ass="koboSpan" id="kobo.351.1">you</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">delivered.</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">Your</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">presentation</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">of</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">a</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">portfolio</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">allows</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">you</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">to</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">stand</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">out</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">as</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">a</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">candidate</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">who</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">will</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">translate</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">complex</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">technical</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">concepts</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">into</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">actionable</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">business</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">solutions.</span></span></p>
<h3 class="head2" id="sc3_742"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="362" id="page362"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">Building a strong portfolio</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">A good portfolio demonstrates your skills in designing and implementing solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.2">It should display technical feats, but with the business objective in mind. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.3">Let us learn to make a portfolio that leaves an indelible mark. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.4">A good portfolio contains:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">Summary of projects along with architecture diagrams</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">Briefly explain each project's objective, along with a high-level architecture diagram. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.2">This will help interviewers get the scope and complexity of the work at hand from the word go.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">For instance, when you worked on multi-region deployment, include diagrams about how different regions interact, emphasizing redundancy and load balancing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">Quantifiable outcomes</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Include, wherever possible, metrics that highlight the results of solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.2">This includes instances like scaling the system by 30% or reducing page load times by 50%. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.3">Quantifiable outcomes show your ability to produce tangible value.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Use before-and-after comparisons to highlight the best performance improvements as well as cost savings achieved because of your solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">Technical challenges and solutions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">Every project runs into obstacles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.2">Describing these problems and how you tackled them showcases your problem-solving abilities and grit.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">For example, when you encountered a bottleneck in processing data, discuss how you identified the problem, proposed a solution, for example, asynchronous processing, to validate its effectiveness.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">Business value and alignment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">Discuss how your technical solutions were aligned with and supported business objectives.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">For example, discuss how optimizing system performance contributed to increased user engagement or how automating deployment pipelines reduced time-to-market for new features.</span></span></p>
<h3 class="head2" id="sc3_743"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">Tailoring the portfolio for interviews</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">A generic portfolio will not resonate with every interviewer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.2">To make a lasting impression, customize your portfolio for each interview, aligning it with the company’s goals, industry, and the specific role you are applying for.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">Steps to tailor your portfolio are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Research the company and role</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">Understand the company's mission, industry, and tech stack. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.2">Study the job description to identify what key competencies they are looking for.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">For cloud-heavy roles, focus on projects involving cloud-native architectures, serverless computing, or containerization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">Highlight relevant projects</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Pick projects that demonstrate your expertise in areas that are critical to the company.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">For instance, if scalability is a priority for the company, point out a project where you employed auto-scaling or optimized it for high traffic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="363" id="page363"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">Speak their language</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">Use terms and concepts from the company's space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.2">So, for example, if interviewing at a fintech company, highlight your experience in handling securely and compliance frameworks such as PCI DSS.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">Highlight soft skills</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">If the job requires leadership or a stakeholder-facing role, include instances of how you enabled cross-functional collaboration or how you presented solutions to non-technical stakeholders.</span></span></p>
<h3 class="head2" id="sc3_744"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">Tools and best practices</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">Using professional tools and best practices can improve the quality of your portfolio, making it more impactful and accessible.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">Recommended tools for creating visuals are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">Lucidchart</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">: Ideal for creating detailed architecture diagrams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.2">It is a cloud-based platform with real-time collaboration and an easy share feature.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">Miro</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">: Excellent for brainstorming and presenting user flows or system interactions using the intuitive whiteboard interface.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">Microsoft Visio</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">: Designed for professional grade diagrams; useful for organizations with a deep interest in the Microsoft stack.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">Showcasing your work using version control:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">Use repositories such as GitHub or GitLab to store and publicly display your code and project documentation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">Have a specific repository for every project, including:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">Architecture diagrams</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">Code snippets that illustrate the most important functionalities</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">README files explaining the project goals, tools used, and results</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">Best practices for a portfolio display are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">Organization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">: Organize your portfolio well, with an easy-to-follow structure from which interviewers can glance through at ease. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.2">Use sections for projects and include an index or table of contents.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">Interactivity and engagement</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">: Make your portfolio interactive if possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.2">For example, link to live demos or hosted applications to demonstrate your solutions in action.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">Consistency and branding</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">: Keep your portfolio looking consistent and uniform within a design and format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.2">This will mean keeping a few colour schemes, fonts, and layouts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.3">A professional look attests to your focus on details.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">Accessibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">: Make sure to make your portfolio available in both digital and hard copy formats if appropriate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.2">The digital versions should be in widely accessible formats (for example, PDF) and easy to share during virtual interviews.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">A great portfolio does more than just show your technical skills; it tells a compelling story of your journey as a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.2">It is in well-curated portfolios, tailored to every interview, and supported by professional tools that you will be able to present your skills and achievements comprehensively and effectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.3">Besides the enhanced performance during the interview, this makes you stand out as a candidate with both technical expertise and strategic business value.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="364" id="page364"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">You will stand out in your proposal based on strong problem-solving skills, and a well-prepared portfolio in front of the interview panel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.2">Let us summarize the takeaways from this chapter to reinforce your preparation strategy as we reach the end.</span></span></p>
<h2 class="head1" id="sc2_745"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">Excelling at interviews is not a one-off but a continuous journey of learning and growth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.2">You are seen to be able to approach problems holistically, set business goals for technical solutions, and communicate effectively with diverse stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.3">This chapter has given you the tools to knock an interview out of the park at behavioral, technical, and design challenges by emphasizing some of the key skills, such as problem-solving, adaptability, and strategic thinking.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">Interview success hinges on both the ability to solve complex technical problems and on how well to present experiences and thought processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.2">Whether it is through structured responses, dynamic whiteboard presentations, or a well-crafted portfolio, it is essential to present unique value to the candidate.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">Remember that this is a mutual process in an interview. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.2">While it assesses your fit for the role, it also gives you an opportunity to assess whether the organization aligns well with your career aspirations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.3">Every interview, successful or not, provides learning moments that can help fine-tune skills and build on performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">To maximize your chances of success, strategic preparation is crucial. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.2">The next chapter introduces a structured 30-day interview preparation plan, designed to help you build technical depth, strengthen your problem-solving approach, and sharpen your communication skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.3">By following this guided plan, you will gain the confidence and readiness to excel in even the most demanding solutions architect interviews.</span></span></p>
<h2 class="head1" id="sc2_746"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">Understand the types of interviews</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">: Master the behavioral, technical and design challenge interviews, their purpose and focus areas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.2">Highlight relevant skills to fit each of the types.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">Problem solving skills</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">: Be equipped with structured methodologies to crack technical problems, breaking a complex problem into manageable component parts and evaluating multiple solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.2">Ready yourself to adapt to real time changes in an interview.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">Portfolio presentation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">: Construct a comprehensive portfolio along with detailed summaries of projects and quantifiable outcomes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.2">Tailor it for every interview by aligning it with the specific needs and focus areas of the company.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">Use visual communication</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">: Whiteboard visually to present system designs and solutions clearly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.2">The whiteboard is effectively helpful for the interviewer to get a quick understanding of the most complex ideas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.3">The presentation also is more interesting and captivating.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">Showcase business acumen and soft skills</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">: Discuss how your technical solution has propelled a business to success. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.2">Share experiences related to leadership, team management, and stakeholder interactions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">Continuous improvement</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">: Treat each interview as an opportunity to learn. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.2">Reflect on your performance, solicit feedback, and iterate in your preparation strategy to help improve your skills and confidence.</span></span></p>
<h2 class="head1" id="sc2_747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">These sample questions and answers show how to prepare for behavioural, technical, and design challenge interviews. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.2">By tuning the answers using the STAR framework and presenting clear, structured answers, you will be in good standing when trying to address even the most challenging interview situations.</span></span></p>
<h3 class="head2" id="sc3_748"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="365" id="page365"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">Behavioral questions</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style745 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">Tell me about a time when you had to guide a team in a process of massive change.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">Situation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">: Migrate from a monolithic architecture to microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">Task</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">: Adapt the new architecture in such a way that the system will be stable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">Action</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">: Held workshops, hands-on training, and meetings with regular check-ins.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">: The migration was completed two weeks ahead of schedule and with a 20% improvement in system performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style745 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">Can you give me an example when you had to make a difficult decision with not enough information to support it?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">Situation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">: Your database went into failure at the high traffic event.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">Task</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">: Given the time constraint, it was either to scale up or to optimize queries.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">Action</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">: Scaled up temporarily and analyzed later.</span></span></p>
