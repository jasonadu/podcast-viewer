<header>
<h1 class="chaplabel" id="ch18"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="355" id="page355"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 18</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Preparation for Solutions Architect Interview</span></span></h1>
</header>
<h2 class="head1" id="sc2_730"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">It is time to sharpen your interview skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Having spent a lot of hours studying, developing competency, and perfecting the resume, the time has arrived for the interview. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">This is the moment to demonstrate your knowledge, show your problem-solving abilities and how you can drive business success.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">The role of a solutions architect demands a combination of technical excellence, leadership, strategic thinking, and excellent communication skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Preparing for an interview typically becomes more about displaying the ability to think beyond mere technical problem solving, but to be able to solve complex, heterogeneous problems and to align technical solutions with business goals. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter will comprehensively walk you through the different stages of a solutions architect interview. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">From understanding what types of interviews, you may encounter to how to present your portfolio, this chapter is designed to give you the strategies and insights required to perform at your best.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">You will learn effective strategies for solving difficult technical problems, how to present your response for maximum impact, and how to demonstrate your experience and skills in a manner appealing to interviewers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Whether it is a behavioral interview, a technical deep dive, or a design challenge, you are sure to be best prepared systematically and with confidence for that challenging interview.</span></span></p>
<h2 class="head1" id="sc2_731"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">This chapter </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">covers</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Types of interviews</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Handling technical challenges during interviews</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Presentation of your portfolio</span></span></p>
<h2 class="head1" id="sc2_732"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="356" id="page356"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">By the end of this chapter, readers will be able to understand each of the crucial areas of the solutions architect interview and the strategies required to ace every stage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">You will learn about various interview types that range from behavioral, technical, and design challenges, and get armed with adequate preparation tips for each. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">This chapter will guide you on how to answer a complex technical question with practical answers, structure responses using frameworks such as the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">situation, task, action, result </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">STAR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">) technique, and show a portfolio to exhibit relevant skills and accomplishments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">You will learn how to align your technical skills with business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Finally, this chapter equips and empowers you with the skills and the confidence to sail through the interview process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Keeping these objectives in mind, let us understand the first critical aspect of interview preparation, that is, to know the different types of interviews you might face.</span></span></p>
<h2 class="head1" id="sc2_733"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Types of interviews</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">In your solutions architecture journey, you will face the following types of interviews, each targeting specific competencies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">Each type of interview has a different focus and expectations, so knowing where to focus for that specific type of interview is important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">This section covers the three main types of interviews, that are, behavioral, technical, and design challenges, outlining their purpose and areas of focus as noted in </span></span><span class="Italic"><a href="#fig18-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Figure 18.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"><img src="images/Figure_18.1.png" alt="A triangular diagram titled Solutions Architect Interviews shows three sections: Design Challenges, Behavioral Interviews, and Technical Interviews, each with brief descriptions and related icons."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig18-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Figure 18.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">: Types of interviews</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_734"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Behavioral interviews</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">The behavioral interview is part of the standard recruitment process in which you are inquired about how you have handled real-world situations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">These interviews are meant to assess your interpersonal skills and leadership abilities in relation to how you handle problems, work within a team, or coordinate your actions to achieve organization-wide goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="357" id="page357"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Purpose</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">: Behavioral interviews examine your soft skills and your leadership, teaming, and change adaptability skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">Hiring managers want to know how you manage stakeholders, resolve conflicts, and make decisions in the presence of stressors.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Key focus areas</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Stakeholder management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Interviewers will ask you questions about how you engage with different stakeholders in terms of technical teams, business leaders, and clients. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">They would like to see how you balance related competing priorities and build consensus.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Conflict resolution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">: You might be asked about situations where you resolved disputes within a team or between different stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">Being proactive with empathy is what counts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Adaptability and decision-making under pressure</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">: Solutions architects rarely know in advance what their challenges will be. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">Hiring managers are interested in hearing how you can maintain your cool and make good choices in intense environments. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-33"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Example question</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Tell me about a time you had to balance conflicting expectations from multiple stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">How did you resolve it?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Preparation tips</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">When answering, use the STAR method.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Think of instances in which you have had to lead people and adapt.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Practice articulating your thought process clearly and concisely.</span></span></p>
<h3 class="head2" id="sc3_735"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Technical interviews</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Technical interviews are there to test how much you know about core architectural principles, technologies, and patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">In most cases, this involves solving complex technical problems, analyzing trade-offs, or demonstrating a role in designing scalable and secure systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Purpose</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">: The purpose is to evaluate the depth of your knowledge about the technical issues you solve and problem-solving skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">The interviewers want to ascertain if you can apply theoretical knowledge to practical scenarios.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Key focus areas</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">System design and architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">: You will be asked to design systems that meet specific functional and non-functional requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">This could include designing a web application, a data pipeline, or microservices-based architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Cloud-native technologies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">: Expect questions on cloud platforms like AWS, Azure, or Google Cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">Be prepared to discuss services such as Kubernetes, serverless computing, and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">infrastructure as code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">IaC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Security, scalability, and performance tuning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">: You will often be asked how you guarantee a system is secure, scalable, and performant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">For example, you might be questioned as to how to protect an API or fine-tune a database for high traffic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Example question</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">How would you design a system to handle millions of concurrent users while ensuring high availability?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Preparation tips</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Practice whiteboarding or online diagram tools to visually explain your system designs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">o	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="358" id="page358"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">Refresh of fundamental architectural patterns and cloud services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Be prepared to discuss the trade-off for their design choices.</span></span></p>
<h3 class="head2" id="sc3_736"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Design challenges</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Design challenges are similar to real-life situations that will challenge your thinking ability as an architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">They generally involve translating vague business requirements into concrete, scalable, and cost-efficient solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Purpose</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">: Evaluate the design skills of a system, the ability to consider the views of several different people, and the knack for optimizing systems for cost, performance, and reliability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Key focus areas</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Design for high availability and disaster recovery</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">: You might be required to design a system which would have a minimum amount of downtime and fast recovery from failure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Selecting the correct technologies with trade-off analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Demonstrate that you can pick the most appropriate technology for the job, with trade-offs being something such as cost, performance, and complexity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Cost and performance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">: Interviewers will check how you balance performance with cost-effectiveness to ensure that designs are both robust and financially viable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-33"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">Example question</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Design an e-commerce platform that can handle flash sales and high traffic spikes while keeping operational costs low.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Preparation tips</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Familiarize yourself with common architectural trade-offs as well as the best practices for high availability as well as disaster recovery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Practice responding to design challenges by using tools like Miro or Lucidchart to create detailed architecture diagrams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Emphasize the specific reasoning for all your design decisions so that it really shows your knowledge of the technical and business considerations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Each type of interview will play a significant role in evaluating your readiness for the solutions architect role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">Behavioural interviews check your leadership and interpersonal skills, technical interviews measure your problem-solving and technical acumen, and design challenges test whether you have what it takes to architect efficient and cost-effective solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.3">With an understanding of each type of interview and its purposes as well as focus areas, you will prepare yourself accordingly to excel in every aspect of the hiring process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Understanding the types of interviews is a good starting point, but acing these often comes down to how well you can solve tricky technical problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">Now let us walk through some practical strategies for solving such problems and how you should approach solving these issues so that you can present your problem-solving skills at a technical or design challenge interview with confidence.</span></span></p>
<h2 class="head1" id="sc2_737"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Handling technical challenges during interview</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">The</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">solutions</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">architect</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">interview</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">may</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">include</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">answering</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">some</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">of</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">the</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">most</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">complex</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">technical</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">problems</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">ever,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">that,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">besides</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">testing</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">your</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">technical</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">knowledge,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">even</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">test</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">critical</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">thinking,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">effective</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">communication,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">and</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">the</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">ability</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">to</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">adapt</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">to</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">fast-changing</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">situations.</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">This</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">section</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">provides</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">practical</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">guidelines</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">on</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">how</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">to</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">answer</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">such</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">questions.</span></span></p>
<h3 class="head2" id="sc3_738"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="359" id="page359"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Problem-solving approach</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">A structured approach is of the essence; it should not deter from coming up with creativity when the problem needs solutions which are novel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.2">Interviewers are interested in how you think and analyze, and how you articulate the process, rather than whether you finally arrive at the correct solution. </span></span><span class="Italic"><a href="#fig18-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">Figure 18.2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1"> will help you understand the approach better:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1"><img src="images/Figure_18.2.png" alt="A four-step problem-solving process with icons: Understand the Problem, Break into Components, Evaluate Solutions, and Present Solution, each with brief descriptions and a central airplane graphic."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig18-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Figure 18.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">: Problem-solving approach</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Refer to the following steps:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Understand the problem</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">: Listen to the problem statement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">Be sure that you understand the scope and requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.3">Misunderstand the problem, and you are sure to get the wrong answer so take time to clearly define the problem.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">The key actions are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style65"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">Ask about the expected outcome, constraints, and priorities (e.g., performance versus cost).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style65"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Confirm your understanding by paraphrasing the problem to the interviewer.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-52"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Interviewer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Can you develop a real-time data processing system?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-53"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Candidate</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Confirm the understanding, like, are we dealing with streams of data coming from sensors, and should our system be low-latency or cost-effective?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">Break the problem into parts</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">: Big problems appear daunting when taken as one big problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">Divide the large problem into smaller, more understandable pieces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.3">Working on each piece contributes to a whole solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">The key actions are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style65"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Identify the core components of the system, such as data ingestion, storage, processing, and output.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style65"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Solve the problem for individual components separately before interlinking them into a more comprehensive system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">: For a real-time analytics platform, you may break down the problem into:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Data ingestion from multiple sources.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">Stream processing for real-time analytics.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Data storage for historical analysis.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Evaluating multiple solutions and their trade-offs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">: Rarely is there a single correct solution in architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">Interviewers expect you to discuss multiple approaches, weigh their trade-offs, and select one that best meets the needs in the context of the problem at hand.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="360" id="page360"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">The key actions are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">Present two or more possible solutions with some pros and cons.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Highlight trade-offs concerning performance, cost, scalability, and complexity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">Option 1</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">: Use Apache Kafka for stream processing as it can be very high throughput but requires expertise to manage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">Option 2</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">: Use AWS Kinesis as it is easier to manage but could possibly be costlier at scale.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Present your solution clearly and justify your choices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">: After choosing your solution, present it in a logical and well-coherent structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.2">Explain at length how the chosen solution solves the problem and explain the reasons behind your choices given the requirements and constraints.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">The key actions are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Use a logical flow to tell your solution, which covers each component and its role.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">Justify your decisions with data or experience, such as why you chose one technology over another.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">:</span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1"> Our system uses Apache Kafka for its scalability and low-latency capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.2">While it introduces some operational overhead, its benefits in handling high throughput align with the system’s real-time processing requirement.</span></span></p>
<h3 class="head2" id="sc3_739"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Real-time scenarios</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">Adaptability is a core skill for solutions architects, especially in dynamic environments where requirements frequently shift. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.2">This tests your ability to adapt and prioritize under pressure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">Strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">: Stay adaptable and focus on delivering incremental improvements to your solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.2">Be prepared to iterate based on new information or feedback from the interviewer.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Handling changing requirements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">Prioritize key requirements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">Identify which aspects of the problem are critical and must be addressed first.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">Refine your solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">In case of new constraints or requirements coming in during the discussion, redesign your solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">Convey your thought process</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Explain how you are refining your solution and why changes are being made.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-52"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">Interviewer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Suppose the system needs to suddenly process a shock load of data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-33"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Candidate</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">: </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Under this new constraint, I would add auto-scaling and adjust the data partitioning approach to maintain the required performance.</span></span></p>
<h3 class="head2" id="sc3_740"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Whiteboard techniques</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">Whiteboarding is pivotal in technical interviews, especially with design challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.2">Always engage your interviewer by encouraging questions or even feedback as you present; thus, making the session interactive and collaborative.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="361" id="page361"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">Importance of visuals</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">: Diagrams help interviewers understand your choice of design at a glance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.2">They also provide you with an opportunity to highlight the main components, data flows, and interactions within your system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style636 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">Effective use of whiteboard</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">Start with a high-level overview</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">: Begin by sketching the overall architecture, showing the major components and how they interact.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Label components clearly</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">: Clearly label each part of your system (e.g., databases, APIs, load balancers) to avoid confusion.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">Highlight data flows</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">: Use arrows to indicate the flow of data between components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.2">This helps interviewers visualize how your system processes information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">Iterate as needed</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">: As the conversation unfolds, update your diagram to reflect changes or new ideas.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-52"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">For a cloud-based e-commerce platform, your diagram may contain:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">Frontend systems (user interface).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Backend services (product catalog, order processing).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Databases (user data, inventory).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">External integrations (payment gateway, delivery services).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Lines connecting these components illustrate how data progresses from user input to order fulfillment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Best practices of whiteboarding</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Use color-coding or use different shapes to distinguish compute, storage, and networking parts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">Keep it clean and organized; do not overcrowd the board with too much information that is not crucial.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">You can also tell the story of your diagram as you draw it and describe the different components' purpose and role.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">Any interview that involves complex technical issues requires structured thinking, the flexibility of mind, and a good ability to communicate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.2">Provided that one can comprehend the problem, divide it into reasonable portions, evaluate relevant trade-offs, and express it persuasively, then they will be able to show experience and problem-solving skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.3">The addition of real-time adjustments plus the use of visual aids such as whiteboarding only increases the candidate's ability to speak about ideas and to be effective in the interview process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">While problem-solving showcases your technical capabilities, your portfolio needs to portray your experience and impact just as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.2">So, let us discuss how to write and tailor a great portfolio for your interviews.</span></span></p>
<h2 class="head1" id="sc2_741"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">Presentation of your portfolio</span></h2>
