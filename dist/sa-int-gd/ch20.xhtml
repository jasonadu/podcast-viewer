<section epub:type="chapter" role="doc-chapter">
<header>
<h1 class="chaplabel" id="ch20"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="383" id="page383"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 20</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Expert Insights and Common Pitfalls</span></span></h1>
</header>
<h2 class="head1" id="sc2_769"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">These are transformative times for technology, where the solutions architect’s role has become pivotal in driving innovation and aligning technology with business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">An architect is expected not only to have solid technical expertise but to align technology strategies with business goals as well, navigate complex systems, and lead teams in crafting scalable, reliable, and secure solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Such a balance requires not only profound technical knowledge but also an acute understanding of business needs and the dynamics of stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">This chapter prepares you for the multifaceted challenges of a solutions architect interview, based on expert answers and common pitfalls that occur. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Successful candidates not only score well in technical evaluations but also show the ability to lead, communicate effectively, and make sound decisions under pressure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">You will learn valuable insights, such as what major architects look for in candidates and how to avoid making the most common mistakes during interviews. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">This chapter draws on real-world advice and strategies to avoid pitfalls that will prepare you with confidence in navigating the interview process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Show your ability to not only demonstrate your technical expertise but also your leadership potential.</span></span></p>
<h2 class="head1" id="sc2_770"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Insights from industry experts</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Qualities top architects seek in candidates</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Common pitfalls in interviews</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Strategies to avoid common mistakes</span></span></p>
<h2 class="head1" id="sc2_771"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">By the end of this chapter, readers will have a clear understanding of the key lessons and expectations required to excel in solutions architect interviews. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">They will acquire valuable insights into what industry leaders value most in their candidates, including technical acumen, good strategic fit to the business objectives, and savvy stakeholder management.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="384" id="page384"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Readers will learn how to recognize and avoid common pitfalls in interviews, thus avoiding embarrassment and confusion when representing their skills and experience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">Real-life tips by the authors, who are seasoned architects, on the best way to answer tricky technical and behavioural questions will be discussed in the chapter.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">The chapter also discusses the importance of demonstrating leadership, communication, and decision-making in an interview. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">It will prepare readers for techniques in handling high-pressure situations, alignment of technical solutions with business goals, and articulation of thought processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">Readers will be well-equipped by the end of this chapter to navigate through the interview process, avoid the common mistakes that other people make, and shine as top-tier candidates for solutions architect roles.</span></span></p>
<h2 class="head1" id="sc2_772"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Insights from industry experts</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Learning directly from experienced architects equips candidates with the perspective to anticipate challenges and proactively address them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">Expert insights highlight the importance of aligning technical solutions strategically with evolving business goals, ensuring long-term success.</span></span></p>
<h3 class="head2" id="sc3_773"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Importance of expert insights</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">In the rapidly evolving world of technology, to remain relevant as a solutions architect calls for more than technical knowledge; it demands experiential wisdom. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Here, insight from an expert becomes invaluable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.3">This could include industry veterans who have encountered a wide range of architectural challenges across different domains that include finance, insurance, health care, and retail.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">These challenges require a unique approach, blending strategic foresight with hands-on problem-solving. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Besides running evaluations based on current requirements, expert architects predict future requirements to ensure that the systems are scalable, reliable, and adaptable.</span></span></p>
<h4 class="head3" id="sc4_774"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Critical highlights for expert mindset</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">This requires a mindset that goes well beyond solving immediate technical problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Industry leaders bring to the table a strategic view of their solutions, ensuring current requirements are met but also that expected future challenges are addressed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">Top architects are distinguished from others by their proactive and holistic approach.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Here are the essential elements of the expert mindset that aspiring architects need to develop:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Risk mitigation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Good architects proactively identify system failures, security vulnerabilities, and performance bottlenecks in their design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">They put into place strategies such as redundancy, failover mechanisms, and security controls so that systems may better withstand and recover from potential disruptions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Future-proofing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">As the technology landscape continues to accelerate, architects have the challenge of designing systems that are inherently future-proof. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">This includes designing modular and scalable architectures that accommodate growth and seamlessly integrate new tools or services as they emerge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Stakeholder alignment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">A top architect knows that technical decisions should return business value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">Aligning technical solutions with the organizational goals of its work ensures that they support broader business objectives, like enhancing customer satisfaction, achieving higher operational efficiency, or generating revenue growth.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">These points underscore strategic foresight, flexibility, and business acumen in the solutions architect role.</span></span></p>
<h3 class="head2" id="sc3_775"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Key takeaways from top architects</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Drawing on five decades of combined experience, we distill the core lessons that set successful solutions architects apart:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="385" id="page385"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Building scalable and reliable systems</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">: Scalable and reliable architecture is placed at the top of the list from day one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">While designing a system for a startup or for a global enterprise, the ability to handle increased load without compromising performance is not negotiable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Key takeaway</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">: Use modular designs and leverage cloud-native services such as auto-scaling, load balancing, and multi-region deployments to achieve scalability and high availability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Adapting to emerging trends</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">: Technology evolves rapidly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">Top architects stay ahead by adopting trends like DevSecOps, cloud-native architecture, and AIOps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.3">These approaches streamline operations, enhance security, and improve system observability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Key takeaway</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">: Commit to continuous learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">Regularly assess how emerging trends can solve current bottlenecks or make the system better.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Balance technical depth with business alignment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">: A good architect is an interface between technical teams and business leaders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">They explain technical concepts in business terms so that stakeholders understand the value that proposed solutions would drive.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Key takeaway</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">: Understand the business domain deeply so that every technical decision drives business outcome.</span></span></p>
<h3 class="head2" id="sc3_776"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Successful architectures examples</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Let us look at a few examples.</span></span></p>
<h4 class="head3" id="sc4_777"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Retail industry</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Let us consider a scalable e-commerce platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">A retail chain was suffering huge losses during sales events due to the heavy traffic on its platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">It used microservices architecture, orchestrating container systems with Kubernetes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">The salient features and success factors are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Salient features</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Auto-scaling ensured that the platform could recover from traffic surges.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">The ordering process is made much more responsive due to event-driven systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">AI-based recommendation systems seamlessly integrated with the platform, which enhanced the average order value.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Success factors</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">: Scalability, fault tolerance, and non-obstructive user experience promoting business growth.</span></span></p>
<h4 class="head3" id="sc4_778"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Healthcare vertical</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Let us consider a secure HIPAA Compliance Patient Record Management System. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">A health services company needed a solution to handle sensitive patient information in compliance with HIPAA regulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.3">The architectural design was laid on a hybrid cloud model where secure data transfer was ensured, and encryption was integrated for sensitive information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">The salient features and success factors are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Salient features</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Role-based access control ensured data privacy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Disaster recovery mechanisms minimized the downtime during the critical operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Integration with wearables provided real-time health monitoring.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="386" id="page386"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Success factors</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">: Emphasis on security, compliance, and integration capabilities ensured the protection of patient data while enhancing care delivery.</span></span></p>
<h4 class="head3" id="sc4_779"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Financial services</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Let us consider a real-time fraud detection system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">A financial service organization had the requirement of being able to detect fraudulent transactions in real time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">The architecture used a combination of machine learning models along with a low-latency event processing system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">The salient features and success factors are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Salient features</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Stream processing with Apache Kafka enables real-time data ingestion.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">ML models deployed in production flagged anomalies within milliseconds.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Continuous monitoring provided system health insights and minimized false positives.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Success factors</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">: Its ability to detect and prevent fraud in real time protected the institution’s reputation and saved millions in potential losses.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">These examples highlight the value of technical excellence blended with an in-depth understanding of the business context. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">Learning from these successes can serve aspiring solutions architects as a blueprint for designing impactful systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">With these expert insights in mind, let us now examine the specific qualities top architects seek in candidates.</span></span></p>
<h2 class="head1" id="sc2_780"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Qualities top architects seek in candidates</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Solutions architects are arguably the people who connect business requirements with technical deliverables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">The definition of this role is not entirely about technical skills but about strategic thinking, leadership, and problem-solving abilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.3">This section outlines the core competencies that top architects and hiring managers look for in a candidate during the interview process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">The essential competencies assessed by top architects are technical expertise, strategic thinking, communication skills, leadership, adaptability, and evaluating trade-offs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">They are illustrated clearly in </span></span><span class="Italic"><a href="#fig20-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Figure 20.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"><img src="images/Figure_20.1.png" alt="A circular diagram titled Solutions Architect Candidate Evaluation with six colored segments: Evaluating Trade-offs, Technical Expertise, Strategic Thinking, Communication Skills, Leadership, and Adaptability, each with brief descriptions."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig20-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Figure 20.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">: Solutions architect candidate evaluation parameters</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_781"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="387" id="page387"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">Core competencies</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Successful solutions architects possess a balanced mix of technical expertise, strategic thinking, and strong communication skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">Excelling in these core areas enables candidates to design scalable solutions, align technical decisions with business goals, and effectively manage stakeholder expectations.</span></span></p>
<h4 class="head3" id="sc4_782"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Technical expertise</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">One of the most critical aspects of a solutions architect is their technical proficiency across multiple domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">They are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Design patterns</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">: Demonstrating familiarity with industry-standard design patterns (e.g., Factory, Singleton, Event Sourcing) and their appropriate application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">Skilled architects leverage advanced design paradigms to build robust, scalable solutions that meet both current needs and future demands. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">New trends, like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Domain-Driven Design</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">DDD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">), model complex domains closely aligned with business processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">This would help to create clear reusable interfaces as the base for scalable systems, while AI-led design introduces machine learning and AI as core components to architectural strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.3">It is about automating decision-making with good predictive capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.4">The technical depth and forward thinking would be very well evidenced through understanding these approaches and their application in the right contexts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Example use cases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">DDD in a retail application can thus ensure that product catalog and inventory modules are aligned with business rules, thereby producing fewer inconsistencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">API-first design guarantees seamless integration with third-party services, such as payment gateways or shipping providers, because the contracts are defined upfront.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">AI-led design enables the optimization of fraud detection systems in financial services through direct integration of machine learning models in architecture to make real-time predictions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Scalability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">The ability to design a system that scales with business growth and user demand.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Use of best security practices, including authentication, authorization, and data protection.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">For instance, a strong candidate should explain not only what a microservices architecture is but also when and why it is preferable to a monolithic architecture, considering scalability and maintainability.</span></span></p>
<h4 class="head3" id="sc4_783"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Strategic thinking and decision-making skills</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">What hiring managers value most about candidates is the ability to think beyond the current technical problem.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">A lead solutions architect is also a generalist who can connect the dots between multiple domains, technologies, and methodologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.2">While depth in specific areas is valuable, the ability to evaluate and compare different technologies, adapt to new trends, and merge diverse systems with each other is equally important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.3">To give examples, understanding the trade-offs between relational databases and NoSQL, or deciding between containerization and serverless computing, can significantly impact the success of a solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Top architects consistently look for candidates who demonstrate strategic foresight and the ability to align technical solutions effectively with business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">Specifically, they seek candidates who exhibit:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Business alignment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">: Understand business goals and set technical solutions to line up with those goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Decision-making frameworks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">: Leverage structured approaches to architectural decisions, for instance, trade-off analysis or impact assessment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">For example, in a discussion about cloud migration strategy, the candidate should then consider cost, performance, or compliance implication in order to recommend the most appropriate approach.</span></span></p>
<h4 class="head3" id="sc4_784"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="388" id="page388"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">Effective communication and stakeholder management</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">As such, a solutions architect must bridge the gap between technical teams and business stakeholders, as is explained in the following list:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Clear articulation of technical concepts</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">: Explaining complex technical solutions in a manner that non-technical stakeholders can understand.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">Active listening</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">: Understanding stakeholder concerns and incorporating their feedback into solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">For example, a top candidate can present an architectural proposal to a mixed audience, addressing technical details for engineers while highlighting business value for executives.</span></span></p>
<h3 class="head2" id="sc3_785"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Soft skills</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Beyond technical expertise, solutions architects must excel in soft skills such as leadership, team collaboration, adaptability, and problem-solving under pressure to effectively manage diverse teams, respond swiftly to challenges, and ensure successful outcomes.</span></span></p>
<h4 class="head3" id="sc4_786"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Leadership and team collaboration</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Strong leadership skills are essential for guiding teams and influencing stakeholders, such as:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Mentorship</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">: Assisting junior team members in sharing knowledge and best practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Facilitating collaboration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">: It enables cross-functional collaboration with development, operations, and business teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">For example, a high-performance solutions architect resolves conflicts between teams, ensures the teams are aligned on common goals, and creates a healthy team environment.</span></span></p>
<h4 class="head3" id="sc4_787"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Adaptability and problem solving under pressure</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Adaptability is a key competency in the fast-paced tech setting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">Uncertainty management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">: The capability to remain composed and resourceful while working with incomplete information or changing priorities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Rapid problem solving</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">: The ability to think on the spur of the moment and respond to unexpected problems on time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">For example, a critical system component fails during peak hours. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">The candidate should be able to rapidly identify the problem, suggest a possible solution, and communicate a recovery plan.</span></span></p>
<h3 class="head2" id="sc3_788"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Real-world problem solving</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Ambiguity tolerance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">: Leading architects look for individuals who can thrive in ambiguity, where instructions are not clearly defined or complete information is lacking.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Navigating complex problem spaces</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">: Breaking down ambiguous or ever-changing requirements into workable solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-31"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">For example, when faced with a fuzzy requirement such as optimizing system performance, a good candidate should point out specific bottlenecks in performance, ascertain metrics for improvement, and implement targeted optimizations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">Evaluating trade-offs in design decisions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">: All architectural decisions entail trade-offs, and great candidates can analyse and explain such trade-offs well.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">o	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="389" id="page389"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Cost versus performance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">: The desire to minimize operational costs in bounding performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Simple yet flexible</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">: Design of noncomplex flexible systems. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">For example, a candidate discussing the database solution may weigh the pros and cons of a NoSQL database versus a relational database in consideration of factors such as query flexibility, required scalability, and required consistency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Candidates have honed their skills in these fields, so they can fulfil the multi-dimensional role of solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">They make sure that the designs they come up with are technically sound as well as consistent with business objectives and practical constraints.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Understanding these desired competencies helps avoid common pitfalls candidates often encounter during interviews, which we will discuss next.</span></span></p>
<h2 class="head1" id="sc2_789"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Common pitfalls in interviews</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Solutions architect interview process is highly demanding, involving not only technical ability but also strategic thinking and good communication skills, as well as the alignment of solutions with business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.2">Many candidates struggle to balance these factors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.3">The next section discusses some common mistakes interviewees make and ways to avoid them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Typical pitfalls candidates encounter in solutions architect interviews, such as overemphasis on technology, unclear communication, weak stakeholder management, ignoring non-functional requirements, and inadequate system design, are summarized in </span></span><span class="Italic"><a href="#fig20-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Figure 20.2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1"><img src="images/Figure_20.2.png" alt="A circular infographic titled Navigating Solutions Architect Interview Challenges lists five challenges: inadequate system design, overemphasis on technology, lack of clarity in communication, weak stakeholder management, and ignoring non-functional requirements."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig20-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Figure 20.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">: Common mistakes occur in solutions architects interviews</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_790"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Overemphasizing technology</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">The most common mistake that the candidates make is becoming over focused on technical specifics of a particular tool or framework, forgetting the big picture, that is, the larger business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">Refer to the following list for more details:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Pitfall</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">: Describing the architecture in terms of the technologies that it includes, such as describing an architecture in terms of Kubernetes or Terraform without considering how those technologies help get to business objectives, like time-to-market, system reliability, and other relevant outcomes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Avoidance strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">: Always relate your technical decisions to relevant business outcomes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">For example, if you are proposing the architecture of microservices, let them know how it will support scalability and rapid feature development, all of which are ways to accelerate business growth.</span></span></p>
<h3 class="head2" id="sc3_791"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="390" id="page390"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">Communicating ineffectively</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">This section discusses the pitfalls of using excessive technical jargon.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">Effective communication is the backbone of a solutions architect's role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">Many candidates often fail to engage the audience if they fill a response too dense with technical terms or do not change their communication mode to suit the interview panel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.3">Refer to the following list for more details:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="391" id="page391"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Pitfall</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">: Elaborating on a solution in highly technical language without confirmation that the panel, which can consist of people lacking the technical background, understands its merit.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Avoidance strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">: Plan your language according to the audience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.2">When talking through the technical aspects, talk down the technical so that other ideas can be conceptualized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.3">Practice summarizing your solutions in plain talk so that others may understand. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">Ignoring conflicting stakeholder requirements situations, typically in the form of an interview, test candidates on their conflict management skills among stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.2">A candidate talking more about the technical means than the dynamics of stakeholders may be perceived as too detached from the human touch of solution design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">Effectively managing stakeholder conflicts is vital for architects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.2">Candidates must demonstrate their ability to balance competing stakeholder priorities thoughtfully and strategically:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">Pitfall</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">: Not demonstrating how you would deal, for example, with a business stakeholder that is demanding fast deployment against the operations team that insists on stability of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Avoidance strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">: Emphasize your ability to mediate between stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.2">Discuss how you would facilitate workshops to align priorities, propose trade-offs, or build consensus around phased implementations.</span></span></p>
<h3 class="head2" id="sc3_792"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Overlooking non-functional requirements</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">This section addresses the common mistake of overlooking performance</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">, scalability, or security.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-58"><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">A </span></span><span class="Normal--BPB-HEB--Char CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">non-functional requirement</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1"> (</span></span><span class="Normal--BPB-HEB--Char CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">NFR</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">) rich architecture must support both functional and non-functional requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-58"><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Candidates pay much attention to the functional features while missing out on important NFRs, such as system performance, security, and reliability. </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Refer to the following list for more details:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">•	</span></span><span class="Normal--BPB-HEB--Char CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">Pitfall</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">: Proposing a solution that satisfies functional requirements but neglects scalability, which tends to lead to the applications performing poorly under heavy loads.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">•	</span></span><span class="Normal--BPB-HEB--Char CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Avoidance strategy</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">: In the system design question above, explicitly mention your NFRs. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Explain how your architecture addresses performance (for instance, via caching), security (for example, through role-based access controls), and scalability (for example, auto-scaling based on traffic).</span></span></p>
<h3 class="head2" id="sc3_793"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">Providing inadequate system design</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Candidates often undermine their credibility by not clearly justifying their design decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.2">Demonstrating clear reasoning behind architectural choices highlights your analytical thinking and ensures your solutions are credible, robust, and well-aligned with business needs.</span></span></p>
<h3 class="head2" id="sc3_794"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">Not justifying architectural choices with proper reasoning</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">Architectural design questions are meant to evaluate your ability to make sound, rational decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.2">Often, candidates fail to say why they chose a particular design or technology, which really diminishes the credibility of the solution itself. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.3">Refer to the following list for more details:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style636 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Pitfall</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">: Provide a high-level design without justification of why a particular architectural style, such as microservices, or a tool, like Redis for caching, was chosen.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style636 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">Avoidance strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">: Always justify design decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.2">Discuss alternative options clearly with explanations on the advantages and limitations of such options for every alternative. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.3">For example, when proposing serverless architecture, say how it lessens operational overhead but may cause latencies in initiating cold starts.</span></span></p>
			<p class="Text-Body"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">The common pitfalls described here can significantly improve performance in solutions architect interviews. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">Balancing knowledge of technical areas with clear communication, strategic thinking, and a focus on business outcomes will ensure the entire skill set required for the position. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.3">What might prove to be useful in avoiding these pitfalls will not only help during the interview process but also set a well-crafted foundation for real-world success as solutions architects.</span></p>
			<p class="Text-Body"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Having identified these frequent mistakes, let us now explore practical strategies to effectively avoid them and succeed in your interviews.</span></p>
<h2 class="head1" id="sc2_795"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Strategies to avoid common mistakes</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Success in a solutions architect interview is not just a function of technical know-how but also the quality of the solutions presentation and whether the solutions are aligned with the goals of the company. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.2">Several candidates make unnecessary mistakes that would hold them back. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.3">This section gives practical approaches that would structure your preparation, present your answers well, and consistently show that you are a candidate for success.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig20-3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Figure 20.3</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1"> outlines key strategies for interview success, including tailoring responses, leveraging experience, building a strong narrative, and staying calm under pressure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1"><img src="images/Figure_20.3.png" alt="Infographic titled “How to excel in Solutions Architect interviews?” with icons and tips: tailor responses, build narrative, leverage experience, and stay calm, each with brief advice under the respective headings."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig20-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Figure 20.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">: Best practices to ace solutions architect interviews</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_796"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Preparation advice</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Effective preparation forms the foundation for a successful interview. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.2">After all, inadequate or unsuitable preparation is just a missed opportunity to present one's competency.</span></span></p>
<h4 class="head3" id="sc4_797"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">Preparation aligned to job and organizational ends</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">Starting with a good understanding of the position description and the business requirements of the company. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.2">Align your preparation to tackle skills, technologies, and pain areas of relevance to the job.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">o	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="392" id="page392"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">Look up the company's industry, products, and services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">Identify some key business challenges like scaling systems, compliance, or cost reduction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">Read up on the organization's tech stack and any publicly available information about their architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">Leverage checklists and frameworks for systematic preparation</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">Make use of the checklists given in </span></span><span class="Italic"><a href="ch02.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Chapter 2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">Solutions Architect Checklist</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1"> to ensure that you address all critical areas of solutions architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">Use the requirements gathering checklist, checklists on design principles, performance tuning, and security best practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">Review your preparation regularly, pointing out any gaps.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">For example, suppose it is a cloud-native focus for a company. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.2">Then, your preparation should include containerization, serverless architectures, and IaC.</span></span></p>
<h3 class="head2" id="sc3_798"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Practice and feedback</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">Theoretical knowledge alone will not suffice if you cannot articulate it under pressure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.2">Mock interviews and constructive feedback are important to hone the delivery.</span></span></p>
<h4 class="head3" id="sc4_799"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">Mock interviews</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">: Mock interviews simulate real interview scenarios and help you in:</span></span></p>
