			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Determining areas to improve, such as aspects of communication or incomplete technical descriptions of solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Developing the ability to clearly express complex solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Iterative improvement</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">: Apply the lessons learned from mock interviews to your preparation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.2">Focus on improving specific aspects, such as answering behavioural questions or diagramming system designs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">Talk to other peers, mentors, or try services like Pramp or Interviewing.io, which can provide professional feedback.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Return and adjust the learning plan based on areas of improvement highlighted in the feedback.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">For example, if feedback indicates your answers are too technical, practice tying them to business outcomes, such as cost savings or improved user experience.</span></span></p>
<h3 class="head2" id="sc3_800"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">Crafting responses</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">A well-structured answer will make a big difference in how your solutions are perceived. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.2">Interviewers prefer the candidate who shows clear thinking and problem-solving abilities.</span></span></p>
<h4 class="head3" id="sc4_801"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">Make use of the STAR framework for behavioral questions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-32"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">You will be guided to give structured, impactful answers when answering those behavioural interview questions, using the STAR framework.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">Situation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">: Set the context.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">o	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="393" id="page393"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">Task</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">: Explain your responsibility or challenge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">Action</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">: Describe the steps you take to accomplish the challenge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">: Outcomes, with metrics as possible.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-32"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">For example, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">Our application was performing poorly during peak hours in a past role (Situation). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.2">I was asked to identify and remove bottlenecks (Task). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.3">I implemented a Redis caching strategy and optimized database queries (Action), reducing page load times by 50% (Result).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">Structure technical answers to demonstrate your reasoning and trade-off analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">: For technical interview questions, break down your problem-solving approach:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">Start with problem analysis and discuss key considerations (e.g., scalability, security, cost).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">Outline possible solutions and their trade-offs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">End with your recommended solution with justification.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">For example, when tasked with designing a system that has the availability:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">Start with a description of the business need, which will be the minimum downtime.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">Discuss Redundancy, multi-region deployment, and load balancing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">o	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">Recommend Solution (for example, AWS multi-region architecture) with a focus on continuous business operations and user experience.</span></p>
			<p class="Text-Body"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">Applying these strategies sets the stage for showcasing real-world relevance, essential advice for excelling as a solutions architect candidate.</span></p>
			<p class="not-in-toc-head-12-palatino"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">Real-world tips for interview success</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">Excelling in a solutions architect interview requires more than technical knowledge; it demands applying your skills in a way that aligns with the company’s unique business and technical context. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.2">Demonstrating this adaptability and relevance can set you apart from other candidates.</span></span></p>
<h3 class="head2" id="sc3_802"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">Demonstrating context awareness</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">One of the most important ways in which you would pass a solutions architect interview is by relating your answers to the unique business and technical context of the job itself. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.2">Every organization has distinct requirements and challenges, and demonstrating flexibility and adaptability sets you apart.</span></span></p>
<h4 class="head3" id="sc4_803"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">Know the domain of the company</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">: Investigate the company's industry, their products, and services before the interview. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.2">Pinpoint the technical and business problems they are likely to face.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">Tailor your language to the domain</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">: Use industry-specific terminology and align your solutions with their business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.2">For instance, a healthcare organization may be sensitive to compliance and data security issues, while an e-commerce firm is bound to be interested in scalability and user experience.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">Request clarification of the question</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">: When the interviewer mentions something vaguely, ask a few questions to seek further clarification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.2">This clearly establishes an analytical thinking approach, and this answer, in turn, shows it is relevant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">For example,</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1"> when asked to design a system for high availability, relate your answer to the company’s specific needs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.2">For a retail company, emphasize minimizing downtime during peak shopping hours. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.3">For a healthcare provider, focus on ensuring data accessibility for emergency responders.</span></span></p>
<h3 class="head2" id="sc3_804"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="394" id="page394"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">Leveraging personal experience</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">Your past work and accomplishments provide concrete proof of your expertise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.2">Talk about your experiences in an interview that coincide with the job requirements.</span></span></p>
<h4 class="head3" id="sc4_805"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">Quantify impact</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">: Use metrics to showcase the success of your projects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.2">For example, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">I implemented a microservices architecture that improved system scalability by 40% and reduced deployment time from 2 hours to 15 minutes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">Emphasize pertinent experience</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">: Tell stories that apply to the position. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.2">If the position focuses on cloud-native architectures, then you talk about your experience with Amazon Web Services, GCP, or Azure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Be specific</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">: Explain the problem you had, your responsibility, what you did, and the result. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.2">The STAR method is very effective.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">For example, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">In a previous role, we led the migration of a legacy monolithic application to a microservices-based architecture on AWS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.2">This reduced downtime during updates by 80% and improved overall system performance by 30%. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">Storytelling with business impact</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">: Engage your technical competence with business results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.2">Companies want to see how your technical decisions drive business value.</span></span></p>
<h4 class="head3" id="sc4_806"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">Frame your solutions around business impact</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">: When discussing a technical solution, always tie it back to the business benefit.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">Showcase problem-solving skills</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">: Highlight how you have tackled real-world challenges, such as improving system performance, reducing costs, or enhancing user experience.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">Weave a compelling story</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">: Use storytelling to make your achievements memorable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.2">Provide context, detail your approach, and emphasize the positive results.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">For example, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">When our company faced increasing user complaints about slow application performance, I led an initiative to implement a caching strategy using Redis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.2">This reduced page load times by 50%, improving customer satisfaction and contributing to a 15% increase in sales during the following quarter.</span></span></p>
<h3 class="head2" id="sc3_807"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Keeping cool under pressure</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Technical interviews can be intense, especially when faced with complex scenarios or unexpected questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.2">Your ability to remain composed is as important as your technical knowledge.</span></span></p>
<h4 class="head3" id="sc4_808"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">Key tips</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">The key tips are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">Pause and think</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">: Do not rush to answer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.2">Take a moment to gather your thoughts and structure your response. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.3">This not only improves your answer but also shows confidence.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">Break down the problem</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">: This is especially when you break down complex problems into smaller units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.2">As you break it down, explain your thought process behind working on each part.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="395" id="page395"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Practice mindfulness techniques</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">: Deep breathing or visualization can help manage stress during high-pressure situations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">Acknowledge uncertainty</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">: Show that you do not know the answer honestly and explain how you would solve it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.2">This is a great way of showing off your problem-solving skills as well as your willingness to learn.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">For example, having to design a fault-tolerant system on the spot, start with identifying basic components where redundancy will be applied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.2">Discuss possible solutions, their trade-offs, and how you would evaluate them in a real-world scenario. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.3">If unsure of any of the details, mention the tools or frameworks you would research to fill the gaps.</span></span></p>
			<p class="Text-Body"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">These strategies can help you present yourself as a confident, adaptable, and impact-driven solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.2">Interviews are more about how to think and communicate than the technical skills you have.</span></p>
<h2 class="head1" id="sc2_809"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">Excelling in a solutions architect interview requires more than technical </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">expertise; </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">it demands strategic thinking, effective communication, and the ability to align technical solutions with business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.2">Certainly, technical expertise provides a solid platform, but it is the ability to present deep ideas in relatively accessible ways, handle conflicting requirements from various stakeholders, and create systems which balance functionality with non-functional needs that makes top candidates stand out.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">By being mindful of common pitfalls such as overemphasizing technology, neglecting stakeholder management, or overlooking non-functional requirements, you can portray yourself as a well-rounded candidate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.2">A solutions architect is not a simple problem </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">solver; </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">they are the bridge between the need in business and the technical means of it to deliver value to the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">This holistic approach will not only help you stand out during interviews but also prepare you for the multifaceted responsibilities of the role in real-world scenarios.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">In the next chapter, we will explore operational excellence considerations, delving into essential strategies for designing systems that are scalable, resilient, maintainable, and efficient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.2">Understanding operational excellence will further enable solutions architects to consistently deliver high-performing solutions, align technical designs effectively with evolving business goals, and position themselves as leaders capable of guiding organizations toward sustainable technical success.</span></span></p>
<h2 class="head1" id="sc2_810"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">Bridge technical decisions with business value</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">: Always connect technical decisions with their impact on business outcomes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.2">Clearly articulate how your solutions address real-world problems and deliver measurable value to the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">Communicate effectively</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">: Use language according to the audience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.2">Technical and non-technical audiences must understand your vision; Avoid jargons overload.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">Stakeholder management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">: Show your ability to mediate conflicting requirements align stakeholders toward a shared goal.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">Emphasize NFRs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">: Present your designs with performance, scalability, security, and reliability to demonstrate a holistic understanding of architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">Design justification</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">: Clearly explain your decisions using trade-offs to demonstrate your analytical thinking.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="396" id="page396"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">Practice real-life scenario solving</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">: Practice yourself in simulating interview situations to hone your problem-solving and communications skills under pressure.</span></span></p>
<h2 class="head1" id="sc2_811"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">Describe a time when you had to mediate between conflicting stakeholder requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.2">How did you resolve the conflict?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">Situation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">: In your last assignment, you were asked to design a new system, maintaining cost-effectiveness in contrast with scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.2">One stakeholder was keen on scalability, which would provide head room for future growth, however, the other was concerned about upfront costs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">Task</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">: Your task was to come up with a solution that satisfies both requirements without compromising the fundamental functionality of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">Action</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">: You held a stakeholder workshop to clarify the priorities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.2">You proposed a phased approach starting with cost-efficient cloud solution with auto-scaling capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.3">This would enable you to save money on the upfront cost while still benefiting from scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">: Both stakeholders were satisfied since this would be a solution that has immediate savings while also being prepared for future system growth. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.2">It also helps optimize the deployment time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">Describe a project where scalability and performance had to be balanced.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">:</span></span><span class="CharOverride-4"> </span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">Situation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">You were leading the redesign of a customer portal for a retail client experiencing performance issues during peak sales events.</span></span><span class="CharOverride-4"> </span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">Task</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">The goal was to redesign the system to handle traffic surges without degrading performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">Action</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">You adopted a microservices architecture deployed on auto-scaling Kubernetes clusters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.2">You implemented Redis caching for frequently accessed data and optimized database queries to reduce latency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">The system's performance improved by 40% during peak traffic, with zero downtime reported during the Black Friday sales period.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">How to design a high availability system for a crucial health application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">First thing is to identify key business and technical requirements, namely HA and fault tolerance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">Redundancy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">: As redundancy, along with multiple availability zones or regions, there will be continuous operation during a failure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">Load balancing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">: Using a load balancer like AWS Elastic Load Balancer or Azure Application Gateway for distributing traffic equally.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">Database</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">: Multi-master database with automatic failover.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">Disaster recovery</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">: Automated backups with regular recovery processes testing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">: Such architecture generates a 99.99% uptime SLA without putting the organisation at risk of potential service disruption.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="397" id="page397"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">You are asked to transform a monolith application into a microservices architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.2">How would you handle it?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">Monolith review</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">: Identify the modules which are very critical and find their dependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">Prioritize microservices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">: Start with the modules with clear boundaries as well as having the maximum possible impact.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">API develop</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">: Utilize REST or gRPC for the API communication of the microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">Containerization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">: Develop microservices in containers using Docker and deploy them via Kubernetes to scale.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">Data strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">: Shared or separate database for each and every microservice based on consistency and performance criteria.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">CI/CD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">: Build CI/CD pipelines such that the entire process can be made non-breakable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">Monitor and iterate</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">: Apply tools like Prometheus and Grafana in observability and refine further based on the performance metrics.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">How would you harden a </span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">cloud-native</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1"> application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">Authentication and authorization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">: OAuth 2.0 for API access control or RBAC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">Encryption of data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">: AWS KMS or Azure Key Vault for data in rest and using TLS for data in transit.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">Infrastructure security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">: Security groups, NACLs and private subnet.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">DevSecOps</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">: Integrate security into your CI/CD pipeline; you can use, for example, a tool like SonarQube to auto scan for vulnerabilities and analysis of static code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">Audit and compliance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">: Audit logging and access monitoring, followed by anomaly detection using AWS CloudTrail or Azure Security Center.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">You would prefer relational for an e-commerce site, and NoSQL or vice versa. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.2">Explain why you made such a choice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">It depends on your application requirements:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">Relational database management system (RDBMS)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">: If the application necessitates complex queries, for example transactional consistency across the payments or requires structured data, you will be very likely to use an RDBMS like PostgreSQL.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">NoSQL database</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">: If your primary requirement is scalability and processing of unstructured or semi-structured data, like user behavior logs, then a NoSQL solution like MongoDB or DynamoDB would be ideal.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">Recommendation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">: In many cases, the hybrid way works better. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.2">For example, critical transactions using RDBMS and user sessions and product catalogues by NoSQL.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">What is your approach to a trade-off between performance vs cost as part of the cloud deployment?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">Approach:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">Analyze requirements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">: Understand the performance metrics like response time and the budget constraints.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="398" id="page398"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">Review the cloud service options</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">: Consider using spot instances or reserved instances to reduce costs by keeping performance consistent.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">Leverage auto-scaling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">: Build auto-scaling policies to optimize resource usage during high and low traffic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">Caching</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">: Utilize caching solutions like Redis to improve performance without incurring too much cost.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">Final recommendation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">: Balance by optimizing workloads to run efficiently during peak and off-peak hours. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.2">Cost monitoring using FinOps practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">How do you align between the technical solution and the business objectives?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">:</span></span><span class="CharOverride-4"> </span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">At first, you get familiarized with the business issues and priorities by discussing these matters with the relevant stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">As the work progresses, all your technical decisions match those strategic goals at a later stage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">For example, if faster time-to-market is the objective, then you would suggest implementing the DevOps practices like CI/CD pipelines, IaC to automate the deployment process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">Also, implement periodic feedback loops with users to ensure that the solution stays relevant in changing business needs ecosystem.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">9.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">How do you manage requirements ambiguity?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">: </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">Ambiguity is prevalent, and my strategy involves the following:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">Clarify assumptions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">: Get stakeholders to close the gaps and agree on the assumptions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">Iterative development</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">: Starting with a minimal viable solution and then building based on feedback.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">Using domain knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">: Leverage past experiences to enable you to make appropriate decisions when clarity is scarce. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.2">For example, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">in a recent project, we did not have much clear sight of future traffic patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.2">We designed the system modular in nature and scalable so that we can adapt it with the requirements evolving.</span></span></p>
