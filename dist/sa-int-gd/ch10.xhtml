<header>
<h1 class="chaplabel" id="ch10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="191" id="page191"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 10</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Data Management and Analytics</span></span></h1>
</header>
<h2 class="head1" id="sc2_278"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Data management and analytics are crucial components of modern enterprise solutions, forming the backbone of informed business decisions and digital transformation initiatives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">For solutions architects, a strong grasp of data strategies is essential to designing scalable, secure, and effective data architectures that drive value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">This chapter </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">gets</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> into the core aspects of data management, covering data architecture design, integration strategies, big data solutions, and analytics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">With the ever-increasing volume, variety, and velocity of data, solutions architects must be equipped to handle complex data environments across hybrid and multi-cloud setups.</span></span></p>
<h2 class="head1" id="sc2_279"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Structure </span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Data architecture design</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Real-world scenarios</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Data integration and management</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Big data solutions</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Leveraging analytics for business insights</span></span></p>
<h2 class="head1" id="sc2_280"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">By the end of this chapter, readers will have a comprehensive understanding of designing scalable and compliant data architectures using industry best practices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">They will be equipped to select appropriate tools and technologies for data integration and management, ensuring seamless and efficient data flows across different systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">Additionally, readers will gain insights into evaluating and implementing big data solutions across leading cloud platforms like Azure, AWS, and Google Cloud, making informed decisions on when to use data lakes, data warehouses, or lakehouses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.4">Furthermore, they will learn how to leverage analytics to drive valuable business insights, supporting strategic decision-making within their organizations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.5">Ultimately, readers will be well-prepared to showcase their knowledge of data management principles and demonstrate their ability to design efficient and impactful data-driven systems during interviews.</span></span></p>
<h2 class="head1" id="sc2_281"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="192" id="page192"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Data architecture design</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Solutions architects are responsible for aligning data architecture with business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">They collaborate with stakeholders to design and implement data storage, processing, and retrieval systems that cater to various business functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">Their role extends beyond selecting technologies, they must ensure that these systems meet organizational goals related to scalability, security, and compliance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">By implementing robust data architectures, solutions architects guarantee that enterprise data remains accessible, reliable, and governed according to regulatory and business standards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Their designs consider present requirements while allowing room for future growth and technological advancements.</span></span></p>
<h3 class="head2" id="sc3_282"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Defining data architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Data architecture refers to the structure and organization of an enterprise’s data assets and data management resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">It is a blueprint that outlines how data is collected, stored, managed, and used across systems, ensuring that the data is readily available, consistent, and secure for business operations and decision-making.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">For solutions architects, data architecture plays a pivotal role in ensuring that enterprise systems are designed to meet both present and future data needs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">By designing efficient data architectures, solutions architects ensure that business data is not only accessible but also structured in a way that supports scalability, security, and governance.</span></span></p>
<h4 class="head3" id="sc4_283"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Role of a solutions architect</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Solutions architects are responsible for aligning data architecture with business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">They work closely with stakeholders to design and implement data storage and processing systems that cater to various business functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">Their role encompasses evaluating different architectural patterns, selecting appropriate data storage mechanisms, and ensuring data compliance with relevant regulations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Solutions architect must understand the intricacies of data management to make decisions about how data is ingested, processed, stored, and secured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">They need to weigh factors like scalability, performance, and governance to design systems that can grow with the business.</span></span></p>
<h4 class="head3" id="sc4_284"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Types of data architectures</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Data architecture can take on several forms depending on the nature of the data and the business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">The four most common architectures are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Data warehouses</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">: Optimized for structured data, often used for reporting and business intelligence.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Data lakes</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">: Capable of handling unstructured, semi-structured, and structured data, suitable for big data analytics and machine learning.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Data mesh</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">: A decentralized approach, where domain-specific teams manage their data as products, promoting scalability and agility.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Hybrid models</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">: Combining elements of both data lakes and warehouses, these models offer flexibility for businesses that need the capabilities of both.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Each of these architectures has distinct advantages depending on the use case, scalability requirements, and governance models.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">The following table provides a comparative view of the key attributes of data warehouses, data lakes, data mesh, and hybrid models:</span></span></p>

						</td>
						<td class="No-Table-Style CellOverride-7">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Lakehouse tools like Databricks, Delta Lake, Snowflake</span></span></p>
						</td>
					</tr>
				</tbody>
			</table>
<p class="caption-t"><span class="tablenum"><a id="tab10-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Table 10.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">: Overview of data architectures</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="193" id="page193"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">The table highlights the strengths and unique attributes of each data architecture model, helping solutions architects make informed decisions based on their organization's data needs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">For instance, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">data warehouses</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> are ideal for structured data that requires fast and reliable reporting, while </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">data lakes</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> provide a more flexible approach to managing large-scale unstructured or semi-structured data. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Data mesh</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> offers a modern, decentralized approach that allows teams to manage data within their own domains, providing agility and scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">Lastly, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">hybrid models</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> combine the best of both worlds, allowing organizations to balance traditional analytics needs with the flexibility of big data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">As a solutions architect, understanding these architectures enables you to align data strategies with business objectives, ensuring the systems are scalable, efficient, and secure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Once the foundational structure of data architecture is defined, it is crucial to incorporate core principles that ensure the architecture is scalable, secure, and aligned with business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">In this subsection, we will </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">get</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> into the essential principles that guide data availability, scalability, and security, which are the cornerstones of an efficient data architecture.</span></span></p>
<h3 class="head2" id="sc3_285"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Core data architecture principles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">A solid understanding of core data architecture principles is essential for solutions architects, as these principles form the foundation for building reliable, scalable, and secure data systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">This section covers critical areas, that is, data availability, scalability, security, data governance and compliance, and data provenance and lineage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">Each of these plays a key role in ensuring the smooth operation and management of data within an organization.</span></span></p>
<h4 class="head3" id="sc4_286"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Data availability</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Data availability refers to the system's </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">ability to provide continuous access to data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> without interruptions, ensuring that data is accessible whenever needed by business processes or applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">Solution architects </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="194" id="page194"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">must design architectures that minimize downtime and maintain high availability, even during system failures or peak usage times. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Key strategies for ensuring data availability are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Redundancy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">: Storing data copies across multiple servers, regions, or data centres to prevent single points of failure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Failover mechanisms</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">: Automatically switching to backup systems or databases in case of an outage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Distributed databases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">: Ensuring that data is distributed across multiple nodes, which allows systems to handle high demand and recover from failures quickly.</span></span></p>
<h4 class="head3" id="sc4_287"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">Data scalability</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Scalability refers to the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">ability of the system to handle increasing amounts of data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"> or traffic without sacrificing performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">Solution architects need to design data architectures that can scale horizontally (adding more servers or nodes) or vertically (increasing the capacity of existing servers) as data demands grow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.3">The following are some strategies to ensure scalability:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Sharding</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">: Splitting data across multiple databases to spread the load and improve query performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Partitioning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">: Dividing a large dataset into smaller, more manageable pieces, often based on time or key values, to improve read or write performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Elastic cloud Services</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">: Using cloud services such as AWS, Azure, or Google Cloud, which allow systems to dynamically scale resources up or down depending on the load.</span></span></p>
<h4 class="head3" id="sc4_288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Data security</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Data security is paramount in any data architecture to </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">protect sensitive information</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1"> from unauthorized access, breaches, or loss. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">Solution architects must implement a variety of security measures, both at the infrastructure and application layers, to safeguard data. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Security practices are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">Encryption</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">: Encrypting data </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">both at rest</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1"> (on storage devices) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">in transit</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1"> (while being transmitted over networks).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Access control</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">: Implementing RBAC to limit access to data based on the user’s role within the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Auditing and monitoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">: Continuously tracking access to data, maintaining logs, and monitoring for suspicious activities that may indicate a security breach.</span></span></p>
<h4 class="head3" id="sc4_289"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Principles of data governance</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Data governance refers to the set of processes, policies, and standards that dictate how data is managed, used, and secured within an organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.2">Solutions architects must design systems that ensure data is trustworthy, well-managed, and aligned with business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.3">Key components of data governance are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Data ownership and stewardship</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">: Assigning clear responsibilities for managing specific datasets to ensure accountability and proper data handling.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Data quality management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">: Implementing tools and processes to continuously monitor, validate, and cleanse data to maintain high data quality across the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Policy enforcement</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">: Ensuring adherence to data policies related to data privacy, retention, and usage through automated systems and manual oversight.</span></span></p>
<h4 class="head3" id="sc4_290"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="195" id="page195"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Principles of compliance</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">Compliance refers to adhering to legal, regulatory, and industry standards for data management. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.2">Solutions architects must design architectures that meet specific compliance requirements, such as GDPR, HIPAA, and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Payment Card Industry Data Security Standard </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">PCI-DSS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">). </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Key practices for ensuring compliance are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Data encryption and anonymization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">: Encrypting sensitive data and using anonymization techniques to protect PII.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Data retention policies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">: Implementing policies that dictate how long data should be retained and when it should be deleted, based on legal and business requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Compliance auditing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">: Ensuring that systems are regularly audited to demonstrate compliance with relevant regulations and industry standards.</span></span></p>
<h4 class="head3" id="sc4_291"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Data provenance</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Data provenance refers to the documentation of where data originates, how it moves through the system, and how it changes over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">Tracking the origin and transformation of data is essential for understanding data quality, verifying its accuracy, and maintaining trust in the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.3">Solutions architects must design systems that allow for detailed tracking of data provenance to support auditing, troubleshooting, and data quality efforts as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Source tracking</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">: Keeping detailed records of where data was collected or ingested from, for example, system logs, databases, and external APIs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Transformation logging</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">: Documenting any transformations applied to data during its lifecycle, such as data cleaning, aggregation, or enrichment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Verification</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">: Ensuring that the provenance of data can be traced to verify its accuracy and authenticity, particularly in sensitive or regulated environments.</span></span></p>
<h4 class="head3" id="sc4_292"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Data lineage</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Data lineage refers to the ability to trace the flow of data from its source to its final destination. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.2">It provides visibility into how data moves across systems, how it is transformed, and where it is consumed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.3">Solutions architects must design data architectures with robust data lineage capabilities to support transparency, compliance, and troubleshooting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.4">Data lineage also helps track the dependencies between different datasets and systems, ensuring that changes to one component do not inadvertently affect others as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">End-to-end visibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">: Providing a clear map of how data flows from its source through pipelines, transformations, and into end-user applications or analytics tools.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Impact analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">: Assessing the impact of changes to data sources, processing logic, or storage on downstream systems and applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Auditability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">: Ensuring that data lineage is documented and auditable to support compliance with regulations like GDPR and HIPAA.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">By adhering to these core data architecture principles, solutions architects can design systems that not only perform efficiently but also meet business, security, and compliance objectives, while ensuring the integrity and trustworthiness of the data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">With a firm understanding of the principles governing data architecture, the next step is to determine how to store and model data in a way that optimizes performance and flexibility. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.2">In the following subsection, we will explore the different techniques for storing and modeling data, focusing on balancing the needs for structured and unstructured data.</span></span></p>
<h3 class="head2" id="sc3_293"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="196" id="page196"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">Data storage and modeling techniques</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Effective data storage and modeling are crucial in designing systems that meet performance, scalability, and flexibility requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.2">Solutions architects must evaluate different storage options based on the type of data being handled (structured, semi-structured, or unstructured) and choose the right data modeling techniques to optimize for performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.3">In this section, we will explore the distinctions between relational and non-relational databases, various types of data formats, and strategies for optimizing read or write performance.</span></span></p>
<h4 class="head3" id="sc4_294"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Relational versus non-relational storage</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Data storage can broadly be categorized into relational (SQL) and non-relational (NoSQL) databases, each serving different needs depending on the data's structure and the application's requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#tab10-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Table 10.2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1"> compares relational and non-relational databases, providing a clear distinction between their features, use cases, and scalability strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">Relational databases are ideal for structured, transactional data, while non-relational databases offer flexibility and scalability for handling large-scale, unstructured or semi-structured data.</span></span></p>

<h4 class="head3" id="sc4_295"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Structured, semi-structured, and unstructured data</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Data comes in various forms, such as structured, semi-structured, and unstructured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.2">Each type requires different storage and processing techniques as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Structured data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">It is highly organized and easily searchable in tables with rows and columns, like SQL databases.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">Semi-structured data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">It includes elements like tags, for example, JSON, XML, which make it somewhat organized but still flexible.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Unstructured data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">: It lacks a predefined format, such as images, videos, or social media content.</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="197" id="page197"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Structured data fits well in relational databases, while semi-structured and unstructured data require more flexible, non-relational or object storage systems.</span></span></p>
<h4 class="head3" id="sc4_296"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Designing data models</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Optimizing data models for read and write operations is essential to ensure application performance and scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.2">Solutions architects must carefully choose strategies like indexing, denormalization, and caching to achieve this balance. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">The following table outlines key strategies and their effects on read and write performance:</span></span></p>

				<colgroup>
					<col class="_idGenTableRowColumn-39"/>
					<col class="_idGenTableRowColumn-88"/>

				</colgroup>

					<tr class="No-Table-Style _idGenTableRowColumn-90">

						<td class="No-Table-Style CellOverride-8">
							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Read performance</span></span></p>
						</td>

							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Write performance</span></span></p>

					<tr class="No-Table-Style _idGenTableRowColumn-4">

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Indexing</span></span></p>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Speeds up query lookups on indexed fields</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Adds overhead on write operations due to index updates</span></span></p>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-50">
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Denormalization</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">Reduces JOINs by storing redundant data</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">Increases complexity in maintaining data consistency</span></span></p>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-56">
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">Caching</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">Stores frequently accessed data in memory</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">N/A (Caching typically focuses on read optimization)</span></span></p>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-50">
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Batch processing</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">N/A (Focused on optimizing writes)</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">Reduces write overhead by processing data in batches</span></span></p>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-56">
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">Asynchronous writes</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">N/A</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">Decouples write operations, increasing performance</span></span></p>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-4">
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">Partitioning or sharding</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Improves query performance by distributing data</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">Distributes write load across multiple shards</span></span></p>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-4">

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">Trade-off consideration</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">OLAP systems often favor read performance for example, reporting</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-9">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">OLTP systems focus on high-frequency transactions</span></span></p>
						</td>
					</tr>
