<header>
<h1 class="chaplabel" id="ch03"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="33" id="page33"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 3</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Technical Proficiency Essential Knowledge</span></span></h1>
</header>
<h2 class="head1" id="sc2_51"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">In this chapter, we will begin by explaining the terminology used during the architecture and design phases of software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">We will cover the essential knowledge required for an architect to design enterprise applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">We will discuss industry standard design patterns and principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">We will also provide essential knowledge on cloud, databases, security, and networking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">We will also touch up on the emerging technologies that an architect needs to be aware of, to have meaningful discussions and apply them to the design of applications based on business requirements.</span></span></p>
<h2 class="head1" id="sc2_52"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Architecture and design vocabulary</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Application design patterns essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Design approaches essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Design principles essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Cloud computing essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Database management essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Application security essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Networking essential knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Emerging technologies essential knowledge</span></span></p>
<h2 class="head1" id="sc2_53"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">In this chapter, readers will gain an understanding of the terminology used in architecture and design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">The solutions architect will especially learn to apply industry standard design approaches and design patterns at the right places during the design of enterprise applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">The readers will gain essential knowledge on </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="34" id="page34"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">cloud computing, database management, security, and networking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Readers will get to know the emerging trends like generative AI and quantum computing that will help the solutions architect to have meaningful technical conversations and design modern day software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">The chapter also covers questions and answers that a solutions architect might be asked in a technical interview.</span></span></p>
<h2 class="head1" id="sc2_54"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Architecture and design vocabulary</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">In this section, we will look at the terminologies used in the architecture and the design space that a solutions architect is supposed to be conversant about. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">We will explain each one of these terms with examples. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">It is important that the architect understands the difference between these terms, as these are being used interchangeably in the realm of software architecture and design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">Once the architect gets a clear grasp of the associated terminology, it becomes easier to have conversation with fellow architects and makes their thoughts clearer during documentation and articulation (socialization) of the solution architecture and design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">The architect should know that the architectural styles, architectural patterns and design patterns can be applied together in a collective manner during the end-to-end design and implementation of a software system.</span></span></p>
<h3 class="head2" id="sc3_55"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Architectural styles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">An architectural style expresses at a high level as to how a software system is structured (blueprint), developed and deployed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">They do not solve a specific architectural problem at hand. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">An architectural style expresses the ways in which the components or the code can be organized in an application, at a high level. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.4">Some of the architectural styles are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Monolith architectural style</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Layered architectural style</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Distributed architectural style</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Messaging architectural styles</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Let us understand architectural style with the following real-world examples: </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Building a manufacturing unit for producing cars</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Building a housing complex with hundreds or thousands of apartments in it</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">In these examples, the architect will use a totally different style to build them. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Architectural styles are abstract answers to the question or challenge of how different components in a software application can be arranged or stacked together. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">For example, an artist will draw the outline of a picture, which gives an idea of what the picture is going to look like when it is completed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">The architectural style is not a readymade solution to an application architecture problem, and it helps the architect to decide the broader blueprint of the solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Architectural styles operate at a higher level of abstraction to provide a highly granular view of the layers or the components’ arrangement and their mode of communication within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">Choosing an architectural style gives clarity to the architect about the arrangement of modules in the application and the mode of communication between them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">It is to be noted that the architect can mix two or more architectural styles to create their solution for the software. </span></span></p>
<h3 class="head2" id="sc3_56"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Architectural patterns</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Architectural patterns help us to implement architectural styles in a particular way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">They provide industry proven solutions to solve specific architecture problems within an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">It expresses a zoomed in view of the modules that will be present in the application and defines the contract of responsibility and interaction of each one of those modules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.4">The architectural pattern will draw its initial idea of the solutions architecture </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="35" id="page35"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">from its abstract architectural style parent and expand it for additional details. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">An application can be built with a chosen architectural style, and each architectural style can be realized with the application of one or more architectural patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Some popular architecture patterns are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Client server architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">MVC pattern</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Event-driven architecture</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">To conclude, architectural styles and patterns are interchangeably used in the architecture world, but there is a subtle difference between the two, which the architect needs to be aware of.</span></span></p>
<h3 class="head2" id="sc3_57"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Design approach</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Application design deals with the details of creating applications for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">Business problem statements are analyzed and elaborated by a business analyst. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">A solutions architect chooses a design approach that best suits the problem to be solved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">It is chosen in such a way that it helps the enterprise to optimize design and development in terms of effort, efficiency, and cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">The design approach chosen is also dependent on the way the organization is structured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">Key stakeholders are identified from business and technology groups, and they participate in the design and development exercise of the software application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.7">The design approach chosen should also lend itself to meeting both functional and nonfunctional requirements of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.8">The design approach should give the enterprise flexibility to change or extend the functionality without expending a lot of effort and cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.9">At the same time, it should also lend itself to meet the software quality of service attributes like scalability, performance, availability, security, and reliability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">For example, if scalability is important, a design approach that divides the software into multiple chunks will be a better option, as that will enable each chunk to scale independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">If the application developed has a need to work with several vendors accepting requests to offer its service, then a design approach that gives importance to the request-response contract will be a better choice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">We will look at the following design approaches in the section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Application design patterns essential knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Domain-Driven Design</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">DDD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">)</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">API first design</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Artificial intelligence </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">AI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">) first design</span></span></p>
<h3 class="head2" id="sc3_58"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Design patterns</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Design patterns are solutions to commonly occurring problems during the design and development of object-oriented software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">As a software architect, it is important to know the industry standard way of solving certain design problems that we encounter time and again in building applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">It is beneficial that the architect does not spend time trying to solve these problems that have already been solved in the best possible way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.4">It is important that the architect identifies these problems or situations in design and development and applies appropriate patterns to overcome those problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.5">It not only helps the architect save time but trying to solve these common problems in software design, in their very own way might sometimes be incomplete and error prone. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.6">To use these patterns, it is important that the architect internalizes the pattern’s usage to identify the right places and opportunities during software design and development.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">We will look at the following design patterns in the section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Application design patterns essential knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Gang of Four design patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Enterprise application design patterns</span></span></p>
<h3 class="head2" id="sc3_59"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="36" id="page36"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Application design principles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Design principles are industry proven and accepted guidelines for creating a flexible, reusable, and extensible software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">These principles aid loose coupling of the software components and enhance the quality of the software developed in terms of scalability, modularity, and maintainability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">Unlike design patterns, they do not solve a problem on their own. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.4">However, they are the leading light that developers and architects should follow for the developed system to be flexible in the long term, after the software is deployed in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.5">The software systems following the proven design principles lend themselves to change very easily.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">We will look at the following design principles in the section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Application design patterns essential knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">SOLID design principles</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">Keep it simple, stupid </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">KISS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">)</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Don’t repeat yourself </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">DRY</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">)</span></span></p>
			<table id="table001" class="Basic-Table">
				<colgroup>
					<col class="_idGenTableRowColumn-1"/>
				</colgroup>
				<tbody>
					<tr class="Basic-Table _idGenTableRowColumn-2">
						<td class="Basic-Table CellOverride-1">
							<p class="Normal--BPB-HEB- ParaOverride-2"><span class="TIP-INFO--BPB-HEB- CharOverride-11"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Note: </span></span><span class="TIP-INFO--BPB-HEB- CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">In this chapter, we will study in detail the foundational design patterns, enterprise application design patterns, and common approaches used for designing applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">We will also discuss design principles to be applied for cleaner and maintainable code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.3">In the next chapter, we will discuss architectural patterns in detail and their applicability to the architecture of enterprise applications.</span></span></p>
						</td>
					</tr>
				</tbody>
			</table>
<h2 class="head1" id="sc2_60"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Application design patterns essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">We discussed what design patterns are and how they are useful in the design of software components and applications in the previous section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">Design patterns can be applied at multiple levels of abstraction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.3">They are applied at a granular level within the scope of individual application components (foundational patterns) or across components to address design concerns (enterprise application patterns). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.4">In complex enterprise applications, we can use enterprise design patterns to address concerns regarding database access, inter component communication, log management, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.5">we will discuss the following types of design patterns in this section:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Gang of Four design patterns also called the foundational patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Enterprise application design patterns used in the design of enterprise applications</span></span></p>
<h3 class="head2" id="sc3_61"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Gang of Four design patterns</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Gang of Four </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">GoF</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">) are also called the fundamental design patterns and are applicable to the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">object-oriented programming</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">OOP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">) style. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">These can be applied to applications of any size that require creation of objects, structuring those objects to form complex ones and manage interaction between those objects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.3">The fundamental design patterns promotes cleaner code with a set of principles that promulgate the idea of separation of concerns of different tasks (object creation and their behavior) within a software component. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.4">It is important to note that design patterns are not specific to any programming language, and they can be applied to any programming language to solve a specific object-oriented design challenge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">There are three different types of fundamental design patterns, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Creational patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Structural patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Behavioral patterns</span></span></p>
<h4 class="head3" id="sc4_62"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Creational patterns</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Let us see creational design </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">patterns</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1"> that deal with the construction of objects in an application to address different types of design challenges.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="37" id="page37"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">We can use the creational patterns in the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Factory pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">: Decouple object creation logic from business logic of the application; Create different object types based on input passed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Prototype pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">: Create a duplicate copy (clone) of an existing object in an application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Builder pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">: Create complex objects with a different set of properties (representation) every time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Singleton pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">: Want to manage only a single instance of an object in the application, thereby avoiding proliferation of objects in the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">The following are examples of how creational patterns can be applied:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Application needs to continue to work with a newer and older version of a feature functionality component (factory pattern).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Create a complex credit card object (Visa or Master Card) with different properties and return to main application (builder pattern).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Application</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">needs to create a duplicate of an existing Bank Account Object and pass to a third-party interface (prototype pattern).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">A single object in the application that allows access to a particular resource like a printer (singleton pattern).</span></span></p>
<h4 class="head3" id="sc4_63"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Structural patterns</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Structural design patterns provide standard ways to organize objects in different ways using composition and create different object hierarchies as required by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.2">They also provide ways to manipulate the structure and edit or delete objects from the existing structure. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">We can use the structural patterns in the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">Adapter pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">: Allows an application component to work with another incompatible application component by using an adapter between them. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Bridge pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">: Separate an interface from its implementation so that they can evolve independently.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Composite pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">: Allow objects to be represented as hierarchies and build relationships between them using composition.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Façade pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">: Allow a simplified interface to access more complex functionality underneath.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Decorator pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">: Allow an objects behavior or functionality to be extended using a wrapper object that adds additional behavior.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Proxy pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">: Need a placeholder interface or object to an underlying object and control access.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Flyweight pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">: The flyweight pattern emphasizes the sharing of data between multiple instances of the same type of object.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">The following are practical examples of how structural patterns are used:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">When an upgraded e-commerce application needs to continue to work with an older version of an inventory component, you create an adapter that translates the request to match the interface acceptable by the inventory application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">In making a database connection in Java, we use the bridge pattern, JDBC drivers implement the driver interface and provide database-specific behavior (MySQL or Oracle). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">The </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">DriverManager</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1"> class acts as a bridge to identify the appropriate driver implementation based on the connection URL and delegates connection requests to the driver.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="38" id="page38"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">If you are building an application for an automobile dealership aggregator that deals with different manufacturers and vehicle types, you can create an </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">AutomobileComposite</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1"> class that can hold objects like manufacturer details, automobile details to aggregate information pertaining to a particular manufacturer and the vehicle type (Car, truck, etc.).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">In an e-commerce application, when you want to place an order to an external partner that uses a proprietary interface, you create a façade to hide the complexity of interacting with the interface from the client.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">When you want to access a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">Simple Object Access Protocol </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">SOAP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">) web service, you use a proxy pattern and generate the required stubs to call the web service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.2">The stubs makes the call to the web service on behalf of the client.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">In an e-commerce aggregator application, if you have multiple categories of products like books, electronics and grocery items, being sold by the same vendor, sharing common attributes like vendor ID, vendor address, tax ID, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.2">Instead of creating a vendor object for each product category, we can use a flyweight pattern to create a single vendor object instance that are shared by different product categories.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">In a health care application, if you want to log the date and time of dispatch before sending different results reports to the patients, you can use a decorator </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">pattern</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">Create a </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">dispatchResultDecorator</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1"> class, that can log the date and time of dispatch and then call a dispatch function on a </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">dispatchReport</span></span><span class="CharOverride-12"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">instance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">This prevents each type of dispatch report instance from having the implementation of logging the date and time of dispatch.</span></span></p>
<h4 class="head3" id="sc4_64"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Behavioral patterns</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Behavioral design patterns provide industry standard best practices for the objects in a software system to communicate with each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.2">They also assign responsibilities to the objects that communicate with each other and help to structure the model of interaction between them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">The following are the scenarios in which behavioral patterns are used:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Observer pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">: A class and a method that gets notified of a change in another class it is observing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Iterator pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">: Iterate through a collection and process the objects one by one.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Command pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">: Encapsulate a command as an object that can be processed consistently.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Chain of responsibility pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">: Allow the request to be processed by a series of functions before it is finally serviced and a response is returned.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">Visitor pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">: You want to separate the operations on an object from its structure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Template method pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">: You want to define the steps of an algorithm as abstract methods and allow sub classes to define their implementation without changing its structure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Interpreter pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">:</span></span><span class="CharOverride-13"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">Interpreter pattern defines a way to evaluate grammar of a language or expression.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">Memento</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">You can use the memento pattern to capture and store an object's state so that it can be restored later without exposing its internal details.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Mediator</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">The mediator object centralizes the communication between different objects in an application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">State</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">A pattern in which the behavior of the object changes, when the internal state of the object changes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">Strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">The strategy pattern is a behavioral design pattern that defines a family of algorithms, encapsulates each one in a separate class, and makes them interchangeable with the implementation of a uniform interface.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="39" id="page39"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">The following are the practical examples of how behavioral patterns are used:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">In an e-commerce application, we can use an observer pattern to notify different components based on events. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.2">A shipping component can register itself with an order queue and get notified when a new order enters the order queue.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">In a retail application, we can create an </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Iterator</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1"> class that takes a list of products and iterates to return each product to the caller till the list is empty. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.2">This abstracts the iteration logic to be implemented independently of each product class.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">In a healthcare provider application, a command interface with an execute method can be created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.2">This interface can be implemented by multiple concrete commands like </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">prescribeTestCommand</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">, </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">CancelAppointmentCommand</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.2">These specific command objects can be used to execute specific tasks like prescribing a test to a patient or cancelling an appointment for a patient keeping the interface uniform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">In a retail application, before an order is shown on the product landing page, different steps can be performed like customer’s interest in specific product categories, recently bought items, their average order value, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.2">Each step represents a responsibility and together constitutes a chain.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">In a retail application, before the value of the order is calculated and shown to the user, it is checked against different types of discounts applicable before the customer is asked to pay. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.2">Each discount type is created as a visitor which is accepted by the payment object of the application to calculate the discount. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">In an e-commerce application, a template method pattern can be used to process different types of orders like a physical order or an email coupon order. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">Certain steps of processing these orders are the same as order creation, inventory control. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.3">However, the method to dispatch these orders could be different. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.4">A template method pattern defines a class (</span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">ProcessOrder</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">) that has both concrete steps like order creation and inventory checks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.2">It also has abstract steps (methods) that can be implemented in a specific way by the concrete classes like a </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">ProcessPhysicalOrder</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1"> and </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">ProcessEmailOrder</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">In an e-commerce application, use an interpreter pattern to create a system to break down and interpret the format and structure of the order request object before it is passed on to an external interface for processing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">In an e-commerce application, a shopping cart can be created using a memento pattern, you let users add or remove items which is stored as the internal state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.2">The object also provides access to the state only to the originator (user) that created it.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">In a retail application, a message queue acts as a mediator between different components like an order processor, Inventory controller and shipping. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">In an e-commerce application, an order can go through multiple statuses such as created, packaged, shipped, and delivered. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.2">We can model each of these statuses as a state object. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.3">Each state has specific behavior (the actions can be performed on the order). </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">In a retail website application, different payment modes like credit card payment or UPI payment can be defined as an algorithm with each strategy implementing the same interface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.2">The application during payment can use any one of the appropriate types of payment strategy to complete the payment.</span></span></p>
<h3 class="head2" id="sc3_65"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">Enterprise application design patterns</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Enterprise application design patterns are industry standard design patterns that solve problems which arise during the development of complex enterprise applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.2">While the Gang of Four foundational design patterns deal with the creation and interaction of objects in an application, the enterprise application patterns act at a higher level of abstraction in solving problems that arise during the design of enterprise applications. </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="40" id="page40"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">They provide industry accepted principles for efficient way of organizing business logic, data and transaction management, concurrency handling and log handling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.2">These enterprise application patterns help to organize different application components in large scale enterprise applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">Some of the commonly used enterprise application design patterns are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">Domain model</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">: A domain represented as an object model with data and its behavior.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Foreign key mapping</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">: This pattern helps to map the database relationships as linkages between objects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.2">This pattern is more often used in </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">Object Relational Mapping </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">ORM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">) frameworks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">Active record pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">: An object that hides database logic and represents the specific instance of an entity (record) from a database table and its methods to manipulate the data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">Front controller</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">: A component that acts as a doorway to the entire application through which all the requests are routed to the application logic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">Service locator pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">: A pattern in which access to services within the application is encapsulated using a common entry point. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.2">This is to hide complex access logic to common services, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Java Database Connectivity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">JDBC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">) connections, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Java Naming and Directory Interface</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">JNDI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">) look up used by business services within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">Query object</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">: An object that encapsulates a query within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">Remote façade</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">: It provides a unified interface to a set of other interfaces which allow access to internal and external resources of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.2">An application might access the file storage device to retrieve a document and then call a third-party API. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.3">These two operations can be clubbed inside a single interface.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">Data transfer object</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">: As the name suggests, data transfer objects are used to transfer data between two layers of an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.2">In a spring boot application, a data transfer object can carry data between the controller layer and the service layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.3">They are mutable by design.</span></span></p>
