			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">Value object</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">: An object that acts as a data carrier within the application without an identity on its own. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.2">Value objects are immutable by design, i.e., their values cannot be changed once they are created.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">Lazy loading</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">: A pattern in which the data required by the application is retrieved or loaded on a need basis or during the time of usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.2">It improves the performance of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">Service layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">: A pattern in which a service component acts as a layer of abstraction between business logic and the data access layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.2">It provides a separation of concern, making the code maintainable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">Unit of work pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">: It keeps a list of all the components affected during a business transaction and orchestrates the updates as a single unit of work to keep the system in a consistent state.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">Repository</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">: It is an abstraction provided for data access logic and an interface for entities of a domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.2">It hides the complexity of direct access to the underlying data storage, like a relational database.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">Business delegate pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">: This provides access to business logic within the application via simplified interfaces.</span></span></p>
<h2 class="head1" id="sc2_66"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">Design approaches essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">In this section, we will look at the following design approaches that are commonly used to design enterprise applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">Domain-Driven Design</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">API first design approach</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">AI first design approach</span></span></p>
<h3 class="head2" id="sc3_67"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="41" id="page41"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">Domain-Driven Design</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">Domain-Driven Design</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1"> is one of the most popular approaches to designing software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.2">It brings a domain or business centric view to the way software is designed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.3">In the earlier era of software design, the focus was more on the technical aspects of the software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.4">The business requirements were coded in a sequential manner and the interconnections or relationships between requirements was largely ignored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.5">This resulted in a software design and a product, which was a ball of mud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.6">The software product though satisfied business needs at the outset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.7">There was no thinking about a methodology in which the software components were rationally organized within the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.8">The modularity adopted was more in terms of dividing the software solutions as technical layers that performed a specific task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.9">For instance, the UI layer of the application was concerned with the rendering logic of the screens to the end user. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.10">The business logic layer would all be written as a single component without any demarcation between operations or behaviour of two different entities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.11">Even if there was some amount of modularity built into it, it was more on technical lines rather than putting in some thinking to separate the business components based on business capabilities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">This kind of a design results in the following challenges:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">Changing one business requirement affects others, as a result the whole software has to be tested even if small changes were introduced into the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">A failure of a single module results in the whole application starting to fail because of the strong cohesion between software programs in the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">It is hard for the operations team to scale software independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.2">A spike in the use of a particular feature meant that the whole application needs to be made redundant and deployed to meet the spike in the load.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">If a particular component is not ready, the whole application has to wait to be deployed in production because of which the time to market largely increases.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">This leads to unmaintainable software products increasing the overall cost of ownership of the software system over years.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">The design affects the reusability of software as there is no compartmentalization of business logic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">DDD tries to prevent the abovementioned challenges by focusing on breaking the ball of mud into independent and manageable pieces of software components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">The methodology initially identifies the boundaries and sub boundaries within the business and organizes them as domains and sub domains.</span></span></p>
<h4 class="head3" id="sc4_68"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">Domains and sub domains</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">A domain is a core area of focus of a business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.2">The business exists to offer products and services in that core area to its customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.3">Examples of domains include an order processing system, a flight reservation system or a hospital management system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.4">The domain encompasses the different business divisions of the enterprise, the processes within each business division and the specific business language used within the business area. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.5">A software design that centers around the business domain is expected to add more value than a design that is more technology centric in which the business requirements are fitted into. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.6">This kind of design lends itself for a better understanding of the software system being developed, by the key business stakeholders of the enterprise and encourage them to take active participation in the development of the software system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">A domain is divided into sub domains in </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">Domain-Driven Design</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.2">The sub domain represents a specific business capability in the larger business domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.3">This sub domain could be core sub domain or a supporting sub domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.4">A core sub domain supports the central business activities of the business, and a supporting sub domain supports the core sub domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.5">Each sub domain is self-contained and can exist on its own without any dependency on other sub domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.6">However, it can have a relationship with other sub domains.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="42" id="page42"/><span class="Italic"><a href="#fig3-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">Figure 3.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1"> shows the e-commerce domain with its sub domains (dark blue circles inside):</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1"><img src="images/Figure_3.1.png" alt="Flowchart of e-commerce domain showing interactions between order processing, invoice generation, payment handling, returns &amp; refunds, inventory control, shipping, and product recommendations."/></span>

</figure>
<h4 class="head3" id="sc4_69"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">Bounded context</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">Once the domain has been identified and divided into sub domains based on the core and supporting capabilities of the business, each sub domain is demarcated into a bounded context to mark its boundary and to define the technical artefacts like entities and aggregates (logical domain model) within the bounded context. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.2">The bounded context will be translated into one or more independent components or microservices at a later point in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.3">The idea of arriving at the bounded context is to break the complexity of the software into multiple chunks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.4">Each bounded context will address a specific capability of the business like inventory, order processing, invoicing and payments, shipping, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.5">The bounded contexts identified can have relationships among them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.6">These relationships are called context maps.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">The following are the relationship types:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">Partnerships</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">: Bounded contexts and their teams share code of models between them, but the ubiquitous language used by different bounded contexts will be unique.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">Customer-supplier</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">: In this model, one bounded context or team provides the required service to another bounded context, that consumes it.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Open host service</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">: A bounded context provides a service which is extended by other bounded contexts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">Anticorruption layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">: A layer of translation between two communicating bounded contexts, so that the model of one does not penetrate or impact the other bounded context.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">Conformist</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">: The downstream system conforms to the models of the upstream systems.</span></span></p>
<h4 class="head3" id="sc4_70"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">Entities and aggregates</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Within a bounded context which represents a sub domain, entities and aggregates need to be identified. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.2">Entities and aggregates represent the data, behavior and relationships required to realize the capabilities within a sub domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.3">This is referred as the logical domain model.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">Entities are objects in DDD that hold data and behavior of real-world things. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.2">They are identified by a unique ID though the other attributes (data) of the entity instance (object) may be the same. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.3">For instance, customer is an entity in the above e-commerce example, and it may have attributes like customer ID, customer name, customer address, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.4">Though the other attributes like name could be the same, the customer ID differentiates the instance of the specific entity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="43" id="page43"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">The following are the high-level steps to applying DDD to design an application:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style727"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">1.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">Identify the core domain you are working with. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.2">Identify the distinct business boundaries or sub domains within the core domain.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style727"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">2.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">Establish relationships between those sub domains.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style727"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">3.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">Establish the bounded contexts for each of the sub domains identified.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style727"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">4.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">Establish relationships between bounded contexts using context map types such as partnerships, conformist, etc.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style727"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">5.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Identify entities, aggregates and value objects within each bounded context. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.2">The entities will model the data and behavior within each bounded context or sub domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.3">They will work together to make up a capability within a subdomain.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style727"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">6.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">Map each of the bounded context to one or more components (microservices) providing the required capabilities for the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.2">Deploy these components independently.</span></span></p>
<h3 class="head2" id="sc3_71"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">API first design approach</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">API is an end point exposed by an enterprise for consumption of their services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.2">APIs have become the backbone of modern-day software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.3">They are effectively used by enterprises to offer their services to their customers and partners. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.4">Most of the applications are distributed and each application needs to expose their capabilities effectively and make known the contract for access of these capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.5">This is done with the help of APIs and a contract is made available for consumers to download and understand ways to access those APIs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">There are three types of APIs that are prevalent in the software application world as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">Private APIs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">: These are APIs built for internal consumption within the enterprise by other business divisions or project teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Public APIs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">: These are APIs exposed by the enterprise to the public. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.2">It is done to expose their services and data to be consumers such as developers to include the enterprise’s capability or service as part of a larger application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.3">This helps to foster innovation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">Partner APIs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">: These are mostly commercial APIs that are exposed to the business partners of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.2">This helps the enterprise to offer their services through third party portals thereby allowing the enterprise to monetize their products and services. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">The API first design approach looks at the capabilities of the application as a set of APIs that are required to be exposed as private, public or partner APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.2">The actual capability or functionality required is then implemented beneath these APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.3">The API first approach helps to develop components and applications in a stateless manner as each of the APIs are self-contained and idempotent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.4">This lets the APIs to scale very quickly without any external dependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">There are different architectural styles for exposing an application’s capability as APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.2">Some of them common ones are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">SOAP</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">Representational State Transfer </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">REST</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">)</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">GraphQL developed by Facebook</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">Google RPC </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">gRPC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">)</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">Webhooks</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">We will look at each one of these in detail and their use cases in </span></span><span class="Italic"><a href="ch04.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">Chapter 4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">, Technical Solutions Architecture and Design</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">.</span></span></p>
<h3 class="head2" id="sc3_72"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="44" id="page44"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">Artificial intelligence first design</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">AI first design approach puts AI as the central point of architecture and design, around which all features of the applications are developed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.2">With the advancement and affordability of high-performance computing hardware combined with availability of data, enterprises are slowly moving away from the conventional approach of coding technical components to machine learning models, that learns from the data on a continuous basis and provide the required functionality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.3">Machine learning or AI is no longer seen as an exciting ingredient added to the list of nonfunctional requirements, but considered as an essential aspect to building modern software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.4">The solutions architect should be conversant with machine learning algorithms and neural networks available to perform intelligent tasks within an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.5">Enterprises are using AI for tasks as varied as recommending products for customers to converting legacy code to more modern software languages like Python and C-Sharp(C#). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.6">The architect working with large enterprises should identify opportunities where AI can make a sea of difference instead of conventional programming methods.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">The following are the steps an architect could follow at the outset, for designing and implementing AI and machine learning based software solutions:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">1.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">Identify opportunities in the enterprise where AI can be used.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">2.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">Collect, consolidate and curate data for building the required AI solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">3.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">Choose the right algorithms, neural networks, tools, frameworks for building the AI models.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">4.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">Ensure the privacy, security and compliance of data being used and exposed to the solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">5.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">Build the models with the curated data and the chosen algorithm or framework.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">6.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">Tune the solution iteratively for accuracy, scalability and performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">7.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">Validate the models using data for which the results are already known.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">8.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">Tune the model’s hyperparameters to make it more accurate.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">9.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">Train the model continuously with data to make it usable on a continuous basis.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style728"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">10.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">Collect feedback and finetune the model for adding business value to users.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">With the world moving towards generative AI, it is very important that the architect has sufficient knowledge of how </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">large language models </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">LLM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">) work and their application to solving problems for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.2">We will touch up on the topic of generative AI in the section, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">Emerging technologies essential knowledge.</span></span></p>
<h2 class="head1" id="sc2_73"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">Design principles essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">The following are the design principles that all architects must be conversant with, to guide the development teams towards building software systems that are maintainable:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">SOLID principles</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">12 factor app</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">KISS</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">You aren’t gonna need it </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">YAGNI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">)</span></span></p>
<h3 class="head2" id="sc3_74"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">SOLID principles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">SOLID principles help developers in building flexible and maintainable software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.2">SOLID stands for the following:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">Single responsibility principle</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">: It states that a class should have only a single reason for changes in it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.2">It means that the class should focus on a single function or task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.3">This allows for a clear delineation of functionality within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.4">This promotes the principle of loose coupling between components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="45" id="page45"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">Open close principle</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">: This principle emphasizes the guideline that a class should be open for extension and should be closed for modification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.2">This enables development of an application wherein any changes to existing classes of functions does not break already existing and working functionality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">Liskov substitution principle</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">: This principle states that the objects of derived classes can replace the objects of a base class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.2">This promotes polymorphism and makes sure all derived classes and objects of derived classes inherit a uniform contract for common functionality among them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">Interface segregation principle</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">: This principle states that we should not design a single interface with all the methods going into it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.2">It makes the classes implementing such interfaces cluttered with unwanted functions or tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.3">Instead, we should split the interface into smaller ones grouping related methods into each one of them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.4">The classes can choose to implement one or more of those interfaces as appropriate.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">Dependency injection</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">: This principle states that the higher-level modules should not be designed to depend on specific low-level modules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.2">Instead, the higher-level modules should use abstractions (interfaces) for the lower-level modules to be injected into them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.3">This results in cleaner code of feature functionality being developed and the lower-level modules can be easily replaced any time within the higher-level modules (containing feature functionality), depending on requirements.</span></span></p>
<h3 class="head2" id="sc3_75"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">12 factor app design</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">12 factor app design principles can be used to build scalable, maintainable and portable distributed applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.2">Though they are mostly used in the development of cloud ready applications and microservices, they can be applied to any modern-day software application embracing varied architectural patterns. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">The following are the 12 design principles prescribed by the 12 factor app design methodology:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">Single codebase per application tracked in version control with many deploys</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">: It means that each application or an independently deployable component should be managed with its own codebase using a version control system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.2">This single codebase enables easy collaboration between development, testing and application support teams. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">Explicitly declare and isolate dependencies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">: This states that the dependencies such as libraries should be explicitly specified and managed by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.2">For example, a spring boot application manages the libraries required using Maven.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">Store config in the environment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">: This principle recommends the configuration information used by the application to be stored outside the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.2">This enables the application to focus only on business logic and not on technical details of how it needs to run in different environments like development and testing. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">Treat backing services as attached resources</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">: This principle emphasizes the fact to consider any support systems such as databases and storage required for the application as loosely coupled services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.2">The loose coupling provides the different application components, the ability to scale independently. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">Strictly separate build, release and run stages</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">: This principle requires the build, release and run stage to be independent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.2">Build stage is where the application codebase is compiled and dependencies are resolved and a compilation unit (war or jar) gets created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.3">The release stage enriches the application with configuration information so that it can run in different environments like development, testing and production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.4">The run stage of this principle requires the application to be deployed and run in an automated manner with the built application code on which configuration has been applied.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">Execute the application as one or more stateless processes</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">: Run each application or the service as a stateless process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.2">This requires the application not to maintain a state that is used across requests between the service and the client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.3">This enables easy scalability of the application without having to worry about loss of any state information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="46" id="page46"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">Export services via port binding</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">: This principle emphasizes that any application or service developed should run by itself independently without the need for any external server. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.2">This can be achieved by the application binding to a port on its own and is able to receive requests from client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.3">For example, a spring boot web app can independently receive and process requests without the need for it to be explicitly deployed in a web container.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">Scale out via the process model</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">: This states that the application should be made up of multiple small processes instead of a single process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.2">These small processes should able to be started and stopped independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.3">This principle aids in the easy scalability of those independent processes. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">Maximize robustness with fast startup and graceful shutdown</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">: This principle emphasizes each service or application should start or shut down very quickly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.2">The system should also be able to bring up or tear down other resources which will enable the application to be in a consistent state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.3">This principle enables the application consumers not having to wait for a longer period to get their requests serviced.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">Keep development, staging, and production as similar as possible</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">: It is important to keep environments such as development, testing and production as similar as possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.2">It aids the application to work consistently across environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.3">This also helps the developer team to identify issues quickly in the development stage itself and does not have to wait until testing or production which increases the cost of quality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">Treat logs as event streams</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">: This principle states that the applications should not be concerned with the storage and management of the logs produced by it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.2">Logging and tracing requests are very important especially on the cloud, where the infrastructure is ephemeral. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">Run admin or management tasks as one-off processes</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">: This principle requires that any administrative tasks required by the application such as setting up of the application configuration, etc., should be run as a separate process outside the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.2">This helps to segregate the application’s business logic from other tasks required for the application to start and function normally.</span></span></p>
<h3 class="head2" id="sc3_76"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">Keep it short and simple</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">This principle is also referred to as KISS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.2">It is one of the important principles, applied not just to software engineering, but also other engineering disciplines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.3">It states that any solution should be made as simple as possible and should avoid unnecessary complexity built into it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.4">It is more often applied to coding wherein programs should be short and readable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.5">For example, a method should be readable in its entirety within the laptop screen and lengthy ones are to be refactored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.6">This makes for an application that is modular, readable and maintainable.</span></span></p>
<h3 class="head2" id="sc3_77"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">You aren’t gonna need it</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">This principle emphasizes the fact an application should only be made up of features that are required for the efficient functioning of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.2">It calls for the prioritization of requirements as must haves, good to have, or excited to have. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.3">An application should address all the must have requirements and prioritize the other two categories. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.4">This again helps to keep the application simple, that lends itself well for future changes and ongoing maintainability.</span></span></p>
<h2 class="head1" id="sc2_78"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">Cloud computing essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">In this section, we will look at the types of services provided by the popular cloud providers like AWS, Azure, and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">Google Cloud Platform </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">GCP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">We will also look at some of the services provided by them to ensure quality of services such as availability, scalability, security, and performance for the application deployed on them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="47" id="page47"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">We will discuss cloud native patterns and their specific implementations on the cloud in </span></span><span class="Italic"><a href="ch22.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">Chapter 22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">, Cloud-native Architecture and Design.</span></span></p>
<h3 class="head2" id="sc3_79"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">Types of services</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">Each cloud provider, at the bare minimum, offers the following four types of services: Infrastructure, platform, software, and serverless. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.2">Let us take a closer look at these.</span></span></p>
<h4 class="head3" id="sc4_80"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">Infrastructure as a service</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">Each cloud provider offers infrastructure for deploying application workloads on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.2">These are servers on the cloud that can either be rented as a whole by the customer or can be shared with other customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.3">The servers come in different configurations based on the memory and CPU requirements of the customer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.4">These are all resources that are billed by the minute, depending on the service provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.5">These servers are virtual machines that are configured on the cloud and have their own name depending on the cloud service provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.6">Examples of infrastructure as a service include computing instances such as</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1"> Elastic Compute Cloud </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">EC2</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">in AWS and</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1"> virtual machines </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">VM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">in Azure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">Apart from servers for application deployment, they also provide object storage for storing artefacts like files, images, and videos on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.2">Some of such services include S3 from AWS, Blob Storage from Azure, and Google Storage from GCP.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">These cloud providers also provide attachable block storage devices, much like a hard disk, to extend the storage capacity of the virtual machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.2">Each virtual machine can be attached to any number of block storage devices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.3">Examples of storage services include </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">Elastic Block Store </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">EBS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">) from AWS and GCP, and disk storage in Azure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">The advantage of using the cloud infrastructure is the infinite scaling they can provide virtually. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.2">It helps enterprises to expand or contract their infrastructure even on an hourly basis depending on their application needs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.3">This ephemeral nature of the cloud infrastructure helps enterprises to save cost by not having to procure infrastructure permanently for their different environments like development, testing and production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.4">The onus of managing and maintaining these infrastructures solely rests on the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.5">This is again a cost advantage for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.6">The cloud providers also present minimal cost options such as spot instances wherein the customers can bid for the unused infrastructure of the cloud providers at a very low cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.7">The other advantage of the cloud infrastructure is the back up and disaster recovery options they provide to protect the customers data, whenever there is a failure or outage at the infrastructure level.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">The disadvantages of the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">infrastructure as a service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">IaaS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">) model is that the customer may not have fine grained control over the cloud infrastructure procured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.2">Though the cloud provider might offer a good amount of flexibility to configure the servers, it will not be the same as what could be achieved with servers procured and deployed in an on-premises environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.3">The other concern would be from a security stand point of the data stored in the cloud infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.4">Though there are multiple security controls in place for the cloud infrastructure, the customers cannot control any compromise of data due to external security breaches happening on the cloud infrastructure.</span></span></p>
<h4 class="head3" id="sc4_81"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">Platform as a service</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">Platform as a service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">PaaS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">) is another important service delivery model that solutions architects needs to be familiar with. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.2">It is a model in which the cloud provider not only provides the hardware infrastructure but also the required software for applications to be built and readily deployed on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.3">PaaS on the cloud is available for all types of workloads on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.4">It offers different types of environments to test and deploy web applications, analyze data using business intelligence tools, creating data warehouses and data lakes, running and managing containerized apps and monitoring them using sophisticated tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.5">For a developer, PaaS helps them pick the right tools (such as IDEs) for development, choose the operating system, install required application runtime libraries and build software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.6">PaaS services are offered to enterprises over the internet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.7">The extent of the services provided will depend on the type of subscription that the enterprise holds </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="48" id="page48"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">with the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.2">There are different types of PaaS such as Public PaaS where the platform is shared with multiple customers and private PaaS where the platform instance on the cloud is dedicated for one cloud customer.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">Some examples of PaaS includes Elastic beanstalk in AWS, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">Azure Kubernetes Service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">AKS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">on Azure and Google Kubernetes Engine on GCP.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">The following are the benefits of PaaS:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">The maintenance of the platform including constant patches to be applied lies with the cloud provider.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">Any licensing costs associated with the software platform are borne by the provider.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">PaaS offers a quick set up and a ready to deploy environment for applications, when the time to market for the customer is very short.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">Like IaaS, PaaS offers infinite scalability, and customers can increase or reduce their capacity based on the load on the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">PaaS is cost effective, and the customer needs to pay only for what is being used during the billing cycle.</span></span></p>
