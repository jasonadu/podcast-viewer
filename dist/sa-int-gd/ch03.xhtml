			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.846.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.847.1">You will ensure that the singleton class does not have any instance variable to avoid threading issues in the class.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style729 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.848.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.849.1">What design approach would you use to break the complexity of software and design the application as distributed components?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.850.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.851.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.852.1">You will use the DDD approach to break down the whole functionality (domain) into sub domains.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.853.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.854.1">You will identify the capabilities required as part of the sub domains.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.855.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.856.1">Each sub domain will have its own Ubiquitous (business) language.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.857.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.858.1">You will create a bounded context for each of the sub domains identified.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.859.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.860.1">Each bounded context will be associated with a set of entities and aggregates.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.861.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.862.1">You will identify and establish relationships between the bounded contexts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.863.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.864.1">You will map each bounded context into one or more microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style729 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.865.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.866.1">What is the design approach you will follow to an application that needs to open its services to lot of business divisions inside the enterprise and multiple business partners outside of the enterprise?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.867.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.868.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.869.1">You will use the API first design approach.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.870.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.871.1">You will study the external systems and the amount of granularity of data required by those systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.872.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.873.1">You will design contracts APIs of the application, based on the need of the consumer entities that wants to consume data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.874.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.875.1">You will understand the subscription needs to the consuming entities and accordingly meter the APIs for avoiding excessive load on the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.876.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.877.1">You will expose the contract to the consumers to access and understand the semantics for calling the exposed APIs. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style729 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.878.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.879.1">What are the design principles that you will adopt to architect and design an application that is distributed in nature?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.880.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.881.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.882.1">You will decide the architectural pattern such as Event driven, multilayered or Microservices to use for the application based on requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.882.2">you will also see if a combination of these patterns need to be used.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.883.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.884.1">For the individual distributed components, you will try to keep their design as simple as possible avoiding unnecessary complexity in terms of additional frameworks or libraries.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.885.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.886.1">You will use a design principle like 12 factor app design to follow industry standard best practices to improve modularity, flexibility and scalability of each distributed component.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style729 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="57" id="page57"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.887.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.888.1">How will you ensure the security of data within the application during transmission and at rest?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.889.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.890.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.891.1">You will ensure the security of data during transmission by using protocols like TLS between communicating components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.892.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.893.1">For the security of data at rest, you will use appropriate encryption algorithms to encrypt data before they are stored in persistent storage devices or databases. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style729 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.894.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.895.1">What are the different types of services offered by major cloud providers?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.896.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.897.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.898.1">Infrastructure as a Service wherein the cloud provider is responsible for provisioning and protecting the hardware, such as virtual machines and elastic block stores. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.898.2">The customer or the consumer is responsible for installing the required software and build applications on the infrastructure provided. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.898.3">Azure virtual machines and AWS elastic compute cloud are examples of this type of service.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.899.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.900.1">Platform as a Service in which the cloud provider provisions the hardware and the software platforms, and the customers can build applications on them and use it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.900.2">AWS </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.901.1">Relational Database Service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.902.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.903.1">RDS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.904.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.905.1">Azure Kubernetes Service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.906.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.907.1">AKS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.908.1">) are examples of this type of service.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.909.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.910.1">Software as a service in which the hardware, software platform, and the applications are hosted by the provider, and the consumer just needs to consume the application with their own data. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.911.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.912.1">Serverless computing is a model that is best suited for developers to write, test, and deploy code with popular programming languages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.912.2">The hardware and the software runtime are provided by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.912.3">AWS Lambda is an example of serverless computing.</span></span></p>
