			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="49" id="page49"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">The disadvantage of PaaS is the limited extent of customization that the cloud provider might allow for the architects and developers to do on the cloud platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.2">For instance, the relational database service is offered in a PaaS model by most of the popular cloud providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.3">However, they may not allow their customers to modify all the parameters of the database engine to the liking of the database administrators in the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.4">In the scenario wherein the enterprise wants more control of such platforms on the cloud, the option is to go for the IaaS model and deploy the required software platform on the cloud to have fine grained control. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.5">The other disadvantage is the availability of the platform, the onus of which totally lies with the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.6">The architect needs to take an informed decision while deploying machine critical applications with PaaS. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.7">In a hybrid environment, the architect needs to be aware of challenges with regards to integration of the PaaS environment with that of the resources on premise.</span></span></p>
<h4 class="head3" id="sc4_82"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">Software as a service</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">Software as a service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">SaaS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">) is a model in which the infrastructure, software platform and the application is provided by the cloud provider and the customer needs to only maintain the data required for the application and make use of the software services offered. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.2">This environment is more suitable for smaller enterprises which may not only have challenges with infrastructure and software platforms but may not have the skills to build applications using the right technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.3">From a subscription perspective, SaaS providers offer a pay per use model, and they have different levels of service ranging from standard to premium based on the subscription. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.4">Like PaaS, SaaS providers offer services over the internet, and they offer APIs for applications either on the cloud or on-premises to be integrated with them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.5">SaaS providers in general offer a multi tenancy model in which their services or applications are shared by many of their customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.6">Some of the SaaS applications include Google Gmail, Netflix entertainment platform and salesforce</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1"> customer relationship management </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">CRM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">platform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">The following are the advantages of using the SaaS models:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">The required capabilities are offered right out of the box, by the SaaS provider, which can readily be consumed with no effort.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">SaaS models have extreme capability to scale depending on the load they are subjected to.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1">They provide very flexible subscriptions that caters to enterprise of different sizes, from small, medium to large.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1">They offer a pay per use model which is very cost effective for consumers. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.1">They are a very good platform to quickly on-board or share ideas for smaller enterprise and startups, thereby fostering a culture of innovation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.1">The disadvantage of using the SaaS model is the risk that comes with sharing data with these third-party service providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.2">The onus of security of such services based on a SaaS model lies purely with the provider and any breach of the data could result in the consumer paying a huge amount of money as penalty to their end users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.3">The solutions architect needs to be aware of these implications while trying to use SaaS models in the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.4">With multi tenancy, the same instance of the application will be shared with multiple customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.5">The architect needs to consider the type of storage used by the SaaS provider and ensure that there is enough physical separation of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.6">This is especially important while using SaaS models for sensitive data like health information of individuals and bank information of customers.</span></span></p>
<h4 class="head3" id="sc4_83"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.631.1">Serverless computing</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.1">Serverless computing is a model in which the infrastructure and the required software is managed by the cloud provider, and it offers an environment for the developers to run and test the code without having to worry about the required hardware or software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.1">Serverless computing differs from the SaaS model, in which the user makes use of the readily built application and requires only their own data to make use of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.2">Developers are offered different types of programming runtimes including Python, Node.js and Java. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.3">They write code within the serverless compute environment and the onus of managing the computing resources like CPU and memory lies with the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.4">The developer only needs to choose their platform of choice write code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.1">Though the developers do not have control over the hardware or the software runtime, they can request for additional CPU cycles or increased memory to improve the efficiency of the program. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.2">All the popular cloud providers offer a serverless computing model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.3">The developers using a serverless computing model take the responsibility to code, test and deploy the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.4">However, the underlying infrastructure and the software runtime is totally managed by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.5">The developers also needs to ensure that their code meets the quality of services required to be met like performance and security. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.1">Serverless computing is used in scenarios where a piece of code needs to be executed as a precursor before a task is performed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.2">For instance, a program can be written in the serverless model and can be wired as a request preprocessor to check and enrich the request for certain headers before it is sent to the web application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.3">Another key feature of the serverless computing model is that the developers are charged only for the time their code runs in the cloud platform and the cloud resources consumed during that time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.4">These serverless compute model programs can also respond to certain events in an application and hence make them a good candidate for event driven applications and microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.636.1">The following are the advantages of the serverless computing model:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.638.1">Developers concentrate only on writing code and the computing resources are provided by the cloud platform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.640.1">The serverless compute platform automatically scales up or down depending on the number of instances of the function executed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.1">Developers pay only for the time during which the resources are consumed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.644.1">The software runtimes are provided for most of the popular programming languages and there are no licensing costs associated with their usage. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.645.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.646.1">It is an easier choice for developers to do quick proof of concepts before they try their programs on their managed infrastructure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.647.1">Some of the serverless computing models include AWS Lambda, Azure Functions and GCP Functions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.1">The main disadvantage with the serverless model is the limit they have on the execution time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.2">If the code takes more time than the threshold execution time limit allowed by the serverless computing platform, the program will get terminated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.3">The other challenge of the serverless model is the way they get warmed up to execute the code for the first time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.4">The resources required are configured only when the code is run for the first time, which </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="50" id="page50"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.1">makes it slower for first time users of the functionality offered by the program deployed in a serverless model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.2">Another disadvantage with this model is the kind of control that developers have over the infrastructure and software platform on which the code runs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.3">The developers do not have any control over the type of servers or the efficiency of the platform on which the code is run although in some cases they can request for a higher memory, which proportionately increases the CPU cycle time, and the program gets executed faster.</span></span></p>
<h2 class="head1" id="sc2_84"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.650.1">Database management essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.1">Making a choice of databases for the application is one of the key responsibilities of a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.2">Though the solutions architect mostly works with the architecture and design of solutions, in many enterprises the solutions architect plays a very key role in choosing the right storage for the data that flows through the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.3">They should also be aware of the sensitivity of the data and should recommend appropriate controls to secure the data as required. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.652.1">The following are the common type of databases that an architect can choose from, based on the type of data used by the application:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.653.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.654.1">Relational databases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.1">: This is the most common type of database used by many of the applications that are transactional in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.2">They provide a strict schema and data is stored in tables as rows and columns with each row pertaining to an instance of an entity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.3">The data stored in a relational database can be retrieved using relational operators. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.4">Examples of relational databases include Oracle, SQL server and Postgres which are offered as standalone version that can be installed on premise and all the</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.1">cloud providers offer them on their cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.2">The relational databases provide the required transactional capability to maintain consistency and integrity of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.3">Data can be created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.4">Queried, updated and deleted from an application using database management frameworks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.5">These frameworks provide a higher layer abstraction to the regular JDBC APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.6">Popular database management frameworks include </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.657.1">Java Persistence API </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.658.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.659.1">JPA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.660.1">) and hibernate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.660.2">A few use cases for relational databases include banking transactions and storing health care data of patients.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.661.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.662.1">NoSQL databases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.1">: NoSQL or Not only SQL databases unlike relational databases do not have any fixed schema for storing data in them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.2">This characteristic of the database makes them an ideal choice for storing semi structured data and unstructured data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.3">So, they are not a best choice for running complex queries or joins. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.4">NoSQL databases also scale very well which makes them an ideal choice for applications, where the load is unpredictable and can grow very quickly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.5">NoSQL databases are highly available as they are normally deployed across nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.6">This makes NoSQL databases offer an eventual consistency model wherein the data becomes consistent a bit later (milliseconds) than it was stored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.7">They are also very fast in returning the data queried as they do not need any complex queries to fetch the semi or unstructured data from them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.8">The flip side to NoSQL databases is that they do not offer any transactional characteristics like consistency and integrity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.9">NoSQL databases also do not have a standardized query language to retrieve from them unlike relational database which has the SQL to query or manipulate the data in them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.10">Some of the popular NoSQL databases include Mongo DB, Cassandra, Couchbase, HBase, Dynamo DB from AWS and Big Table from Google Cloud Platform</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.664.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.665.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.666.1">Graph databases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.1">: A graph database is a special type of database which stores the data as nodes, edges and properties. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.2">It also establishes relationship between the nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.3">The graph database uses mathematical graph structures for storing data in it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.4">The graph databases use traversal algorithms like depth first or breadth first to query the data stored in them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.5">Graph databases scale extremely well by storing data across different partitions or servers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.6">Graph databases are useful for use cases where relationships between data is central to the storage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.7">Social media applications, and recommendation engines are some of the places where a graph database would be a right choice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.8">Some of the examples of graph database includes RedisGraph, ArangoDB, OrientDB, AWS Neptune, Azure Cosmos database and Neo4J.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.668.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.669.1">Key value databases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.1">: Key value databases store data as keys and their associated values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.2">The key is unique and is used to retrieve the value from the database. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.3">Key value databases are ideal candidates </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="51" id="page51"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.1">for storing user sessions in an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.2">They can also be used as a caching mechanism to store data as key value pairs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.1">Any type of data can be stored and retrieved without complexity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.2">These databases can scale very easily. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.3">On the flip side, they do not support a standardized query language to retrieve data and data cannot be retrieved without the keys. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.4">Examples of popular key value databases include Redis, Memcached and BerkeleyDB.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.673.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.674.1">Event databases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.1">: Some applications store events instead of the conventional data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.2">An event database stores all the events over a period, which has resulted in the current state of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.3">Each event along with it stores the date and time the event occurred, along with the information of what caused that event. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.4">Event databases also provide a notification feature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.5">Popular event databases include Apache Kafka, EventStoreDB and Microsoft Azure Event Hubs.</span></span></p>
<h2 class="head1" id="sc2_85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.676.1">Application security essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.1">Application security is one of the key quality metrics when architecting and designing applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.2">It is imperative for a solutions architect to understand the nature of data that is being dealt with by the application and the flow of it throughout the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.3">Any data breach through the application can result in a business loss or a penalty for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.4">The architect needs to be aware of the following data security aspects while the data is being transmitted across the wire and when it is stored:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.678.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.679.1">Symmetric and asymmetric encryption</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.1">: Encryption is the process of transforming or scrambling data to a format that is incomprehensible to the human reader. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.2">Encryption is achieved using a key and an algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.3">A key (information or text that needs to kept as a secret) is chosen and using an algorithm the data is transformed with the help of the key and the output of this process can either be stored or transmitted to other applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.4">In the reverse, the same algorithm and keys are used to convert the incomprehensible text to the original text, which is called decryption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.5">If the same key is used for both encryption and decryption, it is called a symmetric encryption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.6">If two different keys are used, one for encryption and another for decryption, it's called asymmetric encryption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.7">This is the basis for public key cryptography.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.682.1">Hashing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.1">: Hashing is the process of creating a hash value for the given text using a key and an algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.2">Hashing works in the same way as encryption but the generated hash cannot be converted into the original text. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.3">This makes hashing a feasible approach for storing and comparing secure data, like passwords.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.684.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.1">Public key cryptography</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.1">: Public key cryptography uses asymmetric encryption as stated before. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.2">It uses two types of keys. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.3">A private key that is maintained as a secret by the server and is used to encrypt information served by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.4">The other key is the public key which is given to all the clients or consumers of the application data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.5">The data encrypted using the private key can only be decrypted using the public key. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.6">Again, the data encrypted by the public key can only be decrypted by the private key on the application side. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.7">This makes the data transmission over the wire secure. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.1">Transport Layer Security </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.689.1">TLS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.690.1">) protocols like TLS 1.2 and TLS 1.3 make use of public key cryptography.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.691.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.692.1">Digital certificates</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.1">: Digital certificates are certificates issued in the form of a file to an enterprise to be used by its software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.2">It identifies to the outside world, that the enterprise is legitimate and the applications hosted by it can be trusted by software clients. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.3">The digital certificate is issued by certification authorities for a specific period after which it becomes invalid. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.4">Digital certificates contain the public key of the enterprise application for which it was created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.5">The digital certificate is sent to the consumer's browser or the application which uses the public key in it to encrypt the data to be sent to the server application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.6">The server application decrypts the data using its private key.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.694.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.695.1">Ensuring data security during transmission</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.696.1">: Data over the wire can be protected using protocols like TLS, formerly called </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.697.1">Secure Sockets Layer </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.699.1">SSL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.2">TLS ensures security and privacy of data that is </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="52" id="page52"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.1">transmitted over a network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.2">Apart from data, TLS can also be used to encrypt emails and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.1">Voice over IP </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.1">VoIP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.1">) data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.2">TLS works with digital certificates issued by certification authorities like Verisign or Thawte, which are trusted by standard browser implementations like Microsoft Edge, Google Chrome and Apple Safari. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.3">Digital certificates are issued for an enterprise application that can be accessed by users using a desktop browser on a mobile phone. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.706.1">Hypertext transfer protocol Secure </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.707.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.708.1">HTTPS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.1">) that we commonly see in browser URLs is a TLS encryption implementation on top of the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.1">Hyper Text Transfer Protocol </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.712.1">HTTP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.1">) protocol.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.714.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.715.1">Ensuring data security at rest</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.1">: Data at rest (stored on a disk) is always under constant threat from both internal and external parties. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.2">Data security at rest ensures the storage of customer data in a secure manner and there are controls in place to avoid breach of data security. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.3">One of the ways to keep data secure is to have a role-based access to ensure that each user only has access to the data they are entitled to view or modify. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.4">The second way to protect data that is stored is to use appropriate encryption algorithms with a suitable key size that can be used to encrypt data before it is stored in the database. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.5">Most of the popular databases offer default encryption techniques that can be used to encrypt the data before it is stored, without any explicit effort from the users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.6">Using a Layered protection approach is another way of keeping the data secure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.7">This is an approach in which the data layer is protected by multiple passwords which needs to be given one after the other to get access to the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.8">The architect also needs to classify the data based its sensitivity and apply proper controls for its view and modification.</span></span></p>
<h2 class="head1" id="sc2_86"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.717.1">Networking essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.718.1">It is important for a solutions architect to know how machines communicate over the network and the basic theory behind it.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.719.1">The architect should be familiar with different application protocols that are commonly used in communication between application components or between applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.719.2">Though the solutions architect may not be expected to create or manage complex networks required by an enterprise, they should have the basic understanding of the network terminology and understand overall networking topologies in order for them to comfortably work with the network architects and infrastructure management teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.720.1">The architect should be familiar with the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.721.1">Open Systems Interconnection </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.722.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.723.1">OSI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.724.1">) model and the simpler TCP/IP model, based on which most of the modern computer networks are designed.</span></span></p>
<h3 class="head2" id="sc3_87"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.725.1">Open Systems Interconnection model</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.1">The OSI model uses seven layers that computers use to communicate over the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.2">The OSI model is a vendor neutral logical framework that encompasses all the capabilities required to make the network function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.3">The required capabilities are provided by components such as browsers, software runtimes, operating systems, routers, switches and network cables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.4">The OSI model is useful in isolating different functions in a network and helps to address security issues associated with each function.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.1">The following are the seven layers, top down, of the model:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.728.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.729.1">Application layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.1">: The is the layer that the application makes use of to provide an interface with the end user of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.2">This is the layer that is being used by the client applications such as web browsers or messaging clients to send and receive information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.3">Some of the application layer protocols include HTTP,</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.731.1"> File Transfer Protocol </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.732.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.733.1">FTP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.734.1">),</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.735.1"> Simple Mail Transfer Protocol </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.736.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.737.1">SMTP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.738.1">).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.739.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.740.1">Presentation layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.741.1">: This layer prepares the data required for the application layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.741.2">The presentation layer encrypts or decrypts the data based on the direction of the data flow.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.742.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.743.1">Session layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.1">: This session layer is responsible for maintaining the connection between the nodes that are communicating. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.2">It helps to establish an uninterrupted session between the sender and the receiver. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.3">The session layer also provides check points for an optimized transfer of data from the sender to the </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="53" id="page53"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.745.1">receiver. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.745.2">If there are interruptions in the transfer of data, which is later resumed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.745.3">This layer ensures that the data is transmitted from the last check point and only the untransmitted data is sent over the network.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.747.1">Transport layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.748.1">: This layer popularly known as layer four in the OSI model, splits the data packets into segments for optimal functionating of the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.748.2">It handles communication between two nodes in a network by adding a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.749.1">Transmission Control Protocol </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.750.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.1">TCP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.1">) header. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.2">It also receives acknowledgement from the receiver if the data packets are received in order using sequence numbers and without errors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.3">The data packets are transmitted again if there are any errors in the transmission. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.4">This is the layer hosting TCP and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.1">Universal Datagram Protocol </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.754.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.755.1">UDP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.756.1">) protocols.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.757.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.758.1">Network layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.759.1">: This layer is responsible for routing data across different networks, The network layer finds the best path of data transmission between two hosts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.759.2">It assigns a unique IP address within the data packets for the device.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.760.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.761.1">Datalink layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.762.1">: This layer uses the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.763.1">Media Access Control </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.764.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.765.1">MAC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.1">) address to identify the node to which the packets should be routed next in the network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.2">Devices in the datalink layer include switch and bridge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.3">While sending, it creates the frames from the message to be sent and also adds the MAC address of the destination in the MAC header of the message.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.767.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.768.1">Physical layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.1">: This physical layer is responsible for transmitting and receiving the data over the wire. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.2">The data is converted into electric signals (bits) and is sent across the network to other networks or machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.3">The physical layer also controls the rate at which the data is transmitted (bit rate control). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.4">The physical layer also determines the mode of transmission (simplex, duplex, and half duplex) of data across the network.</span></span></p>
<h3 class="head2" id="sc3_88"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.770.1">TCP/IP model</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.1">As mentioned earlier TCP offers a reliable way of transferring data across the network and the internet protocol handles the addressing and the routing of packets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.2">The TCP/ IP model divides the framework into four different layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.3">It is different from the OSI model and was developed prior to it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.4">TCP/IP defines how data is transmitted over the internet and how the data is broken down as packets, routed, transmitted, and decoded at the destination. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.5">Common TCP/IP protocols include HTTP and FTP. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.6">The TCP/IP collection of protocols is generally stateless, which means that each request from the client is treated independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.7">The following are the layers of the TCP/IP model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.8">TCP/IP is independent of the operating system used and supports multiple routing protocols:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.772.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.773.1">Application layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.1">: This is the layer of the network that is used by applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.2">This defines the format of data exchange that applications must adhere to while using specific protocols like HTTP and FTP.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.775.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.1">Transport layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.1">: This layer exchanges acknowledgements of the data packets sent or received. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.2">This layer retransmits the missing packets of data to the destination. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.3">TCP and user datagram protocol are the protocols in this layer.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.778.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.1">Internet layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.780.1">: The internet layer is responsible for routing data packets from one machine to another machine across a network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.780.2">This is achieved by assigning each machine a unique IP address.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.781.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.782.1">Network link layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.783.1">: This is also called the network access layer or the network interface layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.783.2">This layer assigns the MAC address for communication to the next destination for the data packets.</span></span></p>
<h2 class="head1" id="sc2_89"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.784.1">Emerging technologies essential knowledge</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.785.1">Apart from the knowledge to architect and design applications using industry standard architectural patterns, design approaches and principles, the solutions architect is expected to have an awareness of the technologies that are disrupting the industries overall.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="54" id="page54"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.786.1">The following are some of the topics, the architect needs to be educated with, though they may not be using these in their day-to-day work. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.786.2">This is required for them to understand their applicability, explore and include them in their solution, as appropriate.</span></span></p>
<h3 class="head2" id="sc3_90"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.787.1">Generative AI</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.788.1">Generative artificial intelligence </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.789.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.790.1">GenAI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.1">) is the technology that has taken the world by storm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.2">It makes use of the data available on the internet, using which a model has been trained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.3">The LLMs, as they are called, can generate text, images, and videos. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.4">As a result, they have found widespread usage in almost all areas, be it business, science, or the arts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.5">The generative AI field is fast expanding with a wide variety of base models being made available by different technology companies and startups for use by businesses and developers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.6">It is important that the architects have a grasp of the basic concepts related to GenAI to stay contemporary and have meaningful conversations with fellow architects and the businesses for which they build applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.792.1">At a basic level, the architect needs to be aware of the following terminology and is expected to expand their knowledge further in this most exciting and happening area:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.793.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.794.1">Conversational AI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.795.1">: Conversational AI allows users to use common natural language to converse with AI models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.795.2">It uses </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.796.1">natural language processing </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.797.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.798.1">NLP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.799.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.1">techniques to understand questions and provide answers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.801.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.802.1">Deep learning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.803.1">: Deep learning uses neural networks (computer nodes arranged like neurons in the brain) to identify patterns in data to recognize images and predict outcomes based on the data with which it is trained.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.804.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.805.1">Transformer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.806.1">: Transformer are neural network architectures that work based on a mechanism called self-attention. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.806.2">It captures the context in the data provided and is able to generate output for questions asked based on the context. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.807.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.808.1">Large language models</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.1">: LLMs are a broad category of models that are trained with a huge corpus of data and uses NLP to answer questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.2">There are LLMs which are pre-trained with data in a specific domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.3">For instance, a LLM pre-trained with medical and health care data can answer questions related to health disorders, their symptoms and treatment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.810.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.811.1">Generative pre-trained transformer (GPT)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.812.1">: GPTs are a subset of the large language models that use the transformer architecture and are pre trained on a large corpus of data to provide answers to the questions asked. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.812.2">GPTs were developed by the OpenAI long term partnership.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.813.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.814.1">Prompt engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.815.1">: It is a way of asking a question to get the most relevant answer from a large language model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.815.2">It is about framing a question about a particular topic that can get the best possible answer from the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.815.3">Zero shot prompting is a way in which we prompt the LLM with a question without any examples and we let the model answer based on its broad-based training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.815.4">Few shots prompting is another method in which the prompt contains a few examples to get the response from the model.</span></span></p>
<h3 class="head2" id="sc3_91"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.816.1">Blockchain</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.1">Blockchain is a technology that allows information sharing in a distributed manner among participating entities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.2">A relational database storing data as a central repository for an application or for a group of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.3">However, a block chain database in not centralized and the database is maintained by all the parties involved in a transaction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.4">A blockchain stores transactions in a block and these blocks are chained together sequentially. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.5">Blockchain creates a distributed ledger that is maintained by each of the interested parties or entities and any transaction in the block chain database must be approved by all parties before it is committed to the block chain database. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.6">Blockchain has a mechanism which does not allow unauthorized entries into the database.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="55" id="page55"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.1">The advantage of a blockchain is its ability to prevent data tampering as the transactions and its corresponding data are not centralized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.2">This finds a lot of utility in businesses where trust plays a very important role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.3">In trade finance, a block chain can be used to synchronize transactions between an exporter (seller), importer (buyer) and the bank. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.4">The transactions from shipping of goods, to guarantee provided by the bank and the payment by the buyer can all be synchronized using a blockchain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.5">Similarly, a block chain will be very useful in the sale of properties in which the seller and buyer of the property needs to agree and perform transactions in a synchronized manner for the transfer of the property documents from the seller to the buyer and transfer of money from the buyer to the seller.</span></span></p>
<h3 class="head2" id="sc3_92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.819.1">Quantum computing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.820.1">Quantum mechanics is the study of behavior of the sub atomic particles in physics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.820.2">Quantum computing is a field of computer science that makes uses of the principles of quantum mechanics to achieve computing power that are much beyond what is possible with the most powerful computers available now. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.820.3">Using the principles of quantum mechanics, a quantum computer will be able to solve a problem in seconds what it now takes hours for a super computer in the present-day world.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.821.1">Like bits and bytes in today’s computing world, data in quantum computing is stored as qubits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.821.2">A qubit is a basic unit of information in quantum computing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.821.3">Current day computing bits are binary and can hold only a value of zero or one, but a qubit can hold a superposition of multiple states. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.821.4">This makes information representation much more optimum.</span></span><span class="CharOverride-14"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.822.1">By adding multiple qubits and using a concept called entanglement (where multiple qubits influence each other, coordinate and synchronize), quantum computers can calculate exponentially more information and solve very complex problems that will take decades for the hardware available currently.</span></span></p>
<h2 class="head1" id="sc2_93"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.823.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.1">In this chapter, we looked at the essential knowledge required for a solutions architect to effectively architect and design solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.2">We covered the topics of design patterns and approaches to architect and design software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.3">We also looked at the different design principles that are commonly being used by software architects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.4">We discussed the topics of cloud computing services, database management, application security and networking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.5">We also briefly covered the emerging trends that a software architect should be knowledgeable about.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.825.1">In the next chapter, we will cover different architectural patterns and their applicability to different scenarios and application types.</span></span></p>
<h2 class="head1" id="sc2_94"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.826.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.827.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.828.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.829.1">Foundational and enterprise design patterns</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.830.1">: Apply industry standard patterns practically for solving recurring problems during the design and coding of enterprise applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.831.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.832.1">Design approaches and design principles</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.833.1">: Use standard design approaches to break complexity of enterprise application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.833.2">Apply industry accepted design principles to applications during their architecture and design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.834.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.835.1">Learn essential knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.836.1">: Knowledge required in the areas of cloud computing, database management, security and networking for the architect to have a broader understanding of the landscape, apart from design patterns, approaches and principles.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.837.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.838.1">Emerging technologies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.839.1">: Understanding of the technologies like generative AI, Blockchain and quantum computing that are disrupting the industry at the present.</span></span></p>
<h2 class="head1" id="sc2_95"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="56" id="page56"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.840.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style729 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.841.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.842.1">How will you design a software component in which there should exist only one instance of a class?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.843.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.844.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.845.1">You will use the Singleton design pattern which restricts the number of objects in the application to be only one in the application.</span></span></p>
