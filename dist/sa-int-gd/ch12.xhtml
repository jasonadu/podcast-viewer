			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">Besides the architectural strategies for disaster recovery, solutions architects should consider broader business continuity planning to maintain high availability in several failure scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.2">This next section addresses how to incorporate continuity planning for a resilient system design.</span></span></p>
<h2 class="head1" id="sc2_440"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">BC planning for high availability</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">BCP involves the ability of systems and services to continue working with no interruption in case of a sudden disruption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.2">Solutions architects should design architectures that can respond to different failure scenarios to ensure availability and operational integrity.</span></span></p>
<h3 class="head2" id="sc3_441"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Differences between high availability and DR</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">Although the two are related, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">high availability </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">HA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">) and DR are used for different purposes in resilience planning:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">HA is minimizing the downtime during normal operation, distributing workloads, and making use of redundant components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.2">HA architectures are about having systems running continuously, even under minimal disruptions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">DR is about getting out of a major system failure or disaster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.2">DR usually involves restoring data, restarting services, and then re-establishing operations from backup locations after some sort of unexpected event.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="254" id="page254"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">Understanding these differences enables solutions architects to focus BCP elements on system requirements with short-term operational continuity (HA) and longer-term recovery (DR).</span></span></p>
<h3 class="head2" id="sc3_442"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">Service level agreements and BC needs</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">Service level agreements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">SLAs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">) set certain uptime and performance standards, which typically dictate BCP objectives:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Setting SLAs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">: Organizations set SLAs to achieve business continuity goals that encompass allowable downtime, response time, and recovery criteria.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">Mapping SLAs to continuity requirements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">: Solutions architects should ensure that the business needs and technical capabilities align. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.2">They should see that architectures meet or surpass the defined SLAs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.3">In this case, a 99.99% uptime SLA could require failover across multiple availability zones or regions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">The inclusion of HA features and robust continuity solutions ensures that operations are kept at agreed performance levels, thus meeting the SLAs.</span></span></p>
<h3 class="head2" id="sc3_443"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Building BC into your architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">To build resilient systems, solutions architects should consider multiple strategies for maintaining continuity in various failure scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.2">Let us take a look at the key areas to address.</span></span></p>
<h4 class="head3" id="sc4_444"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">Ensuring operations during cyber attacks</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Cyber threats are a significant risk to business continuity, requiring proactive security measures to ensure systems remain operational during an attack. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.2">Implementing redundancy, network isolation, Zero Trust principles, and multi-factor authentication, data encryption can help mitigate risks and maintain service availability, which has been further explained as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">Implement redundancy and isolation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">: Use network segmentation and redundancy to contain cyber threats, allowing unaffected parts of the system to continue operating.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">Zero Trust Architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">: A Zero Trust approach is one where all users, inside or outside the network, are authenticated and authorized in real-time, thus limiting unauthorized access during attacks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">Multi-factor authentication and data encryption</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">: Implementing MFA and data encryption offers layers of security, therefore preventing data breaches and system outages.</span></span></p>
<h4 class="head3" id="sc4_445"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">Continuity during power outages</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">Power disruptions can severely impact critical operations, making it essential to have backup power solutions and redundancy mechanisms in place. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.2">Solutions architects should design architectures that leverage </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">uninterruptible power supply</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">UPS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">) systems, geographical redundancy, and hybrid cloud solutions to maintain availability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.2">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">UPS systems</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">: Implement UPS systems to maintain short-term power in case of outages, thereby reducing the risk of data loss and allowing time for systems to failover.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">Geographical redundancy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">: Host critical applications in multiple regions or data centers to ensure continuity if one location experiences a power disruption. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">Cloud and on-premise hybrid solutions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">: Combine on-premise resilience with cloud redundancy to ensure continuity during outages, with cloud services providing instant failover capabilities.</span></span></p>
<h4 class="head3" id="sc4_446"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="255" id="page255"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">Natural disasters and system failures</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">Disruptions caused by natural disasters or infrastructure failures require robust failover strategies to minimize downtime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.2">By implementing regional failover plans, load balancing, and automated failover mechanisms, organizations can ensure resilience against large-scale disruptions, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">Regional failover plans</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">: Critical systems are dispersed geographically to prevent the impacts of regional disasters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.2">Where one location is down, systems are available elsewhere.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">Load balancing and traffic management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">: Employing load balancers and global traffic managers to send the traffic to available resources during a regional disaster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.2">During such an outage, traffic can be redirected to unaffected regions without a single degradation in system performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">Automated failover mechanisms</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">: Utilize cloud-native services such as AWS Route 53, Azure Traffic Manager, among others, for automation of fails processes so that rerouting of users to the backup sites is done efficiently when a failure occurs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">Solutions architects must design BCP measures that address both huge-scale and localized disruptions, such that they are aligned with the SLAs and all critical systems are resilient and survive any event.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">Designing a strong continuity and disaster recovery strategy is half the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.2">Testing and validation, however, are required to ensure these plans will work as envisioned. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.3">The following section discusses methods of testing, including simulation and proactive techniques like chaos engineering.</span></span></p>
<h2 class="head1" id="sc2_447"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">Testing and validating DR plans</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">For adequate preparedness and avoiding longer downtime during disruptions, the DR plans must undergo regular testing and validation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.2">For solutions architects, proper testing practices must be applied for the verification of recovery strategies against the expected performance or real-world scenarios to meet specific recovery objectives.</span></span></p>
<h3 class="head2" id="sc3_448"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">Importance of regular testing and simulations</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">Testing DR plans is essential for finding out the weaknesses and preparing to improve them before a real disaster hits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.2">Periodic simulations assist with:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">Recovery strategy validation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">: The strategy implemented in the plan meets the RTOs and RPOs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">Identification and filling of gaps</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">: Testing will reveal where the plan is weak, thereby filling those gaps.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">Improving team readiness</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">: Teams can get advanced preparation on DR procedures, which would minimize response time at the event.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">Tests should be scheduled to be held quarterly or semiannually, and after important infrastructure or application changes, the test should be performed.</span></span></p>
<h3 class="head2" id="sc3_449"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">How to design DR simulations</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">Designing a valid DR simulation requires mimicking disaster conditions to test for responses from the system:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">Define scenarios</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">: Some of the possible disasters included data center outages, network failures, and cyberattacks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">Define clear goals</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">: To prove that a failover does happen within an RTO, or data loss is minimized according to the RPO.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">Execute tests gradually</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">: Start with low-risk components before scaling up to full-scale simulations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="256" id="page256"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">Document results and lessons learned</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">: Review results to identify actionable improvements, documenting lessons learned for future testing.</span></span></p>
<h3 class="head2" id="sc3_450"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">Chaos engineering for proactive DR testing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">Chaos engineering is a new type of DR strategy testing in which failure is deliberately injected into systems to observe how they respond. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.2">Let us take a closer look:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">Chaos engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">: Chaos engineering is the process by which one tests the resilience of systems through controlled failures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.2">It is a way of testing the systems under stressful and unpredictable conditions so that solution architects can test the robustness of DR plans.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Applying chaos engineering to DR testing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">Simulating real-world failures such as database downtime or network interruptions, chaos engineering tests if systems can auto-recover from these failures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.2">The injection of failures, including disabling certain nodes or throttling network speeds, shows vulnerabilities that might not occur in the course of testing with other tools.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">Tools for chaos engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Gremlin</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">: Allows engineers to simulate different failure scenarios, from CPU spikes to network outages, and analyse recovery responses.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">Chaos monkey</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">: Part of Netflix’s Simian Army, Chaos Monkey randomly disables production instances to test failover mechanisms.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">AWS fault injection simulator</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">: Enables engineers to test how AWS environments respond to faults, like latency or system crashes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">Benefits of chaos engineering in DR and BC plans</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Proactive vulnerability detection</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">: Chaos engineering helps identify issues in system resilience proactively, minimizing the risk of unexpected failures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">Improved confidence in DR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">: Frequent testing under real-world conditions increases confidence that DR plans will work during an actual disaster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">Enhanced system stability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">: By constantly challenging systems, architects can design more stable, resilient architectures.</span></span></p>
<h3 class="head2" id="sc3_451"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">Common pitfalls in DR testing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">Common mistakes in DR testing can render plans ineffective when needed most:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">Incomplete test coverage</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">: Testing only specific components rather than the full architecture can overlook critical interdependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">Lack of documentation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">: Failing to document procedures and results may cause teams to repeat mistakes or overlook essential lessons.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">Untrained personnel</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">: Testing often involves only the IT team, but DR events impact multiple departments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.2">Including cross-functional teams ensures everyone knows their role.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">Overlooking non-IT dependencies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">: DR plans must consider dependencies beyond IT, such as power and logistics, to ensure a comprehensive recovery approach.</span></span></p>
<h3 class="head2" id="sc3_452"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">Real-world example: DR testing in large enterprises</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">Consider a multinational bank that performs quarterly DR simulations across its global data centres. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.2">The testing involves:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="257" id="page257"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">Simulating regional failures</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">: By creating scenarios that take entire regions offline, the bank verifies its failover across multiple geographies, ensuring customer services remain available.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">Cross-functional collaboration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">: Teams from IT, operations, and compliance collaborate in testing, ensuring that all business aspects remain operational.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">Using chaos engineering tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">: The bank utilizes tools like Gremlin to simulate database outages and load balancing failures, strengthening its DR posture and verifying recovery times.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">This approach not only prepares the bank for actual disruptions but also strengthens its overall resilience by regularly identifying and addressing potential weak points.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">With a strong understanding of testing and validating DR plans, it is helpful to apply these concepts to real-world scenarios.</span></span></p>
<h3 class="head2" id="sc3_453"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">The role of SRE in enhancing DR and BC</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">Site reliability engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">SRE</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">) is a discipline that combines software engineering principles with IT operations to ensure system reliability, scalability, and performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.2">In the context of DR and BC, SRE focuses on proactive measures to minimize downtime, automate recovery processes, and enhance system resilience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.3">By embedding reliability practices into the development lifecycle, SRE teams help ensure that architectures meet RTOs and RPOs.</span></span></p>
<h4 class="head3" id="sc4_454"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">Core SRE practices for BC/DR</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">SRE applies engineering principles to enhance disaster recovery and business continuity by defining clear objectives, managing error budgets, streamlining incident response, and leveraging automation to minimize downtime and improve system resilience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.2">The following list provides more details:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">Service level objectives (SLOs)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">SRE emphasizes setting clear SLOs, which define measurable targets for availability and performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">SLOs align with RTO and RPO goals, ensuring that disaster recovery plans meet business and operational needs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">Error budgets</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">Error budgets provide a quantified allowance for downtime, balancing reliability and innovation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.2">SRE uses error budgets to prioritize recovery efforts and justify investments in DR and BC strategies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">Incident response and post-mortems</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">SRE practices involve structured incident response plans, including detailed runbooks for handling outages.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">Post-mortems analyse the root cause of failures, ensuring lessons learned improve DR and BC strategies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">Automation and tooling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">SRE leverages automation to streamline failover, backup testing, and recovery processes, reducing manual intervention during incidents.</span></span></p>
<h4 class="head3" id="sc4_455"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">SRE's contribution towards resilience</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">The following mentions SRE’s contribution towards resilience:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">Principles of SRE leverage the culture of DR/BC with prevention, reduction of mean time to recovery, and improvement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="258" id="page258"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">Proactive testing, such as chaos engineering, in the service of SRE, to fit the intent for the resiliency of a system under test.</span></span></p>
<h4 class="head3" id="sc4_456"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">Combining SRE with solutions architecture</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">Solution architects work closely with SREs to create architectures that best balance performance, cost, and reliability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.2">Though the solution architect is the system designer and planner, the SRE ensures the design is operationally valid and can handle real-world stressors.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">The following section considers some of the more typical disaster recovery and continuity scenarios (from data center collapse through to ransomware attack and cloud outage) and what the solution architect can do for each.</span></span></p>
<h2 class="head1" id="sc2_457"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">Practical DR and continuity scenarios</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">Solutions architects need to be ready to answer scenario-based questions on DR and BC strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.2">In the following examples, we cover common scenarios and how architectures need to be designed to address each of these situations effectively.</span></span></p>
<h3 class="head2" id="sc3_458"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">Example scenarios</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">Disaster recovery and business continuity require well-defined strategies tailored to specific failure scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.2">Solutions architects must be prepared to design architectures that ensure minimal downtime, quick recovery, and resilience against various disruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.3">The following real-world scenarios highlight how DR and BC strategies can be implemented to mitigate risks and maintain operational stability.</span></span></p>
<h4 class="head3" id="sc4_459"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">Data center failure</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">In case of failure at a data center:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">It is important that DR architecture makes critical services accessible while automatically redirecting the workloads to other locations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">Recommended solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">: Deploy the multi-regional architecture having the load balancer distribution across multiple data centers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.2">Data should be replicated in real-time so that there is continuity, and applications should either be stateless or use distributed databases, so that failover is possible without losing data.</span></span></p>
<h4 class="head3" id="sc4_460"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">Cloud provider outage</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">Cloud provider outages can affect many services across regions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.2">In such a case:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">Critical applications should be planned for cloud redundancy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">Recommended solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">: Implement a multi-cloud strategy to diversify dependencies and avoid single points of failure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.2">Architect the applications to be cloud-agnostic where possible, using containers and orchestration tools (e.g., Kubernetes) to facilitate portability across cloud providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.3">Alternatively, design for cross-region replication within the same cloud provider, ensuring failover within unaffected regions.</span></span></p>
<h4 class="head3" id="sc4_461"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">Ransomware attack recovery</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">A ransomware attack:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">Can freeze essential systems and data, causing quite a disruption to business activity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">Recommended solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">: Harness immutable backups and data snapshots that cannot be changed even after they have been written, thus being ransomware encryption-proof. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.2">Implement a rapid </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="259" id="page259"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">backup restore process using isolated recovery zones to quickly access clean data copies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.2">Regularly test backups to ensure they are uncompromised, and consider using tools that detect unusual file activity or access patterns as early indicators of potential ransomware.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">It helps to overcome known risks through practical scenario implementation; however, it introduces yet another layer of resilience because policy as a service enforces policies in real time to support dynamic ongoing compliance and business continuity across the environments.</span></span></p>
<h3 class="head2" id="sc3_462"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">Policy as a service for business continuity</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">Policy as a service helps to enforce policies across systems in real time, ensuring continuity with the agreed-to DR and BC standards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.2">Policies like data replication or failover rules are coded, thus allowing dynamic and consistent governance across environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.3">These concepts are explained in more detail, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">In BCP, policy as a service provides for continuous policy compliance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">: Defining DR and BC policies as code, policy as a service continuously evaluates systems to be compliant with established standards, meaning systems will meet the criteria for high availability and security even as applications update or environments change.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">Practical example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">: Assume a system configured with policy as a service for regional availability monitoring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.2">When an availability zone goes down, policy as a service will automatically enforce a failover policy, initiate data replication, and redirect traffic to a working zone without requiring manual intervention.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">Business continuity through automatic policy enforcement</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">: With policy as a service, business continuity can be achieved through automatic load distribution and failover. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.2">Thus, in case of disruption, the system would ensure a smooth transition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.3">For example, policies can enforce redundant storage configurations so that data is always available, and services are not interrupted.</span></span></p>
<h3 class="head2" id="sc3_463"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">How to design DR/BC architectures for common scenarios</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">Designing resilient DR/BC architectures for particular scenarios requires a customized approach:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">For data center failures</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">Design a multi-region architecture with Active-Active or Active-Passive failover between data centres.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">Utilize synchronous replication to ensure data consistency across locations, with load balancers distributing traffic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">Periodically test failover to ensure RTO and RPO compliance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">For cloud provider outages</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">Employ a multi-cloud strategy or regional redundancy in the same provider to maintain flexibility.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">Cloud-agnostic components such as containers and orchestration tools to make it easy to migrate.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">Use multi-cloud backup and storage solutions that make rapid recovery possible if one provider fails.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">For ransomware attacks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">Immutable backups and enabling regular data snapshots.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">Security policies for the early detection of unusual behavior by integrating them into your DR framework to trigger immediate isolation of affected systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">Design isolated recovery environments that will restore backups without cross-contamination.</span></span></p>
<h2 class="head1" id="sc2_464"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="260" id="page260"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">In this chapter, we explored the key role that DR and BC play in solutions architecture and how architects design systems to survive disruptions and stay up and running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.2">From knowing what RTO and RPO are and how to implement backup solutions and failover mechanisms to IaC, this chapter provided an overview of resilient architectures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">We also explored policy as code and policy as a service, which dynamically enforce continuity and compliance standards, thus making it possible to adapt in real-time in the face of potential failures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.2">Practical examples and scenario-based insights helped us understand how to respond to data center failures, cloud provider outages, and cybersecurity threats.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">As a solutions architect, mastering DR and BC involves not only designing for continuity but also consistently testing these designs to ensure their effectiveness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.2">Techniques such as chaos engineering expose weaknesses proactively, so that architects fine-tune their DR plans to meet the very highest standards of resilience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.3">Integrated with such strategies, solutions architects will be perfectly equipped to address all interview scenarios and real-world challenges, leading to the delivery of systems that safeguard business operations and generate user trust by dependable availability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">While designing resilient architectures is crucial for maintaining operations during disruptions, governance and compliance play an equally vital role in ensuring that these architectures adhere to regulatory and organizational policies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.2">In the next chapter, we will explore how governance frameworks and compliance regulations influence architectural decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.3">We will discuss how solutions architects can design secure, audit-ready systems while balancing regulatory requirements with business innovation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">In the next chapter, we will learn about governance and compliance and how they are the backbone of enterprise level applications.</span></span></p>
<h2 class="head1" id="sc2_465"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">Designing resilient and recoverable systems is a critical responsibility for solutions architects, ensuring that businesses can withstand disruptions and maintain continuity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.2">This section summarizes the essential principles, best practices, and proactive strategies that drive effective DR and BC planning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.3">From defining RTO and RPO to leveraging IaC, PaC, and automated failover mechanisms, these takeaways equip architects with the necessary tools to </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">build robust, compliant, and highly available architectures:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">Core DR and BC strategies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1">: Solutions architects must design systems with robust DR and BC plans to maintain resilience and recoverability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">Setting RTO and RPO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">: Define RTO and RPO to guide replication and backup strategies effectively.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1">Effective backup and automation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">: Use automated backups and IaC to standardize recovery, ensure consistency, and reduce downtime.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">Active-Active vs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.2">Active-Passive</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">: Choose Active-Active for high availability with low downtime or Active-Passive for cost-effective recovery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">Policy as code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">: Enforce DR compliance with automated policy checks, ensuring recovery standards are continuously met.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">Chaos engineering for resilience</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">: Use tools like Gremlin and Chaos Monkey to test and strengthen system resilience proactively.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">Immutable backups for security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">: Protect against ransomware with immutable backups, providing clean data for recovery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">Multi-cloud and hybrid DR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">: Multi-cloud or hybrid solutions reduce reliance on a single provider, enhancing overall resilience.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="261" id="page261"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">Policy as a service</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">: Automate continuity policies with policy as a service for real-time failover and recovery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">Regular testing and simulations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">: Routine DR testing and simulations prepare systems and teams for real-world scenarios.</span></span></p>
<h2 class="head1" id="sc2_466"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style259"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">How do you decide between synchronous and asynchronous data replication for disaster recovery?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">Synchronous replication:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">Ensures data consistency across locations, minimizing the risk of data loss.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">Involves higher latency, making it suitable for applications needing strong data integrity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">Used in cases where RTO and RPO are low (e.g., financial applications).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">Asynchronous replication:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">Offers faster performance with reduced latency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">Allows minor data loss, making it ideal for applications that can tolerate slight discrepancies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">Applied in applications prioritizing speed and less-critical data requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">Example</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">: For a financial client, you implemented synchronous replication between data centres to achieve near-zero data loss, while using asynchronous replication for less critical services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style259"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">Describe a scenario where you used IaC for rapid disaster recovery and how it improved your DR plan.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">IaC (e.g., Terraform or CloudFormation) automates environment creation, ensuring consistency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">Eliminates manual steps, reducing setup and failover time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">Improves recovery reliability by removing human error from configuration.</span></span></p>
