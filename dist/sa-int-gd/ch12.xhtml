<header>
<h1 class="chaplabel" id="ch12"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="243" id="page243"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 12</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Disaster Recovery and Business Continuity</span></span></h1>
</header>
<h2 class="head1" id="sc2_400"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Disaster recovery </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">DR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">business continuity </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">BC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">) are essential elements of today’s applications, ensuring that systems remain operational for end users even when disruptions such as system failures, cyberattacks, or natural disasters occur. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Therefore, designing systems that minimize downtime but have continuous availability of business service is extremely important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">Solutions architects play crucial roles in providing such applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">DR and BC are integrated into architecture design so that businesses recover as soon as possible and remain stable during adverse situations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.5">This chapter discusses the relevance of DR and BC in solutions architecture by discussing how strategic planning, robust backup solutions, and high-availability designs can prepare systems to face disruption while meeting business objectives.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">We will cover DR and BC concepts with terms like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">recovery time objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">RTO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">), </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">recovery point objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">RPO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">), and solutions including i</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">nfrastructure as code </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">IaC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">policy as code </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">PaC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">) for automated processes through recovery throughout the chapter. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">This chapter will prepare you to design architectures that put operational continuity and disaster readiness first by exploring real-world scenarios, failover strategies, and proactive testing techniques such as </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">chaos engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">In our discussion going forward, we should consider how solutions architects can embed DR and BC principles into architecture and design to build systems that are not only robust but also resilient against challenges.</span></span></p>
<h2 class="head1" id="sc2_401"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Introduction to DR and BC</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">DR planning</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Implementing effective backup solutions</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">DR architectures and failover strategies</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">BC planning for high availability</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="244" id="page244"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Testing and validating DR plans</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Practical DR and continuity scenarios</span></span></p>
<h2 class="head1" id="sc2_402"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">This chapter will prepare readers with the knowledge they need to effectively design disruption-resilient systems able to survive and thrive after events. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">They will be capable of developing DR and BC plans tailored to the objectives of a business, identifying risks to make risk-based decisions, and selecting priority recovery for critical systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">Readers will learn to implement effective disaster recoveries and failovers along with infrastructure as code, policy as code, with the use of automation by IaC and PaC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Additionally, this chapter will allow readers to learn critical DR and BC concepts, such as RTO and RPO, and apply these metrics for proper recovery strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">It shall also give readers practical insights into Active-Active and Active-Passive architecture, real-time replication, and high-availability designs so that they may well design architectures that keep operations up even during disaster scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">It also includes advanced testing methods such as chaos engineering for validation and strengthening of the reader's DR plans.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Finally, the chapter will equip the reader with the confidence to answer questions on disaster recovery and business continuity and to demonstrate capability in designing systems that are resilient, continuous, and compliant in dynamic, real-world environments.</span></span></p>
<h2 class="head1" id="sc2_403"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Introduction to DR and BC</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">In today's digital world, businesses rely heavily on IT systems and digital assets, so resilience planning forms a very important part of any organization's operational strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">For solutions architects, understanding DR and BC is, therefore, very important to design robust architectures that assure system availability and data integrity during an unexpected disruption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">This knowledge becomes highly valuable in scenarios in which an event such as system failure, data loss, or cyber-attack could pose serious business impacts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">As part of the interview preparation, solutions architects should clearly explain the difference, the relevance, and how DR and BC strategies are implemented within enterprise environments, as well as a clear comprehension of industrial standards and best practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig12-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 12.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> illustrates the key elements of business resilience, highlighting critical components such as RTO,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">RPO,</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">BC, DR, and continuity plans. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">These elements collectively form the foundation for building highly available, fault-tolerant, and recoverable architectures, enabling businesses to navigate unforeseen disruptions with minimal impact.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">The key elements of business resilience are shown in the following figure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"><img src="images/Figure_12.1.png" alt="A semi-circular diagram with five labeled segments: Disaster Recovery, Recovery Time Objective, Recovery Point Objective, Continuity Plans, and Business Continuity, each with brief descriptions of their role in IT disruption management."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig12-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Figure 12.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">: Key elements of business resilience</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_404"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="245" id="page245"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Importance of BC/DR in solutions architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">The role of solutions architects is to design systems that not only meet functional requirements but are also resilient and capable of recovering from interruptions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">BC is the ability that continues critical operations with minimal losses during a disruption, protecting the core services of an organization and allowing for an appropriate recovery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">DR deals with the restoration of information technology infrastructure, applications, and data to a recovered state after an incident; risk management for solutions architects also involves designing for BC/DR.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">In interviews, solutions architects should be able to explain why BC and DR are integral components of their design methodology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">They should be well-equipped to speak about industries where business resilience is highly critical, such as financial services, healthcare, and the e-commerce sectors, because prolonged downtime or data loss will have financial, reputational, and regulatory consequences of significant magnitude.</span></span></p>
<h3 class="head2" id="sc3_405"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Difference between DR and BC</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">While often discussed together, DR and BC serve distinct functions in an organization's resilience strategy:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Business continuity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"> is the overarching strategy whereby core functions and services for a company continue to work during these unpredictable events, such as a power outage, failure in networks, or natural calamity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">BC focuses on continuation and sustaining operations and services in terms of clients, enabling an organization to work or continue at a diminished rate of capacity until recovery in full is attained.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Disaster recovery </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">refers to the restoration of IT infrastructure, applications, and data after disruption; BC is a subset of it, relating to technical recovery efforts in terms of restoring data from backups, failover mechanisms, and re-established network connectivity. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Here, while BC is concerned with keeping operations running, DR concerns the restoration of the technological assets supporting those operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">It is important in a solutions architect interview to clearly differentiate BC and DR. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">The candidate should indicate that both are meant to provide business resilience, but while BC is more of an overall organizational strategy to ensure continuity, DR is a tactical approach aimed at restoring IT.</span></span></p>
<h2 class="head1" id="sc2_406"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Key concepts</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">A strong understanding of RTO, RPO, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">disaster recovery plan</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">DRP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">), and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">business continuity plan</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">BCP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">) is vital to solutions architects designing resilient architectures:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Recovery time objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">: RTO is the maximum acceptable period for a system, application, or function to be unavailable in case of disaster or interruption, after which business processes would be affected. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">An RTO guides how long it will take to return systems to their normal running state to prevent severe financial and operational impact. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.3">In the interview, solutions architects should be able to elucidate how RTO goes into the design of restore and recovery processes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Recovery point objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">: RPO describes the maximum acceptable amount of data loss in terms of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">For instance, an RPO of one hour would mean that in case of failure, the system should not lose more than an hour's worth of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">Solutions architects should be able to discuss how they set RPO based on the criticality of data and incorporate it into backup frequency and replication strategies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">Disaster recovery plan</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">: A DRP is an elaborated, documented methodology of what should be done to restore IT infrastructure and services after a disruption has occurred. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">DRPs contain data recovery procedures, the re-configuration of infrastructures, and roles and responsibilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.3">Solutions architects interviewed for such positions should illustrate an awareness of how DRPs are developed, in both the strategic, high level and technical aspects.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="246" id="page246"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Business continuity plan</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">: This is a plan that includes a broader scope of continuous critical business functions and services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">Here, an organization will discuss how to keep operations alive and running during and post-disruption for clients. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.3">A well-thought-out BCP would include a list of emergency contacts, contingency plans, and more resources that could be applied to maintaining continuity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.4">The solutions architect should explain how BCPS ties in with their design to maintain continuity even beyond the prolonged outages.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">The ability to express these concepts in an interview is essential for solutions architects; it will indicate that the architect knows how to design solutions, which are minimizing downtime while preserving data integrity and offering operational resilience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">Being good at BC and DR ideas will inform the employer of the architect's ability to develop solutions to mitigate the risk and safeguard business processes and prepare organizations to meet potential crises effectively.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Having laid the groundwork on what DR and BC are, we can discuss in depth how planning should work to prepare systems for interruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">The next section addresses more critical steps that solutions architects need to take regarding priority in recovery efforts, evaluation of risk, and strategic automation to enhance disaster recovery.</span></span></p>
<h2 class="head1" id="sc2_407"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">DR planning</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">DR planning is part of solutions architecture, mainly when one thinks about the resiliency of the IT infrastructure of an organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">Solutions architects design systems that can recover quickly in case of disruptions, hence minimizing downtime and preserving data integrity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">This section explores the key elements of DR planning, including assessing risks, identifying critical systems, implementing IaC for recovery automation, and structuring a DRP with essential components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Every element has its importance to make the architecture resilient for continuous delivery with rapid recovery from interruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">These elements work together to build resilient architectures that support rapid restoration, data integrity, and high availability in the face of unexpected disruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">The following figure outlines the key elements of DRP, emphasizing essential steps such as risk assessment, identifying critical systems, IaC, and core components of the DRP:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"><img src="images/Figure_12.2.png" alt="A diagram of Disaster Recovery Planning with four colored sections: Risk Assessment, Key Components of DRP, Identifying Critical Systems, and Infrastructure as Code, each listing relevant items and examples."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig12-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Figure 12.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">: Key elements of disaster recovery planning</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_408"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Understanding risk assessment in DR</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Risk assessment is the foundation of any DR plan. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">For solutions architects, conducting a comprehensive risk assessment means that they have the identification of potential vulnerabilities to the system and applications through which such disruptions may manifest themselves, such as hardware failures, network outages, cyber-attacks, or natural disasters, for each one, to understand the possibility and impact they might cause on the activities of the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.3">High-impact, high-probability risks should be focused within the DR strategy to ensure that their recovery efforts are directed towards areas of highest criticality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.4">Questions during interviews could focus on risk assessment techniques, to demonstrate how a solutions architect is going to prioritize the risk identified based on the needs of the organization and dependencies for the system.</span></span></p>
<h3 class="head2" id="sc3_409"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="247" id="page247"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Identifying critical systems and prioritizing recovery</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">In any disaster, not all systems and services have equal priority. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">Part of the role for the solutions architect is determining what level of service impacts business in the event of an interruption, which in turn informs critical recovery tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.3">These system tiers are generally identified. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.4">For instance, critical systems must be restored at Tier 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.5">Thus, these are critical for ensuring that an organization minimizes disruption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.6">Systems can be prioritized in the following manner:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Tier 1</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">: Core systems that must function to operate a business, including customer-facing applications, payment processing, and order management.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Tier 2</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">: Support systems, though important, that would not cause immediate critical operations disruption, such as data analytics and reporting.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Tier 3</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">: Non-critical systems, which could be brought back online later, including development and testing environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">With such categorization, solutions architects can outline a road recovery map that optimizes the assignment of resources when a disaster is declared. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">Indeed, the priority skills often put candidates on the spot as they must determine the way limited resources will be assigned to meet a particular disaster recovery objective in interviews.</span></span></p>
<h3 class="head2" id="sc3_410"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Infrastructure as code for disaster recovery</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">IaC, is a practice using which solutions architects can create the infrastructure, instead of the tedious process of manually doing so, using code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">IaC helps significantly in disaster recovery since architects can standardize their recovery environments and deploy infrastructure very quickly if something happens to disrupt their normal systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">Let us take a closer look:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Automating DR environments</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">IaC enables automated setup of disaster recovery environments, reducing the time needed to provision and configure resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">With IaC tools like Terraform, AWS CloudFormation, and Azure ARM Templates, solutions architects can predefine infrastructure configurations for recovery environments, making them readily available and consistent across different locations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Standardization of recovery configurations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">: IaC enables Solutions architects to standardize recovery configurations across all environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">Through standardization, they ensure that the DR environments replicate the production setups, which reduces the likelihood of configuration drifts that may result in failures during recovery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.3">Solutions architects should be able to discuss IaC tools and the benefits they bring in DR during interviews, as this approach accelerates and standardizes speed in disaster recovery scenarios.</span></span></p>
<h3 class="head2" id="sc3_411"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Key components of a disaster recovery plan</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">A DRP is a documented approach indicating how IT services and infrastructures will be restored after disruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">The structured DRP will comprise the following major elements:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Backup strategies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">: Effective backup strategies are crucial for data recovery in disaster scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">Solutions architects should implement a layered backup approach, using full, incremental, and differential backups to balance recovery speed and storage efficiency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.3">The backup frequency should align with the RPO, ensuring minimal data loss based on the business's tolerance levels.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Failover mechanisms</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">: Failover mechanisms automatically or manually transfer to a standby system in case the primary system crashes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">Solutions architects make the most of techniques such as Active-Active and Active-Passive configurations to achieve failover. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.3">In the Active-Active configuration, both systems run in parallel, each handling its workload, so that the high availability provides instant </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="248" id="page248"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">failover. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">In contrast to this, in the case of an Active-Passive configuration, a secondary system is kept in standby till the primary system fails, then it is activated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.3">How to use each kind of Failover architecture is imperative knowledge for solutions architects in preparing effective DR solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">Data integrity checks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">: Disaster recovery relies on the integrity of data, since damaged data can destroy recovery processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">Solutions architects should include periodic integrity checks of data integrity that include checksum verifications and data comparison routines in the process of recovery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.3">Such integrity checks ensure that any corrupted data is not restored, which would again destabilize business operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.4">Solutions architects should be aware of such checks and prepared to describe their importance in ensuring the reliability of data during an interview.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Through comprehensive DR planning, solutions architects can make their systems resilient, recoverable, and aligned with business continuity objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">The practices covered in this section equip architects with the tactics for assessing risks, making priorities in recovery, IaC automation in the DR environment, and design of DR plans in protecting data integrity and its availability during adverse events.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">One of the most important components in any disaster recovery plan is good, reliable backup solutions that match the priorities of recovery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.2">Having done risk assessment and system prioritization, let us proceed to discuss the types of backup strategies in the following section, which solutions architects can implement to ensure consistency in data availability and recovery.</span></span></p>
<h2 class="head1" id="sc2_412"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Implementing effective backup solutions</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Disaster recovery is all about having a backup solution to restore data and continue operations after disruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.2">Solutions architects need to understand various backup strategies and design systems that balance data recovery speed, cost, and reliability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.3">This section explores the essentials of backup strategies, immutable backups, comparisons between cloud and on-premises solutions, best practices for redundancy and data integrity, the role of PaC, and considerations for hybrid and multi-cloud environments. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">The following figure provides the complete overview of effective backup solutions which includes types of backups, immutable backups, cloud and hybrid environments solutions, PaC:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1"><img src="images/Figure_12.3.png" alt="A mind map of backup solutions with six branches: best practices, policy as code, backup strategy types, disaster recovery in hybrid/multi-cloud, cloud vs. on-premise, and immutable backups, each with related points."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig12-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Figure 12.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">: Overview of backup solutions implementation</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_413"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Types of backup strategies</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Selecting the right backup strategy is critical for ensuring data availability and quick recovery in the event of a failure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.2">Solutions architects must design optimized backup solutions that balance storage efficiency, recovery speed, and data integrity based on an organization's </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">recovery time objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">RTO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">recovery point </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="249" id="page249"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">RPO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.2">The following backup strategies offer different trade-offs between storage requirements and restoration speed:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">Full backup</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Incremental backup</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Differential backup</span></span></p>
<h4 class="head3" id="sc4_414"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Full backup</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">All data in a system is copied to a different storage location, thus a complete snapshot of the system is obtained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">Full backups are thorough but time consuming and require more storage; hence, they are best utilized during periodic use rather than for daily updates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.3">Incremental or differential backup solutions architectures should utilize full backups along with them for optimal performance.</span></span></p>
<h4 class="head3" id="sc4_415"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Incremental backup</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Incremental backup copies only the changed data since the last performed backup, thus reducing storage space and time spent making a backup. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.2">Still, restoring from incremental backup requires applying several backups sequentially; this slows down the process of recovery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.3">Differential backups are ideal for everyday backup in systems where there is a need for minimal interruption.</span></span></p>
<h4 class="head3" id="sc4_416"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Differential backup</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Differential backups copy all changes made since the last full backup, and thus the restoration process is quicker than that of incremental ones because only two files (the last full and differential backup) are required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">Solutions architects must consider whether the extra storage requirements for differential backups offset the potential for faster restoration to help an organization meet its recovery time objectives.</span></span></p>
<h3 class="head2" id="sc3_417"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Immutable backups</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Immutable backups are immutable by design once they have been created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.2">It means critical protection from ransomware attacks and unauthorized access to data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.3">With the added security of making sure the backup files cannot be altered, deleted, or encrypted by malicious users, this is a powerful addition to DR strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.4">Implementing immutable backups is especially important in high-risk environments, and it can be set up using certain storage solutions for cloud and on-premise environments.</span></span></p>
<h3 class="head2" id="sc3_418"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Cloud versus on-premise backup solutions</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">When it comes to choosing between cloud and on-premise backups, solutions architects must consider such factors as scalability, accessibility, compliance, and cost.</span></span></p>
<h4 class="head3" id="sc4_419"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Cloud backup</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">Cloud storage has high scalability, global accessibility, and lower upfront costs because the hardware is eliminated from the on-premise hardware. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.2">Cloud backups may be a source of concern when it comes to data sovereignty, latency, and long-term costs in case large volumes of data are involved.</span></span></p>
<h4 class="head3" id="sc4_420"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">On-premise backup</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">On-premise backups provide better control, low latency, and meet strict compliance standards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.2">They may, however, have higher capital expenditure and can be less scalable compared to cloud solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">A hybrid approach that combines both options allows organizations to maintain on-premise control for critical data while using cloud storage for scalability and cost-efficiency.</span></span></p>
<h3 class="head2" id="sc3_421"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="250" id="page250"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Best practices for redundancy and data integrity</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">The importance of a good backup strategy lies in redundancy and integrity of the data, which can serve as a dependable access in times of disaster.</span></span></p>
<h4 class="head3" id="sc4_422"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Redundancy</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">By making redundant backup copies stored at geographically dispersed sites, it could minimize localized disaster-induced loss of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">Solution architects shall take care to maintain a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">3-2-1 rule</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1"> that maintains three copies of data on two types of storage with one copy maintained offsite.</span></span></p>
<h4 class="head3" id="sc4_423"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Data integrity</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Regular integrity checks assure the backup files are both accurate and complete, preventing data corruption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.2">Automated integrity validation tools would make the process easier in terms of verifying data reliability, without necessarily requiring manual intervention.</span></span></p>
<h3 class="head2" id="sc3_424"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">Policy as code for disaster recovery automation</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">PaC allows the definition of DR policies, including all backup and security standards as code to enable automated governance in CI/CD pipelines.</span></span></p>
<h4 class="head3" id="sc4_425"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">PaC overview</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">With PaC, DR policies, such as backup encryption, replication requirements, and retention periods, are set in machine-readable code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">This will ensure uniformity across environments and cut down on human error.</span></span></p>
<h4 class="head3" id="sc4_426"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">PaC for disaster recovery</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">PaC ensures that the DR policies are applied automatically on all backup processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">Popular tools that enforce backup policies on CI/CD pipelines include </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Open Policy Agent</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">OPA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">) and HashiCorp Sentinel, which ensure that each backup adheres to the standards set by the organization.</span></span></p>
<h3 class="head2" id="sc3_427"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Disaster recovery in hybrid and multi-cloud environments</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Disaster recovery strategies must account for the diversified infrastructure and storage needs of hybrid and multi-cloud environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">Interoperability, data transfer speeds, and vendor-specific DR tools will need to be considered in designing cross-platform backup and recovery processes by solutions architects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.3">It will help streamline cross-platform recovery if the DR strategy is aligned with each environment's capabilities, perhaps leveraging cloud-native tools on AWS and Azure, among others.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">By mastering these backup strategies and practices, solutions architects can effectively design DR frameworks that ensure quick data recovery, maintain integrity, and meet compliance requirements across various environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">While backup solutions provide data recovery capabilities, it is also essential to design system architectures that can handle failover smoothly and ensure high availability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.2">In the next section, we will look at disaster recovery architectures and failover strategies that support continuity during failures.</span></span></p>
<h2 class="head1" id="sc2_428"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">DR architectures and failover strategies</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Designing DR architectures and failover strategies is the most important task for solutions architects to ensure that critical systems remain operational during disruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.2">Solutions architects should consider architectures and strategies that balance performance, resilience, and speed of recovery.</span></span></p>
<h3 class="head2" id="sc3_429"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="251" id="page251"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Active-Active and Active-Passive architectures</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Designing a high-availability architecture requires choosing between Active-Active and Active-Passive configurations, each with its own trade-offs in downtime, cost, and complexity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.2">Solutions architects must align these strategies with business continuity requirements to ensure system resilience, fast failover, and optimal resource utilization.</span></span></p>
<h4 class="head3" id="sc4_430"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Active-Active architecture</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">An Active-Active setup ensures continuous availability by distributing real-time traffic across multiple active nodes or data centers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.2">This approach minimizes downtime and enhances scalability, making it ideal for mission-critical applications that require uninterrupted service.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">This setup is ideal for systems requiring high availability and seamless failovers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.2">By spreading workloads across multiple systems, Active-Active architecture reduces the likelihood of downtime and provides a backup that’s always ready to take over.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Let us consider an example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.2">Two data centers, each capable of processing user requests, are used for a large-scale e-commerce platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.3">In the event of a data center failure, the remaining data center continues serving requests without interruption.</span></span></p>
<h4 class="head3" id="sc4_431"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Active-Passive architecture</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">An Active-Passive setup relies on a standby system that remains idle until the primary system fails. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">While this approach reduces costs compared to Active-Active, it introduces slight downtime during failover. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.3">It is well-suited for cost-sensitive environments where </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">immediate failover is not mandatory but still ensures high availability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">Let us consider an example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">A high-availability payroll system might use Active-Passive configuration where the active system processes payments, and the passive waits in a standby mode. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.3">Once the active system fails, the passive system becomes active.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">Selecting the right high-availability strategy depends on factors such as downtime tolerance, cost, and complexity. </span></span><span class="Italic"><a href="#tab12-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Table 12.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1"> compares Active-Active and Active-Passive</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">architectures to help solutions architects determine the most suitable option based on business needs:</span></span></p>

<p class="caption-t"><span class="tablenum"><a id="tab12-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">Table 12.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">: Comparison of high-availability and disaster recovery architectures</span></p>
<h3 class="head2" id="sc3_432"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Real-time data replication</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">Data replication mechanisms are very important in DR architectures to ensure that the systems can recover with zero data loss and zero-time loss.</span></span></p>
<h4 class="head3" id="sc4_433"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Synchronous replication</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">It ensures that data is written to both primary and secondary systems simultaneously. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.2">It guarantees data consistency but may increase latency.</span></span></p>
<h4 class="head3" id="sc4_434"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="252" id="page252"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Asynchronous replication</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Replication occurs at intervals, thus providing lower latency but risking data loss between replication events.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">Architects should consider factors such as network bandwidth, data criticality, and recovery objectives when choosing a replication strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">Synchronous replication is often preferred for applications that have low tolerance for data loss, whereas asynchronous replication is effective for systems that have performance as a priority.</span></span></p>
<h3 class="head2" id="sc3_435"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">DR and failover strategies for critical systems</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">The following figure gives an overview of the various DR strategies for critical systems:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1"><img src="images/Figure_12.4.png" alt="Infographic showing six disaster recovery strategies: Multi-Regional, Cold Standby, Warm Standby, Hot Standby, Automated Failover, and Manual Failover, each with icons and brief descriptions around a central shield."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig12-4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Figure 12.4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">: Strategies for disaster recovery</span></p>
</figcaption>
</figure>
<h4 class="head3" id="sc4_436"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">Cold, warm, and hot standby</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">Standby strategies determine the speed and efficiency of recovery, balancing cost, downtime, and operational readiness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.2">Solutions architects can choose from cold, warm, or hot standby, depending on their recovery time objectives and budget constraints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.3">These concepts are explained as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">Cold standby</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">: This takes the longest period to recover. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.2">A secondary system is kept totally off until required, which reduces costs but increases the time for recovery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Warm standby</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">: The backup is partially active as key applications are pre-installed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.2">This reduces the period of recovery from cold standby, but there is some ongoing operational cost.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">Hot standby</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">: Mirrors the primary, constantly synchronizing with real-time information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.2">This method is quicker but more expensive.</span></span></p>
<h4 class="head3" id="sc4_437"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">Automated versus manual failover</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Failover mechanisms define how quickly and efficiently a system can recover from failures, with automation offering rapid response and manual failover providing controlled recovery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.2">Depending on system criticality, businesses can implement automated or manual failover strategies to ensure seamless continuity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.3">Let us take a closer look:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Automated failover</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">: Triggers as soon as a system crashes; ideal for applications requiring seamless access.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="253" id="page253"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">Manual failover</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">: Initiated by operators upon system failure; typically reserved for critical or intricate applications for which automated failover poses too great a risk.</span></span></p>
<h3 class="head2" id="sc3_438"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Ensuring DR across distributed architectures</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Disasters can be particularly challenging in distributed systems due to the interdependence of networked components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.2">The architect should:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Implement multi-regional or multi-availability zone strategies to reduce dependency on a point.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Use load balancers to distribute traffic and provide failover solutions, probably across regions or availability zones.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Provide cross-cloud redundancy for defenses against cloud provider outages.</span></span></p>
<h3 class="head2" id="sc3_439"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Case study: Real-world examples of DR architectures</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Suppose a financial institution globally needs continuous operations and solid DR strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.2">Let us take a look at the scenario, and the approach that can be followed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Scenario</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">: The institution employs an active-active architecture across the </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">New York</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1"> and </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">London</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1"> data centers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.2">The data centers both operate in synchronous replication so that there is data consistency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.3">In the event of failure, the traffic will be redirected immediately to the remaining data center, which means no stoppage in service. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Approach</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">: The architecture entails load balancing, automated failover mechanisms, and multi-cloud redundancy for critical services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">This is how the existence of redundancy, real-time replication, and cross-regional failover impacts business continuity for high stake industries.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">The article sets foundational grounding for a solutions architect's role in determining robust DR strategies to have standby readiness for the worst that might happen and increases their resilience factor.</span></span></p>
