			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Vertical</span></span><span class="CharOverride-2"> </span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">scaling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">: In this type of scaling, the server hardware is upgraded by adding more memory or computing power. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.2">This scaling option suits applications or services that need intense computing power or more memory for performing the required number of transactions per second. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.3">This is an </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="184" id="page184"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">easier option that helps applications scale up and perform well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.2">However, this option does not improve the availability of the application, as this type of scaling is still prone to a single point of failure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.3">This may not be the best option to scale mission critical applications to support larger workloads. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Horizontal scaling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">: In horizontal scaling, more application nodes are added to spread the load across multiple nodes of the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">This type of scaling is ideal for mission critical applications as it provides the required availability, since there is redundancy of nodes even if one of the nodes goes down. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.3">However, solutions architects need to note that the application has to be designed in a stateless manner for an easier adoption of this scaling model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.4">Otherwise, additional logic needs to be written in the code to persist application state outside of the node hosting the application, like a database or a cache. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.5">This type of scalability is provided by modern container management platforms like Kubernetes to avoid failures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.6">The routing logic between the nodes in a cluster needs to be addressed carefully in this option. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.7">This is the option that is mostly adopted for applications using the event driven and microservices architectural patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">Task based scaling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">: This type of scaling is more relevant to applications using message-based communication patterns between components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.2">In applications where there are producers placing messages in a queue and consumers that process them, the consumers can be scaled based on the number of messages arriving at the queue (queue depth). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.3">This type of scaling can be done for independent sets of producers and consumers using a queue between them for processing a specific type of transaction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.4">Task based scaling is applicable for event driven and microservices architectural patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.5">For example, if an order queue is getting filled with many orders during a special sale event, the order processing microservice can be scaled independently based on the rate of message arrival in the order queue. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Scaling of the database layer is also very common in improving the overall performance of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Common types of scaling that are particularly applicable to databases to improve their efficiency are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Partitioning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">: This type of scaling is splitting the table into smaller chunks for easy manageability of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">This type of partitioning is divided into horizontal partitioning and vertical partitioning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.3">Horizontal partitioning, which is also called sharding, is a technique in which the table is divided into multiple partitions, with each partition containing a subset of the entire set of records. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.4">In a vertical partition, the columns of a table are split between different partitions, with each partition storing a set of columns with all the table data in them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.5">In range partitioning, each partition stores the data for a range of values of a specific key (column). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.6">For instance, a sales database table can be partitioned based on the revenue made each month. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.7">Some of the databases support a type called list partition, in which each partition stores data for a list of values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.8">For example, each partition can store data pertaining to eligible voters for a set (list) of states in India.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">Replication</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">: This is a technique in which multiple copies of the database are maintained, typically as a master for the write operations and its replicas for read operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">The database management system upgrades one of the read replicas as a write database, just in case the master or the write database goes down. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.3">This strategy to maintain read replicas helps to split the load between read and write operations within the application, which adds to the efficiency of processing the queries.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">Having seen the types of scaling, we will discuss the application scalability strategies available to the solutions architects in the next section.</span></span></p>
<h2 class="head1" id="sc2_270"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Application scalability strategies for solutions architects</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">Application scalability is an aspect that needs to be paid attention to, right from the conception of the solution by the solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.2">The architected application should ensure that lends itself well to easier scalability without having to make any changes once it has been deployed to production, and at the same time, should take care of resource optimization and minimize cost to the enterprise.</span></span></p>
<h3 class="head2" id="sc3_271"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="185" id="page185"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">Architectural patterns</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">The scalability of applications must be addressed right from the stage of solution blueprinting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.2">Some of the ways to achieve application scalability by a proper choice of architectural patterns and design principles are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">Loose coupling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">: Any architectural pattern that promotes loose coupling of components lends itself well to scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.2">In a loosely coupled architecture, the feature functionality is implemented as separate components, with each component communicating with others either directly or through a service bus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.3">This enables each component to be deployed redundantly based on the load it is supposed to take and the performance considerations for the component. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.4">Event-driven architecture is one example of architectural patterns that promote loose coupling of components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.5">Please refer to </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">, Technical Proficiency Essential Knowledge,</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1"> for an extensive study of the popular architectural and design patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Microservices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Microservices architecture is a popular case in point for a loosely coupled architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.2">This distributed architecture enables each of the microservice components to be deployed and scaled independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.3">The decoupled microservices can communicate with each other asynchronously using a message queue or using protocols like gRPC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Layered architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">A layered architecture enables the splitting up of different layers of the application, like user interface, backend logic, and database. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">This kind of architectural pattern promotes the scalability of the individual layers without affecting one another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.3">For instance, the business logic layer or the backend logic can be independently scaled from the user interface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.4">However, this architecture provides limited flexibility when compared to an architecture like microservices, where each component (feature functionality) can be scaled independently of other microservices.</span></span></p>
<h3 class="head2" id="sc3_272"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">Design principles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">The following are the design principles that can be applied to ensure the scalability of applications being built:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Statelessness of applications</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">: The principle of statelessness advocates that the service or the API being called does not store any state with respect to the caller’s request. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.2">Many times, the service of the API stores the state to be used in a subsequent request by the caller during the session. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.3">Storing the state adds extra complexity to scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.4">When a service receives a spike of requests, being stateless enables the service to scale without having to worry about any stateful data it is holding on behalf of the client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.5">Statelessness is one of the important design characteristics of application components to scale freely and be performant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">Idempotency of services</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">: Idempotency is an application characteristic in which the same type of requests passed to the services are treated the same way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.2">Idempotency can be thought of as a corollary to the design principle of being stateless. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.3">This characteristic ensures that there can be redundant instances of the same service that can take up requests in parallel, execute them without causing any inconsistency or side effects, and leave the system in a state of equilibrium post the transaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Communication patterns</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">: Asynchronous communication patterns promote a loose coupling of components and thereby help them to scale very well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.2">Any component-based design can make use of asynchronous communication patterns to let the components scale independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.3">Asynchronous communication also helps to separate out the producer and receiver, thereby providing flexibility to scale independently the producer and the receiver based on the load. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.4">Asynchronous communication also requires the use of a message service bus that acts as a layer between to hold messages and release them in chunks based on a delay configuration that creates a balance between the sender and receiver of messages.</span></span></p>
<h2 class="head1" id="sc2_273"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="186" id="page186"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Performance and scalability on the cloud</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">Applications deployed on the cloud have multiple avenues to ensure application scalability and the required levels of performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.2">With the ability to expand hardware to choose the required input/output operations per second, the cloud can boost the application’s scalability and performance without any major changes to the application itself. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.3">The following are some of the options available to cloud deployed and cloud-native applications to ensure scalability and achieve the required levels of performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.4">They will be discussed in greater detail in </span></span><span class="Italic"><a href="ch22.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Chapter 22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">, Cloud-native Architecture Design</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">The following are the options available as computing models and services on the cloud to ensure the performance and scalability of applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">Content delivery network (CDN)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">: CDN offers the application content to be deployed across multiple points of presence across the globe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.2">This helps the application to serve customers from geographic locations that are closer to them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.3">CDN also reduces the load on the actual backends and provides features to define different types of keys based on which the content can be cached and served.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">Serverless computing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">: Serverless computing model is one in which the cloud provider takes responsibility for the hardware and software platforms required for application deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">Developers can directly run their code in a serverless mode, thereby moving the scalability concerns to the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.3">Developers can also configure the amount of memory and computing power to ensure the required performance levels in this option.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Edge computing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">: Edge computing is a model offered by cloud providers to move the required infrastructure closer to the location of the application and the sources of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.2">This option helps to minimize the latency for applications that produce huge amounts of data that need to be processed and analyzed in real time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.3">This model boosts the performance of such applications and provides the required scalability at the same time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Auto scaling at work</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">: Autoscaling is one of the inherent and important features offered by the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.2">Autoscaling provides the required elasticity to expand the infrastructure within seconds, providing virtually infinite scalability on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.3">The application owner can also choose from different types of hardware available and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">input/output operations per second</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">IOPS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">) required based on the workload deployed on the cloud, thereby getting the required scalability and performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Having discussed scalability and performance on the cloud, we will now discuss how artificial intelligence and machine learning are enabling applications to scale better and proactively manage performance.</span></span></p>
<h2 class="head1" id="sc2_274"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Artificial intelligence in performance and scalability</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">AI and ML continue to disrupt all the phases of the software development lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.2">All contemporary performance monitoring tools include AI-based features that can be used not only to analyze huge amounts of data coming out of these tools but also to forecast any deviations that might occur anytime soon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.3">Solutions architects and developers also make use of machine learning algorithms to train models on the data to proactively monitor and act based on any contingency expected in the normal functioning of the applications in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.4">The following are some of the ways in which AI and ML are being used to ensure application scalability and performance of applications rolled out to users:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">Anomaly detection</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">: AI models are trained on past data generated during application usage and can detect any deviations from normal patterns in the incoming traffic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.2">AI models analyze data points coming out of the application performance monitoring tools and the log content generated by applications to quickly identify bottlenecks and trigger corrective actions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.3">They also sieve huge amounts of data to cluster exceptions and single out the ones that cause performance deterioration and can result in failures if left unattended.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Proactive monitoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">: Models trained on past data can forecast events that can result in the deterioration of performance within applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.2">Models based on algorithms like auto regression and moving </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="187" id="page187"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">averages can forecast spikes in response times or spikes in major garbage collection that are potential situations for the application performance to deteriorate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.2">Based on the forecast, the model can trigger the development teams to identify the possible causes that could result in the forecasted event and take corrective action to prevent performance degradation and even application downtime.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">Predictive autoscaling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">: AI and ML algorithms can continuously monitor the performance of the infrastructure, software platforms, and applications, and auto-scale the infrastructure based on the load to the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.2">This applies to both scaling out and scaling in, which results in an optimized use of the infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.3">AI can understand patterns of usage of the application over a period and suggest plans to allocate desired capacity that can help the enterprise to optimize the overall cost of ownership as well</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">Dynamic configuration management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">: AI</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">can be used to trigger actions that adjust the configuration parameters of platforms to ensure the scalability and performance of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.2">AI can adjust application configuration to switch on the caching layer just in case there is a heavy load on the backend operational systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.3">AI can adjust the number of threads used by the application based on the incoming traffic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.4">AI can also suggest database configurations like connection pooling and indexing based on the number of active connections and query complexity, respectively.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">Having covered the essentials of application performance and scalability so far, the solutions architect needs to know the types of performance testing being done and strategies available for making the application scalable and improving performance, reliability, and availability. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">The solutions architect</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1"> should also be conversant about  the size and the capacity required for applications.</span></span></p>
<h2 class="head1" id="sc2_275"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">In this chapter, we looked at different aspects of application performance and scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.2">These are two important areas that architects and developers should pay attention to, right from the software blueprinting stage to development and even after the application is moved to production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.3">The knowledge of these areas helps the solutions architect to ensure that scalability and performance are built into the architecture and design, and a proper strategy is devised for testing the performance of applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">In the next chapter, we will discuss data management and analytics, which are crucial areas for modern enterprises and form the backbone for making informed business decisions.</span></span></p>
<h2 class="head1" id="sc2_276"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">Takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">Performance and scalability overview</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">: Understand</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">what performance and scalability quality of services are and why they are important for an application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Performance strategies for a solutions architect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">: Understand the different strategies, like caching, load balancing, data partitioning, concurrency, and technology choices, for enhancing the performance of an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.2">Also, leverage architectural patterns and design principles to make an application performant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">Deep dive into application performance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">: Learn the different important types of performance testing like load testing, break point testing, profiling, and soak testing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.2">Also, learn the steps a performance engineer executes to certify an application or a service to be performant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.3">Learn the important metrics used to measure and fine tune performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Application scalability strategies for a solutions architect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">: Learn how architectural patterns like event-driven microservices and design principles like statelessness and idempotency that a solutions architect can use to enhance the scalability of applications. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Performance and scalability on the cloud</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">: Understand how the cloud supports higher performance with its services, like content delivery network and edge computing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.2">Also, learn how the cloud naturally is a platform for scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="188" id="page188"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">Performance and scalability with AI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">: Understand how AI and ML is disrupting the performance and scalability quality of services of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.2">Learn about using ML models to proactively monitor the performance of applications and use them to scale the application when required. </span></span></p>
<h2 class="head1" id="sc2_277"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">What are the different types of testing done to improve the performance of applications?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">Break point testing is done to baseline performance metrics like transactions per second and response time in a standard hardware configuration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">Load testing is done to assess the performance of applications and components in a lab environment that simulates a production setup.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">Profiling of the application is done to understand the memory and computing power usage by an application and identify performance bottlenecks, open resource handles in the code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">Soak testing is done for many hours or even days with a specific load to ensure that the application is stable and performs within the accepted levels.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">What is break point testing, and how is it done?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">Break point testing is done to assess the performance of a single component on a standardized hardware configuration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">This is to assess the number of transactions that can be executed in unit time and the associated performance parameters such as response time, memory, and CPU usage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">Once the break point test is completed, the results can be extrapolated and used to plan the capacity of the required servers to support the required TPS in production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">How will you come up with the optimum size of containers required for a microservice in production? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.2">Can you explain with an example?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">You will perform a break point test on standard hardware running a single instance of microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">You will slowly increase the load every fifteen minutes, and the test will run for about three hours.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">You will measure the number of transactions that can be supported in this standard hardware configuration within the response time that you need. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">You will recommend a capacity based on the TPS needed in production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">For example, if the TPS required in production is 100 and 2 seconds the response time, and the breakpoint test suggest a maximum TPS of 20 with a response time of 2 seconds in this standard hardware, you will suggest provisioning five instances of the microservice with each running on separate nodes with the specified hardware configuration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">What are the different application performance strategies available from a solutions architecture standpoint?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">You can include a caching layer for the frequently referenced data in the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="189" id="page189"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">You can also configure multiple instances with a load balancer to split the load across instances.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">You will also ensure concurrency within the application, if tasks can be performed in parallel.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">For the database, you will implement data partitioning to split the load across multiple partitions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">As a solutions architect, how will you ensure that the application you design is scalable?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">You will make sure that the application component is designed to be stateless so that it can be scaled quickly without any concerns about transferring state.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">You will ensure that the application components are designed to be idempotent.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">You will ensure that the components communicate with each other in an asynchronous manner to ensure that the individual components can easily be scaled.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">What role do AI and ML play in ensuring application performance?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">AI models are trained on past data generated in the course of application usage and can detect any deviations from normal patterns in the incoming traffic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">Models trained on past data can forecast events that can result in the deterioration of performance within applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">AI and ML algorithms can continuously monitor the performance of the infrastructure, software platforms, and applications, and auto-scale the infrastructure based on the load on the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">AI</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">can be used to trigger actions that adjust the configuration parameters of platforms to ensure the scalability and performance of applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">What are the different performance metrics that you measure in your project?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">You measure response time, which is the time taken by an application or a component to process one transaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">You measure throughput, which represents the number of transactions or tasks performed in unit time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">You measure the amount of CPU and memory used by the application while processing transactions in unit time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">You also measure the number of major GCs happening during a load test and fine tune the code and infrastructure to keep it to a minimum.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">How can a solutions architect ensure performance and scalability of an application while blueprinting a solution?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">The architect can recommend an </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1"> in which each component can be scaled independently of each other.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Distributed architectures like microservices lend themselves to superior performance and scalability by their nature of being independently deployable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">A layered architecture can also help to scale the layers of the application independently of each other.</span></span></p>
