<header>
<h1 class="chaplabel" id="ch09"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="175" id="page175"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 9</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Performance and Scalability</span></span></h1>
</header>
<h2 class="head1" id="sc2_245"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Enterprises develop applications with their users in mind. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">One of the qualities that users look for in an application is its usability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Usability is not just about sophisticated features rolled out or the navigational ease built into the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Application performance is one of the key attributes that contribute to the usability of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">A lot of enterprises spend millions of dollars every year to ensure that their applications are performant, and performance issues do not become a reason for their loss of business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.6">With the attention span of users decreasing by the day, application performance must match the expectations of the user. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.7">Observability of systems in production has become one of the key activities to which enterprises give a lot of importance, and equip their development and performance test teams with state-of-the-art performance testing and monitoring tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.8">With so much significance being given to application performance, scalability is one lever that is normally used to ensure the performance of applications and give users a compelling user experience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.9">Application performance and scalability are often discussed hand in hand when it comes to meeting the agreed performance metrics with different stakeholders of the system.</span></span></p>
<h2 class="head1" id="sc2_246"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Performance and scalability overview</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Performance strategies for solutions architects</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Application performance</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Scalability</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Application scalability strategies for solutions architects</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Performance and scalability on the cloud</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Artificial intelligence for performance and scalability</span></span></p>
<h2 class="head1" id="sc2_247"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="176" id="page176"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">In this chapter, readers will understand the basic concepts related to the performance and scalability of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">The solutions architect will learn the strategies to apply to ensure the performance of applications, right from the blueprinting stage of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">The reader will learn about the types of performance testing carried out in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">We will also discuss in detail the list of steps carried out in loading testing applications to ensure that the defined service level objectives of the applications are met. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">We will discuss application performance monitoring and key performance indicators used to measure application performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.6">The solutions architect will also learn about the different strategies </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">available, to ensure </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">application scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">We will later discuss the support that major cloud providers offer, like content delivery networks and edge computing, to ensure application performance and scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.3">We will finally discuss how </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Artificial intelligence</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">AI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">machine learning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">ML</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">) have redefined the performance engineering space and help architects and developers to optimize resources and reduce costs for the enterprise.</span></span></p>
<h2 class="head1" id="sc2_248"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Performance and scalability overview</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Performance and scalability are the drivers that have become the mainstay of any modern-day software application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">These two qualities of service are discussed and debated in detail from the architectural blue printing stage of applications, and long after the applications are deployed into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">Architectural patterns that lend themselves to scalability and are inherently performant are chosen over others, keeping in mind the short and long-term benefits they shower on enterprises to realize their business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.4">Performance and scalability determine all the aspects of software development, from architecture, design, infrastructure provisioning, team composition, and, more importantly, the cost budget of the project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.5">It is imperative to assess the required performance and scalability aspects of the application to ensure that they are properly accounted for in terms of capacity, and there are mechanisms in place to continuously monitor and optimize them as the application is developed and deployed in production.</span></span></p>
<h3 class="head2" id="sc3_249"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Performance</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Performance is the ability of the application to process transactions within an accepted timeframe, which is measured as the response time for the transaction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">Applications must respond to users as they interact with applications in the most efficient manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">The workload of an application could vary depending on the functionality being addressed within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">For example, there could be a payment processing transaction that needs to respond to the user with a success or failure acknowledgement within two seconds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">There could be a batch job that sends eligible offers to customers through emails, which needs to be completed within a given time window of three hours. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.6">Though performance at the outset is viewed as the time at which the users are responded to, it needs to be ensured that the application does this in the most reliable manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.7">It should not overwhelm the resources of the application infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.8">Performance is therefore measured as a totality of how the application works in conjunction with the software platform on which it runs and the underlying hardware.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Development teams use specialized skills and monitoring tools to specifically measure the performance of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">They measure performance in terms of transactions per second and response time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">Additionally, they look at how the other parameters behave, such as the CPU and memory usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.4">Exceptions generated during the processing of those transactions by the application are also checked.</span></span></p>
<h3 class="head2" id="sc3_250"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Scalability</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Scalability is the ability of the system to seamlessly expand or shrink based on the workload imposed on the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">The load on the application deployed to production does not stay constant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">The application is built, configured, and deployed for a known workload based on the total and the concurrent number of users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">There will be spikes in the application depending on situational factors quite often. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.5">For instance, a hospital portal </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="177" id="page177"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">might experience additional load during a period of pandemic spread. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">The application should be architected and designed to support the required expansions based on these kinds of factors.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Scalability is a very important factor for a business to grow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">If the application can be scaled without having to be redesigned for any functionality, it can easily be deployed to any data center or the cloud that is closer to the region in which the business wants to expand its operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">Scalability should also be achieved in a way that does not increase the total cost of ownership of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">Loosely coupled architectures enable scaling of independent components without the enterprise having to scale the entire application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.5">This helps to address additional load only on a particular component (feature) within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.6">Like performance, scalability is another quality of service that needs to be thought about right from the blueprinting of the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.7">It should also be looked at during the design and development of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.8">Solutions architects should always be conversant with the architectural and design principles that promote scalability and apply them consciously while crafting solutions for complex applications.</span></span></p>
<h2 class="head1" id="sc2_251"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Performance strategies for a solutions architect</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Application performance is an aspect that needs to be addressed right from the blueprinting stage of a software project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">The solutions architect needs to explicitly capture the nonfunctional requirements with regard to the application performance of different transactions within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">These requirements can be captured as user stories in an Agile setting and can be tracked and built during the software development lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">Performance is not just for the online transactions that users might perform, but also for other offline jobs like batch jobs and those including loading of data into data warehouses or data lakes, for instance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Let us discuss the strategies available to solutions architects to ensure that application performance as part of the solution blueprinting and design exercise.</span></span></p>
<h3 class="head2" id="sc3_252"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Architecture and design</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Choosing the right architecture is one of the easiest and best starting points to address the performance of the application landscape. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">There are architecture patterns that naturally lend themselves to building performant applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">Solutions architects should carefully study the performance requirements of the application and choose architectures and apply design patterns that enhance the performance of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.4">Any architecture that promotes loose coupling is one of the ideal candidates to ensure and control the performance of the required scale.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Communication patterns and protocols used between components also play a key role in ensuring the performance of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">For instance, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Google RPC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">gRPC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">) could be used to ensure inter services communication between microservices, which offers exchange of payloads using a binary format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">Architectural patterns like </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> warrant asynchronous communication and enable components to be decoupled. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">In such architectures, messages exchanged through a service bus offer better performance by processing payloads by interested components in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">Design patterns like a circuit breaker prevent requests from being sent to unavailable services and avoid waiting time till the request to the failed component times out. </span></span></p>
<h3 class="head2" id="sc3_253"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Caching</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Cache is a high-speed data storage device. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">Caching of data that is being referred to by the application is one of the most effective ways to improve performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">Caching also reduces the load on the actual back-end systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.4">Master data used for reference by the applications to enable feature functionality is one of the primary candidates for caching. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.5">Apart from master data caching, many applications also consider caching transactional data that is very frequently accessed to provide the required performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.6">However, a caching strategy needs to carefully assess the type of data being cached. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.7">Data that gets frequently updated may not be the right candidate for caching, as it will end in stale data being served to the application users.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="178" id="page178"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Choosing the keys to cache data is also one of the important criteria that designers need to be aware of. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">Dynamic keys may not be the right ones to store and retrieve data in a cache. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.3">Apart from the keys, the retention of data in the cache also needs to be carefully thought about. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.4">A frequent data refresh in the cache might degrade the performance of the solution, and a prolonged refresh might end up in the cache being left with stale data.</span></span></p>
<h3 class="head2" id="sc3_254"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Load balancing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Load balancing is a technique of distributing the load among the available application resources to strike a balance in load among those resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">A resource could be an application server, a storage device, or a database used by an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.3">An application deployed across two data centers in an active-active mode or across two availability zones in a cloud region takes an equal amount of load(number of requests), thereby not overwhelming any instance of the resource. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.4">By splitting the load among resources, the hardware and the software platform function optimally without any spike in computational power or memory usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.5">This results in an improved response time for the users of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.6">Load balancing can be dynamic or static. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.7">Static load balancing routes requests to server resources based on fixed rules and does not consider the current state of the server that hosts the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.8">Round robin and resource based allocation methods are examples of static load balancing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.9">A dynamic load balancer takes into account the current state of the server in terms of the load handled by it and accordingly routes the request to the server with the least load. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.10">Least connection and least response time are some of the algorithms used for dynamic load balancing.</span></span></p>
<h3 class="head2" id="sc3_255"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Data partitioning</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Data partitioning is a strategy adopted to improve the performance of database systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">Like the way in which the application user load is spread across multiple data centres or availability zones, data stored can be partitioned across multiple servers to improve the read and write of a data store. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">Data partition improves performance by reducing contention among the partitions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">This reduces the load on the infrastructure in terms of memory and computing power while the data is being scanned during query execution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">Performance is also improved by segregating frequently accessed data from infrequently accessed data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">When the data is split into multiple partitions, any query operation requiring access to the entire dataset may do so in parallel, and the result is collated into a single dataset using the results of those parallel executions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.7">Data partition could be horizontal, vertical, or a functional partition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.8">In a horizontal partition, the whole data set is divided into multiple partitions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.9">In vertical partitioning, each partition has the total dataset, but for a set of attributes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.10">Functional partitions contain data pertaining to a certain group of functions in an application.</span></span></p>
<h3 class="head2" id="sc3_256"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Concurrency within applications</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Concurrency within applications plays a key role in improving the performance of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">While designing applications, tasks that can run concurrently need to be identified and should be executed in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">Applications can make optimum use of the hardware by running their tasks in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.4">With modern-day applications being supported by a large amount of primary memory and servers with multiple CPU cores, it becomes easier to design applications that make use of concurrency and parallelism. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.5">Software platforms like Java and .NET provide libraries to achieve parallelism out of the box for applications that run on them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.6">For instance, in a batch processing of payments submitted by a merchant at the end of the day, a payment processing application can spawn multiple threads to execute each one of the payments in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.7">Concurrency not only helps to reduce response time by executing tasks in parallel, but it also helps to utilize the server resources like CPU and memory in the most optimal way.</span></span></p>
<h3 class="head2" id="sc3_257"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Technology choices</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Choosing the appropriate technology stack to build application components is key to ensuring the required performance levels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Low latency applications would require languages that can provide optimized interactions with the hardware components and network. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">For example, C and C++ would be better choices for low latency </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="179" id="page179"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">applications as they directly compile to the code to be executed on the processor, unlike Java, which compiles to an intermediate bytecode format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">In the same way, an application in which tasks can be performed in an asynchronous fashion can choose a programming language like Node.js that lends itself to such a programming style. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.3">Third party libraries used by applications for database manipulation, message parsing, and connections to third party services with specific protocols must be carefully assessed for performance using a proof-of-concept exercise before they are used for mainstream application development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.4">In the same way, JavaScript libraries that offer superior performance must be chosen for front end development over their features to ensure that the front-end lag does not hamper the overall user experience.</span></span></p>
<h2 class="head1" id="sc2_258"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Application performance</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Performance, being one of the key criteria for success in modern day software applications, is being addressed right from the requirement stage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Different stakeholders are consulted to understand the number of transactions required to be executed, along with the corresponding response time of the transaction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">Enterprises also want to ensure that there is very minimal disruption or downtime for their applications and devise strategies to ensure the availability and performance efficiency of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">With most of the applications making use of DevOps principles and CI/CD pipelines throughout the development lifecycle, performance testing is no longer an isolated activity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">It is ingrained as part of the regular build and testing process of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">Solutions architects and project managers do not certify builds for user acceptance or production deploys if the application does not meet the performance service level agreements. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">In this section, we will discuss the types of performance testing being done and, more specifically, the sequence of steps in load testing, which is very critical for ensuring application performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">We will further discuss performance monitoring and look at some of the key metrics that should be measured to fine tune application performance.</span></span></p>
<h3 class="head2" id="sc3_259"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Types of application performance testing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">There are different types of performance testing done to ensure the performance efficiency of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">These kinds of tests measure the transaction processing time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.3">They also check the quality of code to identify performance bottlenecks to assess the behavior of the application when it is subjected to constant load over a period. </span></span><span class="Italic"><a href="#fig9-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Figure 9.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> depicts the most common type of performance tests carried out to measure and fine tune performance of applications:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"><img src="images/Figure_9.1.png" alt="A chart listing types of application testing: Load Testing, Profiling, Breakpoint Testing, Soak Testing, and User Interface Testing, with descriptions of each method and its purpose. Blue and white color scheme."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig9-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Figure 9.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">: Types of performance testing</span></p>
</figcaption>
</figure>
<h4 class="head3" id="sc4_260"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Load testing</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Load testing of an application is carried out by applying a specific load on the application, and the performance of the application is continuously monitored using </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">application performance monitoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">APM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">) tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">Performance is measured in terms of the response time taken for a specific number of transactions executed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">For example, if two transactions get completed in a second, then the response time of a transaction is half a second. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.4">So, the tools measure if a specific number of transactions of a particular functionality get completed </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="180" id="page180"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">within the agreed response time within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Apart from the response time of transactions, other parameters like the number of slow and stalled transactions, the CPU and memory usage during the execution of the load test, and the number of errors produced are all measured and documented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">The values of these parameters are compared in a correlated manner, and it is understood if the performance of the application is within the accepted levels.</span></span></p>
<h4 class="head3" id="sc4_261"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Profiling</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Application profiling is done to ensure the efficiency of the application and that there are no resource leaks introduced by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">It is also done to measure the time taken by each of the methods in the code and provides valuable information to the developers to improve efficiency by optimizing the code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.3">Application profiling provides data related to memory and CPU usage, hanging threads, and resources left open after usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.4">For instance, application profiling can help developers find unclosed connections and open file handles within the code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.5">Profiling can be done with a single user, and the memory snapshot captured for analysis to identify and fix issues in the code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.6">Profiling can also help to find the size of objects in the heap, which can proliferate as the load increases and potentially cause out of memory issues.</span></span></p>
<h4 class="head3" id="sc4_262"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Break point testing</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Break point testing of an application component is carried out to find the maximum load that a single instance of the component can support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">The component is deployed in a standard configuration of hardware infrastructure and tested. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">This test is normally conducted to baseline performance of an application or a service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.4">Hardware infrastructure is provisioned with a set of memory and CPU cores, along with other required software dependencies deployed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.5">The application is continuously tested by applying a load that constantly increases in a set time frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.6">For example, a break point test may start with a load of five transactions, and the test is incremented by five more transactions every 15 minutes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.7">The response time and other performance parameters like CPU usage, memory usage, and error rates are continuously observed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.8">When the test goes on, a point is marked in the test where the response time continues to be constant, and the error rates, CPU, and memory usage remain stable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.9">The number of transactions, along with the response time, gives the benchmark of the application performance in the configured hardware and the software platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.10">If a better response time is required, the developer can reduce the number of transactions to start with in the break point test. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.11">The developer can also scale the hardware infrastructure vertically and repeat the test.</span></span></p>
<h4 class="head3" id="sc4_263"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Soak testing</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">A soak test runs an application under a constant load for a longer period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">Applications, at times, might exhibit unexpected behavior if they are subjected to a constant load for several days or weeks in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.3">This could manifest as memory leaks, higher CPU usage, unexpected exceptions, and higher error rates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.4">Soak testing ensures system stability and reliability apart from the performance of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.5">It helps performance engineers ensure that the response time is well within the accepted levels when the application continues to take a specific load for longer periods of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.6">Soak testing is done before the application gets deployed into production and ensures that the application adheres to the expected quality of services before it is rolled out to users.</span></span></p>
<h4 class="head3" id="sc4_264"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">User interface testing</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">User interface testing involves measuring page load times and the responsiveness of different user interface elements within the browser application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">Modern browsers provide the required developer tools to measure UI performance by estimating network performance, memory usage, and UI components' responsiveness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.3">Enabling caching of images and JavaScript files is one of the easiest and effective ways to ensure faster page load times. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.4">User interface profiling can also be done to understand elements that take time to load within the browser. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.5">Tools like Chrome developer tools and Apple Safari web inspector help to analyze inefficient memory usage, time taken to load images, and execution of JavaScript code within the browser application.</span></span></p>
<h3 class="head2" id="sc3_265"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="181" id="page181"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Task sequence in application performance testing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">The following is the sequence of tasks carried out by a performance engineer to certify if an application or an application component (like a microservice) is performant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">Its sequence is as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Collect nonfunctional requirements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">This is the phase in which the requirements for application performance are discussed with the stakeholders and then documented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">Service level agreements for metrics like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">transactions per second</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">TPS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">) and response time for various transactions within the application are agreed upon.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Create performance test scripts</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">: This step focuses on writing the performance test scripts for the test to be executed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">Scripting syntax is provided by the load test tools using popular languages like C language (for load runner) and JMeter scripting (XML based) for Apache JMeter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.3">This step can be automated using APIs provided by the tool provider. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">Configure a performance test</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">: Once the script is ready, the test needs to be configured within the performance test tool environment for the load to be applied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">This requires configuration like the number of virtual users, thresholds for parameters like CPU and memory usage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Execute the test</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">: In this step, the test is executed by the performance test tool, which internally uses the performance test script and other configured parameters from the previous step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">The execution of the test can also be automated using the APIs provided by the performance test tool.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Monitor the performance test</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">: As stated in the subsection </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Load testing </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">before, performance tests are run for many hours. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.2">During the test execution, the status of the test is continuously monitored using application performance monitoring tools, and it is ensured that the values of performance metrics like TPS and response time are within the desired levels and there are no major errors reported. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Collect test results</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">: In this step, the results are collected from different tools that were used for load testing and monitoring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.2">For instance, the performance engineer collects the load test results pertaining to transactions executed and response time from LoadRunner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.3">Data points pertaining to memory, CPU usage, and threads could be gathered from AppDynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.4">Data related to the number of errors and exceptions is collected from the log management tools like Splunk.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Interpret the test results</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">: This step is about analyzing the results collected in the previous step and certifying the performance of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.2">The results are viewed in conjunction with each other and the required service level agreements. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Certify the test</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">: Based on analysis, the component is certified to be performant and ready to be deployed to production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">If the test is not certified, the performance engineer executes the test again by adjusting the load and other parameters like CPU and memory usage thresholds.</span></span></p>
<h3 class="head2" id="sc3_266"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Application performance monitoring</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">APM is a set of activities supported by tools to ensure the optimum performance of the application to users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">Performance engineers use APM tools to collect telemetry data from the application environment to constantly monitor it and identify any deviations from set thresholds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.3">As examples, AppDynamics and Dynatrace are two of the popular tools that a performance engineer can use to monitor performance. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Application performance monitoring deals with the following three types of resources:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Infrastructure monitoring</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">Application platform monitoring</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Application monitoring</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">Infrastructure monitoring involves measuring the usage of CPU and memory so that they do not cross the set thresholds and slow down the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">Network monitoring is also a key activity to ensure that data </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="182" id="page182"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">packets do not get dropped during round trips between the client and server. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.2">In case of read-write intensive applications, a number of reads and writes per minute and the average time taken for them are constantly measured and ensured they are within acceptable limits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.3">Applications use </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Redundant Array of Independent Disks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">RAID</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">) configuration and opt for </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">solid state drives</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">SSD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">) over </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">hard disk drives</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">HDD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">) to improve the performance of input/output intensive applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Application platform monitoring focuses on the platforms where the applications are deployed for their run time and database systems that house the application’s data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">This helps to keep track of the hosting platform’s health and ensures that they are active in supporting the applications to operate in the most efficient way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.3">For example, in a microservices application deployed on Kubernetes, the control plane keeps monitoring the desired number of containers required for a particular microservice and instantiates a new container if any of the active container gets terminated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.4">Similarly, when a read replica is set up to serve application reads, the database management system should ensure that the data is effectively replicated to the read replica as configured to ensure that the read and write instances are in sync.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Application performance monitoring deals with the application’s usage of memory and computing resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">During a load test, an application’s usage of the heap allocated to it is constantly monitored to ensure that it does not fill up very quickly with objects, causing out of memory issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.3">Another option could be for the application to make use of multiple cores in the server by creating threads to enable the processing of applicable tasks in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.4">Application monitoring also deals with monitoring the proper closure of resources for use by other threads or application components and ensures that there are no resource leaks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.5">For instance, unclosed database connections will result in the connection pool running out of connections for newer requests to the application. </span></span></p>
<h3 class="head2" id="sc3_267"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Key performance metrics</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">A solutions architect should be aware of key performance metrics to measure and fine tune performance of an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.2">They are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Response time</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">: This is the time taken by an application or a component to process one transaction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.2">For example, if the application can perform four transactions per second, the response time is .25 seconds (250 milliseconds) per transaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">Throughput</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">: This represents the number of transactions or tasks performed in unit time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.2">It can also be the time taken to execute a query by a database in unit time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.3">If a transaction takes two seconds to get completed, the throughput of the application will be .5. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">CPU usage</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">: The amount of CPU used by the application while processing transactions in unit time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.2">This is measured in percentage and in conjunction with the total amount of computing power available to the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">Memory usage</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">: This is the total amount of memory used by the application as opposed to the memory allocated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.2">This is measured in percentage in conjunction with the total amount of memory available to the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.3">For example, some applications have a threshold set to fifty percent.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Number of slow transactions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">: In a load test, these are the transactions that have taken more time than the average or the desired transaction response time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">The CPU and memory are adjusted to reduce the number of slow transactions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.3">On the other hand, more instances can be added to reduce the number of transactions processed by the server or the node.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Number of failed transactions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">: During the load test, this is the number of transactions that failed out of all the transactions that were triggered by the load testing tool. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">If the number of failed transactions is more, root cause analysis is done, and the cause is fixed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Error rate</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">: The error rates are also monitored during the load test. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">Even though the response time might be within limits for the required number of transactions during the load test, the number of errors or exceptions reported should be at a minimum during a load test.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="183" id="page183"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Number of major garbage collections</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">: Major </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">garbage collection</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">GC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">) is one of the deterrents for efficient performance of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.2">This means that the memory allocated is quickly getting filled and is to be recovered. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.3">The major GC must be within prescribed limits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.4">For example, solutions architects may not certify a test if the number of major GC is more than one per hour during the entire duration of the performance test running for several hours.</span></span></p>
<h2 class="head1" id="sc2_268"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Scalability</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Scalability is an important quality of service that supports other qualities of service like performance, reliability, and availability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.2">Scalability is not only about expansion of the application in case it is required, but also about shrinking just in case the load on the application decreases.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Scalability of applications has become very significant due to the following reasons:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Realize business goals</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Scalability helps to future-proof businesses for any expansion being planned and helps enterprises to achieve their business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.2">An application built for scalability can be deployed in any part of the globe with minimum changes to the configuration. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Optimizing total cost of ownership</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">: Scalability helps enterprises to scale in and scale out hardware infrastructure based on the workloads at a given point in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.2">This adjustment of infrastructure based on load helps organizations reduce costs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Improved performance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">: Scalability helps applications improve performance of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.2">Development teams can move applications to specific types of hardware based on application non-functional requirements that help to optimize cost. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Compelling user experience</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">: Compelling user experience determines the success of modern-day enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">With the reduced attention span of users, slow applications and websites are very quickly shunned by users, resulting in business reputation and monetary loss. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.3">Scalability ensures that there is enough capacity to serve the number of users as planned. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.4">The infrastructure also adjusts itself to any increase or decrease in the user count accessing the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Increased reliability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">: Application reliability is about the ability of the system to behave predictably and provide the expected results in a performant way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.2">In situations where there is a sudden unexpected load increase on the application, performance and reliability take a hit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.3">Scalability can help to resolve issues arising from such situations by creating the required redundant nodes and spreading the load for a reliable functioning of the system. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Zero downtime</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">Scalability creates redundancy of applications and components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">This ensures that there is no single point of failure, and the application has the backup to process requests even if the primary application is down. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.3">This kind of availability is even more important for applications like health care and banks, which require a 24*7 availability.</span></span></p>
<h3 class="head2" id="sc3_269"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">Types of scaling</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Solutions architects can make use of different options for increasing the scalability of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">This includes scaling different layers of the application independently based on the load on the specific layer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.3">For instance, the business logic layer can be scaled based on the number of users that need to be supported concurrently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.4">Similarly, the database layer can be scaled depending on the read and write operations that need to be supported at the given point in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.5">There are options ranging from scaling the independent nodes to adding infrastructure for the application layer to overcome performance concerns and availability challenges.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Different types of scalability options available for the application layer are as follows:</span></span></p>
