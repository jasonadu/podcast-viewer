								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.1">Could cause performance issues if the queries are deeply nested.</span></span></li>
							</ul>
						</td>
					</tr>
				</tbody>
			</table>
<p class="caption-t"><span class="tablenum"><a id="tab4-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.1">Table 4.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.712.1">: API architecture patterns</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="79" id="page79"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.1">We have, till now, discussed the different patterns for solution architectures and APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.2">We will now examine the factors to be considered while choosing the technology stack for different layers of an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.3">This will help a solutions architect to quickly understand and use these while making a choice of a technology, and will help them to get prepared for the solutions architect interview.</span></span></p>
<h2 class="head1" id="sc2_116"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.714.1">Technology choices considerations</span></h2>

								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.763.1">Nature of functional requirements (online transactions, data warehouse, caching)</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.764.1">Type of data stored (structured, semi structured, unstructured)</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.765.1">Security (authentication, authorization, encryption)</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.1">Ease and extent of administration (configuration, backup procedures)</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.767.1">Cost (license, maintenance cost)</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.768.1">Support for the cloud (on-prem and cloud)</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-29"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.1">Scalability (horizontal, vertical)</span></span></li>
							</ul>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<p class="Normal--BPB-HEB- ParaOverride-30"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.770.1">Oracle, Microsoft SQL server, Mongo DB, AWS DynamoDB, Redis</span></span></p>
						</td>
					</tr>
				</tbody>
			</table>
<p class="caption-t"><span class="tablenum"><a id="tab4-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.1">Table 4.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.772.1">:</span><span class="CharOverride-5"> </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.773.1">Technology choices considerations</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="80" id="page80"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.1">Now that we have covered key architectural patterns, API design strategies, and technology choices for different types of components in an application, it is time to prepare for common interview questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.2">The model interview questions and answers section will provide model answers to some of the most frequently asked architecture and design questions in solutions architect interviews.</span></span></p>
<h2 class="head1" id="sc2_117"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.775.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.1">In this chapter, we covered the operational and technology drivers for a solution architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.2">We discussed how the business goals and the organizational hierarchy influence architectural decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.3">We also discussed how the users’ expectations for different quality of services, like performance and security, along with enterprise architecture governance, play a role in the architectural decisions being taken. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.4">We looked at the ways in which a solution architecture can influence different phases of a software project, like development, testing, and deployment of the application. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.1">We looked at different architectural patterns that a solutions architect is required to know for effectively blueprinting software solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.2">We discussed some of the most used patterns in the industry, like layered, microservices, </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.778.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.2">We discussed the advantages and disadvantages of using each one of them, along with the scenarios in which they are applicable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.3">We also discussed the architectural and design principles of creating APIs for applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.4">Finally, we looked at the considerations for making technology choices for different components like user interfaces, backend, and databases.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.780.1">In the next chapter, we will look at how we can align technology covered with the business goals of the enterprise.</span></span></p>
<h2 class="head1" id="sc2_118"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="81" id="page81"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.781.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.782.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.783.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.784.1">Drivers of a solution architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.785.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.786.1">Factors that influence a solution architecture that a solutions architect should be familiar with to strike a balance between the solution and the organization’s structure and governance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.787.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.788.1">Architectural patterns</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.789.1">: Choose the best architecture based on the nature of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.789.2">Different architectural patterns such as </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.790.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.1">, layered, pipes and filters, hexagonal, and microservices, along with their advantages, disadvantages, and the appropriate scenarios in which they can be applied.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.792.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.793.1">Microservices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.794.1">: Knowledge of what a microservice is and how to arrive at the required microservices for a business domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.794.2">Salient features of the microservices architecture that an architect is supposed to know to implement this widely used architectural pattern.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.795.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.796.1">API architecture and design</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.797.1">: Knowledge required in the areas of API architecture and design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.797.2">Different architectures available for implementing APIs like SOAP, REST, GraphQL, and gRPC, along with their merits and demerits.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.798.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.799.1">Technology choice</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.1">: Be aware of the factors to be considered while choosing a technology stack for the different layers of the architecture, like presentation, APIs, middleware, and backend components.</span></span></p>
<h2 class="head1" id="sc2_119"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.801.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.802.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.803.1">What is the architecture that you will prescribe for an application that generates lot of events?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.804.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.805.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.806.1">You will prescribe an </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.807.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.808.1"> for such an application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.810.1">You will choose a message broker through which the messages will be routed to the required microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.811.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.812.1">Each microservice could subscribe to the queue or topic that it is interested in to receive the events and process them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.813.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.814.1">Event-driven architecture enables a loose coupling of components and aids scalability of the individual components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.815.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.816.1">What is the architecture you will choose if you want to segregate different technical responsibilities within an application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.819.1">A layered architecture will be more appropriate for this kind of a scenario.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.820.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.821.1">You will suggest a separate layer for presentation, business logic, and data access within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.822.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.823.1">This architectural pattern will enable you to choose a technology that is fit for purpose for each of the layers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.825.1">In the future, it is easy to replace a single layer with an alternative technology stack without a lot of effort.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="82" id="page82"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.826.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.827.1">What is the optimal architecture for an application that needs to execute a process as a sequence of steps, and each step requires a different software run time and a different hardware configuration?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.828.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.829.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.830.1">You will use the pipes and filters architecture for this application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.831.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.832.1">The pipes and filters architecture pattern allows you to run the application as a series of filters (steps) connected through pipes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.833.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.834.1">Each filter can be run in its own software run time and a hardware configuration that is suitable for the compute intensity required for it.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.835.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.836.1">Filters can also be run in parallel to make the architecture faster and efficient. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.837.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.838.1">What is the architecture you will recommend for an application to be developed for a large e-commerce giant that has multiple business divisions supporting the core business?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.839.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.840.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.841.1">An e-commerce application that has complex business requirements needs to be carefully designed. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.842.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.843.1">A methodology like DDD combined with a microservices architecture is the right choice for this application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.844.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.845.1">DDD could be used to identify the sub-domains in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.845.2">The sub-domains represent the business subdivisions of the business domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.845.3">The sub-domains within the e-commerce application include order management, payment processing, inventory control, and shipping, to name a few.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.846.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.847.1">Once you identify the sub-domains, you will identify the business capabilities required in each of the sub-domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.847.2">You will also create a boundary for the subdomain called the bounded context. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.847.3">For example, the order management subdomain and bounded context may require business capabilities like receiving an order, fulfilling an order, and canceling an order.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.848.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.849.1">You will identify microservices within each subdomain/bounded context for addressing the business capabilities required. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.850.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.851.1">What is the suggested architecture for an application in which the individual components need to be consumed by multiple disparate client applications supporting different protocols?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.852.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.853.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.854.1">You would use the hexagonal architecture to blueprint the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.855.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.856.1">You will understand the requirements of the different clients that need to communicate with the server application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.857.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.858.1">You will develop the ports for the server-side component that provide the required function in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.858.2">For instance, a port can interact with the business logic to fetch orders that were returned or cancelled in the last 6 months.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.859.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.860.1">Based on the nature of the clients, you would develop the required adapters that each of the clients can use to fit into the port and consume the business logic.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.861.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.862.1">What are the ways in which application components can communicate with each other in an </span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.863.1">event-driven architecture</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.864.1">?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.865.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.866.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.867.1">In an </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.868.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.869.1">, the communication is asynchronous which means that the client and server are decoupled, and the client does not block to get the response from the server.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.870.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="83" id="page83"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.871.1">The asynchronous communication can either be point-to-point or publish subscribe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.871.2">In a point-to-point communication model, a producer posts a message(event) into a message broker queue and is consumed by another component.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.872.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.873.1">In a publish subscribe model, a producer posts a message (event) to the message broker topic, and all the interested components can subscribe to the topic and consume the message.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.874.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.875.1">Both point-to-point and publish subscribe model are used in the microservices architecture for inter service communication. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.876.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.877.1">What is the most common API architecture used by applications?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.878.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.879.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.880.1">REST which is based on HTTP is the most widely used architectural style for designing and developing APIs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.881.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.882.1">REST based on HTTP supports all the basic CRUD operations like create, read, update, and delete, used by most of the transactional business applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.883.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.884.1">REST APIs are easy to develop using modern day software application frameworks like Spring Boot.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.885.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.886.1">REST APIs are stateless, and they lend themselves to caching their responses.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.887.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.888.1">What is the API architectural pattern that will be used to fetch data from multiple sources in a single call?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.889.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.890.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.891.1">GraphQL, the open-source API query engine, can be used to retrieve all the required data at once.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.892.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.893.1">You can define the schema for the API with the attributes required to be fetched from multiple sources in a single call. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.894.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.895.1">You would use an engine like an Apollo server or Graphene to implement the server-side APIs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.896.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.897.1">You will ensure not to complicate the schema structure to ensure only the required data is fetched to avoid potential performance bottlenecks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.898.1">9.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.899.1">What is the API model that you can use for integrating low latency applications?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.900.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.901.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.902.1">As an architect, you would recommend gRPC as the protocol to implement the server and client-side code, as gRPC uses a binary format for serialization of data across the network.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.903.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.904.1">You will declare the required APIs or methods using Protocol buffers, which is the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.905.1">interface definition language</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.906.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.907.1">IDL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.908.1">) for gRPC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.909.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.910.1">You will generate the server side and client-side code from the protocol buffer file, depending on the technology stack. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.911.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.912.1">The generated client stubs can be used to communicate with the server-side implementation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.913.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.914.1">Be aware that gRPC can be used only for internal applications because of its design approach to generate both server and client-side code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style730 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="84" id="page84"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.915.1">10.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.916.1">How will you integrate your application with a SOAP web service?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.917.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.918.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.919.1">You would request for the WSDL file for the server-side implementation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.919.2">The WSDL file could be provided as a file or as a URL from a server.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.920.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.921.1">You would generate the required client stubs from the WSDL file depending on the programming language used by the client application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.922.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.923.1">You will also go through the WSDL to understand the operations supported and the payload required for each operation. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.924.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.925.1">You will use the generated client stubs from my application to communicate with the SOAP server.</span></span></p>
