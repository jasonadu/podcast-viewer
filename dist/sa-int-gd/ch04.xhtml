			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">Microservices are independently developed and deployed, thereby reducing the dependency on other parts or services of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.2">The independent deployability is one of the key advantages that make microservices architecture the most adopted one by enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.3">This increases the time to market of any new features that the enterprise wants to roll out to its customers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">Each microservice can be independently scaled very quickly because of its lighter weight.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">The startup of microservices is very quick as they are packaged with only limited functionality in them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">Microservices enable the culture of DevOps that encourages the development team and the operations team to work together. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">Microservices are polyglots in nature, which means that each microservice can choose its own technology for development based on the type of problem they are trying to solve.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">Microservices architecture enables an organized team structure in terms of their role and responsibilities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">The following are the disadvantages of the microservices architecture:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">The microservices architecture is complex in nature to implement correctly, thereby making it difficult to adopt for smaller applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">The architecture might prove to be counterproductive if the team does not adopt a proper decomposition strategy.</span></span></p>
			<table id="table003" class="Basic-Table _idGenTablePara-1">
				<colgroup>
					<col class="_idGenTableRowColumn-3"/>
				</colgroup>
				<tbody>
					<tr class="Basic-Table _idGenTableRowColumn-5">
						<td class="Basic-Table CellOverride-1">
							<p class="Normal--BPB-HEB- ParaOverride-2"><span class="TIP-INFO--BPB-HEB- CharOverride-11"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">Note:</span></span><span class="TIP-INFO--BPB-HEB- CharOverride-2"> </span><span class="TIP-INFO--BPB-HEB- CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">Decomposition strategy is a method used to come up with the Microservice components in a sub domain (divisions of a business domain). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.2">Each sub domain comprises of business capabilities; You can try to make each business capability a microservice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.3">Be cautious neither to over split the services, which will make them very granular, nor assign them too many responsibilities, which will again make them a monolith on their own. </span></span></p>
						</td>
					</tr>
				</tbody>
			</table>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="72" id="page72"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">Microservices communicate with each other through network calls, which can be a hurdle to performance if the network latency is large.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">The enterprise needs to address additional technology complexity like DevOps pipelines, container orchestration tools (Kubernetes, for example), in addition to the development, deployment, and monitoring of each microservice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">The microservice architecture could pose technical challenges like transaction management and service aggregation that need to be addressed by the solutions architect.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">Microservice might not be the right option for building applications that have a limited budget and have a very tight timeline for completion.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">The following are the scenarios in which microservices architecture can be a right fit:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">The business is complex, and we need an architecture to address the business complexity in the technology solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">A large application that has high scalability requirements will benefit from a microservices architecture, which allows the business logic to be broken down into multiple independently deployable components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">An enterprise that has a need to introduce newer services to its customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.2">After the initial build with microservices, it becomes easier to introduce new microservices to the application that constitute new feature functionality and products.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">Each microservice can be independently tested and deployed with a virtualization strategy for its dependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">Microservices are also being deployed using a serverless computing model in cloud native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.2">Let us explore why serverless architecture has become one of the mainstays in a cloud native application architecture, along with its merits and demerits. </span></span></p>
<h3 class="head2" id="sc3_109"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">Serverless architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">A serverless architecture is one in which the configuration of the hardware, and the software runtime are totally taken care of by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.2">The developer can use the serverless computing model to deploy their code and test it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.3">The developer can increase the efficiency of the program by requesting additional memory or computing power, depending on the service level agreements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.4">All the popular cloud providers offer different software runtimes, such as Python, Java, and Node.js, in which code can be written. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.5">AWS Lambda and Azure Functions are some examples of serverless architecture. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">The advantages of serverless architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">The developer can directly deploy their code without having to worry about setting up their hardware and software environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">The developer can request additional memory and computing power to improve the efficiency of their code as required.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">There are no additional license costs to worry about.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">The developer is charged only for the time during which the code runs, optimizing the cost. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">Helps the developer to spin up a quick proof of concept.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">Fosters innovation for small enterprises and start-ups.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">The disadvantages of the serverless architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">The developer does not have a lot of control over the hardware and software runtime to configure them in a granular way as required.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="73" id="page73"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">The security model of the serverless infrastructure is totally managed by the cloud provider.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">The cloud provider might provide only the popular and recent software runtime and may not support old technologies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">The serverless architecture is applicable in the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">Applications that need to be built in the shortest possible time without any infrastructure or software setup.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">Scenarios in which procuring a permanent license may be expensive for the enterprise. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">While choosing the right application architecture is key to solving internal system challenges, APIs play a pivotal role in integrating services both within and outside of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.2">Let us now shift focus to API architecture and design to discuss the various approaches to exposing and consuming services in modern software applications.</span></span></p>
<h2 class="head1" id="sc2_110"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">Application programming interface architectures</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">API has become one of the important ways to expose the services of an organization to both internal business divisions and to the external world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.2">APIs provide agility to businesses in staying competitive and increasing their reach to diverse partners across the world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.3">APIs have evolved over the years, and their quality of services in terms of their security, scalability, and resilience has also seen a drastic improvement over the years.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">APIs foster innovation at the same time, helping enterprises to monetize their digital assets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.2">In </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">, Technical Proficiency Essential Knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">, we discussed the API first design approach in which applications are architected and designed with APIs as first-class citizens. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.2">Developers constantly use APIs to develop software that makes use of the services offered by large enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.3">The examples of web application that widely uses APIs are airfare comparison and booking portals, hotel bookings around the world, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.4">We will discuss three major API architectures that are predominantly used that a solutions architect should be aware of. </span></span></p>
<h3 class="head2" id="sc3_111"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">Representational state transfer</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">REST is an architectural style for creating resource based, stateless API end points. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.2">The REST endpoints shield all the complexity of the underlying server implementation from the client and provide a unique </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">Uniform Resource Locator </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">URL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">) to be used by the consumers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.2">REST endpoints are typically resource based and they support operations that are required to query and manipulate the resources of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.3">For instance, there would be specific APIs for customer and order resources of an application, and the API would support operations based on well-known HTTP verbs like post, get, put, and delete, mapping to create, read, update, and delete operations used commonly by server-side applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.4">The REST APIs are stateless in the sense that they do not hold any stateful data between any two requests in the same session. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.5">They are also idempotent and have the same effect on requests that carry identical payloads.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">In essence, REST APIs are characterized by the following features:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">REST endpoints primarily operate on the resources, for example, customer, order, account, etc., of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">Each REST API is identified using a unique URL or a URI.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">They are stateless by design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">REST endpoints support HTTP verbs such as post, get, put, and delete.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">Responses from the REST end points are cacheable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">They enable the approach of </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">Hypermedia as the Engine of Application State </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">HATEOAS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">) wherein the transition to the next possible states of the application is dictated by the REST API in the form of hyperlinks in the response. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="74" id="page74"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">The following are the advantages of using REST APIs:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">They hide the complexity of the inner implementation, making them highly consumable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">REST end points are interoperable with clients using disparate technologies for their front ends.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">They expose end points that are HTTP based and are easy to use by any type of client, like a web or mobile application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">They follow the HTTP taxonomy for manipulating resources and are suitable for CRUD type of applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">Since they are stateless and idempotent, they lend themselves to caching of the generated responses.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">They are easily scalable given their stateless nature.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">The following are the disadvantages of using REST APIs:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">Data aggregation could be a challenge given the fine grained (resource based) nature of the REST APIs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">Though they expose their contracts through swagger files (API 2.0/API 3.0), there is no standardization of schema validation for REST endpoints.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">Applications requiring maintenance of state will not benefit from REST end points, given their stateless nature.</span></span></p>
<h3 class="head2" id="sc3_112"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">Simple Object Access Protocol</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">SOAP was one of the widely adopted protocols before REST came into being. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.2">Interoperability between clients and servers was the main challenge in the application integration space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.3">Servers and clients were written in different programming languages, and integrating them became a challenge, and they could communicate only using a middleware. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.4">Web services became a popular choice to integrate applications, and SOAP served as a worthy candidate to integrate disparate systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.5">A set of associated standards (specifications) came along with SOAP for defining security, reliability, messaging, and interoperability. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">SOAP defined the standard for defining the payloads that contained both data and operations, and the contract of the payload was defined using an interface definition file called the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">web services description language </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">WSDL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.2">Any client that wanted to access the SOAP service could download the WSDL and create the stubs that hid the nuances of accessing the SOAP service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.3">These stubs were able to be generated in multiple languages, depending on the technology stack used by the client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.4">Another method that was available was the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">dynamic invocation interface </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">DII</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">), in which the client did not have to generate stubs and was dynamically able to create SOAP requests and invoke services at runtime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.2">SOAP services are still common in applications developed before the advent of REST, though their usage has almost stopped in contemporary software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.3">The solutions architect might still have to deal with systems that use the SOAP protocol for inter system communication and should have an understanding of these types of services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">The following were the advantages of SOAP: </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">Offers interoperability between applications using different technologies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">Provided specifications for quality of services such as reliability, security, and interoperability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">Removes the necessity of a middleware between the client and the server.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">The WSDL provided the clients with a schema that was used to validate request formats and content at compile time, making them efficient to be tested easily and debug errors.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">The following were the disadvantages of SOAP:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">The SOAP and other related specifications are fairly complex to implement by applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="75" id="page75"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">SOAP may not be the ideal choice for low latency applications, given their nature of invocation (DII especially).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">Since the SOAP services are tied to a WSDL, any changes to the payload will require a recompilation of the client stubs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">SOAP is applicable to the following types of applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">SOAP is an ideal candidate to integrate applications using different technologies in a large enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">Exposing third party partner systems becomes easier with the circulation of the related WSDL files to different consumers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">Plays a significant role in exposing legacy systems to modern day application clients without a major change to the core of those legacy systems.</span></span></p>
<h3 class="head2" id="sc3_113"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">Google remote procedure call</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1">gRPC is an open-source framework developed by Google for optimized and high-performance communication between client and server applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.2">gRPC is widely used by enterprises across the globe to build their APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.3">gRPC uses a binary format as a payload(serialization) between the client and server. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.4">This binary format helps in the compression of the payload, thereby making communication faster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.5">This is different between a REST and a SOAP service, where the payloads are sent in </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">JavaScript Object Notation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">JSON</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1">Extensible Markup Language</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">XML</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">) formats, respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.2">This makes gRPC useful for applications that need faster round trips between the client and the server. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">gRPC uses a specific language called </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">protocol buffers</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">ProtoBuf</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">) to define the APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.2">Later, the protocol buffer file is compiled to the programming language for both the server and the client applications based on their technology, like Java or Python. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.3">The protocol buffer file defines the contract between the client and server, just like WSDL for SOAP services and a Swagger file for REST endpoints.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">The following are the advantages of using gRPC:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">gRPC makes applications interoperable with modern day software applications using a variety of technologies for their implementation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">Suitable for low latency applications where the components interact over a network, like a microservices architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">The binary format serialization compresses the payload, making the communication lighter between the client and server, improving performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">The following are the disadvantages of gRPC:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">It is not suitable for simple applications due to the complexity of its implementation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">Like SOAP services, the contract between the client and server is strictly dictated by the protocol buffer file. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.2">Any change in the contract will result in the recompilation of the server and client code that support gRPC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">It may not be suitable for business-to-business integration (partner systems) because of its rigid nature to generate both server and client-side artefacts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">The following are the application types that will benefit from gRPC:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">Applications used by stock broking and currency exchange houses that require a very low latency, and gRPC could be a good fit for these kinds of applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">It is a good fit for cloud native applications that predominantly use microservices for their applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.2">Inter service communication will benefit from gRPC.</span></span></p>
<h3 class="head2" id="sc3_114"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="76" id="page76"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">GraphQL</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">GraphQL was introduced by Facebook and is a query language used for APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.2">GraphQL has a server engine and uses a declarative approach to define APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.3">In the same way, there are client side libraries that are used to connect to the GraphQL APIs and get the required data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.4">Apollo Server, Graphene, and GraphQL-JS are some of the popular server-side implementations of GraphQL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.5">Apollo client is a popular client-side implementation that can be used by Angular or React front end applications to connect to the GraphQL APIs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">GraphQL was developed to be an efficient alternative to REST endpoints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.2">APIs in GraphQL are defined using a schema that lets front end applications fetch the right amount of data they require for their different form factors (web, mobile, etc). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.3">GraphQL offers the capability to fetch required data in a single call from multiple resources across the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.4">This avoids multiple round trips to the server, unlike in the case of RESTful APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.5">GraphQL APIs can be designed to offer a single end point for the same scenario that requires multiple RESTful calls to get the same amount of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.6">GraphQL is strongly typed, which enables developers to validate the type of parameters passed in queries at the time of API invocation. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">The following are the advantages of GraphQL: </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">GraphQL can retrieve all of the data required in a single call from the client.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">GraphQL can help to fetch just enough data as required by the client application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.2">Mobile applications can especially benefit, given their limited processing power, when compared to a desktop. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">GraphQL offers resolvers that can help to authorize users before they can fetch certain values as part of the API response.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">It has an efficient error handling mechanism that can return meaningful messages to the user. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">Offers notification of the client in real time when data is available in the API.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">The following are the disadvantages of the GraphQL APIs:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">GraphQL may not be the right choice for systems requiring simple CRUD operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">GraphQL may pose performance related issues if the API schemas are deeply nested in terms of their structure to get data from multiple server resources.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">If the application requires fine grained security, REST will be a better choice to handle complexity than GraphQL resolvers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">The following are the scenarios in which GraphQL could be effectively used:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">APIs that fetch data from different resources, and the data needs to be returned to the client all at once.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">Applications that need to validate the query parameters at the API level and return meaningful responses to consumers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">GraphQL is useful for applications supporting multiple form factors where the client needs to specify the data that it wants to consume. </span></span></p>
<h2 class="head1" id="sc2_115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">Architectural patterns summary</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1">Having discussed the patterns for application architectures and APIs, </span></span><span class="Italic"><a href="#tab4-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">Table 4.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1"> shows the salient features for a quick reference. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.2">This will help the readers as a refresher for preparing for the solutions architect interview:</span></span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="77" id="page77"/></p>
			<table id="table004" class="No-Table-Style _idGenTablePara-2">
				<colgroup>
					<col class="_idGenTableRowColumn-6"/>
					<col class="_idGenTableRowColumn-7"/>
				</colgroup>
				<thead>
					<tr class="No-Table-Style _idGenTableRowColumn-8">
						<td class="No-Table-Style CellOverride-2">
							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">Architecture pattern</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-2">
							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.1">Salient features</span></span></p>
						</td>
					</tr>
				</thead>
				<tbody>
					<tr class="No-Table-Style _idGenTableRowColumn-9">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.1">Pipes and filters</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.631.1">This pattern divides a process as multiple steps.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.1">Each step(filter) is connected to a pipe that takes the output of the filter to the next step(filter).</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.1">Filters can run in parallel.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.1">Each filter can run in its own hardware and software, depending on requirements.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.1">Each filter can be made redundant to reduce failures.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.636.1">The data could come from multiple sources and go to a target after being processed by multiple filters.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.1">Ideal for processes that need to be executed as a sequence of steps.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-10">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.638.1">Hexagonal architecture</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.1">The business logic is exposed to multiple clients in the form of a port.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.640.1">Each port can be consumed by a diverse set of clients using custom adapters.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.1">The adapters are written based on the protocol support required by the consuming applications.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.1">Ideal for scenarios in which a business logic component needs to be consumed by disparate clients.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.1">It is like a USB port in a laptop into which multiple devices can be plugged into like an optical mouse or a mobile charger.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-11">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.644.1">Monolith</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.645.1">All the components are packaged into a single compilation unit, such as a WAR or EAR file.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.646.1">No clear segregation of layers within the application.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.647.1">This poses a challenge on the technology choice for individual components like user interfaces, business, and data logic.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.1">Ideal for simple applications with strict timelines.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-12">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.1">Layered</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.650.1">The application architecture is clearly demarcated by different layers.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.1">Each layer addresses a specific technology concern like user Interface, business logic, and data access logic.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.652.1">Each layer can be built with its own technology choice.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.653.1">It is easy to replace the individual layers separately, making it very modular.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.654.1">Ideal for applications wherein each layer undergoes lots of changes and also needs to be replaced often.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-13">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.1">Service oriented architecture</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.1">This architecture integrates different services of the enterprise.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.657.1">The integration of services is enabled by an ESB.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.658.1">Each service integrated can belong to different business divisions of the enterprise.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.659.1">Ideal for scenarios where a business process is to be built as a sequence of services, with each service belonging to different divisions in a large business enterprise.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-14">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.660.1">Event-driven architecture</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.661.1">Applications generate events(messages) in response to a user action(quote, order, etc.).</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.662.1">The messages are posted to a message broker.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.1">This will trigger an action on a business logic component.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.664.1">This architecture enables both point-to-point and publish subscribe type of communication.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.665.1">Ideal for decoupled systems and microservices.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-15">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.666.1">Microservices</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.1">This architecture encourages a business driven approach using methodologies like DDD.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.668.1">Application developed and deployed as individual components.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.669.1">This architecture is highly scalable and hence suitable for cloud-native application architecture.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.1">The communication between components can be synchronous or asynchronous.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.1">Suitable for large applications with complex business requirements like e-commerce applications.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-16">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.1">Serverless</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.673.1">This model enables developers to deploy their code in their preferred software runtime on the cloud.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.674.1">Developers can request additional hardware, such as memory and computing power.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.1">Hardware and software platform is completely managed by the cloud providers.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.676.1">Serverless computing model has come to be widely used with the microservices architecture.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.1">This model is suitable for spinning up a quick proof of concept or a minimum viable product.</span></span></li>
							</ul>
						</td>
					</tr>
				</tbody>
			</table>
<p class="caption-t"><span class="tablenum"><a id="tab4-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.678.1">Table 4.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.679.1">:</span><span class="CharOverride-5"> </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.1">Application architecture patterns</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="78" id="page78"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.1">The following table covers the API architecture patterns:</span></span></p>
			<table id="table005" class="No-Table-Style _idGenTablePara-2">
				<colgroup>
					<col class="_idGenTableRowColumn-17"/>
					<col class="_idGenTableRowColumn-18"/>
				</colgroup>
				<thead>
					<tr class="No-Table-Style _idGenTableRowColumn-19">
						<td class="No-Table-Style CellOverride-2">
							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.682.1">API pattern</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-2">
							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.1">Salient features</span></span></p>
						</td>
					</tr>
				</thead>
				<tbody>
					<tr class="No-Table-Style _idGenTableRowColumn-20">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.684.1">REST</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.1">Most widely used API pattern to integrate applications and expose application capabilities to internal and external partners.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.1">Backed by HTTP, which makes it very consumable by disparate clients.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.1">Supports create, read, update, and delete operations using the HTTP verbs of post, get, put, and delete.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.1">REST APIs operate on resources of the application(order, customer, etc.).</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.689.1">The REST end points are identified by well-defined URLs.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.690.1">REST APIs are stateless and idempotent.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.691.1">The responses from REST end points are highly cacheable.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-21">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.692.1">SOAP</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.1">Makes use of an interface definition file called the WSDL</span></span><span class="CharOverride-17"> </span><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.694.1">to define the APIs.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.695.1">APIs can be called dynamically or by generating stubs from the WSDL file.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.696.1">The payload is a SOAP payload predominantly carried by http.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.697.1">It has additional specifications for reliability messaging, security, and interoperability.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.1">Used to create highly interoperable web services to integrate disparate applications and played a key role in enterprises using SOA.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-22">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.699.1">gRPC</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.1">Google RPC uses a binary format to carry payloads from the client to the server.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.1">APIs are defined using an interface definition file called the ProtoBuf.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.1">Stubs are generated for both clients and servers using the protocol buffer API definition file.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.1">Very performant and is used for inter microservice communication.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.1">May not be suitable for integrating external partners because of the rigid nature to generate stubs for both client and servers.</span></span></li>
							</ul>
						</td>
					</tr>
					<tr class="No-Table-Style _idGenTableRowColumn-21">
						<td class="No-Table-Style CellOverride-3">
							<p class="tcen ParaOverride-26"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.1">GraphQL</span></span></p>
						</td>
						<td class="No-Table-Style CellOverride-3">
							<ul>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.706.1">GraphQL introduced by Facebook defines APIs in the form of a schema.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.707.1">The user can define the depth of the query in the schema file depending on the data(response) requirements.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.708.1">Helps to fetch all the data required from multiple sources in a single call.</span></span></li>
								<li class="Normal--BPB-HEB- ParaOverride-27"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.1">It has resolvers that help with the authentication of APIs.</span></span></li>
