<section epub:type="chapter" role="doc-chapter">
<header>
<h1 class="chaplabel" id="ch04"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="59" id="page59"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 4</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Technical Solutions Architecture and Design</span></span></h1>
</header>
<h2 class="head1" id="sc2_96"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Application architecture is a key decision that plays a vital role in the success of a software project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">There are multiple architectural patterns available which a solutions architect can choose from to blueprint a software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The architecture of a system not only has its own technology implications but also highly influences the other phases of the software project, like development, testing, deployment, and monitoring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">It is important to choose an architecture that not only has a technical advantage but also keeps the business goals of the organization in mind. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">Software solutions, most of the time, are built by enterprises to bridge the gaps between their existing business architecture and their aspirational business goals.</span></span></p>
<h2 class="head1" id="sc2_97"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Drivers of a solution architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Influence of a solution architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Application architectures</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Application programming interface architectures</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Architectural patterns summary</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Technology choices considerations</span></span></p>
<h2 class="head1" id="sc2_98"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">In this chapter, readers will understand the factors that influence a solution architecture of a system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">We will also discuss how a solution architecture can, in turn, influence the different phases of the software development lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">We will cover different types of architectures that solutions architects need to be aware to prepare for a solutions architect interview and use the knowledge presented to effectively build solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.4">The chapter will also cover the architectures for </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">application programming interfaces </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">API</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">)</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">,</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"> which power many of the modern enterprises today.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="60" id="page60"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Now that we have set the stage by understanding the significance of an application architecture in the success of a software project, let us explore the key factors that influence the design and selection of an appropriate choice of solution architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">These drivers, both operational and technical, play a crucial role in determining the architecture best suited for a given project.</span></span></p>
<h2 class="head1" id="sc2_99"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Drivers of a solution architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">In this section, we will cover the factors that a solutions architect should consider while architecting a solution for an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">A solution architecture, before being chosen and detailed, needs to consider various aspects that are both operational and technical in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Some of the operational drivers include organizational structure, stakeholder management, organizational culture, software budget, time to market, and, very importantly, their business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">The technical influencers include functional and nonfunctional requirements, enterprise architecture governance, quality of services required, skillset of the available workforce, integration with other applications, and interface with third party systems. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">The following are the operational factors to be considered by an architect:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Business goals</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">: Business goals are very important to keep in mind while architecting solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">This emphasizes the fact that software architecture should not only address technical complexities but also consider optimizing the whole business process space to which the problem being solved belongs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">A complex software solution is of little help if it does not optimize a business process that is taking a lot of time to complete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.4">Business goals are thereby at the top of the list in choosing the right target architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Organizational structure</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">: There are organizations with multiple divisions, including both business and technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">An application that has an impact on multiple business divisions needs to be more distributed in nature, and the respective components can be managed by the respective business divisions, governed by a contract for communication between them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">From a technology standpoint, there could be multiple teams specializing in a particular area of technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">For instance, there could be a shared middleware services team that develops the middleware services for multiple business units in the enterprise using a specific suite of middleware tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">The architect needs to keep in mind the way the enterprise works and accordingly take architectural decisions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Stakeholder management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">: Functional requirements of the system play a key role in the chosen solution architecture used to build the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">At the same time, it is also important to understand the business stakeholders for whom the system is being built. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">If the requirements are simple, an architecture that can befit those requirements should be chosen. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">For example, an enterprise might want to build an application to manage leave applications and leave encashment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.5">This application might not warrant a distributed architecture like microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.6">The application can be built as a monolith with modularity built into it for segregation of major functions required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.7">A solutions architect should clearly reason out and get the buy-in of both the business and technology stakeholders with regard to how the solution would solve their business problem, and the architecture chosen is the ideal fit for the solution to the problem being solved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.8">The solutions architect should assess the complexity of the requirements given and should recommend an architecture that best fits the application requirements, rather than choosing an architecture that is very sophisticated or popular.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Organizational culture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">: There are organizations that have a lot of resistance to change in adopting newer technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">There could be multiple reasons for it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">The enterprise could be dealing with very sensitive data and would want to stick with its proven technology stack for compliance reasons rather than trying out cutting edge technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">For instance, enterprises dealing with financial information and patient health data might be very cautious about adopting newer technologies such as generative AI or blockchain for their core businesses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.5">They may not adopt it until these are proven to be secure and are broadly accepted by the industry overall. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.6">However, they may be using them in their internal applications to optimize business tasks that may not involve sensitive customer data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="61" id="page61"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Cost and budget</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">: Enterprises more often do not want to spend a budget on a software project more than the money they can make out of it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">The architecture chosen should enable the enterprise to build, test, and deploy the application within the stipulated cost and budget. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.3">The architecture should not prescribe components that are very expensive to procure and maintain in terms of their license cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.4">The architect should keep in mind the budget available for the enterprise to build the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Time to market</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">: Time to market is one of the key factors that a business considers while embarking on software project development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">Many a time, the enterprise wants to introduce a service or a product before any of its competitors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.3">The architect should keep in mind the timelines the business is considering for completing a software project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.4">The solutions architect should use an architecture that strikes a balance between its applicability to the problem, the quality-of-service requirements, and the time to market the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.5">A sophisticated software application or feature may not appeal to users if there are others like it in the market already.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">The following are the technology factors to be considered by an architect:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Software system requirements</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">: The nature of the system requirements plays a very key role in the choice of application architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Application requirements can be complex, which requires a careful assessment and segregation of the functional capabilities required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">An application that requires a compelling user experience will require a different architecture than an application that is compute intensive and needs to be extremely performant in the transactions carried out in the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">Another scenario could be an application that requires that an entire domain functionality be built that cuts across different business divisions in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.5">It is important for a solutions architect to choose an architecture that best fits the functional and nonfunctional requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Enterprise architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">The overall technology governance in an enterprise plays a key role in the choice of architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">There is a lot of emphasis on specific approaches to the way applications are built in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.3">The enterprise architecture will also have a big influence on the choice of the technology stack being used to build applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.4">This largely depends on the nature of the enterprise’s business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.5">The solutions architect should be aware of the enterprise architecture framework within which they should operate to build a blueprint of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Quality-of-services</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">: Quality-of-services is bound by different service level agreements as dictated by the business stakeholders of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">The quality of service is also governed by the laws of the land in which the business operates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.3">There could be a mandate to encrypt the data before it is stored or the continuous availability of the system, if the application offers an essential service being used by the public. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.4">An example could be an application hosted by the government to find the nearest hospital with the required facilities in case of an emergency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Skillset of the available workforce</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">: The technology stack should be chosen based on the available skill set within an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">Certain architectures lend themselves to a generic technology skill set, whereas others might need a specific skill set to realize the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">For example, an </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"> would require the team to have a good experience in message-oriented software like Kafka and messaging patterns to be put into use. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">The architect should accordingly strike a balance between the nature of the requirements, the available skillset, and the chosen architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Integration with other applications</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">: Certain applications may need to work closely with other applications within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Integration using an enterprise service bus or other middleware software would be the right approach to architect and design such applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">The architect should be able to decide the architectural pattern that would be the best fit for blueprinting such applications. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Interface with third party systems</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">: There are applications which require a heavy wiring with systems external to the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">The protocol required to interface with each of those systems could be different, and the format for data exchange could vary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">For example, a flight reservation system might interface with many other external data providers for the flight schedule and the fares that keep changing every hour. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.4">The solutions architect should be conscious of the contracts exposed by third party systems while designing those interfaces.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="62" id="page62"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Having understood the factors that drive the choice of the solution architecture, it is equally important to recognize how the chosen architecture, in turn, influences the various phases of a software project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">The architecture you select will impact not just the development approach but also the team structure, testing strategy, and deployment strategy.</span></span></p>
<h2 class="head1" id="sc2_100"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Influence of a solution architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Like the way an organization’s structure and its business goals drive the software architecture, the software solution architecture also has a profound impact on many aspects of software design and development.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">The following are the phases of the software development that a solution architecture influences:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">Development methodology</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">: The type of architecture decided by the architect has a direct impact on the development methodology used to build the software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">For instance, if the application uses </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"> wherein the software components are loosely coupled, the software can be built in an Agile fashion with multiple components being built in parallel and each component built incrementally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">If the application architecture is a monolith, the software can be built using a traditional methodology like Waterfall.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Team structure</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">: The solution architecture also determines the way the teams are organized in a project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">If the application architecture is distributed as in the case of microservices, each of the components can be built by individual functional delivery teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">Each team will be responsible for developing the capabilities pertaining to a domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.4">If the software architecture uses a three-tier pattern comprising user interface, controller, and business logic, there can be three specialized teams focusing on each of these layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.5">A microservices architecture will also mandate a specialized team, like a DevOps team, that will build the required pipelines to build, test, and deploy the software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Test strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">: The test strategy also gets influenced by the type of architecture chosen. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">A microservices architecture will lend itself easily to testing the components independently of each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.3">More so, the testing will depend on the type of microservice being developed, such as a business logic component or a database component. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.4">In a monolith, the focus is to heavily test the functionality of the application as there is very little segregation of the individual components within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Deployment strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">: Deployment strategy is another aspect that depends on the architecture of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">Microservices architecture lends itself to the independent deployment of the developed services, and they can also be scaled independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.3">The hardware provisioning and scaling mechanism for this will be entirely different than a monolithic application, which is deployed and scaled as a single unit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.4">The hardware provisioning for a monolith must accordingly be planned.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">With an understanding of how solution architecture influences different aspects of a software project, let us now dive deeper into specific application architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">Each architectural pattern brings its own advantages and challenges, and knowing when to apply them is critical for success in both project implementation and interview scenarios.</span></span></p>
<h2 class="head1" id="sc2_101"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Application architectures</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">In this section, we will look at the different types of application architectures that a solution architect needs to be familiar with. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">We will look at the salient features of the architectural pattern discussed, their merits and demerits, so that the architect can take an informed decision on whether they will be a right fit for the given application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.3">We will also look at the applicability of each one of those architectures so that the architect can easily identify the scenario in which one or more of those architectural patterns will be the right choice to be applied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.4">Apart from the technology considerations, the architect also needs to keep in mind the operational and technology factors discussed in the section drivers of a solution architecture to choose an appropriate architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="63" id="page63"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Let us begin by discussing the pipes and filters architecture, which is a well-known pattern for organizing complex processes into modular, reusable components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">This architecture can be particularly effective when processes need to be divided into independent tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">Let us explore the details of this architecture.</span></span></p>
<h3 class="head2" id="sc3_102"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Pipes and filters</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">The pipes and filters architecture is one in which the entire process is divided into multiple tasks, and each task is called a filter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">Each task is carried out independently of the others. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">The tasks are connected using pipes that take the output of the previous filter to the next filter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.4">Each filter is self-contained and works based on the input it receives and gives a specific output after processing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.5">The filter could include any type of processing, like business validation, data transformation, or include a step of a batch process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.6">Filters do not have any routing intelligence and send the output from them to the next filter in the line through the pipe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.7">The filters consume data from a source, and after the data is processed through a series of filters, it is passed on to a target, which could be a business logic component in an application. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig4-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Figure 4.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> depicts the pipes and filters architecture:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"><img src="images/Figure_4.1.png" alt="A flowchart showing a series of connected blocks: Source leads to three sequential Filter blocks via pipes, ending with Target. Arrows indicate the direction from Source through Filters to Target."/></span>
<figcaption>
