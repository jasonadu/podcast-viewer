</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">The advantages of the pipes and filters architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Pipes and filters architecture promotes modularity of the software application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Each filter executes independently of the others, and they can easily be removed or replaced.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">Each filter can be reused any number of times in multiple flows.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Filters can run in parallel, making them performant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Each filter can be made to run on different hardware and software, making them a flexible architectural choice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Each filter can be scaled independently.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">The disadvantages of the pipe and filter architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Complete processing of a request end-to-end might depend on the slowest filter.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">A change of logic of a single filter warrants testing of the end-to-end flow.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">The pipes and filters solution might become difficult to maintain if they are run on completely different sets of hardware across multiple hyperscalers. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Failure of a single filter while processing a request might cause application state related issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.2">It is important that all filters are designed to be stateless, and they are idempotent so that the failure to process a request by a filter can be taken up by another instance of the same filter. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">The pipes and filter architecture can be used in the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">In a process of compute intensive application, the work can be divided against a series of tasks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Each task can best be run in its own choice of hardware and software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">This lets computationally intensive tasks run on powerful hardware against others that are not computationally intensive.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Filters can be run in parallel, making them an ideal choice to process huge amounts of data, as in an </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">extract, transform, and load </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">ETL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">) application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">Scenarios in which the tasks may have to be quickly removed or interchanged with others.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="64" id="page64"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">While pipes and filters focus on modularity through sequential task processing, a hexagonal architecture offers a different approach by isolating business logic from the technical concerns of an application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.2">This separation ensures flexibility in how business logic is accessed and consumed by various interfaces. </span></span></p>
<h3 class="head2" id="sc3_103"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Hexagonal architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">The hexagonal architecture pattern, also known as the ports and adapters pattern, aims to isolate the business logic of the application from other technical components like data sources and protocols used to consume the business logic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">The focus of this architecture pattern is to separate the business logic from other components of the application like database components or the user interface components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.3">This helps to approach the application design more from a business requirements perspective rather than all other concerns that consume the business logic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.4">Once the business components are built, they are integrated with other components or consumed by other applications through ports and adapters. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Adapters are specialized interfaces that can be used by other components or applications to consume the business logic through ports defined as part of the business components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">The architecture enables multiple adapters to be integrated with the same port without impacting each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.3">For example, a business component exposed using a REST API can easily be consumed by a REST client and a GraphQL API. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">The applications use adapters based on their convenience to consume the data from the port and use them in their very own way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">Though hexagonal architecture appears more in line with microservices architecture, it deals with segregation of business logic as components within a single application, whereas microservices deal with applications having a wider business scope involving multiple business divisions within the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">Hexagonal architecture is depicted in the following figure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1"><img src="images/Figure_4.2.png" alt="A diagram shows business logic connecting to external systems via REST and Data ports, with adapters for REST, GraphQL, database, and files, represented by icons for each system."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig4-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Figure 4.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">: Hexagonal architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">The advantages of using the hexagonal architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Business logic is segregated from other technical concerns of the application, enabling developers to focus on core business requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Loose coupling of the components enables flexibility to add or remove components easily.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">The business components can scale independently based on the load on the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">Business logic can be independently tested in full without any dependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">The architecture gives an advantage to choose the technology of choice for each of the components as they are loosely coupled.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">The ports and adapter pattern enables the business logic to be consumed by multiple clients at the same time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">The disadvantages of using the hexagonal architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Added complexity to write ports and adapters.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">The ports and adapters add another layer of abstraction, which may be a hurdle to the performance of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Tracing an application request might be a challenge because of the multiple layers involved.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="65" id="page65"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">This architecture may be a complicated option for applications of simple and medium complexity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">There could be a maintenance overhead because of the number of individual components and layers involved.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">The hexagonal architecture can be used in the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Hexagonal architecture fits in where a single business component must be consumed by multiple heterogeneous client applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Applications that undergo frequent changes and need to be tested often.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Hexagonal architecture can be used for systems which has high scalability requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">This architecture pattern can be used for legacy modernization engagements where a newer component might have to work with a legacy component and vice versa.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">This architecture fits applications which need loose coupling, and components can evolve independently of each other but have well defined interfaces.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">In contrast to the loosely coupled, flexible nature of hexagonal architecture, a monolithic architecture, discussed in the following section, bundles all components into a single deployment unit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.2">While it may seem limiting, monolithic architecture has its place in certain scenarios, particularly for simpler applications or quick MVP builds. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Let us see when a monolithic approach makes sense and its trade-offs.</span></span></p>
<h3 class="head2" id="sc3_104"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Monolith architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">A monolithic architecture is a pattern in which all the components needed to realize the requirements of an application are bundled and deployed together. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">This architecture pattern does not segregate between different concerns like user interface, business, and database logic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.3">There is a very tight coupling between different components of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.4">Due to the lack of segregation of concerns in the application, all the components are developed using a common technology stack or programming language. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.5">The monolith applications are more suited for applications with simple requirements, and the testability of the application does not warrant a considerable amount of effort. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">The monolith architecture is depicted in the following figure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1"><img src="images/Figure_4.3.png" alt="Diagram showing consumers (a smartphone and laptop) connecting to a monolith system with user interface, business logic, and database logic, which then connects to a database."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig4-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Figure 4.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">: Monolith architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">The advantages of the monolith architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">An easy architectural pattern to blueprint and build applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">It is easy to deploy as the entire application is built as a single compilation unit.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">Offers a good performance as all the components run in a single process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">Easier to deploy and manage as all components are bundled into a unified package.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="66" id="page66"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">The disadvantages of the monolith architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">This architecture poses scalability issues as the whole package needs to be scaled, even for scaling a single component.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">The choice of technology poses limitations to developing specific component types like user interfaces and business logic components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">Regression testing is a challenge, as even for small changes, a considerable portion of the application needs to be tested.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">As the codebase grows, it becomes difficult to deploy the application, and application start times could increase.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Maintainability of the codebase is hard for large applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">The monolith architecture can be used in the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Simple applications where the number of features and components is limited. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">This architecture is suitable for applications where the user base is limited and does not change.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">It is a good candidate to quickly develop an application as a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">minimum viable product </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">MVP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">) that can be rolled out to users within shorter timelines.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Monolithic applications may provide simplicity, but when projects require clear separation between concerns like user interface, business logic, and data access, a layered architecture can provide the necessary structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.2">Let us explore the layered architecture below, one of the most widely adopted patterns, and its benefits.</span></span></p>
<h3 class="head2" id="sc3_105"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">Layered architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">The layered architecture helps a </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">solutions</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1"> architect to conceptualize and blueprint the application as a set of distinct layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.2">This is one of the most popular architectural patterns that has been in the industry for a long time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.3">The application using this architecture has multiple layers, each one responsible for a specific technology concern. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.4">There is a layer containing the user interfaces, there is a second layer containing the business logic of the application, and a third layer for database access logic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.5">This makes the application more modular, and each layer is separated from the other two. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.6">This gives flexibility to the architect to choose a technology stack of choice for each of the layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.7">Client server and model view controller are specific cases of this architectural pattern. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.8">However, the communication between the layers depends on how the layers are segregated within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.9">For example, if the business logic components are packaged together, they can communicate with each other directly by calling a method within the corresponding class. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.10">In this case, the user interface and business logic are segregated, and the two components could talk to each other using standard protocols like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">Hyper Text Transfer Protocol (HTTP)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">A layered architecture is depicted in the following figure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1"><img src="images/Figure_4.4.png" alt="A vertical flowchart showing consumers accessing a user interface, which connects to business logic, then database logic, and finally a database at the bottom. Icons for a smartphone and computer are used to represent consumers."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig4-4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">Figure 4.4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">: Layered architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="67" id="page67"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">The advantages of using a layered architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">This architecture provides a clear segregation of concerns, such as user interfaces, business logic, and database logic, making the application more modular and maintainable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">It lends itself to technology choices for each of the application layers concerned.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">It gives flexibility for different teams to work independently on each of the layers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Individual layers can be tested independently by mocking the other adjacent layer on which it is dependent.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Individual layers can be scaled independently.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Components in each layer can be reused depending on the context of feature functionality, for instance, a component developed to check the account status can be reused at multiple places like bill payments and fund transfers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">The disadvantages of the layered architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">Though the individual layers can be scaled independently, it does not offer any segregation between components in each layer.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">The performance of the application depends on the performance of the individual layers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Introduction of a new feature requires development or a change across all the layers of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">Situations in which a layered architecture can be used are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">A good fit for applications that often require a technology change for each of the individual layers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">The layered architecture can be used effectively for large applications, which makes it easier to maintain as the application is modular.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">This architecture can be used for applications where there are teams with skills for specific layers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">While layered architecture organizes an application by technology concerns, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">service oriented architecture </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">SOA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">) organizes services around business functionality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.2">In an enterprise, SOA enables reuse and flexibility across multiple applications and business divisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.3">Let us look at the advantages and challenges of implementing SOA.</span></span></p>
<h3 class="head2" id="sc3_106"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Service oriented architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">The service oriented architecture allows services across multiple applications in an enterprise to communicate with each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.2">These applications could belong to different business divisions in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.3">The services exposed through SOA themselves are owned and maintained by the business division to which the process represented by the services belongs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.4">The service oriented architecture brings in a lot of re-use in the way applications are conceptualized, designed, and developed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.5">For example, the marketing division in an enterprise is responsible for the offers rolled out to its customers for a period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.6">There are multiple applications that can consume these offers and present them to the customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.7">A customer using a mobile application can directly make use of the offers if interested. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.8">On the other hand, a front desk billing clerk using an internal desktop application can let the customers know of these offers at the time of billing the products. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">The important feature of SOA is that each service is completely independent of each other and can be used by multiple client applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.2">These services can be exposed as </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">Simple Object Access Protocols </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">SOAP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">web services, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Representational State Transfer </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">REST</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">) services, and using a message queue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.2">These services are bound by a contract that are made aware to the consuming applications for easy consumption of those services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.3">These services are most popularly hosted on middleware products or an enterprise service bus through which the request response exchange happens. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="68" id="page68"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">A service oriented architecture is depicted in </span></span><span class="Italic"><a href="#fig4-5"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Figure 4.5</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1"><img src="images/Figure_4.5.png" alt="Diagram showing Consumers (tablet and laptop icons) connecting to an Enterprise Service Bus, which connects to three services: Service One and Service Three (database icons), and Service Two (cash register icon)."/></span>
<figcaption>

</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">The advantages of using SOA are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">Services are conceptualized and owned by business divisions which emphasize a joint ownership and business significance in realizing the business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">The services can be developed and deployed independently improving their scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">The services developed can be consumed by any number of channel applications that get added in the future.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">The services offer a definitive contract thereby enabling them to be consumed by any type of application that honors the contract.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">The services are loosely coupled because of which they can be enhanced independently without affecting other services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">The architect can choose the technology that works best for the individual services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">The disadvantages of using SOA are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">The services in most cases are integrated using an </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">Enterprise Service Bus</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">ESB</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">) which adds additional hops and could be a hurdle for application performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Increased license cost for the enterprise to procure and maintain the ESB and the individual services required.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">Complexity of development of the service and its contract to make them interoperable for consumption by multiple consumers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">A strong SOA governance should be in place as the services could be owned by different entities within the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Versioning could become a challenge if multiple consumers want different versions of a service implementation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">Situations in which SOA can be used are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">Works extremely well for a large enterprise wherein a service needs to be consumed by multiple channel applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">SOA lends itself well where each business process is owned by separate business divisions within the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">While a SOA facilitates communication across services, at times, the application might need asynchronous, real-time responses to events. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">Event-driven architecture </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">EDA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">) addresses this by allowing components to react to events without being tightly coupled. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.2">Let us explore in the following section the benefits of EDA and when to use it.</span></span></p>
<h3 class="head2" id="sc3_107"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="69" id="page69"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Event-driven architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">EDA is an architectural pattern in which the components of a system react based on events that happen within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.2">An event is an action that is triggered by an end user or could be triggered by another component within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.3">For example, an inventory component could check for sufficient goods in the warehouse on the receipt of an order within the system, which acts as an event to trigger the inventory validation process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.4">The </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1"> encourages a loosely coupled model for applications in which communication between the components happens in an asynchronous fashion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.2">Messages are exchanged between components using a message broker that helps to bind all the components together. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.3">There are two different approaches to implementing EDA.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">A point-to-point model in which a producer sends a message to an event queue, and the message is consumed by a component designed to process that event. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.2">In the second approach, a producer publishes a message to a topic, and multiple consumers consume the message from the topic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.3">This is called the publish subscribe model, in which a message can be broadcast to multiple subscribers that are interested in the event. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">Event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1"> also supports event streaming in which a continuous stream of messages gets written to the message broker or event bus, and they are continuously processed by event receivers in real or near real time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.2">Some of the popular message brokers include Kafka, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">Amazon Web Services </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">AWS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">) </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">Simple Message Queue </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">SQS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">), and RabbitMQ. </span></span><span class="Italic"><a href="#fig4-6"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">Figure 4.6</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1"> depicts an </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1"><img src="images/Figure_4.6.png" alt="A diagram shows Producer One sending data to a message broker using a queue, which sends to Consumer One. Producer Two uses a topic, sending data via a message broker to both Consumer Two and Consumer Three."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig4-6"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">Figure 4.6</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">: Event-driven architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">The advantages of using </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1"> are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">Event-driven architecture encourages decoupling of components, making the application modular.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">Individual components can be replaced or changed without impacting others if the message structure for consumption does not change.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">Individual components have their choice to choose their own technology stack based on the problem they are trying to solve.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">Offers resilience and message (event) durability as the messages can be stored and processed later if the consumer is not available.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">Can be used for patterns like event sourcing that help to store state changes as events that can be later replayed if required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.2">We will discuss the event sourcing pattern in </span></span><span class="Italic"><a href="ch22.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">Chapter 22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">, Cloud-native Architecture and Design</span></span><span class="CharOverride-15"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">Helps in parallel development as individual teams can work on their components after the contract (message format) has been agreed upon.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">This architecture lends itself well to testing the individual components independently.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">This architecture is scalable as the individual components can be scaled based on their load.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">The disadvantages of using event-driven architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">This architecture may not be suitable for small or medium complexity applications due to the design intensity imposed by it.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="70" id="page70"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">Traceability of the requests could be a challenge because of the asynchronous nature of message exchanges involving multiple components within the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">All transactions involve the message broker, which introduces an extra hop that could be the cause of concern for performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">This architecture will offer eventual consistency, and the data read could be slightly outdated before all the components process a message in a transaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">Situations in which an event-driven architecture is applicable are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">This architecture is widely used by </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">Internet of Things </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">IoT</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">) applications where multiple devices emit data to be collated and processed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">Event-driven architecture is commonly used by microservices architecture for communication between different components within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.2">We will discuss microservices architecture in the next sub-section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">Microservices architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1"> of this chapter.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">This architecture is used in situations that require integration with other applications that use asynchronous communication.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">This is used by applications that require processing of data streams in real or near real time and decisions to be relayed back to the downstream systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">While an </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1"> decouples components using events, in many modern enterprise applications, a more granular division of services is required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.2">Microservices architecture builds on this idea by breaking down the application into independent, business-focused services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.3">This architecture is foundational in cloud-native development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.4">Let us explore how to effectively design microservices.</span></span></p>
<h3 class="head2" id="sc3_108"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">Microservices architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Microservices architecture is one of the most widely used architectural patterns in the industry today. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.2">It is very important for a solutions architect to understand this architecture and associated design approaches, design patterns, and design principles to successfully implement it the right way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.3">In any solutions architect interview, there are always questions pertaining to the successful implementation of this architecture. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">The microservices architecture starts with the division of a business domain into sub domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.2">In microservices architecture, the focus is more on the business domain than on the technology used to implement it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.3">DDD that we covered in </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">, Technical Proficiency Essential Knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1"> is one of the most used design methodologies to split the overall business domain into sub domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.2">The sub domains represent the problem space, which at a high level represents the boundary of the different business functions required in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.3">The sub domains use ubiquitous language to create definitive meanings for the real-world entities that are used within the sub domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.4">The sub domain also gets associated with a domain model that represents the key participants, their relationships, and their behavior within the sub domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.5">The sub domains are later converted into a bounded context within which the required entities will live and operate (data and behavior) to realize the required business functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.6">The bounded contexts are then converted into microservices that represent the individual components providing one of the business capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.7">It is important to note that each microservice will have its own database. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.8">This is to ensure that all microservices are self-contained and their existence does not depend on a common data store of the application, thereby avoiding a single point of failure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.9">Even though the data stores may be unique for each microservice, it is acceptable to have an overlap of data to a certain extent, as required for the business capabilities to operate in harmony with each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.10">For example, a shipping microservice might have some amount of order information to make sure that the order is shipped to the right customer with all the products ordered.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">The whole process of coming up with the sub domains and the required microservices is called a decomposition strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.2">This is one of the most important steps in microservices architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.3">It is vital to get the right number of microservices for the system, at the same time ensuring that each microservice is of the right size. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.4">This determines the flexibility of the whole application to address changing market needs and a quick time to </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="71" id="page71"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">market. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.2">This also helps the individual microservices to scale independently and very quickly, as the size of the microservice is rightly managed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.3">Microservices architecture is one of the most used architectures in cloud native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.4">Microservices architecture lends itself very well to containerization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.5">Clients access microservices using API gateway. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.6">It is important for the solutions architect to understand the concepts of containerization to effectively implement microservices architecture on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.7">We will cover the containerization concepts and the microservices design patterns in detail in </span></span><span class="Italic"><a href="ch22.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Chapter 22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">, Cloud-native Architecture and Design</span></span><span class="CharOverride-15"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">The following figure depicts a microservices architecture:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1"><img src="images/Figure_4.7.png" alt="Diagram showing consumers (a phone and laptop) accessing an API Gateway, which routes requests to three services (Service One, Two, Three), each connected to its own database."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig4-7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">Figure 4.7</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">: Microservices architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">The advantages of microservices architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">The architecture is driven by business focused design methodology.</span></span></p>
			<table id="table002" class="Basic-Table _idGenTablePara-1">

					<col class="_idGenTableRowColumn-3"/>
				</colgroup>
				<tbody>
					<tr class="Basic-Table _idGenTableRowColumn-4">
						<td class="Basic-Table CellOverride-1">
							<p class="Normal--BPB-HEB- ParaOverride-2"><span class="TIP-INFO--BPB-HEB- CharOverride-11"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">Note:</span></span><span class="TIP-INFO--BPB-HEB- CharOverride-2"> </span><span class="TIP-INFO--BPB-HEB- CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">DDD approach that we covered in </span></span><span class="TIP-INFO--BPB-HEB- CharOverride-15"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Chapter 3</span></span><span class="TIP-INFO--BPB-HEB- CharOverride-3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">,</span></span><span class="TIP-INFO--BPB-HEB- CharOverride-15"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1"> Technical Proficiency Essential Knowledge</span></span><span class="TIP-INFO--BPB-HEB- CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1"> is one of the popular methodologies to divide the entire business domain into sub domains.</span></span></p>
						</td>
					</tr>
				</tbody>
			</table>
