			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.658.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.659.1">Monitoring and auditing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.660.1">: Utilize tools such as Splunk or AWS Security Hub for real-time checks of compliance and log monitoring.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.661.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.662.1">Automated compliance validation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.1">: Integrate automated scripts into CI/CD pipelines to validate compliance before deployment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.664.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.665.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.666.1">: The institution was able to attain PCI DSS compliance with reduced audit overhead and increased confidence in the security of its payment systems.</span></span></p>
<h4 class="head3" id="sc4_528"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.1">Government agency systems governance</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.668.1">Government agencies handle vast amounts of sensitive citizen data, making strong governance essential to ensure data privacy, compliance, and operational transparency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.668.2">With stringent data residency laws, inter-agency data sharing requirements, and accountability challenges, agencies must implement standardized governance models that enforce policies consistently across departments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.669.1">By leveraging unified governance frameworks, data classification, PaC, and continuous auditing, agencies can streamline compliance, minimize data breach risks, and enhance transparency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.669.2">This case study highlights how structured governance ensures regulatory adherence while maintaining efficiency in public sector operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.1">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.1">Case</span></span><span class="Normal--BPB-HEB--Char CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.673.1"> study</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.674.1">: A government agency needs strong governance to meet data privacy standards, remain transparent, and protect citizen data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.676.1">Challenges</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.678.1">o	</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.679.1">Strict data residency is a requirement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.1">o	</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.1">Data should be shared across agencies while not revealing sensitive information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.682.1">o	</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.1">There is a lack of accountability in the dispersed teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.684.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.1">Solutions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.1">Unified governance model</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.689.1">: Implement an overarching governance model that makes the policies uniform for the agencies</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.690.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.691.1">Data classification</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.692.1">: Employ data classification mechanisms to tag and govern the sensitive data based on their criticality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.694.1">Policy as code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.695.1">: Enforce governance policy through PaC to hold the infrastructure and workflows liable to compliance requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.696.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.697.1">Audit/reporting</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.1">: Continuous auditing technologies should be in place. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.2">They should be able to provide real-time compliance report to regulatory reviews.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.699.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="284" id="page284"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.1">Result</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.1">o	</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.1">Compliance was streamlined.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.1">o	</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.1">The risk of data breach reduced.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.706.1">o	</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.707.1">Transparency on the operations was maintained.</span></span></p>
<h3 class="head2" id="sc3_529"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.708.1">Implement governance in complex systems</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.1">As organizations scale, governance must remain scalable, enforceable, and adaptable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.2">Solutions architects ensure compliance by integrating PaC, IaC, and centralized governance tools while fostering cross-team collaboration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.1">By defining clear governance objectives, automating enforcement, and conducting regular reviews, architects maintain consistency across multi-team, multi-cloud environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.2">These strategies enable solutions architects to design secure, compliant, and efficient systems in complex enterprise landscapes.</span></span></p>
<h4 class="head3" id="sc4_530"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.1">Role of solutions architect</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.712.1">In complex systems, solutions architects must:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.714.1">Design scalable governance models that address multi-team, multi-region, and multi-cloud environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.715.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.1">Integrate governance into every phase of the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.717.1">software development lifecycle</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.718.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.719.1">SDLC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.720.1">), from planning to deployment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.721.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.722.1">Balance innovation with compliance, ensuring systems remain Agile while adhering to regulatory standards.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.723.1">Strategies for implementing governance in complex systems include:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.724.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.725.1">Define governance objectives</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.1">Define key compliance standards, operational goals, and accountability metrics aligned to system needs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.728.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.729.1">Use centralized governance tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.731.1">Implement via mechanisms like ServiceNow </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.732.1">Governance, Risk, and Compliance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.733.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.734.1">GRC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.735.1">) or CloudHealth, an integrated view of compliance and governance activities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.736.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.737.1">Utilize automation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.738.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.739.1">Apply governance policies across teams and environments using IaC and PaC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.740.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.741.1">Develop cross-team collaboration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.742.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.743.1">Align through governance committees that have representation from both IT, legal, security, and operations teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.745.1">Governance review</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.747.1">Review governance periodically and change policies as required by the dynamic needs of the business, changing regulatory environment, and advances in technology.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.748.1">Real-life governance scenarios and case studies illustrate how solutions architects can create systems that are not only compliant but also efficient and scalable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.748.2">With principles from Zero Trust, challenges such as PCI DSS compliance, and the addition of governance in complex systems, architects can be confident that their solutions are responsive to organizational and regulatory demands while instilling trust and accountability.</span></span></p>
<h2 class="head1" id="sc2_531"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.749.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.750.1">Governance and compliance are cornerstones of robust and scalable solutions architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.750.2">This chapter emphasized the importance of integrating governance frameworks and compliance standards into the design and operation of modern systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.750.3">Solutions architects are tasked with balancing innovation with regulatory adherence, ensuring that systems not only meet business objectives but also withstand scrutiny from stakeholders and regulatory bodies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="285" id="page285"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.1">From understanding the governance frameworks, such as TOGAF, COBIT, and ITIL; adherence to compliance standards, such as GDPR, HIPAA, and PCI DSS, and more, this chapter puts into practice action strategies as well as tools to cope with real-world challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.2">Therefore, automation is a must for this continuous compliance and governance in dynamic and multi-cloud, distributed environments, which would be the role, like PaC and PaaS.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.1">With practical insights into Zero Trust Architecture, real-world case studies, and emerging technologies, solutions architects are now better positioned to design systems that are secure, compliant, and resilient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.2">This chapter ensures that you are prepared to navigate governance and compliance requirements, answer challenging interview questions, and implement scalable solutions that foster accountability and innovation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.1">However, governance and compliance are not just about policies and automation; effective communication and collaboration are equally vital. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.2">Solutions architects must work with diverse stakeholders, align technical and business priorities, and convey complex solutions clearly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.3">The next chapter explores the critical soft skills needed for success, including stakeholder communication, documentation, presentation skills, and leading cross-functional teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.4">Mastering these skills ensures that solutions architects can translate governance and compliance strategies into actionable, well-aligned solutions across an organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.754.1">In the next chapter, we will study communication and collaboration, which are the foundation of a solutions architect’s role.</span></span></p>
<h2 class="head1" id="sc2_532"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.755.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.756.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.757.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.758.1">Governance and compliance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.759.1">: They are critical for secure and scalable architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.759.2">This chapter covered key frameworks, automation strategies like PaC and SaC, and Zero Trust principles to enforce compliance dynamically. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.759.3">Real-world case studies illustrate how architects can integrate governance without hindering innovation, ensuring resilience, risk mitigation, and readiness for regulatory challenges. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.760.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.761.1">Governance frameworks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.762.1">: TOGAF, COBIT, ITIL to be used by solution architects to align architectures towards organizational goals and regulatory standards.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.763.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.764.1">Compliance integration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.765.1">: Design systems and incorporate compliance through design, Privacy by Design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.765.2">Implement data encryption and appropriate controls toward maintaining standards such as GDPR, HIPAA, or PCI DSS.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.767.1">Governance through automation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.768.1">: Use PaC and SaC for dynamic enforcement of governance and compliance across CI/CD pipelines and runtime environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.770.1">Risk management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.1">: Implement proactive risk management in order to identify vulnerability and mitigate compliance risks that add to the system's resilience within hybrid and multi-cloud architectures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.772.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.773.1">Zero Trust Architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.1">: Apply the Zero Trust principles for continuous verification, secure access, and adherence to data protection policies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.775.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.1">Emerging technologies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.1">: Adopt governance practices to innovations like AI, ML, cloud-native systems, and distributed architectures, ensuring agility with compliance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.778.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.1">Practical applications</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.780.1">: Case studies in the healthcare, finance, and government sectors showcase how governance and compliance strategies are effectively implemented.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.781.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.782.1">Interview preparation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.783.1">: Prepare to respond to governance and compliance scenarios and explain the rationale for decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.783.2">Show your expertise on tools and frameworks.</span></span></p>
<h2 class="head1" id="sc2_533"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="286" id="page286"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.784.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.785.1">1.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.786.1">What is the role of governance in solutions architecture?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.787.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.788.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.789.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.790.1">Governance is a process that ensures that systems are delivered within organizational objectives, regulatory requirements, and operational guidelines.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.792.1">It includes structures that define decision-making, ensure compliance with policy, and check balances to avoid mismatches, security breaches, and inefficiencies.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.793.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.794.1">Governance structures like TOGAF ensure that architectures are scalable, but business imperatives are aligned.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.795.1">2.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.796.1">Describe how you would design such a system to be GDPR compliant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.797.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.798.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.799.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.1">Data privacy</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.801.1">: Apply the principles of Privacy by Design, including data limitation collection and user control over personal information.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.802.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.803.1">Data encryption</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.804.1">: Use strong encryption for rest and in-transit.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.805.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.806.1">Consent management</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.807.1">: Ensure explicit user consent for data processing activities.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.808.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.1">Data residency</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.810.1">: Store data within the European Union as required by residency.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.811.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.812.1">Monitoring and auditing</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.813.1">: Use something like AWS Config to watch for non-compliance continuously.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.814.1">3.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.815.1">What is policy as code, and how does it help governance and compliance?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.816.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.817.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.818.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.819.1">Policy as code takes the policies of governance and compliance and turns them into something machine-readable, so they can automate enforcement in CI/CD pipelines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.819.2">For example:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.820.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.821.1">Compliance validation</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.822.1">: PaC will always ensure that any deployment done is always GDPR or PCI DSS compliant.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.823.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.824.1">Automation</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.825.1">: Prevents human error when non-compliant configurations will automatically get rejected.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.826.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.827.1">Tools</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.828.1">: OPA will enforce policies like data encryption or role-based access.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.829.1">4.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.830.1">Describe the centralized versus decentralized governance difference.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.831.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.832.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.833.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.834.1">Centralized governance</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.835.1">: All decisions are taken with a high level of centralization and strict uniform policies are in place along with strict oversight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.835.2">Ideally suited for industry sectors like finance, where rules and regulation are highly rigorous.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.836.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.837.1">Decentralized governance</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.838.1">: It spreads out responsibilities, hence encouraging agility and innovation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.838.2">It suits dynamic organizations like multinational corporations where teams need autonomy within a governance framework.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.839.1">5.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.840.1">How would you enforce compliance in a hybrid or multi-cloud environment?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.841.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.842.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.843.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.844.1">Unified governance framework</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.845.1">: Apply tools such as Terraform or Azure Arc to ensure consistency in policy implementation across platforms.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.846.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.847.1">Data residency</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.848.1">: Ensure that data complies with the local laws through strategic choice of compliant data centers.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.849.1">•	</span></span><span class="CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="287" id="page287"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.850.1">Monitoring and alerts</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.851.1">: Tools like Prisma Cloud for the real-time detection and remediation of non-compliance.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.852.1">6.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.853.1">Describe a scenario that illustrates how Zero Trust Architecture provides compliance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.854.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.855.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.856.1">•	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.857.1">Scenario</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.858.1">: A healthcare application that needs HIPAA, where Zero Trust Architecture provides-</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-40"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.859.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.860.1">IAM and MFA</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.861.1">: Only the authorized will get access to sensitive data.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-40"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.862.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.863.1">Micro-segmentation</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.864.1">: Patient records are segregated by department so that no lateral breach is possible.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.865.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.866.1">Continuous monitoring</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.867.1">: Tools will detect and report the unauthorized accesses in real-time.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style741 CharOverride-22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.868.1">7.	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.869.1">How does SaC facilitate compliance?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.870.1">Model answer</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.871.1">:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.872.1">•	</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.873.1">SaC can integrate security policies into the development lifecycle and then automatically enforce in CI/CD pipelines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.873.2">Some examples are as follows:</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-40"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.874.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.875.1">Access control policies</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.876.1">: Enforce role-based access using IAM rules.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-40"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.877.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.878.1">Encryption standards</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.879.1">: Automatically check for proper encryption settings while deploying.</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288 CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.880.1">o	</span></span><span class="CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.881.1">Compliance assurance</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.882.1">: HashiCorp Sentinel ensures consistency in security practice between environments.</span></p>
