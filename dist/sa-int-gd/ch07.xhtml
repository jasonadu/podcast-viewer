			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Industry popular products are mostly compliant with the laws of the land that enterprises like financial institutions must comply.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Replace is an ideal option for medium size enterprises which may not have the necessary skills to rebuild the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">This option is an ideal choice for capabilities that are very much required but may not be the core competency of the enterprise to build them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">For instance, an e-commerce company might buy a product for processing the payroll of its employees. </span></span></p>
<h3 class="head2" id="sc3_197"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Best practices of legacy modernization</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">The following are the practices that many of the enterprises adopt during their journey of legacy modernization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">These industry accepted guidelines help smooth the journey of modernization and also increase the success rate of such engagements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.3">The following is a list of a few such best practices:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Conduct a discovery phase</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">: A discovery phase becomes very important in the path to modernize legacy applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.2">This phase helps to come up with the right number and size of the business capabilities required in the target modernized application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.3">This also helps to zero in on the right modernization strategy to be adopted.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Build a roadmap</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">: Come up with a roadmap for the entire journey of the legacy modernization exercise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">Plan and document each of the steps that are required in the pathway to successfully migrate legacy application to modern day architectures and technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.3">At the same time, beware of the challenges and risks on the way and document the appropriate risk mitigation plan to be adopted.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">Leverage automation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">: Legacy modernization exercises deal with understanding existing application documentation, design, code, and database schemas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">Make use of automation tools to extract business </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="137" id="page137"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">rules and logic from existing legacy applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.2">Refer to the section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Artificial intelligence in legacy modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1"> for more on how AI can be used.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Retire unused applications</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">: Many enterprises continue to maintain applications that are no longer used by their staff. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.2">There is always a disconnect between the maintenance team and the business teams, which results in unused applications continuing to occupy the infrastructure landscape. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.3">Enterprises need to take an inventory of applications that are being maintained in production and also take stock of the applications being used by their users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.4">The unused applications can be retired, thereby reducing the total cost of ownership.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">Embrace Agile</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">: Break down the entire journey into manageable and measurable tasks and execute each one of them as independently as possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.2">This approach helps us to measure the effectiveness of the activity completed in the whole journey. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.3">Being Agile gives us an opportunity to course correct the direction of the whole journey, just in case certain aspects of the modernization exercise, like choosing a modernization strategy, identification of skills required, etc., need to be fine-tuned.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">Track with KPIs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">: Measuring a process is one of the important prerequisites to continuously improving it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.2">Define key performance indicators to measure the effectiveness of the process being adopted for the legacy modernization exercise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.3">KPIs can be defined and measured for different areas like project management, business process effectiveness, finance, and organizational change.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">In this section, we discussed the best practices to get the most out of the legacy modernization engagements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.2">We discussed the importance of building a roadmap for adopting automation and also making use of Agile practices to enable the success of such engagements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.3">In the next section, we will see the role of cloud in the modernization of legacy workloads.</span></span></p>
<h2 class="head1" id="sc2_198"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">Legacy modernization to cloud</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Many organizations follow a cloud first approach for their newer and transformation workloads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.2">It becomes important for the solutions architects to understand how different workloads like applications, data, and processes can be migrated to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.3">Cloud has an inherent quality of providing virtually infinitely scalable infrastructure, modern software runtimes, and a variety of services out of the box to transform workloads in the most effective way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.4">The cloud also provides enterprises with the right opportunity to migrate their ageing workloads to hardware platforms with superior computing power and storage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.5">Apart from the infrastructure, the cloud also provides the required tools that make the movement of applications to the cloud easier for organizations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.6">Right from the phase of making an inventory of applications for cloud migration and up to the phase of development and deployment on the cloud, each cloud provider has their own set of tools to make modernization engagements a very seamless one. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">The cloud also provides different models of computing, like SaaS and serverless computing, that break barriers of having to procure or provision the required infrastructure for applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.2">Cloud also accommodates with ease different styles of modernization approaches like rehosting, replatforming, or rearchitecting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.3">This gives greater flexibility to enterprises, and they can choose the option that best works for them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.4">The details of the cloud computing model and cloud architecture patterns are covered in detail in </span></span><span class="Italic"><a href="ch22.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Chapter 22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">, Cloud-native Architecture Design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">The following are the ways in which the cloud enables easier modernization of legacy applications, irrespective of the modernization strategy being chosen by the enterprise:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">Serverless computing models</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">: Multiple cloud providers offer serverless computing models in which the infrastructure and software runtime are the responsibility of the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.2">Developers just need to deploy their code and run their application on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.3">This offers an immense benefit to enterprises, especially the medium and smaller ones, to modernize their legacy workloads in the quickest and most efficient manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.4">AWS Lambda and Azure functions are some examples of serverless computing models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.5">The serverless computing model was discussed in detail in </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">, Technical Proficiency Essential Knowledge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="138" id="page138"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">SaaS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">: Software as a service enables direct consumption of the software application without having to worry about provisioning infrastructure or building applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.2">In this model, the infrastructure, application platform, and the application service are provided by the service provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.3">It enables a pay-as-you-use model for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.4">This model gives a great advantage for enterprises that quickly want to modernize their legacy workloads without having to worry about infrastructure, software installation, or application builds, and provides an opportunity to roll out their service to their customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.5">The data is owned by the enterprise, and this model is very useful for startups as well to roll out their minimum viable products in the quickest possible time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Infrastructure migration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">: Many of the enterprises move their legacy workloads to a suitable infrastructure on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.2">This gives them an advantage of cost efficiency and maintenance ease, and provides the first essential step to modernize their workloads in terms of software at a later point in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.3">Many of the cloud providers like AWS, Azure, and Google Cloud Platform offer a variety of hardware infrastructure that enterprises can choose from and get cost benefits from the differentiated pricing models offered by these cloud providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.4">For instance, a batch job running in a dedicated hardware on premise can be moved to spot instances on the cloud, thereby decreasing the total cost of ownership of the application to the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.5">Enterprises also get an advantage to switch hardware depending on the usage of the application at different points in time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">Cloud-native architectures</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">: Cloud-native architecture recommends that applications be divided into manageable chunks of software components called services (microservices), wherein the design is aligned more towards the business operations of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.2">These services are then containerized and deployed on container runtimes managed by a container orchestration engine like Kubernetes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.3">These services are independently deployable and can be easily scaled in or out depending on the performance and scalability requirements of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.4">Many of the enterprises are currently engaged in moving their legacy workloads to the cloud, adopting cloud-native architecture and design patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">Replatforming</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">: The cloud provides immense opportunities to move many of the legacy application components and services to equivalents on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.2">All the major cloud providers offer hundreds of services in a pay-as-you-go model that can be utilized out of the box with a minimum amount of configuration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.3">This offers a ready-to-use platform to enterprises to easily move their applications to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.4">Apart from the application related services, the cloud also provides integration services for the application to easily connect with their partner systems outside of the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">In this section, we looked at why the cloud is a preferred platform for modernizing legacy workloads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.2">However, many enterprises still have most of their core applications running on mainframe systems. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">In the next section, we will discuss the approaches for modernizing mainframe applications.</span></span></p>
<h2 class="head1" id="sc2_199"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Mainframe modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">Mainframes continue to be at the core of major enterprises across the globe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.2">Though there had not been any major operational and technical concerns with most of the workloads deployed and run on the mainframe ecosystem, mainframe modernization continues to be one of the most discussed topics in any technology forum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.3">Many of them have been discussing this journey for years.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">The following are the major reasons that enterprises are considering moving away from the mainframes:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">With modern-day enterprise applications being built on newer software platforms, agility in terms of integrating them with mainframe applications becomes a challenge, hampering innovation and future growth.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Refactor code to achieve better control and quality over the application to induce the required functional changes within the application easily.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Reduce the cost of maintenance of the mainframe hardware that is housed in enterprise data centres.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="139" id="page139"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Address the unavailability of skills to maintain the hardware and software platforms pertaining to mainframe applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Leverage new hardware, software platforms, and engineering practices to improve the time to market aspect of mainframe applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Improve the availability of applications by leveraging multiple regions and availability zones when such applications are deployed on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">Better options for disaster recovery and business continuity for workloads when deployed on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">Mainframe modernization requires more than technology skills to ensure the success of such modernization engagements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.2">It is not just a change of the mainframe platform to another equivalent on the cloud, but it requires a change in the IT culture of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.3">Enterprises have to understand and address challenges and risks to mainframe modernization and address these challenges in the flyway before these programs can be started. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">The following are some of the important challenges that enterprises face when modernizing their mainframe applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">It is an effort intensive and an expensive exercise to modernize mainframe applications, from organizing a discovery to rewriting the code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">Some cloud providers offer equivalent mainframe platforms for a lift and shift of those applications from the data centre. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.2">However, enterprises need to carefully weigh the options to modernize such applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">It requires a consensus among multiple business and technology stakeholders to start the modernization engagement of mainframe applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">It requires an expert team to lay down a roadmap of the phases and tasks and take them forward on the path to modernization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">In mainframe modernization, there are three different types of components to be modernized, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">Application logic written in </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">Common Business Oriented Language</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">COBOL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">Customer Information Control System</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">CICS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">) to an equivalent modern programming language.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">User interface developed with technologies like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">basic mapping support</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">BMS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">) in mainframes should be rewritten to a contemporary UI technology supplemented with client-side frameworks and libraries. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Moving data residing in DB2 and VSAM files to a relational database system like relational database service on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">As far as mainframe modernization is concerned, there are two different approaches that are being adopted by enterprises, namely, replatform and rearchitect.</span></span></p>
<h3 class="head2" id="sc3_200"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Replatform</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">Many of the enterprises are looking at options for quickly moving their mainframe workloads to a platform on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.2">This is a quicker option for the enterprise to retain their applications in their original form, but moving to a more distributed platform on the cloud, where they will get better agility at a reduced maintenance cost. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Million instructions per second </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">MIPS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">) is a measure of the performance of the mainframe hardware systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.2">With an application using hundreds of MIPS to process customer transactions, the licensing cost of the mainframe operating systems and the software platforms goes up substantially. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.3">Enterprises want to move such workloads to other platforms on the cloud where they can reduce the cost of hardware and software hosting the applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.4">Small and medium applications can easily make use of this option, and the risk of rewriting complex code gets greatly reduced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.5">This option of modernization helps enterprises to continue to maintain these applications with their existing workforce. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="140" id="page140"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">In the replatform option, the user interface and the business logic remain the same in the target platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.2">However, data residing on the mainframe database, such as DB2 or VSAM files, gets replatformed to a modern RDBMS platform like Oracle or PostgreSQL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.3">This could warrant a minimum amount of changes to the code base. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.4">This option gives a quick return on investment and reduces the overall cost of ownership at the same time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.5">Apart from replatforming the operating system and the database platform, the schedulers and tools of the legacy system will need a replacement in the target cloud platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.6">For instance, tools required for scheduling and monitoring jobs would need a replacement in the target platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.7">The platform for running batch jobs would also need to be replaced with an equivalent in the target.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">The following table gives an idea of how the current and replatformed target will look for the major components being modernized:</span></span></p>

<p class="caption-t"><span class="tablenum"><a id="tab7-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">Table 7.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">: Replatforming a mainframe application</span></p>
<h3 class="head2" id="sc3_201"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">Rewrite</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">In this approach, there is an overhaul of the mainframe application, optionally combined with its movement to the cloud or a new data centre on premises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.2">The application is rewritten using modern day software runtimes, including renewed user interfaces, business logic, data sources, and other systems of integration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">In the case of migration to the cloud, the mainframe application is rearchitected as a cloud-native application to fit into the cloud ecosystem, leveraging the capabilities of the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.2">The feature functionality of the mainframe applications written using COBOL and CICS is rewritten using the latest programming languages like Java or Python. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.3">The data sources used by the mainframe applications, like DB2 or VSAM, are migrated to cloud-native databases like Oracle or PostgreSQL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.4">User interfaces developed using BMS are technically rewritten using Angular or React JS JavaScript frameworks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">The legacy applications migrated to the cloud follow a cloud-native architecture in which the business logic is converted into microservices, with each service offering a specific business capability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.2">These microservices are then deployed as containers on the cloud with the application containers overseen by container orchestration engines like Kubernetes. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">The following table gives an overview of how the application landscape looks when the legacy application has been rewritten:</span></span></p>
			<table id="table008" class="No-Table-Style _idGenTablePara-2">
				<colgroup>
					<col class="_idGenTableRowColumn-36"/>
					<col class="_idGenTableRowColumn-32"/>
					<col class="_idGenTableRowColumn-37"/>
				</colgroup>
				<tbody>
					<tr class="No-Table-Style _idGenTableRowColumn-34">
						<td class="No-Table-Style CellOverride-4">
							<p class="tcen ParaOverride-26"><span class="CharOverride-16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">Component type</span></span></p>
						</td>

<p class="caption-t"><span class="tablenum"><a id="tab7-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">Table 7.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">: Rewriting mainframe applications</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">The applications that have been modernized on the cloud can continue to integrate with applications in the enterprise data centre and with other third-party systems as before. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.2">This rewrite approach brings with it a high availability of the services and products to its customers, with an improved performance of customer transactions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.3">The applications on the cloud communicate with the applications in the enterprise data centre </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="141" id="page141"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">through dedicated communication channels established between the cloud provider’s availability zone and the enterprise data centre. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.2">For example, for AWS, a Direct Connect link could be used for a secure, fast, and reliable connection between the enterprise data centre and the cloud platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.3">A</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">I</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1"> plays a very crucial role in rearchitecting solutions in terms of extracting business logic from the existing application code to generate the target state technology and design artefacts that accelerate the legacy modernization engagements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">In the next section, we will discuss more about how AI is playing the role of an accelerator with regard to the different activities being done as part of the modernization exercise.</span></span></p>
<h2 class="head1" id="sc2_202"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">Artificial intelligence in legacy modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">AI and ML are playing a key role in most of the phases of the green field software development lifecycle, and the area of legacy modernization is no exception. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.2">In modern day legacy modernization engagements, AI is used across multiple phases of the transformation program from identifying dependencies, business rules extraction from existing applications, analyzing and recommending modernization approaches, data migration, building and testing the modernized version, and reconciling the modernized version of functionality to that of the existing version. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.3">In case of applications with huge technical debt, they also help to analyze applications, identify technical debts, and recommend ways to clean them up and refactor them in a more modular way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.4">These applications can be taken up for hosting in a newer environment that has the required hardware and software platform upgrades.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig7-3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">Figure 7.3</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1"> depicts the tasks that can intelligently be automated with the use of AI:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1"><img src="images/Figure_7.3.png" alt="A diagram with six numbered sections describing IT tasks: Modernization Recommendations, Technical Debt Reduction, Dependency Analysis, Business Rules Extraction, Code Generation, and Data Migration, each with a brief description."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig7-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">Figure 7.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">: Artificial intelligence in legacy modernization</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">The following are the tasks in the modernization journey that can hugely benefit from the usage of AI:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">Modernization recommendations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">AI models can analyze hardware infrastructure and application platforms and recommend the appropriate strategy for modernization, like rehosting or rearchitecting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.2">They help to deep dive into each one of the approaches and provide a cost-benefit analysis of each one of the options. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.3">They can also provide valuable information and support decisions on the architecture and design approach to be adopted to make the application modernized.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">Technical debt identification and resolution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">: AI language models can analyze existing code, understand patterns, and identify areas of the application that are overly complex, never visited, and deeply nested. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.2">It can also make recommendations to refactor code, enabling the re-use of logic that is being used at multiple points within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">Analyze dependencies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">AI models can be used to analyze dependencies between components in complex applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.2">This is especially useful in scenarios where there is no proper documentation of the existing application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.3">Apart from identifying relationships between components, AI-powered code analyzers can pinpoint integrations with external systems and the places in the code where it is used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.4">They can also identify internal dependencies to database systems and message queues, and unearth the </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="142" id="page142"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">integration touch points like APIs and service calls. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.2">AI models can also be used for What-If analysis to understand the impact on the application while changing a particular portion of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">Business rules extraction</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">: In case of applications written in languages whose skills are in demand, the language models can parse the code and extract business rules within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.2">This can be a good starting point for the team to understand the business logic and create the requirements specification that can be used to build the modernized system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">Code conversion</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">: Models, when fed with the existing application code, can help to convert legacy into modern day programming languages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.2">For instance, COBOL programs written decades ago with no subject matter expertise available within the enterprise can be fed to models, and the model can convert them into the required modern-day targets like Python or Java.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Data migration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">: AI assistants can help cleanse the data by identifying inconsistencies and dependencies of huge databases before migration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.2">It can help in the deduplication of data within databases and help sanitize huge datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.3">They also help in creating schema design if they are fed with datasets along with metadata information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.4">AI models can assist in mapping source to target data models and help simplification of the target schema. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.5">In microservices, AI models can assist in coming up with a schema for individual microservices if they are given domain specific and business capability related information about the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">Having discussed the role of artificial intelligence in the transformation of legacy to modern architectures and design, we will now discuss a roadmap that enterprises can adopt and use as a reference for the execution of legacy modernization programs. </span></span></p>
<h2 class="head1" id="sc2_203"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">Roadmap to legacy modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">The path to modernizing legacy applications needs to be carefully planned and executed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.2">The discussion includes multiple stakeholders in the business and technology organization of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.3">It is one of the decisions that requires a strong business case and stakeholder consensus because the application has been in operation in a different older avatar till then and is getting replaced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.4">Legacy modernization requires a careful analysis of the application landscape, and an informed choice needs to be made between what is necessary versus what can be deferred. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.5">Benefits and return on investments need to be discussed, documented, socialized, and approved before embarking on the journey of legacy modernization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">The following figure depicts the steps in the roadmap to modernization in an enterprise:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1"><img src="images/Figure_7.4.png" alt="A flowchart titled Legacy Modernization Roadmap shows seven steps, each with sub-steps: Stakeholder Communication, Build Business Case, Analyze Application Landscape, Organize Discovery, Configure Process &amp; Controls, Build &amp; Test, and Measure ROI."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig7-4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Figure 7.4</span></span><span class="Figure-Caption--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">: Legacy modernization roadmap</span></span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">The following are the key steps that need to be addressed in the journey of legacy modernization:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">Stakeholder communication</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">: All the stakeholders need to be identified and informed of the pain points in the existing application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.2">This needs to be documented and socialized with leaders in the business and the technology hierarchy of the enterprise. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">Build a consensus</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">: There needs to be consensus among the stakeholders involved in this journey of modernization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.2">It is important to hold workshops with all the groups and associates that will be part of the journey and apprise them of the need to embark on this journey to overhaul the existing </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="143" id="page143"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.2">This helps to get everyone to understand the need for the engagement and garner support from the required parties within the enterprise. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Build the business case</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">: The reasons for the modernization of the application need to be clearly understood and documented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.2">The reasons could be an ageing technology, higher cost of maintenance, or the inflexibility of the application to introduce new changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.3">This business case will form the basis for getting the required funding and for getting this software engagement moving forward.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">Prepare a roadmap</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">: Create a roadmap that will guide the process of modernization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.2">Based on the inventory prepared, prioritize different application components based on their complexity and business criticality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.3">The roadmap should contain the sequence of high-level activities to be performed to embark on and successfully complete the modernization exercise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">Analyze existing application landscape</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">: Create an inventory of application components and it is dependencies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.2">Make a list of hardware infrastructure (server types), software platforms, and application components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.3">Get information related to each one of these from existing documentation, application code, and database schema. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.4">These are the candidates to start a discovery phase before the actual process of modernization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">Finalize the type of modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Based on the nature of the application, its complexity, and criticality, decide on the type of modernization strategy. </span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">If the hosted application platform is nearing the end of support, a replatform strategy could be a suitable option to migrate the application to the latest version of the software platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.2">For example, a .NET application hosted on .NET framework version nearing end of support could be ported to .NET core latest version. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">Organize a discovery phase</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">: This is one of the most important phases in the modernization journey. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.2">Based on the information available, like functional documentation, database schema, and application code, prepare the required functional specification for the new system and the technical design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.3">Adopt a well-structured methodology to perform business decomposition of the existing application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.4">For instance, if the enterprises decide to move from a monolith to microservices, DDD could be a good approach to be adopted. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.5">You can also use this phase to reengineer some of the business processes and optimize them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.6">This is an optional step, but it presents a good opportunity to optimize existing business processes.</span></span><span class="CharOverride-2"> </span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">Finalize architecture and technology</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">: Blueprint the target architecture with all the dependencies and integrations explicitly called out. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.2">Finalize the versions of the software and the libraries intended for use by the target platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.3">Discuss with business and technology stakeholders and finalize the nonfunctional requirements that the modernized application needs to address. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.4">List the required design patterns to be used in the target and make the technology choices that will be used for the different capabilities required for the modernized application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.5">For example, an existing web application can be modernized as containers and deployed on a Docker runtime.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">Governance framework</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">: Create a governance framework for the modernization of engagements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.2">The framework created should contain industry standard best practices, guidelines for modernization, and should align itself with the enterprise architecture governance framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.3">Based on the framework, configure checkpoints to measure the outcome of each stage of the roadmap by validating the deliverables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.4">For example, ensure there is an API governance process in place to validate the APIs created as part of the modernization journey. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.5">Choose the required tools that will help both ease migration to the target and validate the individual components of the migrated application. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">Build and test</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">: Construct the application with the choice of technology finalized for each of the layers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.2">Adopt modern engineering principles like DevOps that could help in the early detection of issues before moving the application to the user acceptance test. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.3">Create a test strategy not only for testing application feature functionality but for other qualities of service like performance, security, and usability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.4">Create a test strategy to compare the results of the modernized application with those of the old application to ensure that there are no gaps in the design and logic of the modernized version. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.5">Create a deployment strategy to perform a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">friendly user test </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">FUT</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">) before the new application is opened up to a larger user base for consumption.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="144" id="page144"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">Measure return on investment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">Measure the return on investment of the modernization effort by creating reports with data that reflects the level of customer satisfaction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.2">Also, measure the amount of money being spent on the modernized application and the number of tickets being raised by customers every week. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.3">At the enterprise level, measure ROI by analyzing customer retention percentage as well as newer customer registrations for the modernized application compared to those of the past periods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.4">Measure the ease of deployment of the modernized application to newer geographies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.5">Conduct a customer satisfaction survey to understand the customer satisfaction levels with regard to the overall quality of service of the newer application version.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">Having discussed the roadmap for a legacy modernization program, let us now discuss a checklist that can be used by solutions architects to have checkpoints to ensure a smooth sailing in the journey of legacy modernization.</span></span></p>
<h2 class="head1" id="sc2_204"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">Checklist for legacy modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">The following is the easy-to-use checklist for solutions architects and developers embarking on the journey of modernizing their existing IT applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">The business drivers have been identified and documented for the legacy modernization engagement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">All the business and technology stakeholders have been identified and notified of the decision to modernize the legacy platform. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">The business case has been prepared and socialized with identified stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">The business case for the legacy modernization program has been approved, and the budget has been allocated.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">Different options of legacy modernization have been evaluated, and an appropriate one chosen.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">A legacy modernization governance framework is in place (aligned to the enterprise architecture governance framework).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">A roadmap to modernize the legacy applications had been drawn and reviewed with the required stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">A consensus has arrived with different teams, and buy-in has been received for the modernization journey.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">All applications have been prioritized based on complexity and business criticality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">Applications of medium complexity, minimum business impact, and a good modernization cost benefit have been chosen for the modernization program (For enterprises embarking on a modernization journey).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">The legacy modernization option (rehost, rearchitect, or rewrite) has been chosen after a due diligence of the existing application platform and its dependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">The target architecture has been blueprinted and approved by technology stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">Appropriate technology choices have been finalized for different components of the application, like user interface, business logic, and databases.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">Equivalent tools for monitoring and scheduling are finalized in the target based on the requirements of the application being modernized.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">A plan has been drawn, socialized, and approved for the modernization project of the legacy application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">The business processes are optimized for efficiency in case the legacy system is being rewritten.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">The application is built and tested based on the plan and SLAs agreed upon.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">Features and capabilities between the source and the target platforms are compared, and necessary changes are made to the system to become compatible with the target platform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="145" id="page145"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">The modernized system is tested for functionality and results compared with the legacy system for functional accuracy.</span></span></p>
