<header>
<h1 class="chaplabel" id="ch07"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="127" id="page127"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 7</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Legacy Modernization and Migration Strategies</span></span></h1>
</header>
<h2 class="head1" id="sc2_184"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Software systems are built and maintained by enterprises to give their customers a compelling user experience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">It is not only about a fancy application user interface but also more about introducing new product and service offerings to their customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">It is also to be noted that the user expectations from business houses in terms of new feature offerings only keep growing forever. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Having said this, software systems built must be nimble for enterprises to roll out new service offerings to their customers on a regular basis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">However, applications that are developed to serve hundreds of thousands of users slowly lose their sheen not only from a functionality perspective but also from a usability perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.6">Users acquire new digital habits for the consumption of products and features offered by enterprises through their online channels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.7">Moreover, the applications built by enterprises with the intent of realizing their business goals currently may no longer be their trusted envoy as the business horizon expands and the customer base increases. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Enterprises put their customers first and ensure that their content and delivery are more aligned with users’ needs and their channels of delivery are at par with the current standards of the industry. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">It becomes inevitable for enterprises to keep their software systems up to date to ensure that their products and service delivery continue to delight their customers, and that they are not left behind their competitors in their area of operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Apart from the customers’ changing needs and the company’s ever-changing appetite for expansion and growth, the hardware and software platforms hosting the application also evolves and we reach a point wherein the hardware and software are not able to put up with the changed demands of the customer and the enterprise and hence needs to be replaced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">Legacy modernization is one area that is being discussed and pursued with a lot of rigor by modern day enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">Enterprises set aside millions of dollars in their budget for this very important exercise of future proofing their software systems and their business operations.</span></span></p>
<h2 class="head1" id="sc2_185"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Software application dynamics</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Role of a solutions architect in legacy modernization</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Challenges to legacy modernization</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="128" id="page128"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Drivers for legacy modernization</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Legacy modernization to cloud</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Mainframe modernization</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Artificial intelligence in legacy modernization</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Roadmap to legacy modernization</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Checklist for legacy modernization</span></span></p>
<h2 class="head1" id="sc2_186"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Software application dynamics</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Software applications are built to last for a long period of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Gaps between the enterprise business goals and the existing business processes trigger the setting aside of budgets for the development of new software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">Requirements are gathered, analyzed, and refined iteratively before developing software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">However, the business ecosystem continues to change with regard to the business goals being revisited and enhanced every quarter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.5">The quality-of-service expectations from software systems, such as performance, usability, and security, also continue to change due to changing user needs and regulatory compliance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.6">For instance, feature functionality that used to be a major driver a decade ago is only one of the main aspects of a software application now. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.7">Software application feature functionality among competitors has become table stakes now, with all leading business houses providing the same features and capabilities to users in their domain of expertise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.8">For instance, if you want to get a quote for an insurance policy online, almost all the leading insurance companies provide features to generate a quote online. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.9">However, the current generation of software users is looking for something beyond application functionality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.10">Users look for qualities of service like usability, performance, security, and reliability of the application before they choose a service provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.11">The continuous and combined effects of the functional changes along with upgrades for the nonfunctional aspects over time have a side effect of taking the application to a state where the application loses its nimbleness and the important quality of being fit for purpose. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.12">Fit for purpose lets a software application serve its users or customers without any friction in terms of functionality and other qualities of service.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Gartner defines a legacy application as an information system that may be based on outdated technologies but is critical for day-to-day operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">Enterprises spend millions of dollars to maintain these critical applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">However, maintaining these applications to keep them usable and fit for purpose for their customers becomes difficult both in terms of effort and cost, and a tipping point is reached wherein enterprises decide to rewrite or redevelop the application into a more modern avatar. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.4">Most enterprises go for a green field (from scratch) development to make use of the advancements in terms of hardware and software infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.5">This also provides them with an opportunity to architect and design the application to ensure that it imbibes the required qualities of service, along with the option of optimizing their existing business processes and introducing new feature functionality as part of the redeveloped application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Having seen what the legacy is and the need to modernize such platforms, let us see what the challenges are that come in the way of modernization efforts.</span></span></p>
<h2 class="head1" id="sc2_187"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Role of a solutions architect in legacy modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">With legacy modernization programs becoming more prevalent in both large and small enterprises, it is imperative for solutions architects to be aware of the proven strategies that are adopted industry wide for modernizing legacy workloads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Solutions architects are expected to recommend an appropriate modernization strategy, knowing well the structure of the organization they work for and the application landscape that the enterprise is planning to modernize. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">The solutions architects should also play a key role in anticipating risks involved in executing such programs and should set up necessary guardrails to mitigate the risks, just in case they happen. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">The solutions architect also plays a key role in building a business case and socializing it with all stakeholders, including senior management, to procure the required budget for such programs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="129" id="page129"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Apart from recommending the appropriate modernization strategy and mitigating risks, the solutions architect should take the lead in the discovery phase of such engagements, wherein the requirements from the existing legacy application are culled out and refined. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">The architect should be aware of the different tools available to extract logic from applications that may be bereft of any functional specification documentation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">The solutions architects also play a key role in the design of the new system based on the modernization strategy adopted and the new requirements frozen for the modernized version of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">The solutions architect plays an important role in the finalization of the architecture for the application to be modernized and the design required to realize the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">The architect suggests various accelerators, including AI-powered tools, to speed up the build and test phases of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Finally, the architect is also responsible for coming up with the important KPIs, in consultation with the business and technology stakeholders, to measure the success of this modernization engagement and ensure a positive ROI</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">to the enterprise carrying out such engagements.</span></span></p>
<h2 class="head1" id="sc2_188"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Challenges to legacy modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Though modernization of applications comes with its own benefits, it also has its own challenges that need to be addressed while embarking on this journey or during the journey. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">If these challenges are not overcome, there is a good chance that the effort may get derailed midway after having spent a considerable amount of money. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">It is in the best interest of the enterprise to identify all challenges upfront and address them to complete the migration of an application from legacy platforms to the current-day modern platforms.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">The following are the challenges that a solutions architect needs to be aware of and address when attempting to migrate legacy applications to modern day technical platforms:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Functional complexity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">: Most of the applications that fall into the modernization bucket were developed at least a decade ago or even more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">In many of these applications, there is no detailed documentation of the functionality, and due to the dynamic nature of the software industry, it is very likely that only a few people, or even fewer, know the overall functionality of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">Some of the application components could be overly complex with integrations into systems outside of the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Application criticality</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">: Applications could be mission critical for the overall running of the business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">Hence, it becomes a very difficult decision to start the modernization exercise of these kinds of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.3">The feasible way is to form a team of engineers and business analysts who go through the code and document the functionality of the application to the fullest, and get it vetted by the functional experts of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.4">Any modernization exercise can only begin after this exercise is completed in a foolproof manner.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Interdependencies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">: The application to be migrated might have dependencies on other systems within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">So, an upgrade to the current application might be difficult if the other systems still use older technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.3">Though the current application can be overhauled or technically refreshed, all the integration points with the application will continue to use the older versions of the libraries to communicate with the dependent system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.4">Analysis of these dependencies and making an inventory of applications that need to be upgraded, and the sequence also becomes equally important.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Software size</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">: Some of the applications could be massive in terms of the number of components they comprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">All these components could be tightly coupled with each other, which makes it difficult to adopt a phased approach to modernization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.3">This kind of an application requires a lot of analysis and design before such applications are modernized to newer technology platforms. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Cost and budget</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">: Many of the enterprises may not have the required budget to modernize their applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">In medium and smaller enterprises, especially, they may be spending money to change the enterprise initiatives to grow the business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.3">Depending on the nature of the application, with </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">software as a service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">SaaS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">) models becoming prevalent, it becomes a lot easier for enterprises to move to such models instead of spending a lot of money to rebuild such applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">However, the </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="130" id="page130"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">recommendations for a modernization strategy have to be arrived at after performing a careful cost-benefit analysis.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Having discussed the challenges on the way to application modernization and how to overcome them, we will now look at the drivers for legacy modernization, which help IT and business stakeholders to build business cases and procure funding from their senior leadership.</span></span></p>
<h2 class="head1" id="sc2_189"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Drivers for legacy modernization</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Software system continues to depreciate over a period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">All applications, even those that are well maintained, will continue to depreciate because of continuous changes being made to both the codebase and the infrastructure platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">The other major reason is the change in business priorities and goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.4">Specific business goals that were the drivers for a software system could change in a couple of years, and hence warrant a change to the application that could take a mammoth effort. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">The drivers for legacy modernization are summarized in </span></span><span class="Italic"><a href="#fig7-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Figure 7.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> for quick reference:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="images/Figure_7.1.png" alt="A hexagonal diagram with Technology Evolution at the center, surrounded by six hexagons labeled: Business Goals, Skills Unavailability, Maintenance Cost Reduction, Improve Quality of Services, Reduce Technical Debt, Flexibility for Change."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig7-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Figure 7.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">: Drivers for modernization</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">The following are the major reasons that lead enterprises to modernize their legacy applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Shifted business goals</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">: All enterprises operate to make profits and want to continuously grow year by year. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.2">Each enterprise has its business architecture, representing the set of underlying business processes driving its products and services rolled out to its customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.3">These products and services are offered to their customers in the form of software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.4">These underlying business processes need to undergo a change when the business goals change, and new business targets are set. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.5">As a result of this, the underlying software applications supporting these processes are also required to undergo changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.6">When business processes, which are the underpinning for any business, are getting overhauled, the applications that encompass the business logic (process) become outdated and warrant redevelopment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Skill unavailability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">: In the software space, hardware and software platforms undergo very rapid change. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">Programming languages and software frameworks used to build software systems also continue to change, with more feature rich, easy to understand, and modern languages quickly being adopted by developers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">When enterprises start adopting a few of these languages or frameworks, there is a shift in the learning pattern among developers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.4">Most of the development community starts </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="131" id="page131"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">to focus on a few of these newer languages and frameworks due to the demand for them, and the availability of skills for the older ones goes dwindling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">For instance, when Spring Boot was introduced, it became a very popular replacement for </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Enterprise JavaBeans </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">EJB</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">) based applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.2">Though new applications continue to be developed using Spring Boot in a RESTful way, there are requirements to maintain applications using EJB. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.3">However, the supply of skills for such technologies has become far and few.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Technology evolution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">: Software platforms on which the application is hosted also continue to evolve, and there comes a point where the application either becomes too effort-intensive to maintain on the hosted platform or the application does not lend itself to newer versions of the hardware and software platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">There are also newer technical paradigms or programming models whose development benefits far outweigh the existing application platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">For instance, Docker changed the way applications are developed and deployed as containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.4">If the application is a monolith with tightly coupled components, modernization becomes imperative to redevelop the application as microservices and deploy them as containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.5">The other reason is the vendor of the software platform deciding against making any further updates to the software platform or announcing the end of vendor support for the platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.6">These situations trigger the modernization effort of such an application within the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Flexibility of change</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Applications are built to give the flexibility to add more functionality over a period after they move into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">Most of the applications do lend themselves to such an effort, but what happens is that, due to the constant changes made, the applications lose their nimbleness to support the addition of newer components to the overall unit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">Solutions architects and developers technically bend these applications to introduce newer components to support the required functionality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.4">However, after a period, the application starts to become frAgile and introduces brittleness in the components, which results in instability of the system in production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Accrued technical debt</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">All applications over a period continue to accrue technical debt. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">Technical debt gets introduced because of the code or design changes made to applications, either as quick fixes or to deliver a feature quickly within a timeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.3">Though these kinds of changes help to meet the deadlines for the team, many a time, they may be against the accepted patterns and principles of design and coding. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.4">These kinds of issues continue to accumulate in the code, and they increase the cost of testing and maintenance in the long term. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.5">Technical debts could also arise from incomplete or a lack of understanding of functional requirements when the team started developing the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Cost of maintenance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">: As the application continues to accrue technical debt and becomes inflexible for change, it becomes difficult and expensive to maintain such applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">Due to the code complexities introduced over a period, the application might become unstable and might start to show up as unpredictable functional errors or issues in the agreed service levels for other attributes like performance and security. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">The enterprise continues to stack up its support team and needs to spend money to perform an excessive amount of testing, even for small changes introduced in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.4">In the longer run, it becomes untenable to add changes to the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Quality of services</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">: Expectations over the application qualities</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">of service continue to increase over a period after the application goes into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">There could be new security threats which might require a major upgrade to the application or the hosted platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.3">New laws could be enacted, forcing the application to become legally compliant with a host of changes made throughout the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.4">This continuous swarm of changes made to the application might introduce side effects affecting important qualities of service like performance and reliability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.5">For instance, new business rules introduced to make the application legally compliant might introduce a performance lag, which becomes difficult to address with the current architecture and design of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.6">Apart from this, the user interface world also changes at a rapid pace, which needs to be adopted by applications, failing to do so may leave them behind their competitors in terms of providing a compelling user experience.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="132" id="page132"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Having discussed the drivers of legacy modernization, we will now discuss different strategies that are available for enterprises to modernize their legacy workloads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">These strategies adopted depend on factors like the amount of money the enterprise is willing to spend, the skill availability of the enterprise for such programs, and, more importantly, the timeline they are looking for to complete the modernization of business-critical applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Modernizing legacy applications consumes time and effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">Not all the applications warrant the same type of transformation, and the approach adopted should be in alignment with the business goals of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.3">Few applications would just require movement to a modern-day hardware platform, whereas others might require a total rewrite of the application being modernized.</span></span></p>
<h3 class="head2" id="sc3_190"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Legacy modernization strategies</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">In this section, we will look at the different strategies that enterprises adopt to modernize their legacy workloads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">These strategies largely depend on the business goals of the enterprise, budget, and timelines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">More importantly, customer experience takes center stage, and the enterprises embark on modernization journeys to make their application fit for purpose and provide their users with a compelling user experience. </span></span><span class="Italic"><a href="#fig7-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Figure 7.2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"> depicts a summary of the different modernization strategies adopted by modern day enterprises:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"><img src="images/Figure_7.2.png" alt="A diagram lists six cloud migration strategies: Rehost, Replatform, Rearchitect, Refactor, Replace, and Rewrite, each with brief descriptions, grouped under the heading Modernization Strategy."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig7-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">Figure 7.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">: Legacy modernization options</span></p>
</figcaption>
</figure>
<h4 class="head3" id="sc4_191"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Rehost</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Rehosting is also known as lift and shift. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">In this option, the application is redeployed to newer infrastructure, either on premises or on the cloud, without any changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.3">This is the simplest of the modernization options available to an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.4">This can be done to launch services on a larger scale with a scaled-out infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.5">This option also helps enable an enterprise to introduce improved services to customers within a short timeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.6">A very quick and easy migration to the newer infrastructure is the advantage of rehosting.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">This option works best for enterprises that want to move their workloads to the cloud to benefit from the cost model of pay-as-you-go. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">The time, effort, and cost in this option are minimal to the enterprise, and there is also no business impact to the enterprise while rehosting applications to a newer environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.3">Enterprises embarking on a cloud journey choose this option to try out the cloud infrastructure and the associated cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.4">However, lift and shift is the easier option for the applications that do not have a lot of dependencies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.5">If the application has a lot of moving parts, it takes a lot of effort for validation to ensure that all the parts rehosted work in harmony. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.6">Rehosting may not be the right option and will not yield any results if the application already has a lot of technical debt. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.7">In such cases, it makes a lot of sense to refactor or rearchitect the application to get any visible benefits of the modernization exercise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="133" id="page133"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">The following are the major benefits of the lift and shift option:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">The lift and shift option helps to scale the infrastructure for the application being modernized.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">This option can also be used to enhance the security posture of the application being migrated to a newer environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">This is a good starting point for the enterprises that are embarking on a cloud journey.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">This also helps to save cost in terms of hardware licenses for enterprises while lifting and shifting their workloads to the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Rehosting to a cloud provider could provide better capability for backup of the application and application data.</span></span></p>
<h4 class="head3" id="sc4_192"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Replatform</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Replatform is another key strategy to move applications to enable them to make use of newer versions of the operating systems, software runtimes, and powerful compute engines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">This is a slightly expensive and more effort-consuming strategy than its rehosting counterpart. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.3">Replatforming can be done for both applications and databases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.4">For applications, this option may require changes to the underlying application code for it to be replatformed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.5">When an application is moving to a newer platform, the dependencies of the applications in terms of the different libraries they use might pose version-related challenges, and they may have to be refreshed to their latest versions before the application is deployed successfully on the newer platform run time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.6">For example, a Java application using JDK 11 could be upgraded to Java 17, but there could be multiple libraries in the application, like parsers and utilities, that may not be compatible with Java 17. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.7">The versions of those libraries may have to change to a compatible version, and the application code might have to undergo changes. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">For databases, it is about moving the schema and the data to a newer database platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">This is typically done to optimize cost, make use of certain out of the box features like parallelism in query execution, and benefit from better backup options. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">However, data migration in the replatform option could pose significant challenges in terms of the schema changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.4">The data types between the legacy source and the target platform should be mapped, and discrepancies in terms of their compatibility must be addressed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.5">This can be done by using modern day schema migration tools that help to overcome such challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.6">Another area that needs attention in replatforming databases is the difference in query syntaxes that may have to be resolved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.7">For instance, DB2 and Oracle databases use different query syntaxes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.8">Many legacy applications still do not use </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Object Relational Mapping </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">ORM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">) frameworks like Hibernate and have their SQL queries embedded in the application code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">SQL queries embedded in the application code must also be changed to be compatible with the newer target platform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">When applications are replatformed to the cloud, other than the application code and database changes, there could be other components like batch jobs and integration layers that might also have to be replatformed, and these could have been written using proprietary software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">There are chances that these may not be readily supported in the newer platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.3">The enterprise may decide to rearchitect or rewrite these incompatible components alone. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.4">In such situations, it needs to be taken care that they are rewritten in a platform-agnostic way so as not to be tied to a particular cloud provider.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">The following are the advantages of the replatform strategy in the modernization of legacy applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">The application gets upgraded to the newer operating systems and runtime platforms, making it efficient to use modern day hardware platforms.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">The application also gets migrated to more powerful hardware platforms, which results in better efficiency of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">It provides cost benefits in terms of maintenance of hardware and software platforms, as these are taken care of by the cloud provider in case applications are replatformed to the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="134" id="page134"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Replatforming will improve the security posture of the application, making it compliant with newer regulations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">It improves the quality of services like performance and scalability of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Databases can make use of parallelism that improves query execution time, making the overall application performant, thereby improving the overall user experience.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Improves the stability of the application because of improved hardware and software platforms, thereby reducing unplanned downtimes of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">It provides improved backup and restore options than when the application was deployed on a proprietary legacy platform.</span></span></p>
<h4 class="head3" id="sc4_193"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Rearchitect</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Rearchitecture is a modernization strategy in which the architecture of the application is modified to take complete advantage of modern-day software architectural patterns and design principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">This option is considered by enterprises if their current business critical application is not fit for purpose to meet the increased expectations of both the enterprise management and its customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.3">Another major reason for rearchitecting an application is its high maintenance cost in production and the challenges related to the continued enhancement of the application with evolving business requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.4">With the increasing demand for the quality of services to be on par with its competitors in terms of performance and reliability, this option becomes the right fit to address the required quality of services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.5">Regulatory compliance and security are the next major reasons for enterprises to adopt this option. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.6">To improve the security posture and to comply with the laws of the land, it might be infeasible and expensive to redevelop the whole application, and may increase the total cost of ownership.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">The rearchitect option provides an opportunity to make use of state-of-the-art hardware and software platforms and make the application distributed for ease of development and management postproduction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">The strategy helps enterprises to align their IT systems with their contemporary business goals and accelerates the expansion of their business across multiple regions where they want to establish themselves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.3">Many of the enterprises adopt this approach to reduce the time to market their products and services and make them available to their customers and their internal staff in a timely and usable way. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">When the application is rearchitect for the cloud, the enterprise can make use of the out of the box services of the cloud and readily benefit from the scalability and the automation available to expand and shrink the infrastructure as required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.2">Computing power, software run times, databases, and integration services like queues can be configured very easily with hardware infrastructure, and the configuration predominantly rests with the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.3">The enterprise can focus its energy on building the required business services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.4">For the architecture, the applications can be rearchitected to make use of the cloud-native architectural patterns like microservices, which provide independent deployability of services and can easily be managed and monitored with contemporary container orchestration tools like Kubernetes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.5">Cloud-native architecture is discussed in detail in </span></span><span class="Italic"><a href="ch22.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Chapter 22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">, Cloud-native Architecture Design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">The following are the advantages of an enterprise adopting the rearchitect strategy:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Applications can make use of modern-day architectures like microservices (containerization), </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">, and design principles like SOLID and 12-factor design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Alignment of the IT systems with the changing business goals of the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Leverage automation for repetitive tasks like the provision of hardware, the configuration of software platforms, etc. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Scale the system in or out based on the changing demands of the business thereby optimizing hardware and reducing the overall cost of ownership.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Leverage modern day technologies like AI and ML to proactively monitor applications for failure and take appropriate actions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="135" id="page135"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Leverage modern day management systems for container orchestration for efficient management of software platforms and available resources.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Postproduction management in terms of fault isolation and management becomes easier with modularity being adopted for application architectures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Having seen the option to rearchitect a legacy application, we will now move on to look at the strategy and the benefits of refactoring an existing legacy software system.</span></span></p>
<h4 class="head3" id="sc4_194"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Refactor</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Refactoring an application involves modification of application code to make it more modular. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">This option retains the existing functionality of the application and the hardware and software platform on which the current application resides. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.3">This option is chosen by enterprises to make the codebase more flexible for changes to future enhancements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.4">This also includes cleanup of the codebase to remove dead or unreachable code, which reduces technical debt and the size of the application to make it accommodating for maintenance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.5">Refactoring of the application also helps to simplify complex pathways in the code and makes it flexible for changes to the application in the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.6">During the refactoring exercise, developers also identify similar logic across the application and componentize those pieces of code logic so that it can be reused at multiple places within the application, as required. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">The following are the advantages of the refactor option when applied to an application that is fit for purpose:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Makes the application modular, thereby making it easier for maintenance and reducing cost.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Improves the overall quality of the application by making it more performant and scalable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">Improves the reusability of the code logic that is used at multiple places within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">The complexity of the application gets addressed, thereby making it more amenable to accommodate future changes to the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Technical debt is greatly reduced, thereby increasing maintainability of the application.</span></span></p>
<h4 class="head3" id="sc4_195"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Rebuild</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Rebuilding a legacy application involves rewriting the application completely from scratch with renewed requirements as per the current needs of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">In this approach, the project team can draw a plan to incrementally rebuild parts of the application with both the older and the newer application coexisting before the entire suite of the older components is rebuilt using the newer architecture and technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.3">This helps to have more control over the schedule and execute a plan in which the components can be prioritized and rebuilt based on the business criticality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.4">This option gives the enterprise an opportunity to adopt modern day architectural and design patterns along with the choice of technology for each of the different layers of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.5">Alongside this, this option gives the opportunity to introduce industry standard engineering principles like DevOps, containerization, and observability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.6">In addition to an architectural and technology refresh, the organization can also optimize its business processes and can greatly improve customer delight with their product and services offered.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">The following are the advantages of the rebuild option when applied to an application that is not fit for purpose:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Opportunity to re-engineer business processes within the enterprise for an optimized product and service experience to its customers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">Adopt state of the art technology to rebuild the modernized applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Helps to future proof applications to become scalable and performant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Leverage technologies like AI and ML</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">as part of application feature functionality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Adopt modern day user experience design principles to improve the usability of the application thereby improving customer's delight.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="136" id="page136"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Improved time to market by adopting modern day engineering practices for build, test, and deployment.</span></span></p>
<h4 class="head3" id="sc4_196"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Replace</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">In the replace option of legacy modernization, the software application is replaced with a commercial off the shelf solution or a solution offered on the cloud in SaaS model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">This is different from the rebuild option, in which the software application is redeveloped mostly in-house with renewed requirements that are aligned with the business and customer expectations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">In a replace strategy, different choices of platforms offering the required capabilities are evaluated, and the product to use is finally decided. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">The evaluation also takes into account the types of integration required with other systems in the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.3">In many cases, the chosen product would require customization to fit the requirements of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.4">This customization is undertaken by the product vendors themselves, or the enterprise can employ a service integrator to customize the product to fit the requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.5">This option helps the enterprise to quickly move to a more modern platform and retire the legacy application at the earliest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.6">However, the enterprise should be very prudent in analyzing the features of the product and the amount of customization to be done before choosing the product for implementation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.7">There are scenarios in which the product may have to be customized a lot to satisfy very specific requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.8">Cost is another factor that plays a major role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.9">Some of the product vendors have a plug and play model wherein the enterprise can choose only the components that are required for them and pay the license cost only for those components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.10">Other product vendors might charge the enterprise the full license cost of the product, irrespective of the features used by the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">The following are the advantages of the replace strategy for modernizing legacy applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">It is easier to replace the application with a commercial off the shelf application than to rebuild the entire application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">In a component licensing model, the enterprise pays only for the features that it uses rather than paying for the entire product.</span></span></p>
