			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">The modernized system is tested for qualities of service like performance, security, and reliability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">Modernized system is moved to production with suitable observability tools configured for continuous monitoring and improvement of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">The ROI of the modernization program is measured using KPIs like customer retention percentage, new customer registrations, reduction in application downtimes, improved performance, and security postures.</span></span></p>
<h2 class="head1" id="sc2_205"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">In this chapter, we looked at different aspects of legacy application modernization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.2">Legacy modernization is one of the areas that a lot of enterprises are paying attention to and are spending millions of dollars. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.3">It is important for solutions architects and developers to understand the legacy modernization strategies that are commonly used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.4">They also need to be conversant with how AI can play a key role in the modernization of applications in the current day world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.5">They also need to be aware of the benefits of moving enterprise workloads to the cloud using </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">cloud-native</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1"> architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.2">The knowledge of these areas helps the solutions architect to add value to the enterprise along the way of their growth journey.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">In the next chapter, we will discuss the topic of DevOps, one of the important ingredients to developing modern-day software applications for enterprises.</span></span></p>
<h2 class="head1" id="sc2_206"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">Legacy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">Learn what a legacy application is and why enterprises are spending millions of dollars in transforming legacy applications to modern day technology platforms, both on premise and the cloud. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">Challenges to legacy modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">Learn about the different challenges that dampen the modernization of legacy applications to modern day architectures and technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.2">Learn how business complexity, software size, cost, and budget pose different challenges to the modernization exercise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">Drivers to legacy modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">Learn the different drivers that speed up legacy modernization programs in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.2">Learn how shifting business goals, skills unavailability, and the evolution of technology play an important role in promoting the acceleration of modernization engagements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">Legacy modernization strategies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">Learn different strategies like rehost, replatform, rearchitect, refactor, replace, and rebuild for modernizing legacy applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.2">Learn the applicability of each of these strategies and the challenges with each of these options. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.3">Learn the advantages of each one of these options, as well.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">Legacy modernization to the cloud</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">: Understand the different strategies like cloud-native architectures, SaaS model, serverless computing, and cloud platform services that enable modernization of legacy applications on the cloud. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">Mainframe modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">: Understand the challenges in the modernization of mainframe systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.2">Learn about the replatform and the rewrite options available for modernizing mainframe applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.3">Learn the different types of components that need to be migrated to a modern platform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">Road map to legacy modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">Learn how to systematically approach and execute a legacy modernization engagement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.2">Learn the importance of organizing a discovery phase when choosing the modernization strategy, depending on the workloads to be modernized.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">AI in legacy modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">Understand how AI  is disrupting the legacy modernization space from extracting business rules from existing applications to generating design artefacts and code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.2">They also aid in creating the required artefacts for testing and deployment. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="146" id="page146"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">Checklist for modernization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">: Use a checklist to make sure that there are no gaps in ensuring a smooth legacy modernization journey. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.2">Solutions architects can use checkpoints to conduct reviews of legacy modernization programs.</span></span></p>
<h2 class="head1" id="sc2_207"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">As a solutions architect, what is a legacy system in your opinion?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">A software application that is not fit for the purpose of meeting the demands of its users or does not help the enterprise to meet its business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">The application that cannot support modern-day software platforms or hardware advancements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">A software application in which it is hard and expensive to make any architectural and design changes, and difficult to test and maintain.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">An application that no longer meets the quality of services expected by the customers, like performance, reliability, and security.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">A software that is not modular, and any code changes made manifest themselves as unpredictable errors during usage. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">What are the major challenges to migrating legacy systems?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">Functional complexity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">: Most of the applications that fall in the modernization bucket are functionally complex and were developed at least a decade ago. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">Application criticality</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">: Applications could be mission critical for the overall running of the business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.2">Hence, it becomes a very difficult decision to start the modernization exercise of these kinds of applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">Interdependencies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">: The application to be migrated might have dependencies on other systems within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.2">So, an upgrade to the current application might be difficult.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">Software size</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">: Some of the applications could be massive in terms of the number of components they comprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.2">All these components could be tightly coupled with each other, making it difficult to adopt a phased approach to modernization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">Cost and budget</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">: Many of the enterprises may not have the required budget to modernize their applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">What are the major strategies available to migrate legacy systems?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">Rehost</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">: A strategy in which the application is moved to a different environment with the same software and hardware platforms without any changes to the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.2">This applies more to migrating applications to the cloud with the same software and hardware environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1">Replatform</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">: In this option, the operating system, software, or hardware platform is upgraded. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.2">For instance, a MySQL database in an on-premises application can be replatformed to use the Oracle relational database service on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">Rearchitect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">: In this option, the application is overhauled in terms of the architecture and the design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.2">This is an option to entirely rearchitect the system to make it more distributed and efficient, making use of modern-day distributed architectures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="147" id="page147"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">Refactor</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">: In this strategy, the application is refactored and made more modular without changing the application code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.2">This makes the application performant and easy to maintain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.3">This also reduces the cost of future changes, testing and maintenance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">Replace</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">: This option is to replace an application that is not fit for purpose with an option that offers features out of the box, like a commercial off the shelf or a SaaS solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">Rebuild</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">: This option is to entirely rewrite the application using newer architectural patterns, design principles, and technology frameworks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">What is the difference between rehosting and replatforming of a legacy application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">Rehosting is moving the application to the cloud without changing the software platform, architecture, or the application code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">Rehosting is leveraged more in terms of moving workloads to the cloud as an initial step, after which the application can be refactored or rearchitected to improve the quality of the application's services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">Rehosting helps enterprises to make use of the cloud in case the on-premises hardware license is very expensive or the usage is coming to an end.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">In the replatform option, the application is moved to the cloud, and it makes use of the out of the box platforms and services on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.2">For instance, an application using an Oracle database on premise can be moved to the Amazon cloud to leverage the relational database service.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">Replatform helps the enterprise to adopt a pay-as-you-go model for the required services and not worry about the software or hardware licenses of those services on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">How can artificial intelligence help in legacy migration?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">AI has disrupted the area of legacy modernization, just like green field software development and testing of software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">AI helps to extract business logic and rules from legacy applications for which no documentation is available.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">Large language models </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">LLMs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">) help to convert legacy code directly to modern-day programming languages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.2">For example, LLMs can convert COBOL code directly to Java or Python.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">AI can analyze legacy applications and identify technical debt, along with recommendations to remove or reduce the technical debt.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">AI can also recommend the right strategy for modernization, like rearchitect, refactor, or rebuild, thereby helping organizations to review their decisions. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">As a solutions architect, how will you measure the effectiveness of a legacy migration project?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">You will devise customer KPIs like customer retention ratio, new customers added, and new product registrations that will help to measure customer satisfaction levels.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">For the enterprise, we can measure the total cost of ownership and time to market before and after the migration of the legacy workloads.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">We can monitor the quality of services like performance improvement, improvement of security posture, and the usability of the application before and after migration to tangibly measure the efficiency added.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="148" id="page148"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">What is the role of cloud with respect to legacy modernization?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">Cloud-native architecture recommends splitting legacy applications as services (microservices) that are independently deployable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">Legacy applications can be migrated to better hardware infrastructure on the cloud as a starting point for rearchitecting legacy software platforms to the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">Replatforming applications to cloud is done to make use of native cloud services by enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.2">This relieves enterprises of their responsibility to maintain those services and leverage the cost benefits associated with a pay-as-you-go model.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.1">SaaS model offered by the cloud benefits enterprises to make use of applications offered readily on the cloud providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.2">In this model, only the data is owned by the enterprise, with the application and the hardware owned by the cloud provider.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.631.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.1">In the serverless compute model, the enterprise can move their code to the cloud and execute it without provisioning any hardware or software platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.2">Services like AWS Lambda and Azure functions are examples of serverless models offered by cloud providers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.1">As a solutions architect, what is the roadmap you will propose for legacy modernization engagements?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.636.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.1">Stakeholder communication and building a consensus are important steps in modernization exercises, as these are not just technology programs but an organizational change management that requires a buy-in from everyone involved.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.638.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.1">Build the business case to get the required budget from the executive management and prepare a roadmap detailing all the steps to be performed to ensure completion and success of the modernization exercise embarked upon.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.640.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.1">Analyze the existing application landscape and finalize the type of modernization that is suitable for the workload being moved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.2">For instance, if an organization must quickly modernize a business-critical application within a short period of time, replacing it with a commercial off the shelf product will be the best option than a rebuild or a rearchitect option.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.1">Organizing a discovery phase is very crucial to plan for the business logic and rules consolidation and finalization of modernization strategy, application architecture, and design.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.644.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.645.1">Build and test the application as per the modernization strategy and architecture finalized.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.646.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.647.1">Measure the return on investment by devising appropriate key performance indicators related to both operational and non-operational aspects of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.1">9.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.1">As a solutions architect, what are the options available to modernize mainframe applications?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.650.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.652.1">Replatform option in which enterprises want to move mainframe workloads to other platforms on the cloud, using which they can reduce the cost of hardware and software platforms hosting the applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.653.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.654.1">Rewrite is another option available to modernize mainframe applications in which the application is rearchitected using cloud-native architecture patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.654.2">Applications are split into components using methodologies like </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.1">Domain-Driven Design</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.1">, developed as containers, and deployed on cloud platforms managed by container orchestration platforms like Kubernetes.</span></span></p>
