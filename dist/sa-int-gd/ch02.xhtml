<section epub:type="chapter" role="doc-chapter">
<header>
<h1 class="chaplabel" id="ch02"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="13" id="page13"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 2</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Solutions Architect Checklist</span></span></h1>
</header>
<h2 class="head1" id="sc2_26"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Designing a software system requires a multitude of skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">It requires good technology skills mixed with communication and interpersonal skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">If those skills are complemented with a systematic way of doing things, the software system created will be one that adds value to the enterprise in realizing its business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Many times, the architects will be technically good and possess good communication skills, but due to the lack of application of systematic thinking, the solution they create may have a lot of gaps in satisfying both functional and nonfunctional requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">Even more important, the software system built should have the buy-in of all the stakeholders involved, without which it will not find any light at the end of the tunnel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.6">Thus, it is critical to have the buy-in of all the stakeholders involved in the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.7">A checklist will be very useful in inculcating a systematic thinking model into the minds of the solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.8">This chapter introduces the reader to various checklists that can be used as a validation guide during the different phases of the software development lifecycle.</span></span></p>
<h2 class="head1" id="sc2_27"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Initiation to checklists</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Stakeholder communication and collaboration checklists</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Architecture, design, and development checklists</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Solution quality of service checklists</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Problem solving, innovation, and continuous improvement checklist</span></span></p>
<h2 class="head1" id="sc2_28"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">The readers of the chapter will learn what a software architecture checklist is and the need for a checklist to be used by a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">The readers will get to know how to use a checklist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">The chapter also covers checkpoints under different categories such as business stakeholder management, communication, requirements, architecture, design, and other quality of services, which are critical for developing a solution </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="14" id="page14"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The chapter also contains solved questions at the end, which will help the reader to get an idea of the type of questions that will be asked in a solutions architect interview.</span></span></p>
<h2 class="head1" id="sc2_29"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Initiation to checklists</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">A solution architecture checklist encompasses a list of checkpoints that are required to be verified by the solutions architect and the development team to ensure that the solution adheres to the needs of the business to realize the business goals of the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">The checklist is created from industry standard best practices, proven architectural styles, design patterns, and commonly accepted software processes and procedures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">They ensure that the system is well architected, flexibly designed, and at the same time, address the functional and non-functional requirements of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-14"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">A brief description of how each type of checklist will be useful is depicted in </span></span><span class="Italic"><a href="#fig2-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Figure 2.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"><img src="images/Figure_2.1.png" alt="A table listing key business areas—such as stakeholder management, communications, architecture, development, DevOps, availability, security, performance, scalability, usability, reliability, and problem-solving—with brief descriptions."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig2-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Figure 2.1</span></span><span class="Figure-Caption--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">: Types of checklists</span></span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_30"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Need for a checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Consider the following scenarios:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">A solutions architect created an architecture that did not have enough controls to store the customer data securely. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">It was an application built for a healthcare provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">The customer data was compromised, which resulted in reputational damage to the company, and it ended up paying millions of dollars as a penalty.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">The software system created was tested for functionality, and it satisfied all the functional requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">When it was deployed to production, it continued to work as expected, but when there was a special event and the load on the system spiked, the performance of the system degraded, resulting in a bad user experience and loss of business.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">A software system built for a retailer was not designed for redundancy of its critical services and was down for a substantial amount of time during a critical patching window, which resulted in a loss of business for the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">A system was built for an insurance company, the navigation of which was very confusing for the users, resulting in an increase in call volume to its call center. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The company had to spend a huge amount of money to maintain its call center resources.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="15" id="page15"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">All these scenarios resulted from a gap in one or more of the quality-of-service attributes of the software solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">This could have easily been prevented had the solutions architect followed a systematic approach to take care of the required qualities of service to be built into the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">A checklist will be useful to guide the architect and the development team to check if all the tasks pertaining to meeting the functional and nonfunctional requirements have been completed, for the system to be useful for the end users, thereby adding value to the enterprise.</span></span></p>
<h3 class="head2" id="sc3_31"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Using the checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">The checklist can be used by architects or by any stakeholder in the development team to verify the solution against each of the checkpoints in each category. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">This can be useful to identify gaps in the solution architecture to meet both its functional and non-functional requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">The following are the key points to keep in mind while using the checklist:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Modify the checklist to suit your enterprise and project needs of functional and non-functional requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Apply principles of your enterprise architecture governance framework into each of the checklist categories, more so, while addressing the solution architecture and the quality of service attributes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">The checklists have been created based on existing architectural and design principles, so refine the checklist because the principles evolve, and new ones arrive.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Make a note of any exclusion from any of the steps given in the checklists, with a reason for the same, so that the decisions taken are well informed and data driven.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Update or modify the checklists based on learnings from previous projects and suggestions from the stakeholders who are actively engaged in the design and building of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Review the checklist periodically and make sure it aligns with the goals of the software system being built.</span></span></p>
<h2 class="head1" id="sc2_32"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Stakeholder communication and collaboration checklists</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">In this section, we will create checkpoints that a solutions architect can use to identify the problem statement, solidify it, and socialize it with the business and technology stakeholders of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">We will discuss how we can make the communication process more effective along the way so that there is consensus among the parties involved before a solutions architect can embark on the journey of architecting and developing the software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">We will also discuss a checklist for managing the requirements effectively.</span></span></p>
<h3 class="head2" id="sc3_33"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Business stakeholder management checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Getting business stakeholders’ buy-in is the key to any software project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">The solutions architect must work with both the business and other technology stakeholders of the organization from the beginning to understand and redefine, if required, the business problem statement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">Consensus among all the stakeholders in the organization is vital for the project’s success.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">The following is a checklist that the solutions architect can use as a reference to ensure proper stakeholder management at the start of the project:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="16" id="page16"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">The architect has understood the business domain of the customer organization, which is the core of their existence.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">The architect has understood the business goals of your customer, for which they are ready to make business process and technology interventions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">The architect has understood the existing business processes within the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">The architect has understood the business and technology hierarchy within the organization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">The architect has gained knowledge of the business architecture of their organization, where the business processes interact and collaborate with each other to offer value to their customers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">The architect has understood the specific business problem of the customer, which needs technology or a process intervention.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">The architect has knowledge of the cost budget and timeline within which the business problem needs to be solved.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Document the business problem that needs to be solved with sections such as the current and the desired states, impacted business units, goals that will be achieved, etc.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">The architect has identified the business and technology stakeholders that they need to work with.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">The stakeholders are apprised of the project’s vision and how it helps to realize the enterprise business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">The stakeholders are aware of the need to solve the business problem and have a consensus on the problem statement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Having discussed the checkpoints to identify stakeholders and their business problems, we will move on to create a checklist to effectively plan and manage the communication channels with them.</span></span></p>
<h3 class="head2" id="sc3_34"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Communication checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Once the stakeholders are identified, it is important to have meetings and workshops with different groups in the organization to elaborate and detail the problem statement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">This will raise the problem space understanding of the solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">The solutions architect also comes up with a mental model of the solution and socializes with different groups to get their consensus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.4">It is very important for the solutions architect to use appropriate communication and collaboration platforms (Confluence, for example) to document the discussions during those meetings and workshops. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.5">The idea of this is to come up with a consensus on the problem definition and the overall process or technology intervention required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.6">The checklist is as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">The architect has grouped the stakeholders to whom the problem statement and the technology or process intervention need to be communicated.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">There is a clear plan of engagement with each of the stakeholder groups.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">The architect has identified the priority and order of meetings or workshops that need to be set up for communication with stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">The problem is clearly articulated to the business and technology stakeholder groups with the relevant documents and presentations, including the data points and facts.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">The technology or process intervention that will be applied to solve the business problem has been clearly articulated.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">The stakeholders are convinced of the overall technology and process intervention suggested to solve the business problem.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">The possible technology choices that will be used for the solution have been discussed with the stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">The suggested process interventions agreed by the stakeholders are in line with the business goals to be met.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">The business architecture impacts are communicated to all the stakeholder groups for an agreement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">There is a consensus about the solution among the audience during those workshops or meetings.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="17" id="page17"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">All the stakeholders are apprised of the timelines of the project and their engagement with respect to each of the project phases.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">The risks associated with the project and its impact on budget and timelines have been clearly communicated to all stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Risk mitigation plan is in place and has been articulated and shared with all the stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">The key stakeholders that will have an influence on decisions throughout the project have been identified and engaged with.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">The key stakeholders have been communicated and have agreed on their involvement throughout the project based on fixed hours every week.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Feedback has been received from the relevant customer stakeholders during those workshops or meetings.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Documented the discussion during those meetings or workshops to get everybody on the same page. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">The minutes of meetings or notes are shared using a documentation platform like Confluence.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Incorporated the changes based on the feedback received from the technology and business stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">The revised technology and process intervention have been communicated to the stakeholders, including the executive management and project sponsor.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Sign off is provided to proceed with the solution details to solve the problem.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Having seen the checkpoints to effectively engage with the business and technology stakeholders involved, we will move on to look at checkpoints that can help to efficiently manage requirements, which is the backbone of any software system.</span></span></p>
<h3 class="head2" id="sc3_35"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Requirements management checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Once the problem statement is defined, the solutions architect works with the business analyst identified for the program and other business and technology stakeholders of the organization for requirement analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">This requirement checklist will help the solutions architect to break down the problem statement into manageable chunks called requirements or user stories, in the case of Agile.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">The following is a checklist that the solutions architect can use as a reference to effectively engage in the management of requirements at the start of the project:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Helps project teams understand requirements as simple English statements. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">Helps businesses to prioritize requirements easily.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Helps both the project and business teams to look at working software every two or three weeks and make amends as required to the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">The business analyst has started to refine the problem statement to break it down.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Started to work with the technology stakeholders to understand the non-functional requirements like usability, security, performance, and scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">The business analyst has written the user stories for both functional and non-functional requirements in the case of Agile development.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">In case of Waterfall, the business analyst has explicitly written the requirements as sections in a document that covers both functional and nonfunctional requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">The business analyst has classified the user stories based on the area to which they belong, such as security, payments, accounts, operations, etc.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="18" id="page18"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Each of the requirements or the user story has been mapped to one or more of the business goals of the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">The acceptance criteria have been identified for each of the user stories in consultation with the relevant stakeholders. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">The user stories are prioritized based on the criticality of achieving the business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">A prototype has been created for the application to depict the functional and data flow within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">A prototype has been socialized with all business stakeholders, and feedback received from them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Feedback received from the stakeholders has been incorporated into the prototype. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">The user stories are circulated to the business and technology stakeholders for sign off.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Suggested changes by the customer, to re-prioritize the user stories, have been taken care of.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">The functional and non-functional requirements of user stories have been signed off by the business and technology stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">A robust change management process has been created to incorporate the changes to the requirements or user stories during project execution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Having discussed the stakeholder communication, collaboration, and requirement checklists, we will now discuss the technical checkpoints that a solutions architect can use to blueprint, design, and develop a software system.</span></span></p>
<h2 class="head1" id="sc2_36"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Architecture, design, and development checklists</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">In this section, we will discuss checkpoints that a solutions architect can use to architect, design, and develop a system effectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">The solution architecture and design checklist will cover aspects to ensure that there are no gaps left when the solutions architect creates the architecture and design blueprint of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.3">In the development checklist, we will talk about points the solutions architect needs to keep in mind to assist the development team in efficiently converting the design into a software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.4">We also have a DevOps checklist, which can be used to establish a mature DevOps culture within the project team to enable timeliness and quality of the software product.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">We will first look at the architecture and design checklist that can be used by a solutions architect to blueprint the system.</span></span></p>
<h3 class="head2" id="sc3_37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Architecture and design checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Architecture and design checklist is the most important artefact that needs to be used by an architect to ensure that their solution is flexible, built to proven architectural styles, and meets the required quality of services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">This checklist also addresses the required checkpoints to ensure that the software solution is designed in a parametrized way if it needs to support multiple lines of business or regions in which the organization operates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.3">This checklist helps to ensure that various aspects of the software solution are thoroughly considered and addressed during the architecture and design of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">The following is a checklist that the solutions architect can use as guidelines for the architecture and design of a software application:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">The user stories for the functional and non-functional requirements are signed off.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">The functional and non-functional requirements are understood by the solutions architect.</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">The architect has identified foreseeable dependencies and risks for the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">The architect has documented and shared the foreseeable risks with the business and technology stakeholders and the project management team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">The architect has made a choice of technologies to be included in the building of different types of components in the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">The following are examples of technology choices:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">Angular or React JS, for the front-end components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">Spring Boot or .NET for the business components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">The architect has considered the options of using a contemporary application framework versus build from scratch approach for the solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">The architect has conducted </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">Proof of Architecture </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">PoA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">) experiments for critical components and integration touch points within the application to ensure protocol type, performance, and security guardrails are applied to data.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">The results of the proof of architecture have been documented and shared with all the stakeholders of the project.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">The architecture is socialized with the relevant business and technology stakeholders, and its salient features and limitations are articulated to them.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">The dependencies and risks are clearly articulated to all stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">The feedback is received, incorporated, and a consensus is reached for the architecture to be used to build the solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">There is a sign-off received from the technology stakeholders of the organization to go ahead with the system build to resolve the business problem.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="21" id="page21"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">The architecture is socialized with the project team, including project managers, developers, and testers who will build and test the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">Having seen the checklist for architecture and design, we will now move on to discuss the software development lifecycle checklist that can be used by the solutions architect to mentor, monitor, and assist the development team.</span></span></p>
<h3 class="head2" id="sc3_38"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">Software development lifecycle checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">In modern day enterprises, the role of the architect does not end with creating a blueprint of the system by applying their knowledge of architectural styles and design patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.2">They are also expected to be part of the bigger project team during the whole development process, helping all development stakeholders like project managers to plan the sprints, to development leads for helping them with productivity improvements, to test managers to devise test strategy and to developers to help them with modern and safe coding practices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.3">The solutions architect also works with the DevOps engineer to recommend to them the best practices for creating the DevOps pipelines for continuous integration, delivery, and deployment, as needed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.4">They also work with different specialized teams like the performance team, security team, and the deployment team to arrive at optimum strategies for meeting the nonfunctional requirements of the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.5">Apart from this, they also work with the infrastructure team to arrive at the layout of the services required for the application. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">The following are the checkpoints that the software architect can use to add value during the different phases of the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">software development lifecycle </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">SDLC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">):</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">The architect assists the project manager, Scrum Master, and the development team in planning the sprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">The architect assists the Scrum teams regularly to clarify details on the design of the specific feature functionality being built.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">The architect has come up with coding practices to be adopted by the development team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">The architect conducts code reviews to assess the quality of the code being written.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">The architect helps the development team recommend unit testing frameworks to test the application code, depending on the type of component, like frontend, backend, and database components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">The architect works with the development team to suggest ways to improve the velocity of the team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">The architect assists the project manager in reassessing time and effort for components if a major change is foreseen for a functional or nonfunctional requirement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">The architect conducts regular reviews of the development team’s work for any deviations from the approved solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">The architect assists the test manager and testers to devise ways for testing different types of components, including frontend and backend components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">The architect keeps a close watch on the quality of services being met by the solution built by the development team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">Having discussed the development checklist, we will move on to discuss the DevOps checklist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.2">The DevOps culture has become inevitable for building quality solutions and is being adopted by large as well as small enterprises across the globe.</span></span></p>
<h3 class="head2" id="sc3_39"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">DevOps checklist</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">DevOps has become an integral part of the SDLC in most projects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.2">In short, DevOps is an integration of tasks of the development and operations teams into a single bucket to improve the quality of the software developed and reduce the time to market the software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.3">A DevOps pipeline encompasses different stages or hooks that </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="22" id="page22"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">the software component goes through and gets itself certified for meeting the functional and nonfunctional requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.2">The DevOps team is mostly a shared services team that helps different projects in building the required pipelines. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">The architect works closely with the DevOps team to create the required pipelines for their project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.2">They ensure that the DevOps pipeline requirements are met for their project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.3">They decide the different stages of the pipeline based on the nature of the components in the project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.4">They work with the DevOps team to define the success or failure criteria for each of the stages of the pipeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.5">The essential knowledge required about DevOps for an architect is discussed in </span></span><span class="Italic"><a href="ch08.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">Chapter 8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">, DevOps</span></span><span class="CharOverride-2"> </span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">Essentials.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">The following is a checklist that the architect can use as a reference to ensure proper implementation of the DevOps culture in the project:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">The team delivers code to the version-controlled codebase repository at regular intervals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">In small enterprises, the solutions architect decides the technology for building the pipeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.2">However, as stated before, in large enterprises, the DevOps team is a centralized team which builds the DevOps pipeline for multiple projects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.3">In such a case, the solutions architect works with the DevOps team to define the stages of the pipeline for their project.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">The technology for the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">continuous integration and continuous delivery </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">CI/CD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">) pipeline is finalized for the project by the architect in consultation with the DevOps team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">The following are examples of technology for CI/CD pipelines:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">Jenkins</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">Gitlab</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">GitHub actions</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">Azure DevOps</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">The DevOps pipeline is configured as code by using YAML, etc. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">The stages of the pipeline are finalized based on the nonfunctional requirements of the project engagement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">The following are examples of the stages in the pipeline:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">Unit testing</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">Functional test</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">Security test</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">Performance test</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Parallel testing</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Each stage of the pipeline has its own measurements for success or failure, acting as a quality gate.</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Response time</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">Number of errors</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">Threads created</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">Developers have a clear view of how their code flows within the pipeline and the success or failure of each stage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">Infrastructure as code </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">IaC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">) is implemented for the project.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="23" id="page23"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">Each component has its own code base and is independently versioned and baselined.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">Static code analysis is being carried out as part of the pipeline.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">The following are examples of static code analyzers: </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">SonarQube</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style381"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">Klocwork</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">There are distinct environments for development and test (functional, security, performance).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style92"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">There is logging and auditing process in place for each of the build that happens through the pipeline.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">A complex and sophisticated architecture may not add value unless it offers the required quality of services to its users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.2">Having discussed the architecture, design, and DevOps checklists that can be used within the software development lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.3">We will now discuss checklists for ensuring the quality of services of the software application.</span></span></p>
<h2 class="head1" id="sc2_40"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">Solution quality of service checklists</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">We will start by looking at the checkpoints that a solutions architect can use to ensure the availability of the software system as required by the enterprise.</span></span></p>
