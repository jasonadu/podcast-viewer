<h2 class="head1" id="sc2_874"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">Security in a cloud-native architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">Contemporary cloud-native applications use a cloud security model called the Zero Trust model in which no component of the architecture assumes implicit security, and all the parts of the application need to be secured explicitly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.2">In the cloud, the application is made up of moving parts from a hardware and software platform perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.3">Hardware gets provisioned and torn down based on application non-functional requirements like performance and scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.4">Software platforms get patched regularly as new versions get released. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.5">It is inevitable that these are monitored continuously, and security controls are updated on a regular basis to maintain the security posture of both the provisioned cloud services and applications that use them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.6">In the following sections, we will look at ways in which we can maintain the security posture within cloud-native applications.</span></span></p>
<h3 class="head2" id="sc3_875"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">Role-based access control</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">RBAC determines the permissions assigned to a group of users to access resources on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.2">Each cloud provider offers their own implementation of the identity and access management services that provide end to end capabilities to manage users and roles on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.3">AWS provides the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">identity and access management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">IAM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">) service, and Azure provides an equivalent service called </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">Azure Entra ID</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.2">In practice, a role is created, and a set of policies is assigned to the role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.3">Each assigned policy can have permissions to access one or more resources on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.4">The role is assigned to a group of users, enabling them access to their entitled resource group. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.5">As a best practice, adopt the principle of least privileges, wherein the principal is assigned minimum permissions just enough to perform the required operations within the cloud and application ecosystem.</span></span></p>
<h3 class="head2" id="sc3_876"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">Container security</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">All microservices in a cloud-native application live as containers inside the cloud environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.2">It is important that the containers are kept secure, and they continue to be monitored for any unusual behavior. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.3">Kubernetes and Istio help to define network policies that limit the inter service and service to outside world communication to required levels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.4">In the cloud, where immutable infrastructure is the norm, containers should never be modified once created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.5">Containers should be torn down and created afresh if changes are required to the image or the running containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.6">Kubernetes namespaces can be used to group and isolate related resources in the cluster and that they do not overlap with each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.7">Use a stringent audit trail process to capture all the behavioral changes happening within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.8">Do not expose sensitive information like database passwords and API keys, and store them in services meant for them on the cloud. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">AWS Secrets Manager</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1"> and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">Azure Key Vault</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1"> are some of the choices for storing this kind of information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.2">Continuously monitor the security of infrastructure using cloud services providing this capability. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">AWS GuardDuty and Microsoft Defender</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1"> for cloud helps in monitoring the application resources and the underlying infrastructure and flag unusual behavior, if any.</span></span></p>
<h3 class="head2" id="sc3_877"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">Data security</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">Data security pertains to the security of data when it is stored and while it is in transit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.2">We looked at the approaches for both in </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">, Technical Proficiency Essential Knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.2">All the cloud providers offer mechanisms to encrypt data when it is stored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.3">AWS, Azure, and GCP provide their own encryption mechanism while the data is being stored in their respective persistence storage services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.4">This applies to both transactional data stored in a relational database and artefacts stored as part of their object storage system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.5">For instance, AWS S3, an object-based storage, offers different types of encryption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.6">The user can opt to use the default encryption S3 provides out of the box. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.7">The other option is for the customer to create their own key for encryption within the </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="432" id="page432"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">cloud and use it to encrypt objects before they are stored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.2">There is also a client-side encryption mechanism in which the customer can encrypt objects on the client side before they are stored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.3">As stated in the previous section, sensitive information like database credentials and API keys must be stored in the managed services like secrets manager provided by AWS and Google cloud platforms.</span></span></p>
<h3 class="head2" id="sc3_878"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">Cloud-native application security</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">In this section, we will look at OAuth 2.0, a framework that is most used in the authentication and authorization of cloud-native applications made of microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.2">It delegates the authentication and authorization to an authorization service (an identity provider) that is integrated with the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.3">It helps to assign the required permissions to users based on the role assigned to them by the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.4">The permissions are granted in the form of an access token (JSON Web token), which is sent to the user, and it can be passed along with subsequent requests. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.5">The access token is validated (based on the timestamp) for every request, and the user is authorized based on their permissions described within the token payload. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig22-7"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Figure 22.7</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1"> depicts the OAuth 2.0 authorization code grant flow, which is used in the context of authentication and authorization of microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.2">It becomes imperative for the solutions architect to understand OAuth 2.0 from an application security and a solutions architect interview perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.3">Let us walk through the OAuth 2.0 authorization code grant flow as depicted in the following figure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1"><img src="images/Figure_22.7.png" alt="A sequence diagram showing interactions between Client, API Gateway, Token Service, Authorization Service, and Business Service in ten numbered steps, illustrating a typical API authorization process."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">Figure 22.7</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">: OAuth 2.0 authorization code grant flow</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">The steps can be explained as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">1.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">The user (through a client application) wants to access a business service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.2">It calls the authorization endpoint of the application to sign in.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">2.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">The user is redirected by the authorization end point of the application to a token endpoint (An identity provider like Azure Entra ID or AWS Cognito). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.2">The user is requested by the token endpoint (through a login page) to enter their credentials.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">3.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">The user enters </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">their</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1"> credentials, and it is validated by the token service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.2">Once the user login is successful. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.3">The token service sends an authorization code to the client application. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">4.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">The client application sends the authorization code back to token service (identity provider) to exchange the authorization code for an access token.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">5.	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="433" id="page433"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">The token service sends an access token to the client application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.2">This access token becomes the bearer token for the user. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.3">This access token can be in the form of a JWT.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">6.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">The client application makes the next request to access a business service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.2">It sends the access token in the authorization header. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.3">The request is routed through the API gateway.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">7.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">The API gateway validates the access token for validity by interacting with the token service (identity provider). </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">8.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">Once the token is validated for success, the request is forwarded to the business service for necessary business action, such as an order retrieval or a payment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">9.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">The result of the business action (success or failure) is returned to the API gateway.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style747"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">10.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">The API gateway forwards the result of the business service call to the client application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">The advantage of the authorization code grant is that it is more secure as it involves a two-step process of generating an authorization code and then exchanging it for an access token.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">In the case of mobile and single page applications, the security is achieved using a technique called </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">Proof Key for Code Exchange </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">PKCE</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.2">It prevents an authorization code interception attack on the mobile device. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.3">PKCE is the same as the authorization code grant flow with some minor variations. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">The following are the salient features of the PKCE flow:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">When the client submits the credentials to the token service (identity provider), it also creates a random string, hashes it, and sends it as part of the request.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">The token service then returns the authorization code to the mobile application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">The mobile application then sends the authorization code along with the original plain random string value to the token service and requests for the access token. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">The token service compares the plain text random string with the hashed value that was initially sent by the client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.2">If they match, the access token is issued to the client.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">The other flow that is used for mobile and single-page applications is the implicit grant in which the client is given the access token after signing in with credentials. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.2">There is no authorization code involved in this type of OAuth flow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.3">However, this method is less secure than the authorization code grant.</span></span></p>
<h3 class="head2" id="sc3_879"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">Implementing an OAuth 2.0 authorization code flow</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">In this section, we will look at the steps to implement the OAuth 2.0 authorization code grant flow with the Azure identity provider, namely the Azure Entra ID. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.2">Azure Entra ID has been taken as a reference Identity provider here on the Azure cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.3">OAuth 2.0 is a specification, and these steps to implement OAuth 2.0 are pretty much the same using any of the popular Identity providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.4">It requires registration of the app with Azure Entra ID service and providing a redirect URL within the application to which the authorization code will be sent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.5">The application exchanges the authorization code for the access token.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">The steps are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">1.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">Register the application with the Azure Entra ID service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.2">Let us call our application </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">My Sample App 1</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">2.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">As part of the registration process, the developer enters a redirect URL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.2">This is the URL within the application to which Azure Entra ID will redirect the user, along with the authorization code as a request parameter, after successful authentication. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.3">Let us call this redirect URL </span></span><a href="https://mysampleapp1.com/callback"><span class="Link--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">https://mysampleapp1.com/callback</span></span></a><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.2">The registration page within Azure is shown in the following figure:</span></span></p>
<figure class="center1"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="434" id="page434"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1"><img src="images/Figure_22.8.png" alt="A screenshot of the Microsoft Entra admin center showing the overview page for an app registration. Details include display name, application ID, object ID, tenant ID, and various configuration links."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-8"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">Figure 22.8</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">: Implementing OAuth 2.0 with Azure Entra ID </span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">3.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">After configuring the redirect URL, generate a client secret for the application under </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">Certificates &amp; Secrets</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.2">The secret is used by the client to authenticate itself with Azure Entra ID and exchange the authorization code for the access token.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">4.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">Click on </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">API permissions</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1"> and include the APIs and resources which needs to be accessed with the access token issued by the Azure Entra ID. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.2">These are the APIs and resources the application can access on behalf of the user using the access token issued by Azure Entra ID.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">5.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">Create a client login page in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.2">When the user tries to login, redirect the user to the Azure Entra ID authorization endpoint as follows: </span></span><span class="Link--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">.</span></span></p>
			<table id="table048" class="Basic-Table _idGenTablePara-1">
				<colgroup>
					<col class="_idGenTableRowColumn-3"/>
				</colgroup>
				<tbody>
					<tr class="Basic-Table _idGenTableRowColumn-46">
						<td class="Basic-Table CellOverride-1">
							<p class="Normal--BPB-HEB- ParaOverride-2"><span class="TIP-INFO--BPB-HEB- CharOverride-11"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">Note: </span></span><span class="TIP-INFO--BPB-HEB- CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">Tenant is the unique ID of Azure Entra ID that the organization received when it signed up with Microsoft for the cloud service.</span></span></p>
						</td>
					</tr>
				</tbody>
			</table>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">6.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">Include the following parameters as part of the redirection mentioned previously:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">a.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">client_id</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">: The client ID is the application ID generated as part of the application registration process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">b.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">response_type; code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">: This indicates that we want an Authorization code from the authorization endpoint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">c.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">redirect_uri</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">: The redirect URI that we entered as part of the app registration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">d.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">scope</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">: The data permissions required (e.g. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.2">profile, email).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">e.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">state</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">: Any string value that we want to preserve between authentication and redirection.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">7.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">The Entra ID service will ask for the users to authenticate themselves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.2">Once the users enter their user ID and password, Azure Entra ID will validate them, and if authentication is successful, it redirects to the URL given as part of the application registration process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="Link--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">https://mysampleapp1.com/callback</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1"> is the redirection URL as configured during the application registration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="435" id="page435"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">8.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">The redirect URL will contain the authorization code as a request parameter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.2">The redirection endpoint will exchange the authorization code for an access token by making a POST request to the Microsoft token endpoint as follows:</span></span></p>
			<p class="Link--BPB-HEB- ParaOverride-32"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">9.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1">Include the following parameters in the request body while calling the token end point to exchange the authorization for the access token:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">a.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">client_id</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">: Client ID is the application ID generated as part of the application registration process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">b.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">client_secret</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">: Client secret generated as part of the registration process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">c.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">: Authorization code received from Azure Entra ID.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">d.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">redirect_uri</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">: The redirect URL that was used in the authorization request.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">e.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">grant_type</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">: Should be </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">authorization_code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style748"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">10.	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">Use the access token received to access the APIs and other resources to which permissions were given within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">Now that we have covered the required knowledge areas for cloud-native architecture, we will look at the possible questions that can be asked in a solutions architect interview.</span></span></p>
<h2 class="head1" id="sc2_880"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">The cloud has become an inevitable proposition in the technology roadmap of large enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.2">It is important for solutions architects to understand the nuances of cloud native architectures, including factors that influence the migration of on-premise workloads to the cloud. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">In this chapter, we discussed the different computing models like IaaS, PaaS, and SaaS offered by cloud providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.2">We looked at the factors to be considered by a solutions architect before moving workloads to the cloud or blueprinting a new application for the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">We explained the concepts of containerization and orchestration, understanding of which is important for cloud-native architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.2">We also looked at the difference between virtual machines and containerization, along with the advantages that containers offer over virtual machines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.3">We also looked at the principles governing </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">cloud-native</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1"> architectures like immutable infrastructure, declarative APIs, and Microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.2">We went on to discuss computing models and services offered by the cloud to make applications robust enough to address the required quality of services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.3">We went on to discuss a reference architecture based on Azure to explain the different components that make up cloud native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.4">We also covered important design patterns required to come up with a robust cloud-native architectural blueprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">Security considerations are paramount while blueprinting cloud-native architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.2">We covered aspects for implementing a security framework on the cloud using the OAuth 2.0 specification. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">In the next chapter, we will cover the process related to effectively managing applications once they have moved into production.</span></span></p>
<h2 class="head1" id="sc2_881"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">Considerations for cloud-native architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">: understand important factors to be considered such as regulatory compliance, cost, cloud provider choices and application security before architecting applications for the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">Containerization and orchestration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">: Containerization and orchestration are important capabilities required for cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.2">Containerization lends itself to scalability, which is a fundamental characteristic of the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.3">Orchestration helps in managing scalability on cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="436" id="page436"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">Cloud-native architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">: Break down the application into loosely coupled microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.2">Use </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">Domain-Driven Design</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1"> to come up with sub domains and microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.2">Understand the reference architecture for the cloud and the equivalent technology components provided by cloud providers to realize the reference architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.3">Understand and adopt best practices to move non-cloud workload to a cloud-native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.4">Leverage unique capabilities of the cloud to build cloud-native applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">Microservice design patterns</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">Understand the design patterns that make business microservices scalable, resilient and available. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.2">Understand how to manage transactions in a distributed architecture like microservices on the cloud. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">Cloud-native security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">Understand the implementation of security for the infrastructure, data, and applications.</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">Understand OAuth 2.0 framework to implement authentication and authorization for cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.2">Understand the different flavors of the OAuth 2.0 implementation and their applicability to different types of applications. </span></span></p>
<h2 class="head1" id="sc2_882"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">What is the difference between virtual machines and containerization?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1">Virtual machines are fundamentally a technique for hardware virtualization, whereas containerization virtualizes the operating system of a node or server.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1">In a virtual machine, you can install multiple operating systems on a host called guest operating systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.2">A hypervisor sits between the host operating system and the guest operating systems, interpreting the commands and providing networking services through the host operating system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.1">In containerization, a container run time sits on top of the host operating system and provides an environment for the software containers to run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.2">This results in optimization of resources as no guest operating systems are required.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.631.1">Docker is a very popular containerization platform, whereas Hyper-V by Microsoft and VirtualBox by Oracle are popular virtual machine software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.1">What are the design principles behind cloud-native architecture?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.636.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.1">The infrastructure of cloud-native architecture is immutable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.2">It means that the infrastructure is never modified once created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.3">If any changes are required, the infrastructure is destroyed and recreated.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.638.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.1">It makes use of declarative APIs that take input from the users and help them to realize the end state on the cloud infrastructure, without having the users know how the API works internally.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.640.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.1">The cloud-native architecture is made up of loosely coupled components (microservices).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.1">The cloud-native architecture has a service mesh which helps in secure inter microservice communication and enhances the observability of the solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.644.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.645.1">What are the salient features of a cloud-native application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.646.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.647.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.1">In cloud-native architecture, the application is made up of individual microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.650.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.1">The microservices are deployed as containers in the cloud environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.652.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.653.1">Each container is packaged to contain all the dependencies (libraries) of the microservice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.654.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="437" id="page437"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.1">The containers are managed using an orchestration tool like Kubernetes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.657.1">Azure Kubernetes Service and Amazon Elastic Kubernetes Services are some of the managed services that can be used to deploy cloud-native applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.658.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.659.1">What is the requirement for an orchestration tool in a cloud-native architecture?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.660.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.661.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.662.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.1">An orchestration tool provides the required capability for scheduling and controlling the microservice containers inside a cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.664.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.665.1">The orchestration tool has two main components, a control plane and a data plane.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.666.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.1">The control plane has the administrative components of the orchestration tool, like a controller manager, scheduler, API server, and data storage component.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.668.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.669.1">The scheduler schedules new containers in the cluster, and the controller manager maintains the required number of instances of the application containers. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.1">The API server is used to take user inputs to manage the cluster according to the customer application requirements (scale up or scale down the number of container instances of a microservice). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.2">The data storage component stores the current state of the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.673.1">The data plane is the area (nodes or servers) in which the business application microservices reside as containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.673.2">The data plane is controlled by the control plane.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.674.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.1">The orchestration tool has an indispensable place in the cloud environment where the infrastructure creation and termination are very dynamic, and we need an automated way to scale up and scale down container instances based on application load.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.676.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.1">Kubernetes is one of the popular container management and orchestration tools being used by enterprises.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.678.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.679.1">How will you manage transactions in a cloud-native microservices architecture?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.682.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.1">A cloud-native microservices architecture follows a model called an eventual consistency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.684.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.1">The saga pattern can be used to manage distributed transactions in a microservices architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.2">The saga pattern has two different flavors, choreography and orchestration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.1">In the choreographed mode, each microservice emits an event that is consumed and processed by the other microservice in the sequence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.2">If the processing is successful, it emits a success message; otherwise, it emits a failure message that is picked up by the first microservice, and it rolls back its changes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.689.1">In the orchestrated mode, an orchestrator calls each microservice in the sequence and manages the success and failure modes of each microservice involved in the transaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.690.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.691.1">How can you achieve graceful degradation of the application in cloud-native microservices architecture?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.692.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.694.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.695.1">In a microservices architecture, you can use a circuit breaker pattern to prevent routing calls to a microservice that is failing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.696.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.697.1">The circuit breaker pattern helps to define a fallback function that is called in lieu of the failed microservice for fault isolation and graceful degradation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.699.1">The fallback function helps to handle the failure scenario with an alternate functionality or response till the time the failed microservice is up and running.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="438" id="page438"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.1">The circuit breaker uses rate limiting to throttle the requests to microservices, reducing load on a microservice that is already under heavy load, due to which it can fail. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.2">This improves the resilience of the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.1">Libraries like Reslience4J (Java based) can be used to implement the circuit breaker pattern in Java.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.1">How will you come up with the required microservices in the sub domain of the application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.706.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.707.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.708.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.1">Sub domains are business areas constituting the main domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.2">The overall business domain is divided into core and supporting sub domains.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.1">For each sub domain, a domain model is created containing entities and aggregates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.2">It also uses ubiquitous language for uniformity of vocabulary within the sub domain.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.712.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.1">Each sub domain comprises of business capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.2">For instance, in an e-commerce application(domain), order management, inventory control, payment management order shipping can be the sub domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.3">Within order management sub domain, track order, cancel order could be the business capabilities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.714.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.715.1">Each of the business capabilities can in turn be represented as a microservice exposing the required operations for exposure to the channel systems for consumption.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.717.1">What is the need for an API gateway in cloud-native architecture?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.718.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.719.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.720.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.721.1">The API gateway provides path-based routing of request to the required business microservices of the cloud-native application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.722.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.723.1">The API gateway also provides service aggregation in which a request needs to communicate with multiple microservices to process a user request.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.724.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.725.1">The API gateway also interacts with the identity provider to validate whether the access token sent by the client application is valid and has not been tampered with.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.1">The API gateway provides throttling capability to limit the requests to microservices, thereby limiting the load on the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.2">The limits could be set based on user and time (requests per minute, etc.).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.728.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.729.1">The API gateway also provides a caching mechanism to cache responses, which reduces the overall load on the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style526 CharOverride-18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.1">9.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.731.1">Can you explain the authorization code grant flow of OAuth 2.0 to implement authentication and authorization for a cloud-native application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.732.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.733.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.734.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.735.1">OAuth 2.0 is an authorization framework that helps in a secure delegated authorization mechanism for cloud-native microservice applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.736.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.737.1">The authorization code grant starts with redirecting the user to an authorization server to authenticate themselves.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.738.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.739.1">Once the user authenticates, an authorization code is sent to the client, which they exchange for an access token (JWT) and use it as part of subsequent requests to access the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.740.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.741.1">The access token is the bearer token that the client sends as part of the request authorization header to identify itself as an authentic user.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.742.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.743.1">The API gateway picks up the access token from the request header and validates it against the authorization server. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.743.2">The user is allowed access if the access token is valid.</span></span></p>
