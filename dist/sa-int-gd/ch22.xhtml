			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Service mesh</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">: A service mesh is a software layer that manages many of the cross-cutting concerns like networking, inter service communication, security and observability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">A service mesh makes more sense in the case of a cloud-native application because of the way the application is divided into multiple smaller components(microservices) and the dynamic way in which multiple instances of those components are managed within the cloud infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.3">An extra layer of the service mesh software becomes necessary to manage the capabilities of networking, security of communication between components and monitoring the usage of services and the nodes in an optimal way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.4">Hence, a service mesh is one of the prescribed layers of software in cloud-native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.5">Istio and Linkerd are the popular service meshes used by enterprises while deploying cloud-native applications on the cloud. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">Having looked at the principles behind cloud-native architecture, the following are the key characteristics of cloud-native applications:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Distributable</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">: To reemphasize, cloud-native applications are built as loosely coupled components or microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">This is to take advantage of the virtually infinite scaling of infrastructure provided by the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.3">Smaller components are easier to scale with minimum startup times. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">Observable</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">: A request to a cloud-native application span across multiple microservices and the requests flowing through them are tracked using special software or a cloud provider service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.2">For </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="423" id="page423"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">example, AWS X-Ray is a service which provides distributed tracing of cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.2">This helps the developer and production support teams to very easily debug technical problems and fix them quickly.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">Portable</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">The cloud-native application does not have a lock in with a particular cloud provider and they are built to be vendor neutral and can be ported to any cloud provider with minimum effort.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Interoperable</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">All the microservices in the cloud-native application expose their functionality using well designed APIs, which can be consumed by other services using standard application protocols.</span></span><span class="CharOverride-4"> </span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">Available</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">The cloud-native applications have high availability because of features like auto scaling which kick in if an instance of the service is down. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.2">Another identical instance of the service is automatically created.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Having discussed what cloud-native architecture is and the key principles behind it, let us move on to see how a </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">cloud-native</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1"> architecture benefits from the unique features of the cloud.</span></span></p>
<h2 class="head1" id="sc2_863"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Taking advantage of cloud-native architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">Applications on the cloud can benefit from unique models and services that are inherent to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.2">These are offered by popular cloud providers under various names. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.3">We make use of them in our applications depending on the nature, complexity and the requirements of the application. </span></span></p>
<h3 class="head2" id="sc3_864"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Multi-cloud deployment</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Cloud-native architecture lends itself easily to a multi-cloud deployment arrangement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.2">In a multi-cloud architecture, applications can be deployed across two or more cloud providers to avoid vendor lock-in. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.3">They also help to adhere to regulatory compliance for workloads in which a single provider may not be able to fulfill all requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.4">A multi-cloud architecture provides cost advantages for workloads in which expensive services could be moved to a cloud provider that provides them at a lower cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.5">Cloud-native architectures built as containers and orchestrated using market popular orchestration tools (Kubernetes) provide the enterprise with the flexibility to deploy their workloads across multiple clouds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.6">They also provide the advantage of moving the application from one cloud provider to another with minimum effort.</span></span></p>
<h3 class="head2" id="sc3_865"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">Serverless computing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">As stated earlier, cloud-native architectures can take advantage of the serverless computing model on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.2">In a serverless computing model, the developers only need to write code and deploy it in the software platform of their choice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.3">The hardware and software platforms are maintained by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.4">Microservices and </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">event-driven architecture</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1"> hugely benefit from the serverless computing model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.2">AWS Lambda and Azure functions are some of the examples of the serverless computing model.</span></span></p>
<h3 class="head2" id="sc3_866"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Edge computing</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Edge computing is a model in which the resources, like computing power and storage space, are brought closer to the applications that need them rather than deploying the application to a specific region on cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.2">Given the complexity of data formats and limitations in the network band width, the edge computing model provides greater performance by getting near the application and source of data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.3">The edge computing model is very prevalent in health care and manufacturing applications where the sensitivity and volume of data are high. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.4">The edge computing model provides high performance at locations where the network bandwidth is a challenge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.5">It also helps to adhere to data protection laws, which prohibit the movement of data to locations other than where it was produced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.6">Edge computing is also useful in applications where large amounts of data are produced, analyzed, and acted upon quickly.</span></span></p>
<h3 class="head2" id="sc3_867"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="424" id="page424"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">Content delivery network</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">The cloud offers a feature called the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">content delivery network</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">CDN</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">) to cache the content across multiple points of presence of the cloud provider across the globe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.2">When a user requests content, the request is routed to the cache location that is nearest to the user, and the content is served from that location. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.3">When an application is deployed on the cloud, the back-end services can be configured to use the CDN to serve the data to the user. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.4">If there is a cache miss, the request is routed to the backend service, and in the round trip, the data is cached in the CDN for future requests. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.5">CDN offers the capability to cache content based on a set of keys that can be used to fetch the response. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.6">It is used by applications in which the user needs to download large files, such as videos and images. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.7">This feature is particularly useful for applications offering educational content to users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.8">The content delivery network also provides a capability to demarcate content that is downloadable free of cost versus a download that is allowed only for subscribed users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.9">The CDN can also be configured to make use of secure protocols like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">transport layer security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">TLS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">) that we discussed in </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">, Technical Proficiency Essential Knowledge.</span></span></p>
<h3 class="head2" id="sc3_868"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Financial operations</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">Financial operations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">FinOps</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">) for short, is a framework that lets different divisions in the enterprise work together to continuously innovate ways of optimizing resources to reduce the total cost of the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.2">Cloud is a very dynamic environment, and in large enterprises where multiple units move their workloads to the cloud, the enterprise can lose sight of the cloud services usage, and the costs can shoot up very quickly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.3">It is therefore mandatory for the enterprise to lay down principles of usage for resources on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.4">Teams from information technology, business, and finance work closely to gain real time visibility into the usage of the cloud and help the enterprise to make informed decisions to increase or limit the spending on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.5">FinOps encourages a shared responsibility model in which the budget is allocated by the finance team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.6">The business teams prioritize their application features based on the budget allocated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.7">The technology team makes judicious use of the allocated budget in provisioning infrastructure and other services on the cloud to build applications offering maximum business value to the enterprise and its customers.</span></span></p>
<h3 class="head2" id="sc3_869"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">Infrastructure as code</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">One of the advantages of the cloud is its elasticity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.2">Infrastructure can be created or terminated at will, based on user requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.3">Cloud providers offer the capability to express the infrastructure requirement as code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.4">Each cloud provider has its own syntax to represent their services along with attributes to describe their initial setup and configuration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.5">This is a huge shift in terms of how enterprises deal with their infrastructure requirements on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.6">When the enterprise wants to make a change to the existing infrastructure, the cloud provider allows the enterprise to visually compare the existing and new setups, which helps in making sure that there are no gaps that could cause a potential infrastructure or application outage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.7">AWS CloudFormation and Azure resource manager templates are examples of services that help in defining infrastructure as code.</span></span></p>
<h2 class="head1" id="sc2_870"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Cloud-native reference architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">A reference architecture is a sample blueprint that has all the best practices and industry standard guidelines built into it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.2">Reference architecture for specific technologies or platforms is published by leading engineering companies or organizations formed as a conglomerate of multiple top engineering firms in the world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.3">The reference architecture is vendor neutral and offers guidance to build an architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.4">Enterprises can use reference architecture to build applications with the most appropriate technology stack for each of the layers or components in it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.5">Take a look at the following figure for a better understanding:</span></span></p>
<figure class="center1"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="425" id="page425"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1"><img src="images/Figure_22.5.png" alt="A layered diagram of cloud-native architecture showing components: Applications (Mobile, Web, Desktop), API Platform, Orchestration Tool, Microservices, Container Runtime, Infrastructure (Private, Shared, Serverless), and service layers."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-5"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Figure 22.5</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">: Cloud-native architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">The key components of the reference architecture are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Infrastructure layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">: This provides the required hardware for running the cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.2">The infrastructure can be provisioned to be dedicated (private) for a single customer, or it can be shared (public) with multiple customers (called multitenancy). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.3">The cloud also provides a serverless computing model in which the hardware and software platforms are completely managed by the cloud provider, and the developer just needs to write and run the code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Container runtime</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">: The container run time provides the required platform to deploy and manage the microservices of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.2">Each microservice is created as an image using popular container platform tools like Docker. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.3">These images are deployed and run within the container run time whose instances can be controlled using configuration files. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.4">The image is packaged to have all the dependencies (libraries) required for the microservice to operate and scale independently. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">Microservices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">These are the application microservices within the cloud-native application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.2">These microservices comprise business capabilities that are exposed using well defined interfaces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.3">Microservices lend themselves very well to the cloud environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.4">Microservice instances can be scaled up or down based on business needs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">Orchestration tool</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">: As seen earlier, this manages the number of instances (containers) of the microservices on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.2">It is responsible for creating the required number of containers within the cloud based on the desired state. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.3">The orchestration tool makes sure that the number of instances of a microservice does not go below the desired count. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.4">The user can increase or decrease the number of instances in the desired state through command line tools or through APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.5">The orchestration tool will automatically scale up or scale down the number of container instances based on that user input. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.6">As discussed before, the orchestration tool is also supplemented with a service mesh that provides additional capabilities such as security for interservice communication and enhanced monitoring.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">API gateway</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">: This is the component that exposes the application to internal and external parties. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.2">The APIs are created and deployed to aggregate the calls to the microservices based on business requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.3">The API platform also provides security by authenticating the requests made to the application by interfacing with the identity provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.4">The API platform has the capability to throttle requests to the microservices, thereby avoiding flooding of requests to the application components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.5">API platform supports policies that regulate the number of requests to the application in each period (per minute or per hour).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Integration services</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">: The integration services bring different components in the application together to realize a particular business function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.2">Each microservice communicates with other microservices through this integration layer by exchanging messages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.3">Azure service bus, AWS simple queue service, and AWS simple notification service are some examples of integration services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="426" id="page426"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">Observability layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">: This layer provides the required capability to monitor microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.2">This layer constantly observes the resource utilization for a particular component. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.3">If the resource usage exceeds the threshold, then this data is used to trigger the auto scaling mechanism to spin up additional containers of the service to bring the resource consumption to normal levels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.4">This layer also helps to keep track of requests routed across multiple microservices based on functional requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">Caching</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">: This layer caches the data returned as part of the API response. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.2">All APIs are built to be stateless in a cloud-native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.3">This is an essential design principle of the cloud wherein the infrastructure can be created or destroyed dynamically. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.4">This quality of the cloud necessitates that the applications (microservices) on the cloud are created as stateless services to take full advantage of the dynamic nature of the cloud for scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Access management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">: Identity providers are platforms that provide authentication and authorization services for applications on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.2">Different types of users might have different entitlements within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.3">This is managed by the identity provider, which in most cases integrates with the API layer to provide the required permissions to the users of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.4">Many a time, the permissions are managed as </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">JSON Web Tokens </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">JWT</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">), which encode all the permissions that a user has within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.2">When the user logs in, a JWT is created by the application through the identity provider and sent to the user. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.3">The user sends this JWT as part of every request (as a bearer token) to be allowed access till the active session with the application is terminated for the user.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">Storage</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">: In cloud-native architecture, all microservices have their own database schema and instance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.2">This enables the solutions architect to choose the type of database for the microservice based on the data it handles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.3">For instance, a microservice handling a financial transaction might store the data in a relational database, whereas a microservice handling a document would store it in a document database like an AWS DocumentDB instance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.4">The storage layer also includes capabilities like Azure Blob Storage or an AWS S3 to store file and image objects.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Analytics layer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">This layer of architecture provides insights about all the services included as part of the cloud-native application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.2">A cloud-native application makes use of the native services offered by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.3">For each period, this layer generates reports that can be used to assess the cost of deploying the application on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.4">This helps with a continued improvement of the solution to reduce the deployment and maintenance costs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.5">This layer also helps to procure or allocate a budget for running the application on the cloud for a future period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.6">The solutions architect also gets insights into the most expensive services being used and can look at alternatives or redesign the solution to reduce the overall cost.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">In this section, we covered the reference architecture for the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.2">In the next section, we will take this reference architecture and see how we can deploy the same in Azure, which is one of the popular cloud providers that is being adopted by many of the large enterprises.</span></span></p>
<h3 class="head2" id="sc3_871"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Cloud-native reference architecture on Azure</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">The following is a depiction of the reference cloud-native architecture using Microsoft Azure Kubernetes Service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.2">It depicts a mapping of the components between the reference architecture and Azure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.3">We have taken a few microservices (order, shipping, and invoice processing) from the e-commerce domain as examples for depiction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.4">The reader needs to note that the other popular cloud providers, like AWS and Google, also provide similar components that can be mapped to the reference architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">Additionally, note that in this section, we have used </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Azure Kubernetes Service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">AKS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">) to realize the reference architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.2">It is to be noted that there are other options available with Azure and other cloud providers like AWS and Google. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.3">For instance, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">Azure Container Instances</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">ACI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">) is a serverless model to deploy microservice containers on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.2">In this case, the infrastructure and the software platforms are managed by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.3">Similarly, AWS provides a choice of </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">Elastic Container Service</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">ECS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">) and Fargate to deploy containerized applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.2">ECS provides a managed service option to run containers without the </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="427" id="page427"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">need for Kubernetes, and Fargate is a serverless option to run containers without the customer having to provision any infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.2">Likewise, Google Cloud provides Google Cloud Run service that can be used to deploy containerized applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.3">It is a serverless model in which the number of instances is scaled down when the application is not in use. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.4">The choice of the cloud service used to deploy containerized apps on the cloud depends on factors like cost, complexity of the application and the available expertise to manage these applications independently on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.5">Take a look at the following figure:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1"><img src="images/Figure_22.6.png" alt="Diagram of an Azure Kubernetes Cluster with three microservices (Order, Shipping, Invoice), APIs, databases, service bus, and Azure SDK components including storage, monitoring, Redis cache, Key Vault, and Entra ID."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-6"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">Figure 22.6</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">: Cloud-native architecture on Azure</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">The salient features of the reference architecture for an e-commerce application deployed on the Microsoft Azure platform are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">The Azure Kubernetes Service is the Azure managed service that provides the required container runtime and the orchestration capabilities for architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">Istio is installed for secure inter services communication and enhanced monitoring of the application services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.2">Istio injects its envoy pods alongside the application pods (sidecars) and enables generation of telemetry data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.3">We can optionally install Prometheus as part of the Istio installation to collect telemetry data from the Kubernetes cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.4">Prometheus collects telemetry data from these injected side cars about the traffic moving in and out of the microservice pods, thereby enhancing the overall observability of the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">Azure manages the control plane of the architecture, and all the application microservices are deployed on the data plane of the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">Each microservice has its own data store depending on the nature of the data it handles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.2">For instance, the order and shipping microservices use a relational SQL server database, and the invoice microservice uses an Azure Cosmos NoSQL database.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">The microservices communicate with each other using a services bus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.2">This capability can be leveraged using the Azure Service bus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.3">The Azure service bus provides both the capability of a point-to-point communication (queue based) between two microservices and a broadcast style communication(topic based) between microservices. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="428" id="page428"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">The business capabilities of the application are exposed by the microservices as well-defined interfaces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.2">These interfaces are exposed to the outside world using the API gateway.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">The Azure API gateway provides the required API capabilities to the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.2">It helps to throttle the number of requests per client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.3">The API gateway provides policy configuration that can be used to define usage patterns (consumption per minute, per hour, etc.) for different types of consumers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">The Azure API gateway also connects to the Azure Entra ID service for providing the required authentication and authorization features to the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.2">The API gateway also provides support for </span></span><span class="Code-in-Text--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">http</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1"> responses generated by the APIs, to be served again to the users who make a request with the same payload.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">The Azure Redis cache provides the required support to cache information that is quickly required for any transaction based on business requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.2">The REDIS caches provide the ability for the application to respond to users in a performant manner.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">The Blob Storage used in the architecture can be used to store object-based artefacts like documents, images, and video files. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.2">This acts as persistent storage to hold supporting data in addition to the transactional data stored in the relational database.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">The Azure Entra ID also helps to define role-based access control for the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.2">When a user logs in it authenticates the user and issues a JWT access token based on user’s permissions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.3">This token can be used to access the application APIs and resources for a period, till it expires.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">Azure key vault in the architecture is used to store confidential information like database credentials and API keys. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.2">They provide a cleaner and a secure way of organizing information within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">Azure monitor collects data pertaining to health, availability and performance of the different services used in the architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.2">It collects application data as well as telemetry data about different services used by the application within the azure cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.3">It also monitors and collects data pertaining to the usage of the subscription accounts within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.4">Azure monitor provides a log analytics feature to query and visualize the data collected by Azure monitor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.5">Azure monitor has a built-in feature called application insights to monitor the performance metrices like response time, error rates and throughput of the deployed services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">Having seen the implementation of a cloud-native architecture with one of the popular cloud providers (Azure), we will now discuss the principles and best practices around Migrating non-cloud workloads to a cloud-native architecture.</span></span></p>
<h2 class="head1" id="sc2_872"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">Migrating non-cloud workloads to a cloud-native architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">Moving a non-cloud workload to a cloud-native architecture involves a host of different factors such as organization readiness, willingness to adopt a distributed architecture like microservices, embracing a DevOps culture and structuring teams to align to cloud-native architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">The following are the best practices that a solutions architect can apply to transform a non-cloud architecture into cloud-native architecture:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">Perform assessment of the applications that are candidates to adopt a distributed architecture. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">Leverage methodologies like </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">Domain-Driven Design</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1"> to identify the microservices required for the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.2">The microservices denote the business capabilities required in the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">Use an architectural pattern like event-driven architecture for inter services communication. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.2">A service like an Azure event bus can be used for this purpose.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="429" id="page429"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">Use industry standard design patterns such as 12 factor app design and microservice design patterns to address cross cutting concerns like transaction management, secure inter service communication, and response aggregation from multiple services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.2">Choose an appropriate storage mechanism for each of the microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">Use a service mesh to provide the required capabilities to the cluster for enhanced monitoring and secure communication between services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">Use an API gateway to enable path-based routing to the services within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.2">Create policies to limit the number of requests to each service based on customer needs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">Choose an identity provider that will provide the authentication and authorization capabilities to the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.2">Azure Entra ID and AWS Cognito are popular choices for an identity provider.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">Enable application security by using industry standard frameworks like OAuth 2.0. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.2">Many identity providers, such as Azure Entra ID, provide out of the box support for an OAuth 2.0 implementation within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.3">We will discuss OAuth 2.0 in detail in the section cloud application security.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">Provision TLS certificates for end-to-end secure transmission of data across different layers of the application, such as API gateway, load balancers, containers, and data storage services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Automate infrastructure provisioning for these microservices by using Infrastructure as code principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.2">AWS CloudFormation, Google cloud deployment manager and Azure resource manager templates are popular choices to provision infrastructure using code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Choose and configure features like a CDN or edge computing to ensure faster delivery of services to the users of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">Build the required CI/CD pipelines for the microservice components to be easily developed and deployed in the cloud environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">Package each microservice as a container image with all the dependencies packaged as part of the image.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">Provision appropriate security checks across the layers of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.2">For instance, the API gateway can be secured using a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Web Application Firewall</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">WAF</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.2">The inter services communication can be made secure by enabling mutual TLS between the components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.3">This capability is provided out of the box by a software-like service mesh.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">Choose a suitable container and orchestration platform to deploy microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.2">Azure Kubernetes Service, AWS elastic Kubernetes services are examples of such platforms.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">Leverage the serverless computing model for the application components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.2">Serverless models lend themselves extremely well to microservices and event-driven architectures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">Assess the performance requirements of each of these individual microservice components to provision the required infrastructure and the number of instances required.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Use a canary or blue green deployment strategy to deploy the microservices on the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.2">This strategy will reduce the downtime at the time of application upgrades.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">Enable distributed tracing using tools like AWS X-Ray for easier debugging during problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.2">Leverage tools like ELK to centrally store, aggregate, and visualize application logs. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">Enable telemetry data collection and monitoring using tools like Istio and Prometheus for optimized resource usage and to ensure performance of the application within accepted levels. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">Having seen the principles behind moving a non-cloud application to a cloud-native architecture in this section, we will now discuss the industry standard patterns that can be adopted while designing and developing cloud-native applications.</span></span></p>
<h2 class="head1" id="sc2_873"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="430" id="page430"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">Cloud-native application design patterns</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">The cloud-native design patterns in general apply to microservices architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.2">The solutions architect needs to be conversant with these patterns, internalize them, and identify scenarios for their application during design and development of cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.3">These patterns, when applied, make the solution robust, increase reliability, and enhance scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.4">The most adopted microservices design patterns that apply to cloud-native applications built as loosely coupled microservices are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">Decompose by business capability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">This pattern emphasizes that the microservices in an application can be identified based on the business capabilities required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.2">Once we have a subdomain, which identifies a portion of the business within the larger domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.3">The services within the domain can be identified by capabilities that create value for the business and its customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.4">For example, an order subdomain could have services like customer quote management and order management. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.5">Each of these microservice in turn support several operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">Api gateway pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">: The API gateway pattern emphasizes the inclusion of an API gateway in the microservices architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.2">The API gateway acts as an entry point for the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.3">It performs data transformation, provides routing and response aggregation logic (of multiple microservices), authenticates and integrates with an identity provider for authentication and authorization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.4">It also provides a request throttling mechanism while exposing the application to third party clients. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.5">The API gateway also provides caching capabilities and makes the application performant.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">Circuit breaker pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">: This pattern helps with graceful degradation when one or more microservices fail within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.2">This pattern isolates the fault and does not route the request to the service that is down. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.3">It has a fallback mechanism that provides an alternate service (response) till the time the called microservice (backend system) comes back to operation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">Database per service</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">: This microservice pattern prescribes that each microservice should have its own data store. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.2">This enables the microservice to handle and store data that is more aligned with the business capability being built within the microservice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.3">A microservice that deals with bank account information can use a relational database as its data store, whereas a microservice dealing with a social media platform can store its data using a graph database like AWS Neptune.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">Domain events</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">This pattern is used by an application composed of microservices that communicate with each other using a service bus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.2">Each microservice, when it updates its database, emits a domain event, which is consumed by other interested services to act and accordingly update their database to keep the whole system in harmony.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">Event sourcing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">Instead of storing the current state of the application in a persistent data store, state changes can be stored as a series of events. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.2">This helps the application to replay the changes that have happened over a period and helps to move to a particular state as required by the business capability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.3">The events can be stored in an event store like Apache Kafka.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">Command Query Responsibility Segregation (CQRS)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">: This pattern helps to segregate the database for read and write operations separately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.2">This helps to normalize the read database depending on the type of queries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.3">Each microservice has its own read database that it queries for fetching business information relevant to the subdomain that it is part of. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.4">This pattern helps to improve the performance of the microservice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.5">The read database is updated using domain events every time the write database is inserted, updated, or deleted.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">Saga pattern</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">: The saga pattern defines the principle to manage transactions across microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.2">Orchestration and choreography are the two different ways in which transactions can be managed in the microservices architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.3">In the choreography pattern, each microservice responds to an event and then drops a message in the event bus to be picked up by the next microservice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.4">This continues till the transaction is completed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.5">In the orchestration pattern, there is an orchestrator component which calls each of the microservice taking part in the transaction and issues a signal to either commit or rollback the transaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="431" id="page431"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">In this section, we covered the important patterns that can be used in cloud-native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.2">This will help the solutions architect to solve some of the commonly occurring problems in a microservices application that can be deployed on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.3">In the next section, we discuss OAuth 2.0 that deals with the security of an application built in a cloud-native way.</span></span></p>
