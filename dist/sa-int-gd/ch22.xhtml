<header>
<h1 class="chaplabel" id="ch22"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="413" id="page413"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 22</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Cloud-native Architecture and Design</span></span></h1>
</header>
<h2 class="head1" id="sc2_852"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Cloud-native architecture is about architecting and designing applications for the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">With the cloud becoming an inevitable option over the last decade, all enterprises, large or small, have roadmaps to move their workloads to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The cloud importantly provides a scalable environment that modern-day enterprises need to grow their businesses at a global scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">The cloud provides predictability of infrastructure and platforms on which enterprises deploy their applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">The cloud-native applications are specifically designed to leverage the dynamic nature of the cloud and take full advantage of the services provided by the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.6">Applications tend to gain a lot when they are architected and designed, using industry accepted principles and reference application architectures that have been created and refined over a period and have been adopted by numerous enterprises.</span></span></p>
<h2 class="head1" id="sc2_853"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Cloud-native architecture preview</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Considerations for cloud-native architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Containerization and orchestration</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Deep dive into cloud-native architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Taking advantage of cloud-native architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Cloud-native reference architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Migrating non-cloud workloads to a cloud-native architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Cloud-native application design patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Security in a cloud-native architecture</span></span></p>
<h2 class="head1" id="sc2_854"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="414" id="page414"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">In this chapter, readers will get an overview of the cloud-native architecture and the broad types of services offered on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">The chapter will cover the factors a solutions architect should consider while architecting applications for the cloud, including prerequisites such as containerization and orchestration technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">The chapter will discuss containerization and orchestration in detail, which are the underpinning technologies behind cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.4">We will also cover the design principles guiding cloud-native architecture and the characteristics of cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.5">We will further move on to discuss application reference architecture for the cloud with a specific example of it on a major cloud provider, Azure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.6">Along with the cloud-native architecture, we will also look at best practices for migrating a non-cloud workload to a cloud-native format. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.7">We will also look at the design patterns that cloud-native applications can use to make the architecture robust, modular, and maintainable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.8">We will also cover cloud application security using the OAuth 2.0 framework, which is commonly used to secure cloud-native applications.</span></span></p>
<h2 class="head1" id="sc2_855"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Cloud-native architecture preview</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">The cloud has transformed the way applications are conceptualized, designed, built and deployed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">A cloud-native architecture is one in which the architect takes full advantage of the features offered by the cloud provider to blueprint the solution as a set of loosely coupled services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">In </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, Technical Proficiency Essential Knowledge,</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> we discussed the following four types of computing models offered by popular cloud providers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">They are:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">IaaS</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">PaaS</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">SaaS</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Serverless computing</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Solutions architects leverage one or more of these capabilities offered in the cloud to blueprint and develop cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">Cloud-native applications differ from other applications in that they are developed by keeping the cloud offered services as the first option in a given list of choices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Cloud-native applications are developed as independent software components and, to a large extent, make use of the compute, integration, and data services available on the cloud to build their capabilities rather than getting an external software platform or service to be deployed on the cloud to fulfil the required capability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">Cloud-native applications are born on the cloud and are deployed on public or private clouds offered by providers like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Amazon Web Services</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">AWS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">), Microsoft Azure, and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Google Cloud Platform</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">GCP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Having got an overview of cloud-native architecture, we will look at the factors to be considered for cloud movement and architecting applications for the cloud.</span></span></p>
<h2 class="head1" id="sc2_856"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Considerations for cloud-native architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">The cloud is a very dynamic environment, providing a host of services for different capabilities that are required to build and host applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Before embarking on a journey into the cloud, it is important to understand the factors that influence the development and deployment of applications on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">It is important for a solutions architect to know these factors to decide the suitability of hosting applications on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">We can categorize the factors as operational and technical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">The operational factors relate to regulatory compliance, choice of the cloud provider, organization readiness for the cloud, and the costs associated with the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">The technical factors include application complexity, automation readiness, DevOps adoption, and the ability to monitor and maintain applications on the cloud for the long term.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">The operational factors that will influence the movement to cloud and the cloud architecture to be adopted are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="415" id="page415"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Regulatory compliance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">: This relates to adhering to the laws of the region. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">In cloud-native architecture, all the application components reside on the cloud, including the data generated and used by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">If the application deals with sensitive and private data pertaining to customers, there could be regulations that prevent storage of such data on the cloud infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.4">The solutions architect should be aware of such regulatory implications before coming up with an application architecture that works on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Stakeholder buy-in</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">: The enterprise should initially prepare for cloud migration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">This requires an assessment of their application inventory and prioritizing them based on their mission critical nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">It is not just an architectural decision to move workloads to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">There are business stakeholders who should be kept informed of their applications moving to the cloud, and their buy-in to move to the cloud becomes very critical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">There could be multiple levels of approval required from both the business and technology side before a decision to move to the cloud is taken. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">For enterprises embarking on their cloud journey, it makes more sense to move some of their non-critical workloads to the cloud to test the waters before they move their mission critical applications to the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Choice of cloud providers</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">: All the major cloud providers offer a similar set of services on their cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">Once an application is deployed on the cloud, it takes effort and time to move applications to another cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">Therefore, the decision to choose a cloud provider becomes very tricky and important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.4">The cost of ownership and vendor support could be one of the driving factors in choosing a cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.5">Some of the enterprises might already have an ongoing contract with an existing vendor, based on which the vendor may offer competitive pricing for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.6">Another factor that could affect the choice is the pace and ability of the cloud provider to roll out new services on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Cost and budget</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">: The cloud gives you pay as you go model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">The enterprise must understand the overall cost of ownership to run and maintain its workloads on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">Some of the cloud providers offer discounted pricing models if the enterprise could commit to a set of infrastructure (reserved instances) usage annually. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.4">There are also options in which the customer can avail themselves of discounts if a certain amount is paid upfront. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.5">The solutions architect, hence, should have an overview of the different pricing models available for the enterprise moving to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.6">The solution architect should also look at some of the exclusive and expensive services that the application might need on the cloud and suggest an appropriate solution or an alternative to it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.7">Some of the cloud providers also provide spot instances, which can be used for jobs that can be terminated and continued based on infrastructure availability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.8">Such infrastructure is offered at very low prices to the customer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.9">An architect should carefully craft their solution to make use of the different options available on the cloud, which will reduce the overall cost of application development, deployment, and maintenance on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">After addressing operational factors, solutions architects must also assess the technical feasibility to ensure optimal cloud deployment and long-term maintenance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">The following are the technical considerations for an architect while architecting solutions on the cloud:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Application architecture considerations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">: Cloud-native architecture warrants that the applications be built as smaller components or microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">Most of the applications born on the cloud make heavy use of containerization to scale up or scale down the infrastructure depending on the load to the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.3">A solutions architect should keep this in mind and assess the suitability of the application being architected on the cloud. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">They</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"> should carefully weigh the requirements for cloud suitability and recommend whether the application can be architected for the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">There are other options available on the cloud where applications can be directly deployed using managed services like an Azure App Service or an AWS Elastic Beanstalk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.3">The solutions architect, hence, plays a key role in deciding the appropriate solution for building and deploying applications on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Automate everything</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">: The cloud is a very dynamic environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">Infrastructure can virtually be scaled infinitely. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">When it comes to cloud-native architecture, the applications are built and deployed as independent components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.4">The cloud gives an immense advantage for hosting these kinds of </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="416" id="page416"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.2">However, for provisioning infrastructure and ensuring their scalability, automation plays a key role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.3">Architects need to consider tools like Terraform, Azure resource manager, to help create the required infrastructure for applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.4">When applications are built, there must be proper DevOps pipelines built alongside to support automated building, testing, and deployment of the cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.5">The architect also needs to configure the infrastructure to scale as appropriate automatically using rules provided by the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.6">For instance, you can configure a rule to increase the memory of the computing instance from 8GB to 16GB based on usage. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-31"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">These cloud-native application components, being granular, lend themselves very well to the cloud environment and can scale extremely fast without having to depend on any external libraries or platforms. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Application security considerations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">: Cloud offers a shared security model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">The cloud provider is responsible for the security of the infrastructure provided. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.3">The customer is responsible for the security of the applications deployed on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.4">The architect needs to have a clear understanding of the security measures that need to be put in place for the applications being deployed on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.5">The architect also needs to understand industry accepted standards that are required for the specific data that is being handled and stored, and ensure that the cloud infrastructure and the platform comply with those standards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.6">For instance, PCI DSS is the widely accepted standard for handling credit card data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.7">The architect needs to ensure that the cloud provider is PCI DSS compliant before choosing to deploy and run their applications on that cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.8">The architect also needs to think of solutions for allowing third party partners and applications to access the enterprise’s cloud-native applications being deployed on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Observability considerations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">: Given the dynamic nature of the cloud infrastructure, the architect must devise approaches for monitoring the moving parts of the cloud infrastructure, performance of the applications deployed, and the continued security posture of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">Popular cloud providers offer the required tools for monitoring the infrastructure and application performance on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.3">There are services to check if the infrastructure and other services used comply with a specific configuration as per the enterprise requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.4">Any deviations from the required configuration can result in support or the development team being notified for corrective action to be taken. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.5">As for the cloud-native applications, the architect should leverage the right services for a distributed tracing of the request flow across components. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Having discussed the factors that an architect should consider for deploying applications on the cloud, we will move to the next section to understand how cloud-native applications are architected and developed on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">Containerization is an important concept that allows these components to be packaged and deployed on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.3">In the following section, we will discuss containerization in detail and its counterpart, the virtual machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.4">We will also discuss the topic of orchestration, which helps to manage the instances of an application service deployed on the cloud in the most optimal way as required by an enterprise.</span></span></p>
<h2 class="head1" id="sc2_857"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Containerization and orchestration</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">The way software is developed, packaged, and deployed has changed drastically in the last decade. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">Containerization and container orchestration have transformed the development, deployment, and management of software components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">From large compilation units like a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">web archive</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">WAR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">) or an </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">enterprise archive</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">EAR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">) file containing all the code and configuration artefacts, the software packaging mechanism has come a long way to bundle them as images and run as containers. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Orchestration is the way the containers are managed within the container runtime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">Orchestration tools help to manage the deployed software units, ensuring optimum infrastructure usage and continuous uptime of applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Containerization and orchestration have become an integral part of cloud-native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">They make use of cloud capabilities like hardware clustering and autoscaling to provide the required quality of services that modern day enterprises need for their software applications. </span></span></p>
<h3 class="head2" id="sc3_858"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="417" id="page417"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Virtual machines</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">It is important for a solutions architect to understand the difference between virtual machines and containers, as there is still an ambiguity between the two and they are used interchangeably.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Virtual machines fundamentally virtualize the hardware component of a server or a host. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">This helps us to install multiple guest operating systems on the host machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.3">For instance, you can install a flavor of the Unix operating system on a host running Windows with the help of the virtualization software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.4">There are multiple choices of virtualization software available, such as Oracle VirtualBox and Microsoft Hyper-V.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">The following figure depicts the organization of components in a virtual machine:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1"><img src="images/Figure_22.1.png" alt="A diagram showing virtualization layers: Infrastructure at the base, then Host Operating System, Hypervisor, two Guest OS layers, and four applications divided between the two Guest OS layers above."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Figure 22.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">: Virtual machine</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">The guest operating systems within a single server take up their own resources on the host in terms of memory and computing power. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">When a virtualization software is installed on a machine, it installs a component called the hypervisor, which acts as an interface layer between the guest operating systems and the host operating system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">The hypervisor interprets the commands of the guest operating system and passes on the commands to the host operating system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">It also provides other services to the guest operating system, like networking and resource allocation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.5">Though the virtual machines help to run multiple guest operating systems on the host, the guest operating systems take a good chunk of resources on the host machine, making them heavier and inefficient from a resource usage perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.6">Despite the consumption of resources by individual guest operating systems, virtual machines was a disruptive thought in the direction of hardware utilization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.7">Virtual machines helped to run multiple operating systems on powerful machines, providing efficient utilization of hardware and optimization of cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.8">They importantly laid the foundation for cloud computing by introducing the concept of sharing computing power by multiple users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.9">They also showcased that these individual partitions can be run in an isolated manner, so that the security concerns of one virtual machine do not affect the other virtual machine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.10">The virtual machines also provided fault tolerance, in which the failure of one of the virtual machines did not affect the other virtual machines running on the host. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">The hardware virtualization was taken a step further to give way for the concept of containerization, in which the host system operating system is virtualized rather than the hardware of the host system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">We will discuss containerization in detail in the next section. </span></span></p>
<h3 class="head2" id="sc3_859"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Containerization</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Containerization is packaging of software components in a way that they are independent and self-contained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">The packaged software that can be executed or run using specific commands is called an image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.3">The software component is packaged(image) along with all its dependencies so that it can be deployed and run independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.4">The salient feature of containerization is its ability to create images that are portable and </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="418" id="page418"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">can be run in any hardware and software configuration that has a standardized container run time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">When the images are run, the images are called containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.3">The images are run in a specific environment called the container runtime, which offers a specialized layer over the operating system to host and execute these software containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.4">Docker is one of the popular containers run time that is being used by many of the enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.5">These containers run times are available for most of the popular operating systems like Linux and Windows and the containers deployed and tested in a developer’s laptop can be seamlessly deployed on any other machine running the container run time without any changes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">The following figure depicts the containerization of software components:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"><img src="images/Figure_22.2.png" alt="A diagram showing four vertical blocks labeled Application One to Application Four above three horizontal layers: Container Runtime, Host Operating System, and Infrastructure."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Figure 22.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">: Container organization</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_860"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Orchestration</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Orchestration is an approach using which the containers (microservices) on the cloud are managed in a cloud-native architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.2">Once the application is deployed as a set of containers on the cloud infrastructure, there will be multiple instances of the container running on the cloud, based on a scalability factor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.3">This is to avoid a single point of failure and to spread the load across multiple redundant instances of the microservice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.4">The container instance in some cases runs on a separate physical machine (though it can be shared) to have a standardized configuration for the instance of the container. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.5">Using a container orchestration tool is one of the best ways to manage clusters (group of servers or nodes) and containers on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.6">The orchestration tool ensures that there is optimum utilization of hardware resources in terms of how the containers are deployed and managed within the nodes on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.7">It also provides a completely automated way to keep the desired number of container instances of a microservice running on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.8">If one of the containers gets terminated due to a technical glitch, the orchestration tool immediately spins up a new container of the microservice thereby keeping the number of container instances at a level required to service customer requests within accepted levels of performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.9">It also helps to route requests from one microservice container to another in the most optimum way so that the load on the system is kept in balance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.10">The orchestration tool also exposes a feature in the form of APIs to take inputs from the user to increase or decrease the desired number of container instances for a specific microservice in a cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig22-3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">Figure 22.3</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1"> depicts the major components of an orchestration engine. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">This is based on Kubernetes, a popular container orchestration tool available to manage clusters and containers both on the cloud and on premise as well.</span></span></p>
<figure class="center1"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="419" id="page419"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1"><img src="images/Figure_22.3.png" alt="Diagram showing Kubernetes architecture: the Control Plane with API Server, Controller Manager, Etcd, Scheduler, and Cloud Controller Manager; and the Data Plane with three nodes each running Kubelet and multiple Pods. An arrow connects the planes."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Figure 22.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">: Kubernetes orchestration components</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">The architecture of the orchestration tool is divided into a control plane and a data plane. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.2">The control plane has the components necessary to manage the entire cluster and to keep it in a state of equilibrium based on the needs of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.3">The data plane has nodes into which the microservices containers are deployed and run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.4">The control plane has total control of the data plane and keeps track of all activities that happen within the data plane. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">The components of a control plane are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">API server</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">: This component of the control plane exposes a feature to take inputs through APIs or command line (a tool like kubectl) from the user to create new containers on the cloud and to increase or decrease the number of already running container instances of a microservice at the required level. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.2">The API server is internally wired with other components of the control plane to achieve this. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Controller manager</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">: The controller manager monitors the state of the cluster and keeps the nodes and the containers in each node to the desired state as required by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">This also enables internode communication by enabling the routes required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.3">In the cloud environment, it manages the load balancers required for each service pertaining to the deployment containing a group of pods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.4">Each pod is a computational unit in a host within which one or more containers reside. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.5">A group of pods is clubbed as a deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.6">A service is an artefact created to interact with deployment in the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Scheduler</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">: The scheduler schedules new pods into the nodes based on the resource availability within the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">This component continuously assesses the requirements of the application within the cluster and assigns the pod to a node that has the least load at that point in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.3">It ensures optimal usage of the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Etcd</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">: This is a distributed key value storage which stores the current state of the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">It is a central point of information for the scheduler and controller manager to understand how many nodes and pods are operational in the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.3">Any input from the user through the API server updates the etcd</span></span><span class="Italic"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">database so that the controller manager and the scheduler can pick it up and act on it to adjust the state of the cluster based on the application needs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Cloud controller manager</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">: This is a component of the control plane that has cloud specific logic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">It links the cluster with the cloud providers APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.3">It separates the components in the cluster that interact with the cloud versus others that do not need to interact with the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.4">The cloud controller manager component is specifically for the cloud and is not installed when the cluster is installed on premises.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">The components of a data plane are as follows: </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Kubelet</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">: This is an agent that is present in each of the nodes in the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">This transmits any changes to the nodes and the pods in those nodes to </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="420" id="page420"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">the control plane. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.2">Any node or pod failure is informed to the control plane. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.3">The controller manager and the scheduler act on the data to accordingly to adjust the state of the cluster to maintain the desired state. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Pods</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">: The data plane of the cluster comprises multiple worker nodes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.2">A pod is the minimal computational unit within the node, inside which a container of the application runs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.3">Each node in the data plane can contain multiple pods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.4">Each pod can have one or more containers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.5">As stated earlier, a set of pods is grouped together as a deployment, which enables them to be managed as a single unit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.6">The deployment is exposed to applications external to the cluster using an artefact called the service. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.7">The service specifies the port on which the pods can be reached from the outside world in a load balanced way.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Having seen the components of an orchestration engine, we will cover the best practices for deploying and managing containers within a cluster in the next section.</span></span></p>
<h3 class="head2" id="sc3_861"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Best practices for application deployment</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Once the microservices are developed as containers, the following are some of the best practices a solutions architect can recommend to ease deployment, enable health checks, ensure security, and group resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">It is applicable to Kubernetes, a popular container management tool that is being used widely by enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.3">The details are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Grouping pods as namespaces</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">: Once the application has been containerized as microservices, as a best practice, we can logically group pods in a cluster using a concept called a namespace. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">The namespace is a virtual cluster within the overall larger cluster that allows you to create separate environments for the ease of managing the resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.3">We can have namespaces for different environments like development and testing within the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.4">Namespaces can also be used to segregate type of components like pods containing business logic versus pods that hold database logic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.5">Namespaces also provide role-based access that help to assign permissions at each namespace level. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.6">We can also use namespaces to assign resource limits such as memory and computation power.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Use secrets for secure data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">: Each application uses confidential information like user IDs and passwords to connect to the database and API keys for connecting to external APIs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.2">Instead of hardcoding this information within application code., Kubernetes secrets can be used to store them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.3">This is done by creation of an encryption configuration file and enabling encryption in the API server of the control plane.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Using configmaps for application configuration data</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">: In Kubernetes, application configuration data can be stored in configmaps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.2">It can be used to store environment specific data, which can help write cleaner code within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.3">However, it needs to be noted that the data stored in a configmap is not encrypted. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.4">The configmaps should not be used to store sensitive information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.5">Any update to the configuration information inside the configmap does not automatically reflect in the microservices code deployed as a pod. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.6">Hence, the pods need to be restarted in case of configuration updates.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Implement health checks for microservice container pods</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">: Readiness and liveness probes can be included as part of the pod specification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.2">Readiness tells Kubernetes that a pod is ready and operational to service requests from the client. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.3">Liveness probes inform Kubernetes about the problems encountered by a pod in operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.4">Kubernetes decides either to restart the pod or to destroy it and create a new pod for the microservice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Use Helm for application management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">: Helm is a package manager for Kubernetes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">It aids in packaging different artefacts of Kubernetes like deployments, services and configmaps into a single package called the helm chart. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.3">Usage of Helm charts can help to seamlessly package and deploy applications on the cluster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.4">They also help in maintaining multiple versions of a microservice. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Use horizontal pod autoscalers (HPA)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">: Kubernetes can be instructed to scale up the number of pods based on resource usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.2">HPAs compute the replica count (desired number of pods) based on a </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="421" id="page421"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">threshold resource utilization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">If the resource utilization exceeds the threshold, Kubernetes increases the number of pods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.3">Similarly, if the current utilization of resources falls below the threshold limit, it reduces the number of pods, thereby making optimal use of resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.4">HPAs can be set up through command line tools (kubectl) or through YAML configuration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Now that we have seen containerization and orchestration, the central concepts to cloud-native architecture, and the best practices for their usage, we will </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">go</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1"> deeper into the principles of cloud-native architecture and how cloud-native applications are developed.</span></span></p>
<h2 class="head1" id="sc2_862"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Deep dive into cloud-native architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Cloud-native architecture is an approach in which the application is built as microservices and deployed as containers, making use of the compute, data storage, networking, and integration services of the cloud provider. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.2">Microservices and containerization together provide the backbone of a cloud-native application architecture overseen by an orchestration engine for optimal performance on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.3">We have seen the microservices architecture, its advantages, and applicability in </span></span><span class="Italic"><a href="ch04.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Chapter 4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">, Technical Solutions Architecture and Design. </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">The microservices architecture takes advantage of the dynamic nature of the cloud infrastructure, along with other engineering principles like DevOps, to provide the required functionality and quality of services to the end customer.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Cloud-native architecture lets the solutions architects and developers make use of several features offered by the cloud like infrastructure redundancy, virtually infinite scalability, a shared security model and reliability of hardware and software platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">Cloud-native architecture also stands out in the way they respond to failure situations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">The following are the key principles of cloud-native architecture according to the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">Cloud Native Council Foundation </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">CNCF</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">), an organization that promotes the adoption of cloud-native applications and supported by cloud providers like Microsoft, Google and Amazon Web services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">These principles are fundamental to the adoption of cloud and building cloud-native applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.3">Each cloud provider offers a rich set of run time options and tools to build, deploy and monitor cloud-native applications in a standard way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.4">For instance, Azure provides </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Azure Kubernetes Service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">AKS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">) and AWS provides a similar service called</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1"> Elastic Kubernetes Service </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">EKS</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">) to deploy and run cloud-native applications on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">Moreover, they provide the required auxiliary services for a continuous monitoring of these deployed applications thereby providing a control of how applications should be run and managed on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig22-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Figure 22.4</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1"> depicts the principles of cloud-native architecture for a quick reference:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"><img src="images/Figure_22.4.png" alt="A diagram listing five principles of cloud native architecture: Immutable Infrastructure, Declarative APIs, Containers, Microservices, and Service Mesh, each with a corresponding icon."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig22-4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Figure 22.4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">: Principles of cloud-native architecture</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">The principles of a cloud-native architecture explained as follows helps in blueprinting applications that can lend themselves to be deployed on any of the cloud providers without major customization:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="422" id="page422"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Immutable infrastructure</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">An immutable infrastructure is one which does not undergo any changes after it has been created. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">If the infrastructure after deployment of the application needs a change, the existing infrastructure is torn down, and new infrastructure is provisioned, and the application gets deployed on the new provisioned infrastructure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.3">For instance, if a microservice needs a higher compute capacity due to a demand in throughput, the existing server is destroyed and the microservice gets deployed in a server with multiple cores. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.4">This promotes automation which is very important for a dynamic environment like the cloud where manual management of the cloud resources could be laborious and error prone. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.5">Immutable infrastructure also provides scalability, fault isolation, ease of deployment, and rollback, along with reduced operational tasks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">Declarative APIs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Declarative APIs are APIs that take inputs from the users and help them to realize the end state on the cloud infrastructure, without having the users know how the API works internally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">Declarative APIs are more about what users want rather than how it is achieved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.3">Declarative APIs are very relevant to cloud-native architecture as they help in scaling infrastructure through instructions (infrastructure as code) provided. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.4">They promulgate the acceleration of automation within the cloud infrastructure that can be made use by microservices in provisioning the required infrastructure for their operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.5">These APIs also help achieve consistency of configuration of the provisioned infrastructure across different environments like development, testing, staging, and production, thereby bringing predictability to the cloud environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.6">Examples of declarative APIs include the APIs exposed by the Kubernetes control plane, which help to provision the required resources like pods or services within the Kubernetes data plane.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Containers</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">: We have already discussed the working of containers in the section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Containerization and orchestration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.2">Containerization platforms provide the required runtime for cloud-native architecture in which applications are developed as microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.3">In addition to optimizing resources, containerization also standardizes the platform on which the microservices reside. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.4">This means that a microservice image behaves the same way on a container run time, irrespective of the hardware. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.5">This results in a huge benefit in terms of testing the software early in the lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.6">A microservice developed as an image, run as a container, and tested in a developer’s laptop with a container runtime behaves the same way across different cloud provider environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Microservices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">: Microservices architecture lend themselves very well to cloud-native architecture because of their ability to be deployed independently and be scaled without the need to be dependent on external factors like the hardware configuration or the operating system.</span></span></p>
