			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">Collaborating across teams</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">: Effective communication and collaboration are critical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.2">Solutions architects must regularly engage with cross-functional teams, participate in sprint planning, and use tools like Confluence to document architectural decisions, ensuring transparency and alignment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">Leveraging automation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">: Automation is key in Agile. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.2">Implementing CI/CD pipelines, automated testing, and IaC practices can significantly improve the speed and reliability of deployments, enabling rapid iterations while maintaining quality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">Scaling Agile practices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">: Scaling Agile with frameworks like SAFe requires aligning architecture and business strategy across multiple levels of the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.2">Solutions architects should focus on creating a cohesive architectural vision that supports scalability and cross-team collaboration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">Security and compliance in Agile</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">: Security should be an integral part of Agile development, with security testing, compliance checks, and architectural reviews integrated into the CI/CD pipeline and the definition of done.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="123" id="page123"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">Living documentation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">: Documentation should be treated as a living artifact, updated regularly to reflect the current state of the architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.2">This ensures it remains useful without becoming a bottleneck, supporting continuous learning and improvement.</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">Model answer:</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">This involves designing modular and loosely coupled systems that allow for flexibility in implementation while maintaining the integrity of the overarching architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">During sprint planning, ensure that architectural considerations are included and align with both current requirements and future scalability needs.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style259"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">What role does a solutions architect play in an Agile team?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">In an Agile team, solutions architect ensures that the architecture supports iterative delivery and aligns with business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">You collaborate closely with product owners and Scrum Masters during sprint planning to prioritize architectural tasks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">Additionally, you provide technical guidance during development, help identify technical debt, and ensure that the evolving architecture maintains performance, security, and scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style259"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">Can you describe how you have used Agile frameworks like Scrum or Kanban in your previous projects?</span></span></p>
