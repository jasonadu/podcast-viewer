<header>
<h1 class="chaplabel" id="ch06"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="105" id="page105"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 6</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Agile Processes and Essentials</span></span></h1>
</header>
<h2 class="head1" id="sc2_154"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Agile methodologies have transformed the landscape of software development and project management, shifting the focus from rigid, linear processes to flexible, adaptive, and collaborative approaches. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">These methodologies prioritize rapid delivery, continuous feedback, and the ability to quickly respond to change. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">For solutions architects, this requires a fundamental shift in how they design and architect systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Instead of creating a static, one-off architecture, they must now focus on building flexible, scalable, resilient systems that can evolve iteratively to meet the changing needs of the business.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">In Agile environments, solutions architects play a critical role in ensuring that technical architectures remain aligned with long-term business goals while still allowing teams to deliver value incrementally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">This chapter </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">gets</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> into key Agile frameworks like Scrum, Kanban, XP, and SAFe and highlights the unique contribution of solutions architects within these methodologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Additionally, it explores essential tools such as Jira and Confluence, which are crucial for enabling collaboration, managing architectural tasks, and maintaining project transparency in Agile environments.</span></span></p>
<h2 class="head1" id="sc2_155"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Agile</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Solutions architect role in Agile teams</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Decentralized decision-making</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Aligning architecture with Agile development</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Automation in Agile</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Agile tools</span></span></p>
<h2 class="head1" id="sc2_156"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="106" id="page106"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">By the end of this chapter, readers will gain a comprehensive understanding of Agile methodologies and how they impact the role of a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">The chapter will provide an in-depth look into Agile principles, values, and core frameworks such as Scrum, Kanban, XP, and SAFe, allowing readers to grasp when and how to apply each framework based on specific project requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Solutions architects will learn how their role adapts in Agile environments, balancing short-term delivery goals with long-term architectural vision. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">They will master key strategies for implementing modular designs, managing technical debt, and ensuring architectural integrity in iterative development cycles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.5">Additionally, the chapter will cover the use of Agile tools like Jira and Confluence to efficiently manage backlogs, document decisions, and support team collaboration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.6">Furthermore, solutions architects will explore the importance of defining Agile guardrails that guide teams without restricting their autonomy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.7">By the end of the chapter, readers will also be equipped to tackle Agile-related interview questions with real-world examples and insights, ensuring they are well-prepared for discussions around Agile processes and strategies.</span></span></p>
<h2 class="head1" id="sc2_157"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Agile</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Agile is a dynamic software development approach that emphasizes flexibility, collaboration, and iterative progress. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Unlike traditional methods that follow rigid and linear processes, Agile methodologies adapt to changing requirements, focusing on delivering value to customers through continuous feedback and incremental improvements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">Agile framework breaks down complex projects into manageable pieces, allowing teams to respond quickly to change while delivering high quality and working software regularly.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Let us consider a real-world example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">Imagine you are a solutions architect working on a multi-team project for an e-commerce platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">The business priorities shift based on market feedback, requiring quick adaptation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.4">Agile allows you to continuously adjust the architecture and technical design while delivering high-priority features without disrupting ongoing development.</span></span></p>
<h3 class="head2" id="sc3_158"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Agile methodologies</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Agile methodologies are principles and practices that guide teams to deliver software, in short, iterative cycles called sprints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">They encourage collaboration between cross-functional teams, the involvement of customers or end-users, and constant reassessment of the project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">The primary goal of Agile is to deliver working software that evolves with changing stakeholder needs while reducing risks associated with long-term project planning.</span></span></p>
<h4 class="head3" id="sc4_159"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Architect's role in Agile</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">As a solutions architect, you will prioritize incremental delivery, ensuring that each iteration moves the system toward long-term goals while allowing flexibility for changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">This requires designing an architecture that supports rapid delivery cycles without compromising on quality, scalability, and resilience.</span></span></p>
<h4 class="head3" id="sc4_160"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Importance of Agile in modern software development</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">In today’s fast-paced technological environment, businesses need to react swiftly to market changes, evolving customer needs, and emerging technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">Traditional software development methods like Waterfall can be too rigid, making Agile a preferred choice for organizations seeking to enhance software delivery capabilities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Agile focuses on collaboration and continuous delivery, enabling teams to deliver value faster while ensuring the product remains aligned with business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">Agile methodologies help prioritize tasks based on immediate needs, respond quickly to feedback, and reduce risks such as scope creep or delays in responding to changing requirements.</span></span></p>
<h4 class="head3" id="sc4_161"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="107" id="page107"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Architect's consideration</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">While Agile fosters flexibility, for a solutions architect, it is crucial to ensure that rapid iterations do not compromise the system’s overall architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">You will need to maintain architectural integrity by balancing immediate needs with long-term scalability and performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">With an understanding of the broader impact of Agile methodologies, it is essential to dive deeper into the specific principles and core values that define Agile. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">This foundational knowledge sets the stage for exploring different Agile frameworks and how solutions architects can apply them effectively.</span></span></p>
<h4 class="head3" id="sc4_162"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Overview of Agile Manifesto and core principles</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">To fully grasp Agile methodologies, it is essential to understand the values and principles laid out in the Agile Manifesto, which serves as the foundation for all Agile practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">The Agile Manifesto was introduced in 2001. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">It serves as the foundation for Agile methodologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">It provides a set of values and principles that guide how teams approach software development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">The four key values of the Agile Manifesto are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Individuals and interactions over processes and tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">: Focus on communication and collaboration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Working software over comprehensive documentation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">: Deliver value through functional software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Customer collaboration over contract negotiation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">: Foster ongoing collaboration with customers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Responding to change over following a plan</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">: Be flexible to changing requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">The following are the core principles of the Agile Manifesto:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">The highest priority is to satisfy the customer through the early and continuous delivery of valuable software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Working software is the primary measure of progress.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Welcome changing requirements, even late in development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">Agile processes harness change for the customer’s competitive advantage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Agile processes promote sustainable development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">The sponsors, developers, and users should be able to maintain a constant pace indefinitely.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Deliver working software frequently, from a couple of weeks to a couple of months, with a preference for the shorter timescale.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Continuous attention to technical excellence and good design enhances agility.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Business people and developers must work together daily throughout the project.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Simplicity, the art of maximizing the amount of work not done, is essential.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Build projects around motivated individuals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">Give them the environment and support they need, and trust them to get the job done.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">The best architectures, requirements, and designs emerge from self-organizing teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">The most efficient and effective method of conveying information to and within a development team is face-to-face conversation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">At regular intervals, the team reflects on how to become more effective, then tunes and adjusts its behavior accordingly.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Now that we have established a clear understanding of Agile’s core values and principles, let us examine some of the most widely used Agile frameworks, such as Scrum, Kanban, XP, and SAFe, and how these frameworks shape the role and responsibilities of solutions architects.</span></span></p>
<h3 class="head2" id="sc3_163"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="108" id="page108"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Key frameworks</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">Scrum is one of the most widely adopted Agile frameworks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.2">It is designed to help small, cross-functional teams deliver work in sprints that typically last two to four weeks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.3">Scrum provides a structured yet flexible approach, enabling teams to respond to changes while delivering valuable increments of the product at the end of each sprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig6-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 6.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"> illustrates the Scrum process, showcasing the flow of activities from product backlog refinement to sprint execution and delivery, ensuring continuous iteration and incremental delivery of high-value features:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"><img src="images/Figure_6.1.png" alt="A diagram showing the Scrum framework: product backlog leads to sprint planning and sprint backlog; a 2–4 week sprint cycle includes daily scrum meetings, sprint review, and sprint retrospective, producing increments of work."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig6-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 6.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">: Scrum process</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">The following are the roles in Scrum:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Scrum Master</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">: Facilitates the process, removes impediments, and ensures the team follows Scrum principles.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Product owner</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">: Defines and prioritizes the product backlog (a prioritized list of project tasks), ensuring the team focuses on features that deliver maximum value.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Development team</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">: A self-organizing team responsible for delivering working software during each sprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-34"><span class="Italic"><a href="#fig6-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Figure 6.2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"> depicts Scrum events, highlighting the key ceremonies such as sprint planning, daily standups, sprint reviews, and retrospectives, which facilitate effective communication, progress tracking, and continuous improvement throughout the sprint cycle:</span></span></p>

<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig6-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 6.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">: Scrum events</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">The following are the key concepts of Scrum:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Sprints</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">: Sprints are the heartbeat of Scrum, where ideas are turned into value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">Time-boxed iterations (two to four weeks) during which teams work on a specific set of tasks. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Sprint planning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">: Teams determine which backlog items will be completed in the upcoming sprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Daily standups</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">: Short, daily meetings (15 minutes or less) where team members provide updates and discuss blockers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Sprint reviews</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">: Held at the end of the sprint to demonstrate the completed work and gather feedback from stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Retrospectives</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">: After the sprint review, the team reflects on what worked and what did not, identifying areas for improvement.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">The following are the ways in which Scrum helps in iterative delivery and adapting to change:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Scrum structure ensures that teams work in short, focused bursts, allowing them to deliver incremental changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">This approach makes it easier to adapt quickly to changes in requirements or feedback from stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.3">Solutions architects play a vital role by ensuring the architecture aligns with iterative deliveries while keeping the qualities of service like flexibility, availability, security, performance, resilience, and scalability intact.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">The following is a real-world architect’s role:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">As a solutions architect, you might conduct architectural spikes during sprints to explore and mitigate potential technical challenges, ensuring that the architecture supports both short-term delivery and long-term goals. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">While Scrum follows structured sprints, Kanban offers a more continuous and visual approach to managing workflow. </span></span></p>
<h3 class="head2" id="sc3_164"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Kanban</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Kanban is a visual workflow management method designed to optimize the flow of tasks through a system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">Unlike Scrum, Kanban does not use fixed-length sprints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">Instead, it focuses on continuously pulling tasks into a Kanban board that visualizes stages of work (e.g., To Do, In Progress, Done).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Italic"><a href="#fig6-3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Figure 6.3</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1"> illustrates a Kanban board, a visual management tool used to optimize workflow and track the progress of tasks through various stages, providing teams with a clear overview of ongoing, completed, and pending work items:</span></span></p>
<figure class="center1"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="110" id="page110"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"><img src="images/Figure_6.3.png" alt="A Kanban board with columns labeled Backlog, To Do, In Progress (WIP Limit = 1), and Done. Blue cards are distributed in each column. To the right, a Visual Signal is shown. Commitment and Delivery points are marked above."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig6-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Figure 6.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">: Kanban board</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">The following are the key elements of a Kanban board:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">WIP limit</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">: Kanban emphasizes limiting </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">Work in Progress </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">WIP</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.2">By setting a cap on the number of tasks in progress, teams avoid bottlenecks and focus on completing tasks before starting new ones.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Visual signal</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">: A Kanban board visually represents the flow of work. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">Each task is represented by a card that moves through different stages of the workflow, such as </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">To Do</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">In Progress</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">, and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Done</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.2">This helps teams quickly identify task statuses at a glance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Commitment point</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">: The point where tasks are committed to being worked on, signifying when a task moves from the backlog to active development.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Delivery point</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">: The point where tasks are considered complete and delivered, often marked as the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Done</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"> column on the board. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">The goal of Kanban is to minimize the time taken to move tasks from the commitment point to the delivery point.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">The following are the ways to use a Kanban board:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">The board is divided into columns representing different stages of the workflow as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">To Do</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">In Progress</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Done</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Tasks (cards) move across the board as they progress through the workflow, giving the team a clear, visual representation of how work is moving through the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">The following are the benefits of Kanban:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Optimizes workflow</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">: By visualizing tasks and limiting WIP, teams can focus on completing tasks efficiently rather than starting new ones prematurely.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Continuous delivery</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">: Kanban promotes continuous delivery by avoiding rigid sprint cycles, allowing teams to push completed work at any time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Flexible</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">: Teams can add, modify, or reprioritize tasks at any time without disrupting the workflow.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">The following are the ways in which Kanban differs from Scrum:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Kanban offers more flexibility than Scrum, making it ideal for environments with unpredictable task flows, such as support or maintenance teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.2">While Scrum is more structured with time-boxed sprints, Kanban prioritizes flow efficiency and continuous delivery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">The following is the architect’s role in Kanban:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">As a solutions architect in a Kanban environment, your role would involve designing systems that can handle continuous updates without causing disruptions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">You will focus on maintaining workflow visibility and optimizing throughput.</span></span></p>
<h3 class="head2" id="sc3_165"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="111" id="page111"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">Extreme Programming</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">XP is a software development methodology aimed at improving software quality and responsiveness to changing customer requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.2">XP focuses on collaboration and achieving a high standard of technical excellence through the following key practices:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">•	</span></span><span class="Normal--BPB-HEB--Char CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Pair programming</span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">:</span></span><span class="CharOverride-2"> </span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Two developers work together at one workstation, with one writing code while the other reviews it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.2">This collaborative approach not only improves code quality by catching issues early but also facilitates continuous knowledge sharing between team members.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Test-Driven Development (TDD)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">: </span></span><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">TDD is a practice where developers write automated tests before writing actual code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">This ensures that the system behaves as expected and helps catch issues early in the development process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.3">It also leads to cleaner, more maintainable code by promoting the development of only the required functionality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Refactoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">: Refactoring involves restructuring the codebase to improve its internal structure without changing its external behavior. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">This practice improves code maintainability, reduces technical debt, and ensures that the system can evolve over time without becoming brittle or difficult to modify.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Continuous integration (CI)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">: XP emphasizes the importance of integrating code changes into the main branch multiple times a day. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">Continuous integration ensures that the system remains stable and functional as changes are made, reducing the risk of integration issues and maintaining a steady development cadence.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">The following are the ways to focus on quality and engineering excellence:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">XP’s focus on these engineering practices ensures that teams produce high-quality software while remaining flexible in response to changing requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">Practices like TDD and pair programming help reduce bugs, promote cleaner code, and improve overall software quality, while continuous integration ensures that small, frequent changes are integrated without breaking the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">The following is the architect’s role in XP:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">The architect's role in XP involves ensuring that technical decisions align with business goals while maintaining the simplicity of design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.2">They facilitate collaboration by guiding developers during pair programming and ensuring adherence to XP practices like TDD and continuous integration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.3">The architect also monitors refactoring efforts to keep code maintainable and support iterative improvements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.4">They act as a technical mentor, helping teams navigate complex challenges without compromising quality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.5">Finally, they focus on building a scalable and adaptive architecture that can evolve seamlessly with changing requirements.</span></span></p>
<h3 class="head2" id="sc3_166"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Scaled Agile framework</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">The </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Scaled Agile framework </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">SAFe</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">) is designed to scale Agile practices across large enterprises, particularly in organizations where multiple teams work on the same product or portfolio. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.2">SAFe provides a structured approach for aligning Agile principles across different organizational levels, ensuring coherence and consistency in Agile adoption.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">The following are the levels of SAFe:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Team level</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">: At this level, individual Agile teams operate using Scrum or Kanban, working in short sprints or cycles with daily standups to ensure rapid progress and alignment within the team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Program level</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">: This level involves multiple Agile teams working together toward a shared objective, forming what’s called an </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Agile release train </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">ART</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.2">A release train engineer (similar to a Scrum Master for the program) coordinates the activities of all teams, ensuring they remain aligned with program-level objectives.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="112" id="page112"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">Portfolio level</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">: The portfolio level aligns Agile development efforts with the organization's overall strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.2">It focuses on managing value streams, funding initiatives, and ensuring that development efforts support the organization's long-term goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.3">Governance and prioritization of initiatives occur at this level.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">The following is the role of architects in SAFe environments:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">Solutions architects play a crucial role in SAFe environments by ensuring that the architecture aligns with the long-term business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">They coordinate across multiple Agile teams to ensure that systems are designed for scalability, reliability, and performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.3">Architects also help manage technical dependencies across teams, guiding them in following architectural best practices while ensuring that each team’s solutions integrate seamlessly into the overall system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Each Agile framework offers a unique approach to managing projects and delivering software incrementally, but the role of a solutions architect must adapt across all of them. </span></span></p>
<h2 class="head1" id="sc2_167"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">Solutions architect role in Agile teams</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">In traditional software development methodologies, solutions architects typically define the entire system architecture upfront. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.2">This approach, while suitable for linear models like Waterfall, can be too rigid for Agile environments, where requirements and priorities often change during development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.3">In Agile, the role of a solutions architect shifts from delivering a comprehensive, static architecture to supporting an iterative, adaptive design process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.4">Rather than creating a detailed architecture at the start, architects must ensure the system is flexible enough to evolve over time as new insights emerge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">The following are the key aspects of the shift:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">Incremental architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">: Instead of planning all details upfront, Agile solutions architects design modular systems that can evolve incrementally as each sprint delivers new features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.2">This allows teams to make architectural adjustments based on real-time feedback and changing business requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">For example, in a microservices architecture, rather than designing all services upfront, the architect might first create a few core services, then iteratively add more services as new business needs arise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Early architecture planning with flexibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">: While some foundational architecture is still necessary early in the project, Agile solutions architects must recognize that initial designs may need to be revisited and adapted. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.2">The architecture must be flexible to accommodate evolving technical requirements and business priorities without creating unnecessary rework or technical debt.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">For example, in an e-commerce platform, the initial design might focus on scalability for user logins and payments, with flexibility to later incorporate more complex modules like product recommendations or inventory tracking.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">Supporting Agile principles</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">: Agile architecture aligns with principles like simplicity, feedback-driven improvement, and continuous delivery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.2">Solutions architects focus on maintaining a balance between immediate technical decisions and long-term architectural goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">For example, the solutions architect might simplify the data flow in the initial sprints by using a single data source for reporting, knowing that future iterations will introduce more complex data integration layers based on user feedback.</span></span></p>
<h3 class="head2" id="sc3_168"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Continuous collaboration</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Effective communication is crucial for the success of Agile teams, and solutions architects play a central role in ensuring that the architecture aligns with both business needs and technical capabilities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.2">In Agile, collaboration between architects and cross-functional teams is ongoing and iterative.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="113" id="page113"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">The following are the ways for engaging with product owners and Scrum Masters during sprint planning:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">In Agile environments, sprint planning is a vital moment for ensuring that architectural considerations are addressed early in each iteration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.2">Solutions architects work closely with product owners to understand business priorities and identify the technical implications of the user stories selected for the sprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Architects also collaborate with Scrum Masters to remove any impediments related to architecture that could block the team’s progress. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.2">By being part of sprint planning sessions, architects ensure that the architecture evolves in sync with the product roadmap and stakeholder expectations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">For example, in a healthcare project, the product owner may prioritize building a user-friendly patient dashboard. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">The solutions architect helps identify the necessary backend systems that will support the data flow for the dashboard, while the Scrum Master ensures that technical blockers are cleared during the sprint.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">The following are the ways for facilitating architectural discussions during sprints:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">Throughout the sprint, solutions architects engage in ongoing architectural discussions to ensure that the team is making the right technical decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.2">These discussions focus on balancing immediate delivery goals with maintaining the system's long-term integrity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Architects also play a key role in refining the architecture as the sprint progresses, offering guidance on how to approach technical challenges without deviating from the broader architectural vision. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">For example, during the sprint, if the team faces performance issues with data processing, the solutions architect may suggest optimizing the database schema or implementing caching mechanisms to improve performance while staying aligned with the overall architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">The following are the ways for working with cross-functional teams:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">Agile teams are typically cross-functional, comprising developers, testers, designers, and business analysts, all of whom collaborate to deliver a product increment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">Solutions architects bridge the gap between different team members by ensuring that architecture is aligned with business objectives, while still being technically sound and efficient.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">Architects often lead the development of technical solutions that fit within the Agile framework, ensuring that everyone, from front-end developers to backend engineers, understands the architectural strategy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">For example, in a fintech project, a solutions architect might coordinate between the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">user experience </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">UX</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">) or</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1"> user interface </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">UI</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">) designers and the backend development team to ensure that data security controls are built into the user interfaces for financial transactions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">With these responsibilities in mind, solutions architects must also maintain the balance between flexibility and long-term architectural goals.</span></span></p>
<h3 class="head2" id="sc3_169"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">Architectural spikes</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">In Agile, a spike is a type of exploratory task aimed at investigating a particular technical challenge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">Architectural spikes, in particular, are used when the team needs to explore or evaluate different architectural options to mitigate uncertainty. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.3">Spikes allow teams to gain a deeper understanding of a technical issue or assess potential solutions without committing to full implementation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">The following are the ways to use architectural spikes:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">High technical uncertainty</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">: When there is ambiguity or a lack of clarity about how to approach a complex technical problem, an architectural spike is a helpful tool. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.2">For instance, if there are multiple ways to implement a new feature and each presents different technical challenges, the team can run a spike to explore the pros and cons of each approach.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="114" id="page114"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">For example, in an AI-driven application, the team may run a spike to evaluate different machine learning models and their impact on system performance and scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Evaluating new technologies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">: If the team is considering adopting a new technology or framework, an architectural spike can be used to assess its feasibility, integration with the existing system, and potential risks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">For example, a team evaluating whether to migrate from a monolithic architecture to a microservices-based system might run a spike to explore containerization technologies like Docker and Kubernetes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">The following are the steps to run a spike to evaluate technical solutions:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">1.</span></span><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732 CharOverride-10">	</span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Define the problem or uncertainty</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">: Identify the specific architectural challenge that needs investigation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.2">This could involve a new integration, scaling challenges, or evaluating performance under different conditions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">2.</span></span><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732 CharOverride-10">	</span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">Set clear objectives</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">: Establish measurable goals for the spike, such as determining which architectural pattern to use, assessing the impact of a technology change, or identifying performance bottlenecks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">3.</span></span><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732 CharOverride-10">	</span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Time box the spike</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">: Allocate a fixed period for the spike, typically one sprint or less. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.2">This ensures the spike remains focused and does not consume too many resources.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">4.</span></span><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732 CharOverride-10">	</span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">Explore and experiment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">: The team conducts experiments, runs tests, and gathers data to answer the spike’s objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.2">Solutions architects work with the team to explore different architectural options, often developing proof-of-concept implementations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">5.</span></span><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style732 CharOverride-10">	</span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">Document and review the findings</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">: At the end of the spike, document the findings and make a recommendation for the way forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.2">These findings can then be used to inform future sprints or architectural decisions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-19"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">For example, after running a spike on different database solutions for a highly transactional system, the team recommends switching to a NoSQL database like MongoDB due to its performance advantages.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">While spikes help in managing uncertainty, empowering teams to make decisions independently is equally important for fostering agility.</span></span></p>
