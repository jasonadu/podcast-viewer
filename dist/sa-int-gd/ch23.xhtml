			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Anomaly detection</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">: Anomaly detection is the identification of patterns that are deviating from the normally seen and accepted patterns within an application, about any quality of service being measured, like performance and security. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.2">Many of the application monitoring tools monitor traffic to systems for a period and baseline normal patterns as a machine learning model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.3">They use this </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="449" id="page449"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">baselined model to detect any unusual behaviour within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">This could be in terms of an unusual spike in the load on the system at specific times of the day, entries in the log files that normally do not happen, requests coming from IP addresses apart from regions where the enterprise runs its business, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.3">These models continuously monitor the oncoming data into the system and flags off any data point that are outside of the baseline range.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">Intelligent bots</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">: Usage of intelligent chatbots built using the principles of AI has become a regular feature in the resolution of customer issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.2">Production support personnel also use intelligent chatbots to search through huge corpus of known error knowledge bases to get the right content pertaining to the solution of customer reported issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.3">Chatbots are also deployed to interpret customer problems and create support tickets based on the type of issue reported. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.4">They also create a workflow and trigger appropriate teams to attend to issues if the issue resolution requires manual intervention. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.5">Chatbots are useful when integrated with services to support multiple languages or perform language translation to answer queries in the user’s language of choice.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">Self-healing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">: Many AI based automated solutions deployed in the production environment can continue monitoring data points from application monitoring tools and can act on deviations seen in the normal functioning of applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.2">An AI based monitoring solution can switch on the caching feature within the application during the peak hours of application usage to reduce the load on the application’s database or operational systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">Cost optimization on cloud</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">: Intelligent algorithms continuously assess the usage of the infrastructure on cloud platforms and can provide suggestions to scale down or terminate hardware that is not used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.2">Alternatively, it can also provide recommendations to use aggregated or enhanced sizes of compute machines based on their current configuration and their usage by the application.</span></span></p>
<h2 class="head1" id="sc2_907"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Key performance indicators in production support</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">Key performance indicators</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">KPIs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">) are used to measure the efficiency of production support operations within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.2">It helps to understand how well each one of the support levels (L0 to L3) works. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.3">The cost increases for the enterprise as the issues reported escalate up the support chain from L0 to L3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.4">It is important to measure the response time and quality of support provided at each level and ensure that the customer is provided with the required support at the earliest possible opportunity and time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.5">The KPIs also help to understand the gaps in training, and the enterprise can choose to introduce new tools or upskill the support personnel at each level to close the gaps. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">KPIs that can be used to measure the efficiency of the production support function are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Incident volume</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">: Number of incidents reported in a period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.2">It helps to categorize the type of incidents and helps in addressing areas where there are regular incidents being reported. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.3">This indicates the cost of quality incurred in the build and maintenance of the software. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Mean time to resolve</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">: This is the average time taken to resolve the incidents reported. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.2">This measures the efficiency of the resolution process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.3">This metric helps to understand if additional training and resources are required within the team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.4">This also helps to see if all incidents are resolved within their SLA.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Mean time for RCA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">: Average time taken to perform root cause analysis of incidents. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">The team aims to reduce the time taken for root cause analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.3">RCA helps to make permanent fixes to prevent similar incidents from recurring.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">Service uptime</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">: This is the time during which the software application was operational within a given period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.2">It is important for production support teams to keep services up as per the service level agreement and ensure that planned downtime is kept to a minimum.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Incidents re-opened</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">: This metric ensures that the incidents re-opened by the customers are kept to a bare minimum, as it is directly related to the business reputation and money spent on support activities. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="450" id="page450"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">Incidents responded to within SLA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">: This is the end-to-end time between raising an incident and the resolution provided, including possible escalations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">This needs to be kept to a bare minimum and translates to customer satisfaction.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">Known error database (DB) usage rates</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">: This metric is used to identify the effectiveness of the known error DB usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.2">It can also be used to assess the number of misses from the known error DB that points to new types of incidents being reported regularly.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Customer satisfaction index</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">: This is the overall customer satisfaction score with regard to the support provided for the services and products offered by the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.2">This can be collected through formal customer satisfaction surveys.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">Having seen the important metrics to measure the efficiency of the production support process, we will now discuss the factors that contribute to the success of a production support function.</span></span></p>
<h3 class="head2" id="sc3_908"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">Improving production support efficiency</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Production support is about continuous improvement of the process to reduce the time it takes to resolve customer issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">The factors that can considerably improve production support in terms of the efficiency with which a resolution is provided to the users of the application are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">Domain knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">: Imparting domain knowledge of the application to the production support team becomes a key to understanding issues better. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.2">Without the functional knowledge of the application, the production support personnel treat incidents as one-off technical issues, which may reduce the overall efficiency of the process. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Trend sensing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">: A continuous analysis of the incidents reported, and patterns drawn from those incidents reported in the system helps the production support team to be prepared for seasonal issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.2">For example, there will be a spike in the load of e-commerce applications during festival times, and performance issues could be reported.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Knowledge management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">: The team needs to continuously build a known error database which has all the analysis and resolution details for the incidents reported within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.2">This helps in the long run to quickly analyze issues without having to start all over again. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.3">Many production support teams also build sophisticated chatbots and roll them out to the production support team to query the known error database to quickly resolve issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Self-help mechanism</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">: To create efficiency within the production support function, it is imperative to build an effective self-help mechanism, using which the users can solve many of the problems themselves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.2">Enterprises end up spending additional dollars for each of the support calls reaching higher up the support chain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.3">The production support team, in discussion with the development team, should create content that users can help themselves with most of the commonly occurring problems while using the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.4">These could include videos explaining the usage of services, FAQs to contain answers related to common issues customers face, and a self-help portal where users can discuss possible solutions to their problems and refer to blogs about the usage of newly introduced features. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Modern engineering practices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">: Enterprises should adopt modern engineering practices like DevOps to help improve the cost of quality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.2">If an issue is found and fixed earlier in the development lifecycle, it lessens the cost of quality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.3">Each team should have the required quality gates to ensure that the product rolled out to production is bug free. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.4">The quality gates pertain to not just validation of functional requirements but also other quality of services like performance and security which are important from a customer usability perspective.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Having seen the factors that make the production support function effective, we will now look at a checklist that the production support personnel can use to measure efficiency, reduce gaps, and improve the process continuously.</span></span></p>
<h2 class="head1" id="sc2_909"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="451" id="page451"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">A production support checklist</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">The following is a checklist based on modern day production support operations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.2">This can be used by production support teams to make their process effective and productive.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">The checklist is as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">The production support team has been trained on the application domain and required technology.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">The support team has access to a quality operations manual pertaining to the working of the application and possible workarounds in case of issues reported.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">The production support has standard operating procedures for different types of issues that could be reported within the application in production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">The production support team has a well-defined escalation matrix depending on the type of issue reported.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">The production system has a robust framework for release management.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">The production support team has documented the procedure for release management and socialized it with the solutions architects and development teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">The production support team runs a self-help portal for the customer to perform the first level of troubleshooting.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">Production support has a schedule to perform regular adaptive maintenance to keep the application environment in sync with changes in hardware and software platforms.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">Production support team performs regular preventive maintenance to avoid failures from occurring.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">The production support team has created a known error database and continually updates it.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">The production support team performs regular root cause analysis of the issues reported and resolved in the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">The production support team is being regularly trained with the latest application monitoring tools in the industry.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">The production support team deploys machine learning algorithms to forecast deviations in the quality of services like performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">The production support team uses intelligent bots to get answers to customer problems to save cost and time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">The production support team has automated the creation of tickets, set up workflows, and triggered manual intervention for issues reported by users.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">The production support team uses AI based application monitoring tools to set baselines for normalcy and identify deviations from normal operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">The L3 team regularly participates in Agile standups to collaborate with the development team to prepare for the release of new software versions and applications. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">In modern day enterprises, the solutions architect plays a key role from architecture definition to application development and deployment of applications to production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.2">Hence, in a solutions architect interview, a solutions architect might be expected to explain their contribution to the movement of applications to production and their recommendations for effective long-term support and continuous improvement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.3">Therefore, it is important for a solutions architect to be conversant with the production support process. </span></span></p>
<h2 class="head1" id="sc2_910"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="452" id="page452"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">In this chapter, we looked at different aspects of the production support function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.2">This is one of the areas that the solutions architects and developers pay less attention to. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.3">However, the knowledge of this area helps the solutions architect to contribute to making the production support function effective, productive and innovative. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.4">With that in mind, in this chapter, we covered the important topics like stages, levels and types of support offered by enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.5">We also discussed the lifecycle of the production support process followed by KPIs that help to continuously improve the production support function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.6">Finally, we discussed as to how AI is transforming the production support function by offering innovative ways of monitoring and managing software systems in production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">In this book, we had so far looked at different facets of the skills required for a solutions architect to not only ace </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">their</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1"> interviews but also succeed in </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">their</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1"> job. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.2">We covered important technical concepts regarding software architecture and design, soft skills required and operational techniques that can help them to navigate easily through the complexities of modern age software enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.3">The learning and expertise that you have acquired through this book will provide a foundation for a successful solutions architect career. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.4">The next chapter will reflect on the journey to interview success and will discuss the path ahead from here.</span></span></p>
<h2 class="head1" id="sc2_911"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">Key takeaways</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">The takeaways are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">Understand how solutions architects can help improve efficiency of a production support function.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">Learn the different types of maintenance carried out by enterprises to address current problems reported and futureproof their application from failures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">Understand different types of support provided by enterprises to customers regarding product and service usage. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">Learn the lifecycle of a product in production support and responsibilities for each of the phases in the lifecycle. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">Understand the role of machine learning and artificial intelligence in production support processes making them innovative and productive.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">Learn the key performance indicators and a checklist for an efficient functioning of the production support function.</span></span></p>
<h2 class="head1" id="sc2_912"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">Model interview questions and answers</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">1.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">How can a solutions architect help in improving the efficiency of production support teams?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">The solutions architect can educate and train the production support technical team on the architecture of the system and the integration touch points between the layers of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">The solutions architect can design appropriate log mechanisms within the application that can help to troubleshoot issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.2">This can include relevant attributes to index and search, content to be logged, and appropriate log levels.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">The solutions architect can suggest appropriate application monitoring tools like AppDynamics and Splunk for effective monitoring of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">The solutions architect can recommend production support teams in the areas of preventive and perfective maintenance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="453" id="page453"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">What are the different levels of support provided by production support teams?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">Production support in general consists of four levels of support from level 0 to level 3.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">Level 0 support aims to equip the application users with self-help content to troubleshoot issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">Level 1 is the basic help desk support to help users with navigational issues, carrying out simple business functions within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">Level 2 provides technical support with resolving incidents by making simple application configuration and minor fixes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">Level 3 team provides expert support on issues escalated by level 2 teams and involves application design changes, addition of new hardware, and software platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.2">They also plan for new software releases by working closely with the solutions architects and the development team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">What is the difference between preventive maintenance and perfective maintenance?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">Preventive maintenance is done to prevent failures from happening.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">Perfective maintenance is done to help the application perform better than its current performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">An example of preventive maintenance is the addition of extra hardware to counter the sudden spike in the load and deterioration of response time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">Perfective maintenance could be an addition of a caching layer within the application to improve the response time of the read operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">What are the different types of maintenance of an application?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">Corrective, adaptive, preventive, and perfective maintenance are the four types of maintenance carried out in the production environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">Corrective maintenance deals with analyzing and fixing issues reported by users within the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">Adaptive maintenance is done to keep the application up to date with changing hardware and software platforms in the industry.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">Preventive maintenance is carried out to prevent any failures from occurring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.2">This includes the incorporation of health checks and monitoring of critical components within the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">Perfective maintenance is done to make the application perform better in terms of performance, scalability, security, and reliability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">What are the stages in the production support lifecycle?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-24"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Incident management, problem management, change, capacity, and release management are the different stages within the production support lifecycle.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">Incidents are issues reported by the users of the application, and recurring incidents become a problem for which a root cause analysis needs to be done and a permanent fix needs to be made.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">According to ITIL, change management is the addition, modification, and removal of anything that could have an impact on IT services (applications) delivery.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="454" id="page454"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">Release management comprises all activities for a controlled and streamlined release of software into the production environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">Capacity management is the process that ensures that the infrastructure needs of the enterprise are met for efficient operations of the IT systems so as to realize the existing and future business goals of the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">How can we proactively avoid issues in production systems?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">Proactive support can be implemented using machine learning models that have learnt from past data and can forecast problems that can happen in the near term. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.2">For example, an ML model deployed can forecast the occurrence of a series of major GC within the application and can trigger a warning email to the production support team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">Application monitoring tools can be configured for proactive monitoring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.2">Tools listen to the oncoming traffic to the application for a set period and create a baseline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.3">It can then flag data points which are deviating from the set thresholds using the baseline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.4">This could include throughput, response time, number of errors, and exceptions within the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">Can you list four important key performance indicators used by production support teams?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Mean time to resolve</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">: This is the average time taken to resolve the incidents reported. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.2">This measures the efficiency of the resolution process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.3">The team makes every effort to reduce this. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">Service uptime</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">: This is the time during which the software application was operational within a given period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.2">This KPI helps to ensure that the business operations are not impacted.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">Incidents reopened</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">: This metric ensures that the incidents reopened by the customers are being kept to a minimum.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">Incidents responded within SLA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">: This is the end-to-end time between raising an incident and the resolution provided within the SLA. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.2">This helps to retain customer confidence.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style749 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">What role does artificial intelligence play in long term support of applications? </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-21"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">Model answer</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">Artificial intelligence can create baselines of quality of services of applications, like performance and security, and flag off anomalies from normalcy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">AI and ML can help create models that can forecast problems that can happen in the near future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.2">For example, ML models can be deployed to forecast frequent major garbage collection happening in the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">Intelligent chatbots can search through massive amounts of resolution related content and provide answers to customers and production support personnel.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">AI bots can create tickets based on issue types and can initiate workflows for effective tracking and resolution of issues reported.</span></span></p>
