<section epub:type="chapter" role="doc-chapter">
<header>
<h1 class="chaplabel" id="ch23"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="439" id="page439"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 23</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Production Support</span></span></h1>
</header>
<h2 class="head1" id="sc2_883"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">Production support includes the set of activities to maintain applications after they have been developed, tested, and deployed into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Long term support of applications is an area where most enterprises spend millions of dollars every year. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">The production support team is the face of the enterprise to the outside world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">The quality and timeliness of the response to queries of customers regarding system usage and resolution to incidents raised becomes one of the important factors for the continuance by customers with the product or services offered by an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">Effective production support involves the right mix of people, process, and technology to come together. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.6">Production support is an area that is evolving fast, like any other within the software world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.7">Innovative processes supplemented by state-of-the-art tools are continuously disrupting the way production support is being carried out in large enterprises.</span></span></p>
<h2 class="head1" id="sc2_884"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Production support overview</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Solutions architect’s role in production support</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Types of maintenance</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Levels of production support</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Production support lifecycle</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Artificial intelligence in production support</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Key performance indicators in production support</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">A production support checklist</span></span></p>
<h2 class="head1" id="sc2_885"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="440" id="page440"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">In this chapter, we will discuss what production support is and the terminology used in the production support arena of software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">We will understand the role of solutions architects in the production support function and how they can help improve process efficiency.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">We will discuss the types of maintenance carried out by enterprises to address current problems reported and to future proof the system from failures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Following this, different types of support provided by enterprises to customers regarding product and service usage will be covered. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">We will also cover the lifecycle of a product in production support and responsibilities for each of the phases in the lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">A section highlighting how machine learning and artificial intelligence have made production support processes more innovative and productive has been discussed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Moreover, we will cover key performance indicators and factors for the efficient functioning of the production support team, followed by a checklist for the production support team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Finally, we will discuss questions and pointers to answers to prepare solutions architects for interviews in which they may be expected to know the breadth of </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">software development life cycle</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">SDLC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">) from software architecture to development and maintenance.</span></span></p>
<h2 class="head1" id="sc2_886"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Production support overview</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Production support comprises all activities required to keep a software system in the desired state of operation after it has been moved to production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">The activities vary from setting up a help desk for customer support to answer queries regarding the usage of the products and services of an enterprise to analyzing major application gaps reported by users and giving them workarounds till the issues are fixed by the development team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">Production support also includes monitoring the application configuration and fixing any deviations from the ideal set as given by the development team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.4">The production support team also supports new releases by monitoring the deployed application and reporting any anomaly that could have an impact on the quality of services, like performance and availability. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Apart from monitoring and maintaining applications in a desired state, the production support team also takes care of the operational side of things. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">They maintain the infrastructure in an ideal state as required by the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">They quickly respond to triggers emitted by the hardware and software platforms and take immediate action to prevent failures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.4">The production support also regularly patches the platforms on which the application is deployed to keep the platform current and prevent any performance and security related incidents. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.5">They also provide the required professional support to understand user expectations and see if there are any gaps in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.6">These gaps are analyzed and reported to the development team on a regular basis, who, in turn, close those gaps by introducing code fixes or additional features in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.7">Thus, the production support teams act as a bridge between the users of the application and the development team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.8">They also provide regular reports to the management stakeholders about the type of incidents being reported and solved to give a clear picture of the quality of service and ensure that the business goals of the enterprise are met.</span></span></p>
<h2 class="head1" id="sc2_887"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Solutions architect’s role in production support</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">A solutions architect plays a key role in realizing the vision of a software project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">They blueprint and design software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">They have a combined knowledge of the business domain and the technology landscape. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">They are positioned very well to assist different teams during all phases of the software development lifecycle, including production support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">In turn, software architects having a deep understanding of the production support function help them to design features that lend themselves to easier long-term support.</span></span></p>
<h3 class="head2" id="sc3_888"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="441" id="page441"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Essential knowledge for solutions architects</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Solutions architects in modern day enterprises are expected to possess knowledge of areas that help application stability, efficiency, and availability in production, and artefacts that help the production support personnel to efficiently troubleshoot reported issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">These areas are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Log management in production</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">: Log and audit trails are the guiding light for the development and support teams to troubleshoot issues reported in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Knowledge of different types of log files and the production support team’s expectations in their structure and granularity needs to be understood by the architect to incorporate them as a nonfunctional requirement within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">The architect also needs to understand how the log files are being indexed and searched within the production support environment to incorporate the right log structure and content.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Deployment architecture</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">: The solutions architect needs to be conversant with different types of deployment architecture that can help the company to quickly overcome failures and ensure business continuity. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">They need</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> to understand the criticality of the system in conjunction with the deployment architecture patterns to come up with an optimum deployment option. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">For instance, the solutions architecture can suggest a cold or a warm standby depending on the criticality of the different components within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">The solutions architects will also be in the best position to recommend the number of instances of microservices in production in collaboration with the performance architect, since they have knowledge of the service level agreement for different qualities of services of the software system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Business continuity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">: The solutions architect needs to be aware of the vocabulary used in the production support domain to contribute actively to the preparation of disaster recovery and business continuity plans. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">Solutions architects need to understand the </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">recovery time objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">RTO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">) and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">recovery point objective</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">RPO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">), and this helps them to make necessary changes to the architectural blueprint to support them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">Based on the architecture, the architect needs to be aware of the different disaster recovery and business continuity strategies to suggest the right deployment architecture and backup plans to quickly recover from failures and disasters. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Service level agreements (SLAs)</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">: The solutions architect needs to be conversant with different metrics using which the hardware and software components are provisioned in the production environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">Based on the agreed levels for these metrics, the solutions architect can help to size the hardware in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">For example, the solutions architect needs to be aware of metrics like response time, throughput, read-write per minute, etc., to help the support team provision the right amount of hardware for optimal performance.</span></span></p>
<h3 class="head2" id="sc3_889"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Solutions architects role in production support</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Solutions architects can play an important role in preparing the enterprises to efficiently manage applications in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">The following are the ways in which a solutions architect can provide required assistance to support teams to ensure a smooth maintenance phase for software projects:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Help identify vulnerable points within the application</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">: Having a context of the domain and technology is key for the production support personnel to perform their duties effectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">The solutions architect can impart knowledge of the overall system parts and their integration touchpoints, both within the application and with external applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">This helps the production support teams to place the right probes at points within the application that are vulnerable to failure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Aid with required skillset</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">: The solutions architect can assist the enterprise management in recommending the type of skills required for the production support team based on the technical nature of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">For example, if the architecture is heavily event driven and the application </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="442" id="page442"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">makes use of multiple message queues, the architect can accordingly suggest the team composition to have the required skills or train existing personnel to acquire the required knowledge about message driven applications and message queues. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Guidance with monitoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">: The architect can also educate them on different logging mechanisms available within the application. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">They</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> can also guide them on the type of log files generated within the system so that the production support team can use the right log files to debug based on the issue reported. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The architect can guide them on the structure and content of the log files and the conditions in which the entries are made within the log files.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Preparation of operations manual and cookbooks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">: The operations manual helps the production team to know the working of different parts of the application, including infrastructure setup. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">Though the manuals may be written by technical writers with inputs from the development team, solutions architects can play a role in creating the structure and help in including the important workings of the system, which will help in a better understanding of the system by the production support personnel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">They can help in documenting production support, cookbooks, procedures, and practices for troubleshooting issues that may arise in the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Business continuity and disaster recovery plans</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">: We </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">got</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"> into the details of business continuity and disaster recovery in </span></span><span class="Italic"><a href="ch12.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Chapter 12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">, Disaster Recovery and Business Continuity. </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Solutions architects blueprint and design the software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">They understand the failure points within the application more than others. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.3">They can work with infrastructure architects and come up with an application deployment architecture that helps with business continuity in case of a catastrophic failure of the hardware or the software platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.4">They can also recommend approaches to quickly recover from failures by suggesting appropriate technical risk mitigation strategies and backup plans. </span></span></p>
<h2 class="head1" id="sc2_890"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Types of maintenance</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">The maintenance of a software system once it has moved to production is one of the very important phases of a software lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">Though it is important to architect, design, and develop a system as per industry standards, it is also important to make sure the software is maintained in a state that continues to serve the customers of the enterprise, thereby adding value to the business that spent money in creating the software.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">The maintenance of a software system needs to be looked at from three different dimensions, which are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Changes to the software system because of possible errors or issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Changes to the environment hosting the software, including the hardware and software platforms.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Changes in the expectations from the software system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">From the mentioned types of changes, it becomes clear that it is not enough to make changes to the software system only from a defect-fix perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">We also need to look at maintenance from a platform and change management perspective.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">The following figure captures the different types of maintenance undertaken by the production support team:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"><img src="images/Figure_23.1.png" alt="A chart listing four types of maintenance: Corrective, Preventive, Adaptive, and Perfective, each with a brief description of their purpose in application management."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig23-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Figure 23.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">: Types of software maintenance</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="443" id="page443"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">In modern day enterprises, the line between development and operations has blurred, which has created a situation in which architects and developers must work closely with the production support team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">For a solutions architect, it is important to understand the nature of the application, its run time dependencies, and the changing business expectations to work with the production support teams to recommend a maintenance strategy for long term support, including the process to be followed and the monitoring tools to be used.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">A software system might require one or more of the following types of maintenance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">This depends on the phase of maintenance the software is in and the software platform on which the application is deployed.</span></span></p>
<h3 class="head2" id="sc3_891"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Corrective maintenance</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Software systems, irrespective of the testing rigor followed during development, are bound to have issues. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">These issues could arise due to misunderstood requirements by developers and testers that manifest themselves in the form of incorrect code logic and design gaps that result in a technical glitch within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.3">A software system, hence, undergoes corrective maintenance right from the time it is deployed into production till the time it is sunset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.4">It is important to have standard procedures in place to provide a resolution to customer issues within a reasonable amount of time.</span></span></p>
<h3 class="head2" id="sc3_892"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Preventive maintenance</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">Preventive maintenance is also done to prevent failures from happening. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">For example, the production support team may act on a sudden spike in user load on the application by increasing the number of nodes so that the application does not become extremely slow or go down unexpectedly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.3">This type of maintenance also includes scheduling windows for patching operating systems and the software platforms on which applications run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.4">These are required to ward off any known security vulnerabilities and to make use of the enhancements made to the operating systems and run time platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.5">This type also includes making changes to application configuration depending on the usage levels to ensure optimum service levels.</span></span></p>
<h3 class="head2" id="sc3_893"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Adaptive maintenance</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Adaptive maintenance includes changes made to the application so that it continues to work in harmony with the changing hardware and software environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">This also includes upgrades to hardware and software platforms in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.3">For example, the upgradation of Java 11 to Java 16 is a type of adaptive maintenance done. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.4">This type of maintenance ensures continued usability of the application, and it also provides the required quality of services like scalability and availability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.5">This type of maintenance is also done to keep the system in alignment with changing laws of the land and to synchronize its interaction with external systems depending on the changes in those systems.</span></span></p>
<h3 class="head2" id="sc3_894"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Perfective maintenance</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Perfective maintenance includes changes to the applications, software, and hardware platforms in tune with the anticipated changes in business operations and customer application usage in the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">Perfective maintenance can be predictive or prescriptive. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.3">Predictive maintenance is about predicting failures using advanced analytics techniques based on the usage data of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.4">For instance, machine learning models can predict a spike in the memory or CPU usage of a system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.5">Prescriptive maintenance takes predictive maintenance a step further by not just predicting failures but also giving a prescription to avoid failures that are bound to happen in the near term. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.6">Prescriptive maintenance requires developing models on a huge amount of data produced by the hardware and software platforms on which the application runs. </span></span></p>
<h2 class="head1" id="sc2_895"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Levels of production support</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Production support is divided into different levels from L0 to L3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.2">This division makes it easier to categorize the types of problems that each level can solve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.3">It also helps the enterprise to stack up each level with the required skills and train the personnel in the right tools that keep evolving, to address issues that are routed </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="444" id="page444"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">to the appropriate level within the production support team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">The division also enables the organization to put in place a communication structure between different teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">There are also timelines associated with each level so that the users of the service can benefit by getting a resolution within the shortest possible time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.4">This enables the enterprise to provide a positive customer experience and improve customer retention rates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.5">This structure also helps to consolidate product improvement suggestions gathered from the users and to continuously upgrade the application, that helps to grow the business strategically.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">The following figure represents the different levels of support provided by enterprises to address customer reported issues:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1"><img src="images/Figure_23.2.png" alt="A flowchart with four levels: Level 0—Self Help Content for end users; Level 1—Help desk with basic customer support; Level 2—Extensive technical support; Level 3—Specialised support including product changes."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig23-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">Figure 23.2</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">: Levels in production support</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_896"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Level 0 support</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Level 0 support aims to resolve customer application issues by providing a self-help mechanism without a need for any external assistance from the production support team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">This is the first level of support when customers face an issue while using a service or a product rolled out to them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.3">Level 0 support includes self-help troubleshooting guides, videos to explain product and service usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.4">This level also creates moderated forums in which customers discuss their issues and search for possible solutions to their problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.5">This level of support also includes AI-powered chatbots which query a vast body of information about the services and provide relevant answers to customer questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.6">Users are also encouraged to refer to blog posts and frequently asked questions in user portals maintained by the enterprise which are updated from time to time.</span></span></p>
<h3 class="head2" id="sc3_897"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Level 1 support</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">This level of support requires the set-up of a service desk that provides answers to basic queries and helps customers to solve minor usage-related issues of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.2">They provide the first level of interface between the customers and the enterprise when it comes to resolving any application usage problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.3">For example, you call the service desk of a bank to understand what to do if your user account has been locked after the maximum number of password retries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.4">The personnel at this level do not possess any technical knowledge, as they provide basic support for usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.5">The personnel in this tier are trained in the usage of the application, along with the common challenges the customers might face while using the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.6">The personnel also have access to the operations manual to keep their knowledge up to date about new features introduced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.7">They also have AI-powered chatbots at their service to retrieve information and answer customer queries regarding the usage of products and services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.8">This level also supports answering queries to customer emails, classifying and route issues to higher levels, if it is not within their scope of resolution.</span></span></p>
<h3 class="head2" id="sc3_898"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="445" id="page445"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Level 2 support</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Level 2 is an escalated level of support for issues that have not been able to be solved by level 1 personnel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">It involves deep analysis and troubleshooting of the issue reported by the customer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.3">Level 2 support personnel have access to all the hardware and software components within the application to troubleshoot the issue and take the required action to sort it out. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.4">The personnel at this level possess deep technical knowledge with regard to the application, software, and hardware platforms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.5">They collaborate with the developers and architects, discuss the root cause analysis, and get approvals for making changes required to correct the reported problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.6">The solutions to problems could include minor changes to application configuration, provisioning additional nodes in consultation with the development team to solve load related issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Apart from resolving customer technical issues, they monitor the application continuously using application monitoring tools, identify anomalies, and take corrective action based on standard operating procedures given to them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">They also plan maintenance windows for patching operating systems, software platforms, and hardware upgrades in consultation with the development team and business stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">They also work with different stakeholders within the enterprise and are running points to get the required approvals for making changes to the application environment.</span></span></p>
<h3 class="head2" id="sc3_899"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Level 3 support</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Level 3 support offers the highest level of support for any issue escalated by the level 2 personnel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">Level 3 support is made up of highly skilled production support personnel who work with developers of the application and solutions architects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.3">Complicated issues and gaps in the application logic warrant the support of the level 3 team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.4">This level of support requires in-depth technical and domain skills and mostly requires a change in the design or the code within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.5">They are also in charge of deploying advanced tools and techniques for continued and effective monitoring of the production environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.6">They also make decisions regarding hardware and software platform upgrades, thereby performing preventive and perfective maintenance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.7">They also adopt techniques like AIOps to forecast application issues and quality metric changes like response time and throughput, and accordingly carry out changes in the application environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.8">The L3 support team also participates in daily standups along with the development teams to prepare production deployment environments for the upcoming releases of the software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.9">They also work with solutions architects, development teams, and business stakeholders for the joint preparation of disaster recovery and business continuity plans.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Having seen the different levels of support provided, we will now look at the different stages of the production support lifecycle.</span></span></p>
<h2 class="head1" id="sc2_900"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Production support lifecycle</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Applications after being deployed in production continue to service customers within the accepted service levels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">However, issues do arise from time to time in application functionality, software platforms used by the application and the underlying hardware. </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Information Technology Infrastructure Library </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">ITIL</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">), a universally accepted framework for software delivery and servicing provides guidelines for the effective maintenance of a software application and its environment. </span></span><span class="Italic"><a href="#fig23-3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">Figure 23.3</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1"> depicts the different stages of the production support lifecycle:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"><img src="images/Figure_23.3.png" alt="Five columns define IT management terms: Incident (unplanned event needing a fix), Problem (recurring incident needing analysis), Change (modification of IT resources), Release (software deployment), Capacity (ensuring IT needs are met)."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig23-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Figure 23.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">: Production support lifecycle</span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="446" id="page446"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Let us look at the different stages of how an issue reported by the customer is managed within the production support function.</span></span></p>
<h3 class="head2" id="sc3_901"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">Incident management</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">ITIL defines incident as a single unplanned event causing a service disruption to the customer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">It is a situation which requires immediate action to get the services back. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.3">Any incident reported has a direct correlation with the business reputation and monetary loss and needs to be resolved at the earliest possible time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.4">Incident management is the process that is used to respond to the event to bring back the service into operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.5">This process involves the steps of identifying, analysing and resolving the reported incident. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.6">Incident management includes a fix that immediately resolves the issue. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">The steps of incident management are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Incident identification</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">: This is the step where the incident is identified. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.2">This step can either be automated or manual. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.3">An incident could be reported by a user over email or could be triggered by a system that uses automation to notify the production support team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.4">The identified incident is formally recorded into an incident recording system with the description of the incident along with the date and time received and with possible resolution information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Incident prioritization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">: When incidents arrive at the queue, the team should look at the severity of the issue in terms of its impact on the business and prioritize the incident for resolution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">An incident involving login failure for a certain set of users takes priority over an issue wherein some of the users did not get mobile notification for their banking transactions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Incident analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">The team quickly analyses the issues and comes up with the fixes required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">The incident management team also makes sure that the incident does not spread and acts so that it does not affect application availability or uptime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.3">The team will also use their existing error knowledgebase to see if there are prior instances and draw possible reasons for the incident.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Incident resolution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">The incident resolution depends on the analysis of the incident. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.2">The incident will be resolved by provisioning additional hardware or making any configuration changes to the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.3">For example, if the CPU consumption is very high for a particular transaction, the component is moved to a node with multiple cores. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.4">Teams use automation tools and AIOps to quickly resolve issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">Incident documentation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">: The details of the resolution for the incident are documented in detail. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.2">This helps to make sure that any instances of such incidents in the future can be resolved quickly without having to spend time on analysis and troubleshooting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.3">The details of the resolution will also go into error knowledge bases, which will be used to train chatbots to provide answers to customer queries for similar problems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">With regard to the type of incidents, they are divided into major and minor incidents:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">Major incident management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">These are incidents that result in a disruption of business operations and need to be addressed immediately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">A security breach in a banking application is a major incident. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.3">These are issues that are highly critical and warrants immediate analysis and action sometimes in the form of quick fixes to overcome the issue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.4">The objective of major incident management is to get the business operations back within the recovery time objective and recovery point objective.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Minor incident management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">These are incidents that does not affect the normal operations of the business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">These are solved by the production support team within the service level agreement based on the severity of the incident. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.3">A non-operational branch locator functionality within the application is a minor incident that can be fixed within the SLA when reported.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Organizations use mature DevOps processes to identify incidents and fix incidents early in the software development lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">DevOps encourages continuous monitoring and improvement of applications. </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="447" id="page447"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Development and production teams are alerted for any deviations from set thresholds noticed in the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.2">The development and the production support teams work together to quickly identify resolution and fix issues.</span></span></p>
<h3 class="head2" id="sc3_902"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Problem management</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">There could be incidents that are recurring in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">Recurring incidents becomes a problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.3">Though they are addressed at the point in time they occur, the team needs to perform a </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">root cause analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">RCA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">) of the recurring incident and ensure that a permanent solution has been found to stop the incident from occurring again. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.2">Teams perform RCA using tools like fish bone diagrams and </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Failure Mode And Effects Analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">FMEA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.2">Problem management can be both reactive and proactive. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.3">In reactive problem management, the teams work to find the resolution and the root cause of the problem and fix it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.4">In a proactive mode, the observability of the system is enhanced to ensure that incidents are identified early and an analysis ensues if they would become a problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.5">Incidents that could potentially become problems are categorized and addressed accordingly. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Like incident management problem management is also divided into different steps like problem identification, analysis, resolution and documentation that is contextual to the problem being solved.</span></span></p>
<h3 class="head2" id="sc3_903"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">Change management</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">According to ITIL, change management is the addition, modification, and removal of anything that could have an impact on IT services delivery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.2">IT change management provides the process to modify the IT infrastructure and software platforms in a standardized and systematic manner to minimize disruptions in system operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.3">It is a well-planned process comprised of various stages and statuses that IT changes can go through. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.4">Change management aims to reduce the number of incidents in production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.5">Change management is also carried out to plan and implement certain changes required in the system to adhere to regulatory compliance and industry standards. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.6">The change management process considers all the possible risks associated with the change and there are plans in place to mitigate them in order to make sure that there is no disruption to the business operations.</span></span></p>
<h3 class="head2" id="sc3_904"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Release management</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">In modern day enterprises, new features are introduced every other week. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">Apart from new features, patches related to the application defect fixes also need to be released into production for a stable and efficient functioning of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.3">Release management comprises of all activities for a controlled and streamlined release of software into production environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.4">It requires careful planning, testing and an informed deployment of software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.5">The release is planned in such a way that there is no or very minimal downtime of the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.6">Deployment strategies like blue green deployment and canary deployment ensure minimum downtime when new software versions are released into production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Blue green deployment creates an environment (green) with the newer version of the software which takes part of the load, and the old environment (blue) continues to serve other users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.2">Once the green environment is proven to be faultless and stable, all users are redirected to the green environment and the blue environment is shut down.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">Automation plays a very key role in deploying newer releases to the production environment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">The whole deployment process is automated and provisioning and balancing between the blue and green environments is done in an automated manner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.3">Release management is not only about software releases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.4">but it also includes activities to create operational manuals for use by production support personnel and training the production support team.</span></span></p>
<h3 class="head2" id="sc3_905"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="448" id="page448"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Capacity management</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Capacity management is the process that ensures that the infrastructure needs of the enterprise are met for efficient operations of the IT systems to realize the current and future business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.2">It deals with managing both hardware and software demands of the organization so that the applications in production perform with the acceptable levels of service.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">Capacity management broadly is made up of the following areas:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Business capacity management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">This ensures that the IT infrastructure can support the future growth of business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.2">It involves capacity planning in line with the business goals of the enterprise.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Services capacity management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">: This aims to ensure that there is enough Infrastructure capacity to deliver IT services of the enterprise by monitoring and analysing the collected data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.2">Software applications are expected to function within their accepted service level agreements when it comes to measuring their quality of services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.3">Services capacity management ensure if there is enough capacity to meet the accepted service level agreements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Component capacity management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Component capacity management deals with different types of components, like databases and networks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">This process aims to optimally use the resources available to provide customer services within the required levels. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">In this section, we looked at the different stages of the production support life cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">we will now discuss how AI and ML are transforming the production support function in the next section.</span></span></p>
<h2 class="head1" id="sc2_906"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">Artificial intelligence in production support</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">AI and ML have disrupted different areas within the software industry, including production support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">In the development phase, AI models generate code in modern day programming languages for different business functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.3">They also generate DevOps pipelines, create test scripts, and execute them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.4">Models are often deployed to read user stories and generate design artefacts for the software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.5">A lot of enterprises use tools like GitHub Copilot for generating code for their software applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Production support has long been an area comprising tasks that are manual and laborious in nature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.2">There are applications that need to be physically monitored for long periods of time through monitoring tools that emit data based on the state of the application at a given instant of time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.3">However, AI and ML have transformed many of these manual tasks to become automated, thereby reducing manual effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.4">Machine learning algorithms analyse data produced by monitoring tools and log files to identify outliers and forecast any issues that could happen in production systems in the near term. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">AIOps is the use of AI for automated monitoring and management of IT operations in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">This is an area that is becoming prevalent within enterprises to identify, analyse, and resolve issues both in a proactive and a reactive manner. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Ways in which ML and AI have transformed the production support function are as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Predictive maintenance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">: Machine learning algorithms are trained on a large amount of data to create models that can forecast any untoward events that can occur within the applications in the near term. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.2">For instance, a model trained on the last six months of data could understand the patterns and forecast occurrence of a spike in </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">major</span></span><span class="CharOverride-2"> </span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">garbage collections </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">major GC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">) happening within microservices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">This could alert the production support team about the possible spike and the team could respond by increasing the memory configuration of the hardware or the memory allocated to the container.</span></span></p>
