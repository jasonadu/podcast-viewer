<section epub:type="chapter" role="doc-chapter">
<header>
<h1 class="chaplabel" id="ch01"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="1" id="page1"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 1</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">Setting the Stage</span></span></h1>
</header>
<h2 class="head1" id="sc2_1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">This chapter introduces the role of a solutions architect, exploring the key drivers behind solution architecture and its alignment with organizational business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">We will outline the core responsibilities expected of a solutions architect and highlight the essential skills needed to excel in this role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">Additionally, we will discuss how a solutions architect can contribute beyond traditional boundaries, adding value to both project teams and the broader enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">Finally, we will provide guidance on staying current with evolving architectural and technical trends.</span></span></p>
<h2 class="head1" id="sc2_2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Architects in an enterprise</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Solution architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Need for a solution architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Influences of a solution architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Solution architecture build worthiness</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Effective solutions architect</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Responsibilities of a solutions architect</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Attributes of a good solution architecture</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Architectural assumptions and exclusions</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Required technical skills</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Learning architecture in a systematic way</span></span></p>
<h2 class="head1" id="sc2_3"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">By the end of this chapter, we will understand the different architect roles prevalent in an enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">The chapter will cover the scope of solution architecture and the role of a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.3">We will learn business </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="2" id="page2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">goals, business architecture, and how the solution architecture acts as a glue between the two. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Readers will learn the responsibility of a solutions architect as expected by large enterprises and guidance for becoming a solutions architect in a systematic way.</span></span></p>
<h2 class="head1" id="sc2_4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Architects in an enterprise</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Before we move on to look at specific aspects of a solution architecture and the responsibilities of a solutions architect, we will list down the common architect roles found in an organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">This will help us understand the type of activities that are carried out by each of the roles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">We will later dive deeper into the responsibilities of a solutions architect.</span></span></p>
<h3 class="head2" id="sc3_5"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Enterprise architect</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">The enterprise architect defines the overall IT strategy of the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">The enterprise architect decides the boundary of the technical landscape within which all software applications will reside. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">They will recommend and oversee the technology stack to be used within the organization for different areas such as front-end, back-end, databases, middleware, data warehouses, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.4">The enterprise architect provides a framework for IT governance within the organization.</span></span></p>
<h3 class="head2" id="sc3_6"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Solutions architect</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">The solutions architect focuses on implementing the solution for a business problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The solutions architect will choose the components required within the solution and define the mode of communication between those components within the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">We will look at the responsibilities of a solutions architect in greater detail in the section </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Responsibilities of a solutions architect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> within this chapter.</span></span></p>
<h3 class="head2" id="sc3_7"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Technical architect</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">The technical architect is concerned with the technical implementation of a specific component within the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">They recommend the technologies to be used across layers and the components within a solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">The technical architect will provide the required technology leadership to the development team for software creation.</span></span></p>
<h3 class="head2" id="sc3_8"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Data architect</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">The data architect manages the flow of data, security, privacy, and the persistence of data within the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">They also work with the solution and technical architects for individual projects to recommend the tools and techniques to create database systems, data warehouses, and data lakes for individual projects.</span></span></p>
<h3 class="head2" id="sc3_9"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Cloud architect</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">The cloud architect creates solutions for applications born in the cloud (called cloud-native applications) and applications that are migrated from an on-premises data center to the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">The cloud architect is conversant with different services offered by the cloud providers and chooses appropriate ones to create the required capabilities for the application on the cloud. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.3">They are also familiar with proven cloud architectures and select the right architecture based on the nature of the application to be deployed on the cloud.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">In most customer organizations, the solution and technical architect roles overlap. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">The solutions architect also works with the development team to define the technology stack and underpinnings to build applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">The solutions architect is also expected to perform certain tasks of the data architect, such as choosing the right database for persistence to keeping the data private and secure within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.4">For any complex tasks, such as the creation of a data warehouse or a data lake, the data architect is invited to take up the responsibility of guiding the solutions architect and the developers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="3" id="page3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Apart from the common architect roles, some large enterprises also have the following specialized architect roles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">This depends on the technical maturity of the organization and the scale of the specialized technical functions required:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Performance architect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">: The performance architect devises the types and techniques of performance measurement within the project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">Applications for which performance is a key indicator of success, the architect works full time with the solutions architect and the development team to define the key performance indicators to be measured and the thresholds for those indicators. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">They also recommend the tools required for the measurement of performance for the different layers and components within the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Security architect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">: This is a specialized role to define the security strategy for applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">For some applications, data privacy is extremely important as a breach could potentially result in a penalty of millions of dollars for the organization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">This role is extremely crucial for applications that deal with sensitive data, such as bank accounts, credit card information, health care data, and personally identifiable information, such as social security numbers and passport numbers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Infrastructure architect</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">: This is a specialized role that exists within organizations where hundreds of applications exist, and an optimal infrastructure layout is required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">The infrastructure architect decides the capacity of resources based on the quality of services required for the application, such as performance, availability, and disaster recovery.</span></span></p>
<h2 class="head1" id="sc2_10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Solution architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">All enterprises, big or small, have become digital. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">They have their services rolled out to their customers through different channels such as the web, mobile, or their customer service centers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.3">These services could be an independent application in themselves or be part of a larger application that comprises other services as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.4">Before these applications were created, they would have posed themselves as business problems which the enterprise would have wanted to solve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.5">It could have been a new service or a product that the company wanted to introduce, or it could have been an effort to shorten the time taken for an existing service to be rolled out to their customers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.6">Once we have these problems at hand, they are broken down into manageable chunks or requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.7">These requirements are analyzed to be converted into software applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.8">Before this happens, many decisions are made in between. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.9">All these decisions taken to create a digitized version of the required service or product constitute solution architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.10">The decisions include, but are not limited to, the number of components required to create the digitized version of the service and the communication enablement between the components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.11">The communication enablement between these components, in turn, depends on the technical nature of those components and the format of data exchange. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.12">These decisions taken for solving individual problems are aligned with the rules defined by a technical governance framework called the enterprise architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.13">These rules apply to the creation of any digitized version of products and services required for the successful functioning of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.14">A solutions architect not only needs to be aware of the general architectural and design patterns, but also the enterprise architecture framework of the organization within which they should create their architecture and design of the software system.</span></span></p>
<h3 class="head2" id="sc3_11"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Defining a solutions architect</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Solutions architects always need to expand the boundary of their knowledge spectrum to cope up with the pace of technology change. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">Apart from this, solutions architects also need to exceed the expectations of the customer for whom they will be working, depending on the technology stack their customer organization uses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">There are areas of focus, preferences, and strengths for a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">However, the decisions a solutions architect is expected to take go far beyond the confines of creating a blueprint for a software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">The solutions architect is expected to work closely with different stakeholders from the business and technology areas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">The architects are required to work with the business analyst in creating the requirements or user stories (as in an Agile environment). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.7">They are also expected to work with the development team to ensure that the system does not deviate from the original proposed solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.8">In addition, they coordinate with the test </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="4" id="page4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">managers and the infrastructure team to define the test strategy and do capacity planning, respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">There are projects in which developers are given additional responsibility to make technical decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">However, there is a gap between what an associate does as a developer daily versus making decisions about how the different components interact with each other within a software system and their implication on the quality of services such as performance, security, and scalability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.4">The developer churns out code in a language they are proficient in and tests the developed code before the software is rolled out for widespread use. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.5">There are situations in which a developer takes technical decisions involuntarily without knowing the long-term side effects on the quality of services of the software system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">The solutions architect takes informed decisions using their knowledge of architectural styles, design patterns, and design principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">The solutions architect also knows the impact of each one of these architectural styles on the software quality of services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">The solutions architect is also knowledgeable about different methodologies of software development to devise ways to measure the quality of services like security, scalability, and performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.4">The architect is also conversant with tools for observability once the system goes into production.</span></span></p>
<h3 class="head2" id="sc3_12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Key principles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Given a problem statement, the solutions architect is expected to come up with a solution architecture for solving the problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">The following are the key principles that need to be applied while arriving at the solution architecture:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Simplicity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">: The first important principle is to keep the solution simple. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Do not over engineer the solution by introducing components and technologies that will make the solution complex. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">This is going to increase the total cost of ownership of the solution both in terms of development and postproduction support.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Loose coupling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">: Build the solution as loosely coupled components. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">This enables us to independently replace the components in the future, if required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">This also enables us to use the right technology for the individual layers or components without having to worry about the technology being used by a layer above or below.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Reusability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">: Identify the capabilities or components that can be reused across the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">Develop the logic as common components and use a plug and play model to include the common components wherever required. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Modularity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">: Make the solution as modular as possible so that the software components can be tested independently with reduced dependencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Extensibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">: The software is easily extensible without having to modify a lot of components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Industry standards</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">: The solution makes use of industry standard best practices and design patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">Using proven practices for known problems helps to reduce errors and save effort while implementing the solution for existing patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Externalization of shared capabilities</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">: The shared capabilities are identified and externalized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">Shared capabilities such as reporting, storage, and caching are pervasive throughout the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Clear role demarcation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">: The system should have a clear demarcation of the operations and data based on the user roles defined for the system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">These principles serve as a foundation for building robust, scalable, and maintainable solutions.</span></span></p>
<h2 class="head1" id="sc2_13"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Need for a solution architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Software systems are perceivably built to last; at the same time, they should also be flexible enough for changes to be plugged into easily as the business requirements change or evolve over a period after the initial version of the software is deployed into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">The changes that come into the system need not necessarily be </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="5" id="page5"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">with regard to the functionality that is embedded in the form of logic within the code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">The change could be in terms of the type of users that would interact with the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">For example, the application could additionally be rolled out to mobile users along with the web users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.4">There could be additional systems that could be integrated, or there could be new interfaces added to support new functionality, such as payments using payment gateways or payment processors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.5">The way an architect visualizes and designs a system should be open enough to accommodate the changes coming into the system in the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.6">If the system is not able to absorb new changes with the passage of time or takes a considerable amount of time and effort to inject new changes into the system, it is not a well architected system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.7">The structure of the whole system should be approached very cautiously, keeping in mind the future needs of the business. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.8">Along with it, the architect should also consider the different nonfunctional requirements that need to be satisfied by the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.9">If these are not addressed during the architectural stage, it will result in a very rigid system that will need a large maintenance budget, which increases the total cost of ownership.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">In the given modern age of e-commerce and digitalization, products and services are offered at the doorsteps of the customer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">Customers want a quicker and effortless service from enterprises. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.3">The solution architecture needs to support a quicker time to market. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.4">The architecture also needs to strike a balance between online and offline processes in the way customers are serviced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.5">Though a straight through processing is always desirable, an architecture that strikes a balance between automated and manual touch point is more effective in increasing the time to market. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">With the advent of cloud providers, the solution landscape seems to have undergone a major shift. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">A lot of capabilities are being provided out-of-the-box in the form of infrastructure, platform, and software, and the solutions architect’s job seems to have been made simpler. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">Architect is required to weave the capabilities together to create the required blueprint in conjunction with the provided requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.4">The responsibility only increases to gain an in-depth understanding of how these capabilities function beneath the visible surface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.5">Apart from the business functionality, non-functional requirements play a very important role in the day-to-day operations of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.6">Unless the solutions architect has this understanding of the services, the final product moved to production is bound to have implications in terms of maintenance, change management, and, more importantly, cost. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">The onus is on the solutions architect to be even more prudent to use the right services for the required capability for the system to be operationally efficient and cost effective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">To achieve this, the solutions architect should be able to understand the intent of the requirements before delivering a blueprint of the system for further design and development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.3">If the complexity of the system is misunderstood, there is a chance that we add services that are far more humongous than what is required to build the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.4">This is where contextual knowledge becomes very important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.5">Most of the time, the technical team and the business team work in isolation, and a set of requirements in the form of English statements is given to the architecture team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.6">This isolation during the initial phase of the system blueprint starts to percolate through all the phases of the project and finally shows its ugly effect when the system is deployed into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.7">The architect can get help from domain experts to understand the functionality in greater detail before making decisions about what components are required to make up the whole system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.8">Solution architecture is not just about a group of architects working independently, but working hand in hand with the stakeholders involved till the architecture blueprinting and design detailing are done for the software system.</span></span></p>
<h2 class="head1" id="sc2_14"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Influences of a solution architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Before we discuss the basics of how to effectively architect the system, we should understand the drivers behind the demand for a technology-based intervention. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">These drivers help both the business and technology stakeholders to be convinced of the need for a new system to be built or a change to an existing system within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">The solutions architect needs to have a good grasp of the business goals of the organization and the existing business processes within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.4">Once the architect has a good understanding of the existing business process landscape and the enterprise business goals, the clarity about the technology system requirements comes automatically. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.5">This will further pave the way for the road map to build such systems for the enterprise's internal or end customer use.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="6" id="page6"/><span class="Italic"><a href="#fig1-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 1.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1"> gives an overview of how the business processes, business goals, and the solution architecture relate to each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">The solution architecture tries to address the gap between the existing processes and the business goals with technology intervention, as follows:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"><img src="images/Figure_1.1.png" alt="A diagram of three connected triangles labeled Business Architecture, Solution Architecture, and Business Goals, with Solution Architecture at the top center connecting the other two."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig1-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Figure 1.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">: Interconnection between business architecture, business goals, and solution architecture</span></p>
</figcaption>
</figure>
<h3 class="head2" id="sc3_15"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Business goals</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">All businesses exist to make profits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">It is very important for them to have a clear vision of what they want to do on a continual basis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.3">Unless an enterprise has short term and long-term goals, its very existence in the future will become bleak. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.4">Each enterprise has its goals set every year, which depend on the nature of the business they are in. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.5">Your bank might want to increase its deposits by 30% from the previous year. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.6">A retail organization might want to improve its sales by 25% on a yearly basis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.7">The competition also sets the speed of the race in which the enterprises want to participate and always want to win. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.8">Understanding the business goals becomes paramount to creating a successful system architecture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.9">The architect should have the ability to extract business problems that need to be solved for the enterprise to reach its goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.10">These problems must be clearly identified and should have enough details to address their relevance to one or more of the business goals of the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.11">The problem could point to the lack of a product in the existing portfolio of the enterprise, the gap in the service provided, or a usability problem in the system that hampers customer retention or results in business reputation damage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.12">The problems identified may sometimes be addressed as a technology change or a process change within the organization. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">The solutions architect needs the ability to understand the difference between the two and has to address it accordingly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">In certain cases, it would not help if a certain technical change is introduced into the enterprise without optimizing the business process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">The solutions architect, hence, is not only an expert in understanding software systems but should also develop the ability to quickly understand the necessity of the requested functionality and should be able to respond either with a direct technology change or suggest an optimization of the existing process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">Once we have the list of problems identified that correlate to the business goals to be realized, the problem statements must be clearly documented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.5">The format prescribed to document the problem statements should clearly elucidate the business goal to be achieved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.6">The description of the problem statement with relevant data points should prove that it is indeed a problem requiring a solution to move towards the end business goal.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">The process flow diagram could be used to indicate the flow of data and work required to realize the process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">Steps within the process should be marked clearly to indicate the bottlenecks that are hurdles in achieving the desired business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.3">Once the problem statements are documented, the stakeholders need to be identified for a walk through to get their consensus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.4">The stakeholders might come from different departments of the enterprise, such as sales, servicing, and marketing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.5">It is the job of the solutions architect, along with the domain expert, to clearly articulate the problem statement from a process perspective and convince them of the intervention required to resolve the problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.6">The consensus needs to be reached before we move forward to decide on a technological solution that could possibly alleviate the problem and help the enterprise to achieve the required goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.7">Workshops can be conducted with the required stakeholders to discuss the problem statements and possible solutions, and the feedback received from the stakeholders needs to be incorporated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.8">The problem statement can then be broken down into a list of requirements or user stories with the help of the domain expert or a business analyst.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="7" id="page7"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">These discussions will help the solutions architect to firm up the understanding of the system requirements and translate them into technical interventions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">The value derived from the implemented system is in direct proportion to the creation of the right set of problems and devising the right solutions to solve those problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.3">This inherently helps enterprises to achieve their business goals.</span></span></p>
<h3 class="head2" id="sc3_16"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Business architecture</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">The business architecture of an enterprise is made up of multiple parts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">It comprises the existing processes within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.3">The structure of the organization, how the processes and data flows within the enterprise, what kind of roles exist, and the type of empowerment these roles have. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.4">There is always a gap between the existing business architecture and the business goals that the enterprise wants to pursue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.5">This constant pursuit to move from the current state to the desired state is the process excellence that each business wants to achieve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.6">In many organizations, business hierarchy plays a very important role in the way the processes are laid out. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.7">That could be a possible hurdle in moving towards the required business goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.8">The solutions architect needs to be aware of the business architecture as well, though they may not have a lot of say in the way things could possibly be structured within the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.9">However, it should be considered as an influencer while designing software systems and needs to be documented as criteria or parameters that are considered while coming up with the system blueprint.</span></span></p>
<h3 class="head2" id="sc3_17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Solution architecture as the glue</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Once we understand the business goals and the current state of the business, the solution architecture comes into play to create the required bridge between where we are currently and where we want to be in the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">As discussed earlier, this could be the creation of a new product or service or a modification to existing products or services. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.3">The solution architecture aims to create new capabilities for the enterprise, modify existing ones, and sunset unwanted systems that unnecessarily cost money for the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.4">It also optimizes existing services and products for the overall good of the enterprises and the customers served by the enterprise. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">We will discuss in the following section how to measure the effectiveness of a solution architecture under the qualities required of a solution architecture.</span></span></p>
<h2 class="head1" id="sc2_18"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">Solution architecture build worthiness</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">The build worthiness of the architecture is another important aspect to ponder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">It must be ensured that architecture can deliver the goods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.3">We cannot wait until such a time that the rubber meets the road, when the system is deployed into production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Proof of architecture is a very important activity that needs to be carried out before the architecture is finalized for use in building the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.2">Before this activity begins, the preparation phase becomes important to understand the scope of the exercise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.3">The experiments need to be properly scoped and should clearly communicate the objectives of the exercise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.4">The objectives could vary between finding the fitment of the architecture with regard to the requirements or understanding the granularity of the components participating in the solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.5">There are certain cases in which the proof of architecture is carried out to understand the behavior of the nonfunctional requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.6">There are scenarios in which the solution may have to consume data or disseminate data to external systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.7">In such cases, the proof of architecture exercise focuses on collecting metrics around the quality of service, such as reliability, resilience, performance, and security.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">The proof of architecture gives an exact picture of how the process and data flows within the system and how different components of the solution landscape gel with each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">It also gives a good idea of how the capabilities of the solution need to be opened for interaction with the outside world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.3">Components that are in process have far fewer restrictions as they are going to be confined within a single large application process than components that are both used internally by other components of the application and by parties within and outside the enterprise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.4">Another important aspect is the format of data exchange across different components </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="8" id="page8"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">Proof of architecture will help answer the questions about the data formats that need to be exchanged between layers or components that make up the overall system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.3">The proof of architecture will address any data transformations required before the data flows from one component to another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.4">It will also bring out any performance bottlenecks that need to be taken care of. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.5">It becomes more important when there are multiple integration touchpoints expected within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.6">There could be applications external to our system that need to be communicated with, for the realization of a business capability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.7">Sometimes, proof of architecture also throws light on the gaps within the existing processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.8">As an architect, you get questions in mind as to why certain steps are required within the whole process or if the mode of the step can be exchanged from manual to automated or vice versa, thereby paving the way to optimize existing workflows within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.9">Once the proof of architecture is complete, the results need to be documented along with the data points that show the build worthiness of the system.</span></span></p>
<h2 class="head1" id="sc2_19"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Effective solutions architect</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">There is a very thin line between a solution architecture and the details that make up the solution in its entirety. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">If you zoom into a certain portion of the architecture, then you get to see the details of a particular portion of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.3">For instance, you may get the overall floor plan of a multi storied building as given by a civil architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.4">At the same time, the architect should also be able to clearly chalk out detailed plans of the individual floors of the building and the houses on each floor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.5">Each house might be of a different size and may have a different layout for the rooms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.6">Similarly, this software solutions architect should not only come up with an overall blueprint of the application but also detail out the individual components that make up the system in its entirety. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.7">There are architects who confine themselves to drawing solution diagrams on a slide and give them to stakeholders for further consumption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.8">They graze the requirements of the system based on which they arrive at a solution architecture. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">There is very little focus on the actual capabilities required within this system, let alone the nonfunctional requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">These paper architects mostly thrive on their overall experience and are not conversant with contemporary design methodologies and technologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.3">For instance, there are cloud solutions architects coming up with cloud native architectures in a way that they familiarize themselves with a few required services of the cloud provider without understanding the essence of cloud native architectures or getting into the details of how the service is supposed to work, whether it is the right service to be used for the capability being built, the limitations of the service as against satisfying the requirements of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.4">At the outset, the architecture will seem to satisfy the requirements of the overall system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.5">When we start building the system, end-to-end flows wither out because of the limitations posed by the individual components or services used to realize the requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.6">Therefore, it is very important for a solutions architect to map the detailed requirements of the system to the individual components or services that make up the overall system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.7">This helps in two different ways, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">A solutions architect ensures that the solution is complete in all respects with regard to the requirement coverage of this system. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">It helps to ensure that we have chosen the right services to realize the requirements of the system. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">A good solutions architect should also be familiar with a few contemporary programming languages, which will come in handy if they develop a quick proof of concept for some of the requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.2">A good solutions architect is always hands-on and will be ready to participate in creating a quick proof of concept to prove a solution to convince both the business and technology stakeholders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.3">This internally gives a sense of confidence about the architecture that is to be rolled out further for the buildup of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.4">The solutions architect also decides the choice of the technical stack for each of the layers or components in the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.5">The architect should also be conversant with popular technology frameworks that exist in the market at the point in time of the architecture and design exercises. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">The other quality required of a solutions architect is not to confine </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">themself</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"> only to the solution required to build the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">They must adhere to the broader technology rules and contracts that are allowed at the enterprise level and incorporate them into the system being architected. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.3">This is to ensure non-violation of any </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="9" id="page9"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">principle that might put the organization overall at risk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">Examples include designing an application that helps in conversations between a customer and a service agent that cannot be stored for more than three months, following payment card industry standards across all applications developed in a bank for any transaction that involves a credit card.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">The solutions architect must not confine themselves to learning the architectural patterns and the design principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">Understanding of the domain becomes very important to create an architecture that is flexible to accommodate changes in the future and to reuse common components across capabilities within the domain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.3">For example, an insurance policy premium calculation component may be used during the process of policy initiation and policy renewal, but with minor differences. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.4">A deep understanding of the domain will help to identify such places of reuse and will aid the architect to come up with a solution that is lighter, modular, and maintainable.</span></span></p>
<h2 class="head1" id="sc2_20"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">Responsibilities of a solutions architect</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">It is a customer facing role wherein you get to work directly with the business stakeholders to understand their business problems and provide solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.2">At the same time, the solutions architect works with project managers, test managers, and operations staff and assists them in choosing the most optimal strategies to make the project successful. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">The following are the responsibilities of a solutions architect from the point of view of business stakeholders and project teams:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">Understand the business goals and help business stakeholders to bridge the gap between the current and future states.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Provide thought leadership to businesses for optimizing the existing business architecture with simplification of the steps in the existing processes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Understand existing processes within the enterprise, identify gaps in them, and suggest newer products or services that could bridge the gap.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Work with business stakeholders to socialize the problem statement and firm up the clarity of the problem statement, refine and document the same.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Work with their domain experts and business analysts to refine business problems and help them break them down into manageable chunks of requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Work out different solution options for the problem statement identified and choose the most appropriate one that best fits the requirements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Understand the IT governance framework at the organization level and ensure that decisions at the application level adhere to the rules prescribed by the enterprise architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Have knowledge of technologies and frameworks to provide technology consultancy to enterprises to choose the right technologies to solve problems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Conduct proof of architecture and proof of concept experiments to ensure that the end-to-end flow of the functionality works as per the defined architectural specifications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Gather nonfunctional requirements working with the business and make sure the solution designed meets the expectations set by the stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Suggest optimal development methodologies for the development teams to adopt during the build of the software system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Provide continuous support during the build of the solution to ensure that the product is built as per the defined architectural specifications and will help the enterprise to realize its business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="10" id="page10"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Identify potential points of automation within the existing build and test processes and help the teams to build the same.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Work with test managers to suggest the right tools for testing the solution components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Work with operations and assist them in creating the required hooks for the continuous build, test, and deploy pipelines.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Work with infrastructure teams to suggest the requirements related to software services and infrastructure required for the deployment of the final product into production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Being part of discussions during the takeover of the application for long term support and helping them write system operation manuals and decide on appropriate monitoring tools.</span></span></p>
<h2 class="head1" id="sc2_21"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Attributes of a good solution architecture</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">The solution architecture should measure and refine itself against the given attributes for being a very effective blueprint to build a system, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Functionality</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">: The developed solution blueprint should be fit for purpose and address all the requirements of the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.2">The solution should not be made complicated than is required.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Extensibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">: This refers to the ease with which the solution lends itself to changes in the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.2">A rigid software architecture will resist changes and increase the total cost of ownership.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Scalability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">: A good solution architecture lets the software scale well, whether it is vertical with the addition of resources, or horizontal with the addition of more nodes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">Performance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">: A solution architecture should consider the performance </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">service level indicators </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">SLA</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">) specified for different transactions within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">The architecture designed should not introduce performance bottlenecks as the load increases within the application.</span></span></p>
