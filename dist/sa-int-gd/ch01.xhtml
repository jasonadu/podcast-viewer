			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Availability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">: A solution architecture should promise a certain uptime of the system in each period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">The system should be available at the time the software is being upgraded.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">: The architectural blueprint should ensure the privacy of the users as well as data during the flow of work and data within the system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">The solution should recommend appropriate techniques for keeping data safe during transit and at rest.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Disaster recovery</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">: A solution architecture should have a minimum </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">recovery time objective </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">RTO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">) and offer an effective </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">recovery point objective </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">RPO</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">RTO is the time required to bring the system back to operation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.3">RPO is the point from which the system can be recovered after failure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">Portability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">: This attribute denotes how easy it is to port the solution to a different operating system, hardware configuration or a future version of the software runtime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">This attribute is very important in a fast-changing technological world where operating systems and software runtimes evolve rapidly.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-8"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Maintainability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">: This attribute denotes the ease with which the software can be maintained after it is deployed into production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.2">The architecture should lend itself to generating metrics at different touch points within the software, which in turn can be used to monitor the system effectively.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Accessibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">: A solution architecture developed should provide well defined points of access to different capabilities of the software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.2">This will enable access to different functionality to stakeholders both within and outside the enterprise.</span></span></p>
<h2 class="head1" id="sc2_22"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Architectural assumptions and exclusions</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">A solutions architect puts all this effort into making the solution as complete as possible and robust; practically, there are always a few areas for which complete information may not be available. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.2">This might include </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="11" id="page11"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">information about third party systems, integration touchpoints with systems owned by other divisions within the enterprise, and vendor supported third party applications, etc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">In such cases, it is important to call out such dependencies or uncertainties and make way safely for other components to adjust themselves when things become clear down the line. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.3">For instance, the type of protocol may not be known for an external service that is accessible at multiple places within the application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.4">This could be handled by applying a facade pattern, which acts as a point of access to the third-party system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.5">This isolation will help to change the logic only at a single place instead of changing the application at multiple places where access to third party service is required.</span></span></p>
<h2 class="head1" id="sc2_23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Required technical skills</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">In this section, we will briefly list the skills required for a solutions architect.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">A good solutions architect not only needs to possess sound technical skills but also have good soft skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.2">The right blend of the two makes the role of a solutions architect very effective while delivering value to the organization by solving problems and convincing multiple stakeholders of the decision-making process on the way to building software solutions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">The technical skills required for a solutions architect are as follows. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.2">We will go through each one of them in detail in </span></span><span class="Italic"><a href="ch03.xhtml"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Chapter 3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">, Technical Proficiency Essential Knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">Architectural styles</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">Architectural patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Design patterns</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">Knowledge of technology frameworks</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">Knowledge of cloud architectures</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">Hands-on with contemporary programming languages</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">Technologies of the past</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Being current with contemporary technologies</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">Domain knowledge</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">Development methodologies</span></span></p>
<h2 class="head1" id="sc2_24"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Learning architecture in a systematic way</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">The best way to learn solution architecture is by doing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.2">It is a very good way to be a part of solution discussions with other solutions architects and get to know what is being discussed and how the solution architecture evolves over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.3">The developer who has experience can also attempt to do solution architecture by learning common architectural and design patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.4">They can apply their knowledge to problems in their own project and get it reviewed by the architects in their project team.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">The other way to learn solution architecture in a systematic way is to take up an industry standard certification. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">There are good architecture certifications offered by organizations such as </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">The Open Group</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">Amazon</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">, </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Microsoft,</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1"> and </span></span><span class="Italic"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">Google</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">Learning from technology forums and blogs written by industry leaders will help a solutions architect to keep abreast of the latest developments in the architecture world. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">Industry leaders such as Microsoft and Google have created training material for associates with different levels of proficiency to master content related to solution architecture.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Signing up for courses on many of the online educational websites and apps is a good starting point to learn technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.2">There are overviews to give you a summary of the topic in about an hour, and courses running for tens of hours to give you an in-depth treatment of the topic of technology.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="12" id="page12"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">A picture is worth a million words. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.2">Likewise, in software, being hands-on is one of the most important skills for a solutions architect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.3">Be proficient in one or more programming languages, design patterns, and architectural styles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.4">Take a sample application or a scenario and code it end-to-end by applying the applicable architectural style and design patterns to internalize their usage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Staying updated with emerging technologies and applying them to the solutions you develop is another way to keep evolving in this field.</span></span></p>
<h2 class="head1" id="sc2_25"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">Conclusion</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">In this chapter, we looked at the different architect roles in an organization and how the responsibilities of some of these roles overlap. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.2">We discussed what a solution architecture is and the drivers behind it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.3">We then listed down the responsibilities of a solutions architect in an organization and the skills required for a solutions architect at the outset. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.4">We also looked at ways to systematically acquire and improve our solution architectural skills. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">In the next chapter, we will use a checklist that an architect can use to ensure effective stakeholder engagement and communication, comprehensive requirements gathering, and architecting and designing a software system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.2">We will also provide a checklist to ensure the quality of services, such as availability, security, performance, and scalability.</span></span></p>
