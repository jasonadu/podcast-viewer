			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1112.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1113.1">Set up centralized logging using systems like ELK or Azure Log Analytics.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1114.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1115.1">Use distributed tracing tools like Jaeger or AWS X-Ray to track requests across microservices and identify bottlenecks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1116.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1117.1">This approach ensures optimal performance and proactive issue resolution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style734 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="173" id="page173"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1118.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1119.1">Describe a scenario where compliance was ensured using DevOps tools.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1120.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1121.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1122.1">A solution using Azure Policy enforced compliance across multiple subscriptions by checking each resource deployment against predefined policies (e.g., PCI-DSS standards).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1123.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1124.1">Continuous monitoring with Azure Security Center provided alerts on any deviations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1125.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1126.1">Third-party tools like Checkov and Conftest were integrated into the CI/CD pipeline to validate IaC templates against compliance rules before deployment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style734 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1127.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1128.1">How do you manage blue-green or canary deployments at scale?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1129.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1130.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1131.1">Start by leveraging orchestration tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1132.1">: Use tools like Kubernetes, Spinnaker, or ArgoCD to manage blue-green and canary deployments at scale.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1133.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1134.1">Automate environment setup</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1135.1">: Blue-green deployments require two identical environments (blue for current production and green for new deployment). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1135.2">Canary deployments introduce changes to a small subset of users first. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1135.3">Automate the creation and teardown of these environments using </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1136.1">IaC tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1137.1"> like Terraform or Helm for Kubernetes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1138.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1139.1">Use traffic management tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1140.1">: Leverage tools such as Istio, NGINX, or AWS App Mesh to dynamically route traffic between environments during the deployment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1141.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1142.1">Monitor metrics in real-time</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1143.1">: Integrate with Prometheus, Datadog, or CloudWatch to monitor error rates, latency, and user feedback.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1144.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1145.1">Set rollback triggers</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1146.1">: Define automated rollback conditions in your pipeline to revert traffic to the previous stable environment if KPIs fall below defined thresholds.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style734 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1147.1">9.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1148.1">How are DevOps tools selected for a large enterprise deployment?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1149.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1150.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1151.1">Consider scalability, integration with existing systems, security, and ease of use.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1152.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1153.1">For enterprises heavily invested in Microsoft technologies, Azure DevOps is prioritized for tight integration with Azure services and seamless CI/CD support.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1154.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1155.1">For hybrid cloud environments, Jenkins or GitHub Actions may be evaluated for flexibility, with Terraform chosen for IaC.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1156.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1157.1">The goal is to create a cohesive toolchain that aligns with the enterprise’s operational needs and minimizes complexity in managing multiple tools.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style734 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1158.1">10.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1159.1">How would you implement GitOps in a CI/CD pipeline?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1160.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1161.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1162.1">Adopt a declarative approach</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1163.1">: GitOps relies on a declarative model where the desired state of infrastructure and applications is stored in a Git repository. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1163.2">Tools like FluxCD or ArgoCD monitor the Git repository and ensure that the cluster’s state matches the desired state.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1164.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1165.1">Set up automated sync</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1166.1">: Changes to the infrastructure or application configurations are automatically applied when a commit is made to the Git repository. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1166.2">This ensures the CI/CD pipeline remains aligned with Git.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1167.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1168.1">Pipeline integration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1169.1">: Integrate GitOps tools with CI/CD pipelines for automated testing and validation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1169.2">For example, upon a commit to Git, run automated tests and security scans before syncing changes to the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1170.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="174" id="page174"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1171.1">Implement RBAC and approvals</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1172.1">: Use GitHub Actions or Azure DevOps to enforce branch protection and approval workflows to ensure only reviewed changes make it to the repository.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1173.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1174.1">Monitor and observe drift</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1175.1">: Use tools like Prometheus and Grafana to detect and alert on drift between the desired state in Git and the actual state in the cluster.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-33"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1176.1">GitOps promotes a single source of truth and makes deployments predictable and repeatable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style734 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1177.1">11.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1178.1">What is the difference between monitoring and observability, and how do you design for each?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1179.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1180.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1181.1">Monitoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1182.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1183.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1184.1">Monitoring is about collecting predefined metrics, logs, and events to track the health and performance of systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1185.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1186.1">Design</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1187.1">: Use tools like Prometheus, Nagios, or Azure Monitor to track KPIs such as CPU usage, response times, error rates, and availability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1188.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1189.1">Set up dashboards and alerts to notify teams when metrics breach defined thresholds.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1190.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1191.1">Observability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1192.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1193.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1194.1">Observability focuses on understanding the internal state of systems based on external outputs (logs, metrics, and traces).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-22"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1195.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1196.1">Design</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1197.1">: Implement distributed tracing with tools like Jaeger, Zipkin, or AWS X-Ray to trace requests across microservices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1198.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1199.1">Use log aggregation tools such as ELK Stack or Splunk to correlate logs across the system and enable root cause analysis.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-34"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1200.1">A well-observed system enables proactive issue resolution and provides deep insights into system behavior.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style734 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1201.1">12.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1202.1">Explain your approach to designing secure pipelines for a highly regulated industry (e.g., finance or healthcare).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1203.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1204.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1205.1">Secure code practices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1206.1">: Begin by enforcing secure coding standards through automated </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1207.1">static application security testing </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1208.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1209.1">SAST</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1210.1">) tools like SonarQube or Checkmarx in the CI/CD pipeline.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1211.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1212.1">Secrets management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1213.1">: Use tools like HashiCorp Vault, AWS Secrets Manager, or Azure Key Vault to securely store and access secrets during builds and deployments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1214.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1215.1">IAM and RBAC Policies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1216.1">: Implement RBAC and least privilege policies to restrict who can trigger builds, access pipelines, or deploy to production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1217.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1218.1">Compliance checks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1219.1">: Automate compliance checks (e.g., HIPAA, PCI-DSS) with tools like Terraform Sentinel, OPA, or Azure Policy to ensure that every deployment meets regulatory standards.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1220.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1221.1">Audit and logging</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1222.1">: Ensure all pipeline activities are logged and auditable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1222.2">Use centralized logging solutions like Splunk or Azure Log Analytics for traceability and regulatory reporting.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1223.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1224.1">Continuous security testing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1225.1">: Include DAST tools like OWASP ZAP or Burp Suite for runtime vulnerability scanning and penetration testing before deployment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-33"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1226.1">This approach ensures compliance while maintaining a robust security posture throughout the CI/CD process.</span></span></p>
