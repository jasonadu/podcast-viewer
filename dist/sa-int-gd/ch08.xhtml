<header>
<h1 class="chaplabel" id="ch08"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="149" id="page149"/><span class="chapnum"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">C</span><span class="chsmall"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">HAPTER</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1"> 8</span></span><span class="chaptitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">DevOps Essentials</span></span></h1>
</header>
<h2 class="head1" id="sc2_208"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Introduction</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">In today’s technology landscape, DevOps has become an essential approach for building, deploying, and maintaining complex systems at scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">For solutions architects, understanding DevOps goes beyond just knowing tools and pipelines; it involves the ability to design resilient, automated, and scalable solutions that integrate seamlessly with development and operations workflows. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">As organizations increasingly adopt cloud-native architectures, DevOps has evolved into a core competency for delivering software that meets high standards of reliability, security, and agility.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">This chapter focuses on providing solutions architects with the DevOps knowledge and skills necessary to succeed in real-world projects and to excel in technical interviews. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Understanding CI/CD pipelines, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">infrastructure as code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">IaC</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">), monitoring and logging, security integration (DevSecOps), and automated testing are critical areas that are frequently assessed during interviews for this role. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Throughout this chapter, we will break down the essential components of a DevOps strategy from a solutions architect’s perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">This includes strategies for building secure pipelines, automating deployments, and ensuring that systems are designed for continuous integration and delivery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">You will learn how to align DevOps practices with architecture design, how to respond to common interview scenarios, and how to address critical topics such as scalability, reliability, and security.</span></span></p>
<h2 class="head1" id="sc2_209"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Structure</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">This chapter covers the following topics:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">DevOps culture and practices</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Platform engineering</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Implementing IaC with DevOps</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Continuous integration and continuous deployment</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Monitoring and logging</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">AIOps</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="150" id="page150"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">FinOps in DevOps</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Security in DevOps</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">QA and testing</span></span></p>
<h2 class="head1" id="sc2_210"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Objectives</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">By the end of this chapter, readers will have a comprehensive understanding of the core principles and culture of DevOps, emphasizing its importance in modern, cloud-native software development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">They will gain the practical knowledge to design and implement </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">continuous integration and continuous deployment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">CI/CD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">) pipelines, along with the ability to define and manage infrastructure using IaC tools like Terraform.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Readers will also learn how to enhance system reliability through effective monitoring, logging, and observability practices, utilizing tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The chapter will </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">get</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> into advanced topics, including the integration of DevSecOps for embedding security at every stage of the pipeline and FinOps for managing cloud costs efficiently.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Moreover, the chapter will introduce cutting-edge concepts like </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">artificial intelligence for IT operations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> (</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">AIOps</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">) for automating operational tasks and predicting system anomalies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">It will also highlight the critical role of QA and testing within DevOps, providing strategies for continuous testing and quality assurance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">By the end, readers will be well-prepared to design robust, secure, and cost-efficient DevOps solutions that deliver high-quality software at scale.</span></span></p>
<h2 class="head1" id="sc2_211"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">DevOps culture and practices</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">As a solutions architect, it is crucial to not only understand the technical aspects of DevOps but also to internalize its cultural principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">The role of a solutions architect often involves aligning technical solutions with business objectives, and DevOps bridges the gap between development and operations by emphasizing collaboration, automation, and continuous improvement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">This section will cover what DevOps means in practice, how to adopt a DevOps mindset, and why mastering DevOps is a critical competency for solutions architects.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">During interviews, solutions architects are often assessed on their ability to design end-to-end solutions that encompass the full software delivery lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">It is not just about knowing tools and technology stacks but also demonstrating how these tools can be orchestrated to create a cohesive strategy that drives business value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">When discussing DevOps in an interview, it is essential to present it as more than just a methodology; it is a cultural shift that fosters collaboration, innovation, and continuous delivery.</span></span></p>
<h3 class="head2" id="sc3_212"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">DevOps</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">DevOps is a set of practices and cultural philosophies aimed at integrating software </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">development </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Dev</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">) and IT </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">operations </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Ops</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">) teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">It focuses on automating processes, improving collaboration, and enabling continuous delivery and deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">The goal is to shorten the development lifecycle and provide high-quality software in a consistent and repeatable manner.</span></span></p>
<h3 class="head2" id="sc3_213"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">DevOps principles</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Understanding and implementing DevOps principles is a crucial part of a solutions architect’s role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">These principles guide the architect in designing systems that are efficient, reliable, and aligned with business goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="151" id="page151"/><span class="Italic"><a href="#fig8-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Figure 8.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"> provides a summary view of DevOps principles:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"><img src="images/Figure_8.1.png" alt="Infographic showing six key DevOps principles for solution architects, each in a colored box with bullet points: Deliver Fast (red), Optimize the Whole (orange), Respect People (blue), Eliminate Waste (green), Defer Commitment (teal), Build Quality In (purple), and Create Knowledge (yellow)."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig8-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Figure 8.1</span></span><span class="Figure-Caption--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">: DevOps principles</span></span></p>
</figcaption>
</figure>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">The following</span></span><span class="Italic"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">is a concise overview of each key DevOps principle and its relevance for solutions architects:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Respect people</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Respecting people and collaboration are at the core of DevOps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">Solutions architects must foster a culture that values cross-functional teamwork and empowers all stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Design self-service and automation tools to reduce friction between development, operations, and QA, enabling teams to work independently and improve productivity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Eliminate waste</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Reducing unnecessary work, such as over-engineering and redundant processes, ensures that solutions are lean and focused on business outcomes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Implement automation for repetitive tasks, optimize resource allocation, and remove features or steps that do not directly add value.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Build quality in</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Quality is everyone's responsibility. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">Solutions architects need to embed quality checks throughout the architecture to ensure robust and secure systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Establish quality gates in CI/CD pipelines, enforce code quality standards, and advocate </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Test-Driven Development </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">TDD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">) and continuous integration practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Defer commitment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Avoid premature architectural decisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">This principle encourages designing with flexibility to incorporate changes as requirements evolve.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Use loosely coupled architectures and modular designs, allowing components to be easily updated or replaced without impacting the entire system.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="152" id="page152"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Deliver fast</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Rapid delivery of new features and capabilities is essential for maintaining a competitive edge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">Solutions architects need to design systems that support Agile delivery models.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Architect for microservices and modular deployments, enabling independent feature releases and minimizing the impact on other components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Optimize the whole</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Focusing on the efficiency of individual components can lead to suboptimal outcomes for the overall system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">Solutions architects must adopt a holistic approach to optimization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Use systems thinking to identify and address bottlenecks in the entire software delivery pipeline, ensuring smooth integration and value flow across all stages.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Create knowledge</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Continuous learning is vital for improvement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">Solutions architects should establish feedback loops and knowledge-sharing mechanisms to improve processes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">o	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Implement observability and monitoring, document learnings, and promote a culture of experimentation and retrospectives to drive ongoing improvements.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">By adhering to these key DevOps principles, solutions architects can design systems that not only meet technical requirements but also align with organizational goals, improve team collaboration, and support continuous innovation.</span></span></p>
<h3 class="head2" id="sc3_214"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Need for DevOps</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Solutions architects are responsible for ensuring that the solutions they design are not only aligned with business goals but also maintainable, scalable, and secure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">DevOps provides the framework to implement and manage these attributes effectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">It also ensures that solutions architects can design systems that support agility, flexibility, and reliability, which are essential for modern software applications.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">DevOps lays the foundation for efficient collaboration between development and operations teams by emphasizing automation, continuous integration, and delivery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">However, as organizations scale, the complexity of managing infrastructure and environments increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.3">This is where </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">platform engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"> comes into play, building on DevOps principles to provide standardized, self-service platforms that abstract away the intricacies of underlying systems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">In the next section, we will explore how platform engineering enhances DevOps practices by enabling developers to focus on delivering value while operations teams manage a consistent and secure platform. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">This shift ensures streamlined workflows and accelerates the deployment process, further driving agility and efficiency in software development.</span></span></p>
<h2 class="head1" id="sc2_215"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Platform engineering</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">While DevOps focuses on breaking down silos between development and operations, platform engineering takes this a step further by providing a standardized, self-service platform for developers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">This ensures a consistent and streamlined experience, allowing teams to focus on delivering value rather than managing infrastructure complexities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Platform engineering focuses on building internal developer platforms to streamline DevOps practices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">These platforms abstract the complexity of underlying infrastructure, providing developers with self-service capabilities for deploying applications, managing environments, and accessing CI/CD pipelines.</span></span></p>
<h3 class="head2" id="sc3_216"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="153" id="page153"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Benefits of platform engineering</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">The following are a few benefits of platform engineering:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Enhanced developer productivity</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">: Developers can focus on building applications rather than managing infrastructure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Standardization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">: Ensures consistent practices across teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Accelerated delivery</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">: Reduces time to market by offering pre-configured environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">While platform engineering streamlines the development process by providing standardized environments and self-service capabilities, IaC takes it a step further by codifying the infrastructure setup. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">This ensures that the environments provisioned through platform engineering are consistent, scalable, and easily replicable across multiple stages of the software lifecycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.3">Let us explore in the upcoming section how IaC enables this through automation and code-driven infrastructure management.</span></span></p>
<h2 class="head1" id="sc2_217"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Implementing IaC with DevOps</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">IaC is a key practice for solutions architects, enabling them to define, provision, and manage infrastructure using machine-readable files. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.2">This approach provides a systematic way to build and maintain cloud infrastructure, ensuring consistency, scalability, and automation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.3">In this section, we will </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">get</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"> into how solutions architects can leverage IaC using tools like Terraform and other industry leading IaC tools to automate infrastructure management.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">This section will focus on the strategic application of IaC, outlining the strengths of each tool, best practices, and how to incorporate IaC into CI/CD pipelines for automated deployments.</span></span></p>
<h3 class="head2" id="sc3_218"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">IaC and its relevance</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">IaC involves managing and provisioning infrastructure using code-based configurations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">This approach helps solutions architects enforce repeatability, modularity, and automation in deploying infrastructure.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">The following are the key benefits of IaC:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Consistency across environments</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">: Avoid configuration drift by ensuring that every environment is defined by the same code.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Scalability and automation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">: Automatically scale resources and manage configurations for complex deployments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Reduced human error</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">: Automate complex configurations to prevent manual errors.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Version control</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">: Track changes, rollback to previous states, and audit infrastructure configurations.</span></span></p>
<h3 class="head2" id="sc3_219"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">Comparison of tools</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">As a solutions architect, choosing the right IaC tool is crucial for creating scalable, repeatable, and consistent cloud environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.2">Each tool has its strengths and is suited for specific use cases depending on the cloud strategy, technology stack, and team familiarity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.3">In this comparison, we will look at popular IaC tools such as Terraform, Pulumi, and the native solutions provided by hyperscalers, AWS CloudFormation, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Azure Resource Manager </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">(</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">ARM</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">)</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">templates, and Google Cloud Deployment Manager.</span></span></p>

<p class="caption-t"><span class="tablenum"><a id="tab8-1"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Table 8.1</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">: Comparative analysis of IaC tools</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="154" id="page154"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Each IaC tool has its own strengths, limitations, and ideal usage scenarios depending on the project needs, cloud strategy, and team expertise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.2">Based on the comparative analysis provided in </span></span><span class="Italic"><a href="#tab8-1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">Table 8.1</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">, the following recommendations can help solutions architects determine which tool is most appropriate for specific use cases:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">•	</span></span><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="155" id="page155"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Terraform is ideal for multi-cloud and hybrid deployments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.2">It provides strong state management, modularity, and a large provider ecosystem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.3">Use it when flexibility across cloud providers is a priority.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Pulumi is best suited for teams familiar with modern programming languages like Python or TypeScript. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.2">It is particularly useful if you want to apply familiar language constructs (loops, conditionals) to infrastructure management.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">AWS Cloud Formation is the go-to choice for large-scale AWS-specific deployments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.2">It integrates deeply with AWS services and offers strong governance through StackSets.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">ARM Templates are preferred for Azure-only environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.2">It is easy to adopt for Azure developers and integrates well with Azure Policy for compliance management.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Google Cloud Deployment manager is suitable for GCP-centric projects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.2">It supports YAML and Jinja templating but has a steeper learning curve compared to other tools.</span></span></p>
<h3 class="head2" id="sc3_220"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Best practices for solutions architects</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">When designing IaC, solutions architects should follow best practices to ensure maintainability, scalability, and security as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">Use modules for reusability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">: Create reusable components for networking, security groups, and other common resources.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Implement version control</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">: Use Git or Azure Repos for versioning, branching, and peer review.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">Secure sensitive information</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">: Store secrets in tools like HashiCorp Vault or Hyperscaler based solutions like Azure Key Vault or AWS Secrets Manager.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">Parameterize templates</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">: Use parameters to configure templates for different environments (dev, test, prod).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">Apply policy as code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">: Use tools like Terraform Sentinel or Azure Policy to enforce security and compliance.</span></span></p>
<h3 class="head2" id="sc3_221"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">Integrating IaC into CI/CD pipelines</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">Automating infrastructure deployments is a critical responsibility of solutions architects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.2">Integrating IaC into CI/CD pipelines ensures that infrastructure is deployed consistently and verified before going live.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">The following is the step-by-step implementation:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Author IaC code</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">: Write infrastructure code using Terraform or other IaC tools like ARM templates.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">Version control</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">: Store the code in a repository like GitHub or Azure Repos.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">CI/CD pipeline setup</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">: Define build and release pipelines in Azure pipelines or Jenkins.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Pre-deployment checks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">: Implement linting, security scans, and unit tests.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">Automate environment provisioning</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">: Deploy resources to test, staging, and production environments using pipeline stages.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Post-deployment validation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">: Use Azure Monitor to validate the health and performance of the deployed infrastructure.</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">While IaC focuses on defining and managing infrastructure in a repeatable, automated manner, its true power is unlocked when integrated into CI/CD pipelines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.2">By incorporating IaC into CI/CD, organizations can automate the provisioning, configuration, and deployment of infrastructure alongside application code, ensuring consistency across environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">In the next section, we will take a loot at the CI/CD process, highlighting how IaC plays a pivotal role in streamlining deployments, minimizing human intervention, and maintaining system reliability throughout the software delivery lifecycle.</span></span></p>
<h2 class="head1" id="sc2_223"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">Continuous integration and continuous deployment</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">CI/CD is a set of practices designed to enable faster, safer, and more reliable software delivery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.2">For solutions architects, CI/CD is more than just a technical implementation; it is a strategy to streamline development, testing, and deployment processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.3">A well-designed CI/CD pipeline ensures that code changes are integrated, validated, and deployed seamlessly across various environments with minimal manual intervention. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.4">This section talks about how solutions architects can leverage CI/CD to architect resilient systems, optimize release cycles, and maintain high availability and security.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">A typical CI/CD pipeline, as represented in </span></span><span class="Italic"><a href="#fig8-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">Figure 8.2</span></a></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">, consists of several stages that automate the process from code commit to deployment, incorporating checks and balances to ensure high-quality software delivery:</span></span></p>
<figure class="center1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1"><img src="images/Figure_8.2.png" alt="A dotted path with icons represents stages of a DevOps pipeline: Source Control Management, Build and Compile, Static Code Analysis, Unit Testing, Integration and Functional Testing, Security Testing, Deployment Automation, and Monitoring and Feedback."/></span>
<figcaption>
<p class="caption-l"><span class="figurenum"><a id="fig8-2"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">Figure 8.2</span></span><span class="Figure-Caption--BPB-HEB--Char"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">: End to End CI/CD pipeline stages</span></span></p>
</figcaption>
</figure>

						</td>

						</td>

					<tr class="No-Table-Style _idGenTableRowColumn-61">
						<td class="No-Table-Style CellOverride-5">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">Source control management</span></span></p>
						</td>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">Solutions architects should ensure that all code, configuration, and infrastructure scripts are version-controlled. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.2">Implement branch strategies, for example, feature branches, development, staging, and production branches, to maintain code integrity and facilitate smooth collaboration.</span></span></p>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">The build stage compiles the code, resolves dependencies, and packages it for deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.2">As an architect, ensure the pipeline is designed to support incremental builds and parallelization to reduce build time.</span></span></p>
						</td>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">Jenkins, Azure Pipelines, GitLab CI/CD, GitHub Actions, CircleCI.</span></span></p>
						</td>
					</tr>

						<td class="No-Table-Style CellOverride-5">
							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-17"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">Static code analysis</span></span></p>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">Use static code analysis to catch bugs, code smells, and security vulnerabilities early. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.2">Incorporate automated tools in your pipeline to enforce coding standards, maintain code quality, and ensure compliance with security guidelines.</span></span></p>

<p class="caption-t"><span class="tablenum"><a id="tab8-3"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">Table 8.3</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">: CI/CD pipeline stages</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">Consider an example of a CI/CD pipeline using Azure DevOps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.2">Azure DevOps is a powerful platform that provides end-to-end DevOps capabilities, making it an ideal choice for implementing CI/CD pipelines.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">The following are the steps to set up a CI/CD pipeline for a web application using Azure DevOps:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style733"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">1.</span></span><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style733 CharOverride-10">	</span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">Set up Azure Repos</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">Store your application’s source code in Azure Repos.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">Define branching strategies such as feature, development, and main branches to organize your source code and control the flow of changes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style733"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">2.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Create a build Pipeline</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">Use Azure Pipelines to define the build process using a YAML file. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.2">For example:</span></span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">trigger:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">  branches:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37">    <span role="doc-pagebreak" epub:type="pagebreak" aria-label="158" id="page158"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">include:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">      - main</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">pool:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">  vmImage: 'ubuntu-latest'</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">steps:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">  - script: npm install</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">    displayName: 'Install Dependencies'</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-37"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">  - script: npm run build</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-38"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">    displayName: 'Build the Application'</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">Add tasks for static code analysis using SonarQube and security scans using OWASP ZAP.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style733"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">3.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">Automate testing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Integrate unit and integration testing into the pipeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.2">Use Azure Test Plans to manage test cases and track test results.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">Configure automated test scripts to run after the build stage completes successfully.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style733"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">Implement deployment pipeline</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-17"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">Use Azure Pipelines for deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.2">Set up multiple stages for different environments, for example, dev, QA, prod.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">Implement blue-green deployment to minimize downtime:</span></span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-39"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">jobs:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-39"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">  - deployment: DeployApp</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-39"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">    environment: 'production'</span></p>

			<p class="Code-Block--BPB-HEB- ParaOverride-39"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">        green:</span></p>
			<p class="Code-Block--BPB-HEB- ParaOverride-39"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">          steps:</span></p>

			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style733"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">Monitoring and alerting</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">:</span></span></p>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">High</span></span></p>

						</td>

							<p class="Normal--BPB-HEB- ParaOverride-35"><span class="CharOverride-12"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">Medium</span></span></p>
