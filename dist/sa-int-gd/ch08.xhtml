<p class="caption-t"><span class="tablenum"><a id="tab8-4"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Table 8.4</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">: CI/CD tools comparison</span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="159" id="page159"/><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">The following are the key architectural considerations for designing CI/CD pipelines:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">Separation of environments</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">: Maintain separate pipelines for development, staging, and production environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.2">Each environment should be isolated to prevent issues in one environment from affecting others.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">Automated rollback strategies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">: Implement automated rollback strategies in the event of a failed deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.2">For example, use Azure DevOps to define conditions that trigger rollback to a previous stable version if certain KPIs, for example, CPU usage or response time) are breached.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">Design for scalability</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">: Design pipelines that can handle high volumes of changes and builds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.2">Consider using cloud-native services like AWS Code Pipeline or Azure Pipelines that automatically scale based on the workload.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">Security integration</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">: Incorporate security testing, for example, SAST, DAST, at various stages of the pipeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.2">Implement tools like Snyk or Aqua Security to scan container images and IaC templates for vulnerabilities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">Implementing feature flags</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">: Use feature flags to control the release of new features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.2">This allows you to enable or disable features dynamically without redeploying the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">Disaster recovery (DR) and rollback strategies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">: Disaster recovery and rollback strategies are critical for maintaining business continuity and minimizing downtime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.2">In a DevOps context, these strategies must be automated to ensure rapid recovery and prevent manual errors.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">Rollback strategies</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-40"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">Blue-green deployments</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">: Maintain two identical environments (blue for production and green for testing). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.2">In case of failure, traffic can quickly switch back to the blue environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-40"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">Canary releases</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">: Gradually release changes to a subset of users. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.2">If an issue arises, revert to the previous stable version.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">Automated rollbacks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">: Integrate rollback mechanisms in CI/CD pipelines using tools like Spinnaker or Azure Pipelines.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style23"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">DR</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">Data backup and restore</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">: Implement automated backups of critical data and configurations using cloud-native tools like Azure Backup or AWS Backup.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="160" id="page160"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">Chaos engineering</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">: Test DR mechanisms by simulating failures using tools like Gremlin or Chaos Monkey.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-23"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style85"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">Geographically distributed deployments</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">: Deploy applications across multiple regions to ensure failover in case of a regional outage.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">By incorporating these best practices and tools, solutions architects can ensure that their CI/CD pipelines are not only efficient and scalable but also secure and aligned with the organization’s business objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.2">Proper implementation of CI/CD enables faster delivery cycles, improved code quality, and a more streamlined development process that reduces risks and boosts productivity across teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">While CI/CD pipelines automate the process of building, testing, and deploying applications, they often rely on scripts and configurations managed independently of the source control system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.2">This is where GitOps steps in, enhancing the CI/CD approach by treating Git as the single source of truth for both application and infrastructure configurations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">In the following section, we will explore how GitOps builds on CI/CD principles to ensure version-controlled, auditable, and automated deployments.</span></span></p>
<h3 class="head2" id="sc3_225"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">GitOps</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">Building on the principles of IaC and CI/CD, modern DevOps practices are increasingly leveraging GitOps for managing application and infrastructure configurations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.2">This approach ensures a streamlined, automated, and version-controlled pipeline, enabling rapid and reliable deployments across environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">GitOps is an advanced CI/CD practice that uses Git as the single source of truth for both infrastructure and application configurations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.2">By leveraging Git repositories, GitOps ensures that every change in the system is version-controlled and auditable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.3">Tools like ArgoCD and FluxCD automate the process of syncing the desired state stored in Git with the actual state in the environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">The following are the key benefits of GitOps:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">Version control</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">: Every infrastructure change is recorded, providing a clear audit trail.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">Automated rollbacks</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">: Reverting to a previous state is as simple as rolling back to a previous Git commit.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">Consistency</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">: Ensures that environments remain consistent and free from configuration drift.</span></span></p>
<h3 class="head2" id="sc3_226"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">Common DevOps anti-patterns</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">While best practices in DevOps enable efficient, secure, and scalable pipelines, understanding common anti-patterns is equally important for solutions architects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.2">Anti-patterns represent poor practices or design flaws that hinder the effectiveness of DevOps processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.3">Identifying and avoiding these pitfalls is critical to ensuring smooth operations and achieving the desired outcomes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">The following are the key DevOps anti-patterns:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">Lack of automated testing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">Observation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">: Relying solely on manual testing can lead to inconsistent results, longer feedback loops, and increased risk of introducing bugs into production.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">Impact</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">: Slower release cycles and reduced software quality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">Solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">: Implement automated unit, integration, and regression tests as part of the CI/CD pipeline to ensure rapid and reliable feedback.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="161" id="page161"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">Hardcoding configurations</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.551.1">Observation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.552.1">: Embedding environment-specific configurations directly into code or scripts leads to inflexibility and security risks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1">Impact</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">: Difficulties in scaling or migrating applications, increased risk of exposing sensitive information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">Solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">: Use environment variables or configuration management tools like Vault, AWS Parameter Store, or Azure App Configuration to manage configurations securely and dynamically.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1">Over-reliance on manual approvals in CI/CD</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1">Observation</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1">: Requiring excessive manual approvals for every stage of the pipeline can bottleneck the deployment process.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-20"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1">Impact</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">: Delayed releases and reduced agility, defeating the purpose of CI/CD.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style288"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1">o	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">Solution</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">: Automate approvals for non-critical environments and implement </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">policy as code</span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1"> solutions for enforcing compliance in production environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.2">Use tools like Azure Pipelines, GitHub Actions, or Spinnaker to streamline approvals based on pre-defined rules.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">By recognizing and addressing these anti-patterns, solutions architects can ensure that their DevOps pipelines remain efficient, scalable, and secure, fostering a culture of continuous improvement.</span></span></p>
<h3 class="head2" id="sc3_227"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">Hybrid and multi-cloud DevOps</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1">In today’s enterprise IT landscape, leveraging hybrid and multi-cloud environments has become a strategic necessity for achieving flexibility, scalability, and resilience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.2">However, managing DevOps practices across such diverse infrastructures introduces unique challenges that require specialized strategies and tools.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">To bridge the gap between challenges and strategies, it is essential to recognize that overcoming these hurdles requires a combination of cloud-agnostic tools, standardized practices, and a robust architectural approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.2">In the following sub-section, we explore specific strategies to address the complexities of hybrid and multi-cloud DevOps.</span></span></p>
<h4 class="head3" id="sc4_228"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">Challenges and strategies</span></h4>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="Normal--BPB-HEB--Char CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">In modern enterprises, hybrid and multi-cloud environments are becoming the norm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.2">These environments combine on-premises infrastructure with multiple cloud platforms (AWS, Azure, GCP). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.3">While this offers flexibility and resilience, it introduces complexities in managing CI/CD pipelines, consistent configurations, and security policies across diverse environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">Solutions architects must navigate several hurdles when designing DevOps practices for hybrid and multi-cloud setups, some of which are mentioned as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">Inconsistent tooling</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">: Different cloud providers have varying CI/CD tools and processes, leading to operational silos.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">Cross-cloud security</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">: Ensuring secure communication and consistent IAM policies across clouds.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">Complex state management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">: Managing infrastructure state in a distributed, multi-cloud environment.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">To overcome these challenges and ensure efficiency, scalability, and security across platforms, consider the following approaches:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1">Use cloud-agnostic tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">: Tools like Spinnaker for multi-cloud CI/CD orchestration and Terraform for IaC ensure consistent deployments across providers.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1">Centralized logging and monitoring</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1">: Employ tools like ELK Stack, Prometheus, or Datadog for unified observability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">•	</span></span><span class="CharOverride-4"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="162" id="page162"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">Service meshes</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1">: Use Istio or Linkerd to standardize service discovery, security, and communication across hybrid environments.</span></span></p>
<h2 class="head1" id="sc2_229"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">Monitoring and logging</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">Effective monitoring and logging are foundational for maintaining the performance, reliability, and security of software solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.2">However, achieving observability, which is the ability to infer the internal state of a system from its outputs, requires integrating monitoring, logging, and tracing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.3">As a solutions architect, your goal is to embed observability into every layer of the application and infrastructure stack. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.4">This ensures that issues are not only detected early but also understood and resolved swiftly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.5">Observability empowers teams to continuously optimize system behavior, drive innovation, and enhance system uptime.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1">Observability is built on three key pillars, as follows:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">Metrics</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">: Quantifiable data points (e.g., CPU usage, request latency).</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">Logs</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">: Detailed records of system events.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">Traces</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">: Distributed tracing to track the flow of requests across services.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">OpenTelemetry</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1"> is a vendor-neutral framework for collecting, processing, and exporting telemetry data across different observability tools, ensuring a standardized approach.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1">Monitoring covers a wide spectrum of components and activities, including application performance, infrastructure health, network traffic, database usage, and security events. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.2">A robust monitoring and logging strategy will enable proactive issue detection, capacity planning, and compliance auditing.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">Solutions architects should ensure that the following areas are monitored and logged:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">Application performance</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">: Response times, request rates, error rates, and transaction latencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">Infrastructure health</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1">: CPU usage, memory usage, disk I/O, and network traffic for VMs, containers, and serverless components.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">Database metrics</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">: Query performance, connection pool utilization, and read/write latencies.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1">Security events</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">: User authentication attempts, permission changes, and API access patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">Network traffic</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.1">: Throughput, packet loss, latency, and firewall activity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.631.1">Custom business metrics</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.1">: User engagement, purchase transactions, and feature usage patterns.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.1">CI/CD pipeline health</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.1">: Build statuses, deployment times, and integration failures.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.636.1">The following are the key considerations for solutions architects:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.638.1">Define a comprehensive monitoring strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.1">: Identify the key metrics and logs that are critical for the business and technical requirements of your application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.2">Establish SLOs for performance, reliability, and security.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.640.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.1">Implement centralized logging</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.1">: Use centralized logging solutions to aggregate and analyze logs from different sources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.2">This ensures that logs are easily searchable and correlated across the entire application stack.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.644.1">Enable distributed tracing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.645.1">: For microservices-based architectures, enable distributed tracing to track requests across multiple services and identify bottlenecks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.646.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.647.1">Design alerts and dashboards</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.1">: Create alerting rules with appropriate thresholds for each metric. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.2">Use dynamic dashboards to visualize system health and present insights to stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.650.1">Automate monitoring as part of CI/CD pipelines</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.1">: Integrate monitoring configurations and alert setups as part of your CI/CD pipeline to ensure consistency across environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="163" id="page163"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.652.1">The following are the tools for monitoring and logging:</span></span></p>

			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.679.1">The following are the ways for designing a monitoring and logging strategy as a solutions architect:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.1">Start with a requirements assessment</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.682.1">: Identify the key metrics and logs for performance, security, and business insights.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.684.1">Establish a data strategy</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.1">:</span></span><span class="CharOverride-4"> </span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.1">Define data retention policies, log rotation schedules, and access controls for logs and metrics.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.1">Implement across environments</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.689.1">: Ensure consistent monitoring and logging across development, testing, and production environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.690.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.691.1">Use the right tools</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.692.1">: Choose tools based on integration requirements, scalability, and the specific needs of your application stack.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-15"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.694.1">Design proactive alerts</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.695.1">: Set up alerting mechanisms to notify relevant teams before minor issues escalate into critical problems.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.696.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.697.1">Review and optimize regularly</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.1">: Continuously refine the monitoring strategy based on feedback, changing business requirements, and new tool capabilities.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.699.1">By adopting a comprehensive monitoring and logging approach, solutions architects can ensure that systems remain reliable, scalable, and secure while also enabling deep visibility into all layers of the technology stack.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.1">While traditional monitoring tools provide visibility into system performance, the complexity of modern applications requires a more intelligent approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.2">This is where AIOps steps in, leveraging machine learning to predict issues, automate responses, and enhance operational efficiency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.3">Let us examine how AIOps transforms IT operations by offering predictive and automated solutions to manage large-scale environments.</span></span></p>
<h2 class="head1" id="sc2_230"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.1">AIOps</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.1">As systems grow more complex, traditional monitoring and manual intervention are no longer sufficient to manage operational challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.2">This is where AIOps comes into play. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.3">By applying AI and machine learning, </span><span role="doc-pagebreak" epub:type="pagebreak" aria-label="164" id="page164"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.1">AIOps enhances DevOps by proactively identifying, predicting, and resolving issues, ensuring smoother operations and higher system reliability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.1">AIOps leverages machine learning and data analytics to enhance DevOps practices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.2">By analysing vast amounts of operational data, AIOps can predict and prevent potential system failures before they occur.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.1">The following are the key roles of AIOps in DevOps:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.706.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.707.1">Predictive analysis</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.708.1">: Identify patterns and anomalies to foresee issues.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.1">Incident management</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.1">: Automate root cause analysis and suggest fixes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.712.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.1">Resource optimization</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.714.1">: Optimize infrastructure usage based on predictive workloads.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.715.1">Popular AIOps tools include Dynatrace, Splunk AIOps, and New Relic AI.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.1">As AIOps focuses on optimizing system performance and reliability, another critical area for optimization is cloud spending. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.2">FinOps addresses this by ensuring cost efficiency while maintaining operational effectiveness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.3">By integrating financial management practices into DevOps workflows, organizations can gain visibility into cloud expenditures and implement strategies for cost control. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.4">Let us look at how FinOps can help achieve financial accountability in cloud environments.</span></span></p>
<h2 class="head1" id="sc2_231"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.717.1">FinOps in DevOps</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.718.1">FinOps (cloud financial management) is an emerging discipline aimed at optimizing cloud spending without compromising performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.718.2">As DevOps accelerates deployments, managing costs effectively becomes a shared responsibility.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-3"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.719.1">FinOps introduces a structured approach to cloud cost management, focusing on the following principles:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.720.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.721.1">Cost visibility</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.722.1">: Track real-time costs associated with cloud resources across environments.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.723.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.724.1">Budgets and alerts</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.725.1">: Set cost thresholds and receive alerts when nearing budget limits.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.1">Optimization practices</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.728.1">: Identify underutilized resources, optimize instance sizes, and leverage savings plans or reserved instances.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.729.1">The following are the FinOps tools:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-9"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.1">Effective FinOps relies on leveraging the right tools to monitor, analyze, and optimize cloud costs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.2">These tools provide visibility, enforce budget controls, and offer actionable insights to align financial management with DevOps practices.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.731.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.732.1">AWS Cost Explorer </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.733.1">, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.734.1">Azure Cost Management </span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.735.1">, </span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.736.1">Google Cloud Billing</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.737.1">: For real-time cost analysis and forecasting.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.738.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.739.1">Kubecost</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.740.1">: Optimize Kubernetes-based workloads.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-5"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style115"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.741.1">•	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.742.1">CloudHealth by VMware</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.743.1">: Multi-cloud cost optimization and governance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.1">While cost optimization and operational efficiency are crucial, security remains a cornerstone of any robust DevOps strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.2">DevSecOps emphasizes the integration of security practices throughout the CI/CD pipeline, ensuring that systems are not only efficient but also secure and compliant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.3">In the next section, we will explore how security can be seamlessly embedded into DevOps workflows.</span></span></p>
<h2 class="head1" id="sc2_232"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.745.1">Security in DevOps</span></h2>
			<p class="Normal--BPB-HEB- ParaOverride-2"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.1">As software delivery cycles continue to shorten, integrating security into every stage of the development lifecycle is no longer optional, it is a necessity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.2">This is where DevSecOps comes into play. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.3">DevSecOps extends the DevOps philosophy by embedding security practices and considerations into the CI/CD pipeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.4">For solutions architects, the challenge is not just to design scalable and performant architectures but also to ensure that every component is secure and resistant to vulnerabilities. </span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="165" id="page165"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.747.1">During a solutions architect interview, you will likely encounter questions that test your understanding of DevSecOps principles, how you integrate security in various phases of the development lifecycle, and your approach to balancing security with speed and agility. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.747.2">This section aims to equip you with the knowledge to respond to such questions confidently and to demonstrate your ability to build secure, compliant pipelines that meet organizational and regulatory standards.</span></span></p>
<h3 class="head2" id="sc3_233"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.748.1">DevSecOps</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.749.1">DevSecOps is the practice of incorporating security principles, tools, and processes throughout the software development lifecycle, from coding to production deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.749.2">Unlike traditional security practices, which are often applied as a final step, DevSecOps ensures that security is built into every stage of development, making it an integral part of the CI/CD pipeline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.749.3">This proactive approach minimizes vulnerabilities and enhances the overall security posture of the application.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.750.1">Solutions architects need to prioritize security for the following reasons:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.1">For solutions architects, security is a non-negotiable design principle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.2">During the interview, you may be asked how you will approach security considerations when designing architectures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.3">Strong answers will cover topics such as secure coding practices, IAM policy enforcement, and compliance management. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.4">You should emphasize your understanding of security as a shared responsibility and your role in creating secure, compliant, and resilient architectures.</span></span></p>
<h3 class="head2" id="sc3_234"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.1">Static code analysis, dynamic analysis, and vulnerability scanning</span></h3>
			<p class="Normal--BPB-HEB- ParaOverride-6"><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.1">Integrating security into CI/CD pipelines involves the use of tools and practices that continuously test code for vulnerabilities and enforce security standards before deployment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.2">Solutions architects should be familiar with how to design these pipelines to include security gates, ensuring that insecure code is detected and remediated early in the lifecycle.</span></span></p>
