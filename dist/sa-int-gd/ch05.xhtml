			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">You also collaborate with product owners to prioritize features that bring the most business value while ensuring that the system remains flexible and scalable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">4.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1">What strategies do you use for managing technical debt in a fast-paced business environment?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Managing technical debt is critical to maintaining system health over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.2">You ensure that technical debt is treated as part of the regular backlog and is visible to both business and technical stakeholders.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">During backlog refinement sessions, you work with the team to prioritize high-impact technical debt items alongside new feature development. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.2">This ensures that you address it incrementally without compromising project timelines.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">You also advocate for continuous refactoring to keep the system maintainable and scalable.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="101" id="page101"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">5.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">Can you provide an example of how you have handled cost overruns in a project?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">In a previous project, you faced unexpected cost overruns due to increased cloud usage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.2">You immediately assessed your cloud resource allocation and identified that some workloads were over-provisioned.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">To mitigate the issue, you implemented auto-scaling and optimized your resource utilization.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">Additionally, you worked with the finance team to revise the budget and forecast future usage more accurately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.2">This helped you regain control over costs without affecting system performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">6.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">How do you manage the technical integration of systems during a merger or acquisition?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">During M&amp;A, the first step is to assess the technical landscape of both entities, identifying overlapping systems, technology stacks, and critical business processes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">You prioritize integrating business-critical systems like ERP and CRM first, ensuring minimal disruption to operations.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">You use middleware or APIs to bridge disparate systems where necessary and develop a phased integration plan that focuses on consolidating systems over time.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">Regulatory compliance and data migration are key concerns that are addressed early in the process to ensure a smooth transition.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">7.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">How do you handle differing technology stacks during mergers or acquisitions?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">When merging organizations that have different technology stacks, you start by identifying the most critical systems and determining if it is more beneficial to migrate one system onto the other’s platform or to adopt a hybrid solution.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">You may implement middleware to connect systems for the short term while developing a long-term migration strategy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">The decision depends on factors like system compatibility, business needs, cost, and potential downtime.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">A phased approach often works best, allowing critical systems to be integrated first while others are transitioned later.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">8.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">How do you ensure technology projects stay on budget while meeting business needs?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">You ensure that all technology projects begin with a well-defined budget that accounts for both initial costs and ongoing expenses.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">You work closely with finance teams to align the project’s budget with the business’s financial strategy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">Using tools like AWS Cost Explorer  or Azure Cost Management , you continuously monitor expenditures, ensuring they stay within the allocated budget.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">If you encounter budgetary issues, you reassess priorities with the product owner and stakeholders to adjust features or scope, balancing immediate business needs with long-term financial viability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="102" id="page102"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">9.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">How do you mitigate risks during project delivery?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Risk mitigation starts with identifying potential risks early in the project. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.2">You conduct risk assessments and identify areas such as system scalability, performance bottlenecks, and potential integration challenges.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">Proactively designing fault-tolerant systems (e.g., using load balancers or redundancy) helps mitigate technical risks.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">You also implement risk mitigation strategies like prototyping for high-risk features, setting up automated testing, and ensuring frequent communication with stakeholders to adjust project plans as new risks emerge.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">10.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">How do you manage project dependencies to ensure smooth delivery?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">Managing project dependencies involves identifying and documenting all dependencies early in the project.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">You work closely with cross-functional teams to ensure that these dependencies are clearly communicated and aligned across teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.2">You also track and manage them using project management tools like Jira.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">For critical dependencies, you build in contingency plans (e.g., alternative solutions or workarounds) in case one dependency is delayed.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">Frequent communication and stakeholder alignment are key to ensuring that dependencies do not derail project timelines.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">11.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">How do you ensure system compliance during mergers and acquisitions, especially with data privacy regulations?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">During M&amp;A, ensuring compliance with data privacy regulations like GDPR or HIPAA is critical.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">You begin by assessing the data handling practices of both entities and ensuring that any combined system adheres to the strictest applicable regulation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">You collaborate with legal and compliance teams to map out requirements and implement data encryption, access control, and audit logging to protect sensitive information.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">Where necessary, you recommend anonymization or pseudonymization techniques to ensure that data privacy regulations are met while enabling smooth data integration.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">12.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">How do you track and manage multiple project timelines across different business units?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">To manage multiple project timelines across business units, you use project management tools like Jira or Microsoft Project to track dependencies, deadlines, and deliverables.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">You also ensure that each business unit has clear visibility into their priorities and deliverables by maintaining transparent dashboards.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">Regular status meetings with technical teams and business stakeholders help in tracking progress and adjusting timelines when necessary.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">You also make sure that cross-team dependencies are well-managed by setting up proper coordination between teams.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span role="doc-pagebreak" epub:type="pagebreak" aria-label="103" id="page103"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">13.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1">How do you communicate technical trade-offs to non-technical stakeholders?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">When communicating technical trade-offs to non-technical stakeholders, you focus on using clear, business-focused language.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">You explain the potential benefits and risks of each option in terms that resonate with the business, such as costs, time to market, or impact on customer experience.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">For example, if a stakeholder requests a new feature that may compromise scalability, you will outline the trade-offs between delivering the feature quickly and ensuring long-term system performance, allowing the business to make informed decisions.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">14.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">How do you gather requirements in a collaborative environment?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">In a collaborative environment, you facilitate workshops that bring together key stakeholders such as business analysts, developers, and product owners.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">You ensure that everyone has an opportunity to voice their input while maintaining alignment on the project’s goals.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">Your approach focuses on fostering open communication to address potential challenges early and ensure that technical and business teams are aligned.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">For instance, during a requirements-gathering session for a healthcare app, you might engage with both clinical staff and developers to gather diverse perspectives on user needs and system functionality.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">15.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">How do you handle changing business requirements during a project?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">When business requirements change, you ensure that technical solutions remain flexible and adaptable to accommodate these changes.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">You collaborate with stakeholders to reprioritize tasks, making necessary adjustments without compromising the system’s overall integrity.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-25"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">Additionally, you manage technical debt carefully to minimize disruptions, ensuring that short-term changes do not hinder long-term system performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.539.1">For example, if a regulatory update requires changes to a system’s data handling process, you will work with both legal teams and developers to implement the updates efficiently while preserving performance and scalability.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-4"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style731 CharOverride-10"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.540.1">16.	</span></span><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.541.1">How do you manage technology costs and budgets?</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-16"><span class="CharOverride-4"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.542.1">Model answer:</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.543.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.544.1">To manage technology costs and budgets effectively, you work closely with finance teams to track expenses and ensure technology investments align with the business’s financial strategy.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.545.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.546.1">You use tools like AWS Cost Explorer  and Azure Cost Management  to monitor cloud usage and optimize resource allocation.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.547.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.548.1">Additionally, you incorporate FinOps practices to ensure that financial accountability is integrated with engineering decisions, allowing teams to balance costs while maintaining system performance.</span></span></p>
			<p class="Normal--BPB-HEB- ParaOverride-18"><span class="Styles-for-Word-RTF-Imported-Lists_Word-Imported-List-Style1"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.549.1">•	</span></span><span class="CharOverride-2"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.550.1">For instance, during cloud migrations, you have implemented auto-scaling and reserved instances to minimize expenses while ensuring the infrastructure scales to meet demand.</span></span></p>
